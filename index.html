  if (thisSecIdx < todaySecIdx) return true;
  if (thisSecIdx > todaySecIdx) return false;
  return i <= todayInfo.index;
}

function currentReading() {
  return (PLAN_DATA[currentSection] || [])[currentIndex];
}

function isTodaySelected() {
  return currentSection === todayInfo.section && currentIndex === todayInfo.index;
}

function renderScriptureText(el, text) {
  el.innerHTML = text.split('\n').map(line => {
    const m = line.match(/^(\d+:\d+)\s+([\s\S]+)/);
    if (m) return `<p style="margin-bottom:10px"><span class="scripture-verse-num">${m[1]}</span>${m[2]}</p>`;
    return line.trim() ? `<p style="margin-bottom:10px">${line}</p>` : '';
  }).join('');
}

// Cache to avoid repeated API calls within the session
const _scriptureCache = {};

// FHL uses single/double Chinese character abbreviations for book names
const FHL_BOOK_ABBR = {
  '創世記':'創','出埃及記':'出','利未記':'利','民數記':'民','申命記':'申',
  '約書亞記':'書','士師記':'士','路得記':'得','撒母耳記上':'撒上','撒母耳記下':'撒下',
  '列王紀上':'王上','列王紀下':'王下','歷代志上':'代上','歷代志下':'代下',
  '以斯拉記':'拉','尼希米記':'尼','以斯帖記':'斯','約伯記':'伯',
  '詩篇':'詩','箴言':'箴','傳道書':'傳','雅歌':'歌',
  '以賽亞書':'賽','耶利米書':'耶','耶利米哀歌':'哀','以西結書':'結','但以理書':'但',
  '何西阿書':'何','約珥書':'珥','阿摩司書':'摩','俄巴底亞書':'俄','約拿書':'拿',
  '彌迦書':'彌','那鴻書':'鴻','哈巴谷書':'哈','西番雅書':'番','哈該書':'該',
  '撒迦利亞書':'亞','瑪拉基書':'瑪',
  '馬太福音':'太','馬可福音':'可','路加福音':'路','約翰福音':'約','使徒行傳':'徒',
  '羅馬書':'羅','哥林多前書':'林前','哥林多後書':'林後','加拉太書':'加',
  '以弗所書':'弗','腓立比書':'腓','歌羅西書':'西',
  '帖撒羅尼迦前書':'帖前','帖撒羅尼迦後書':'帖後',
  '提摩太前書':'提前','提摩太後書':'提後','提多書':'多','腓利門書':'門',
  '希伯來書':'來','雅各書':'雅','彼得前書':'彼前','彼得後書':'彼後',
  '約翰一書':'約一','約翰二書':'約二','約翰三書':'約三','猶大書':'猶','啟示錄':'啟',
};

async function fetchFHLScripture(passage, dateKey) {
  if (_scriptureCache[dateKey]) return _scriptureCache[dateKey];
  if (!passage) return null;

  // Parse passage like "以賽亞書 1:1-全" / "羅馬書 3:1-18" / "約翰福音 1:1-2:25"
  const m = passage.match(/^(.+?)\s+(\d+):(\d+)[-–](.+)$/);
  if (!m) return null;
  const [, book, chapStr,, endPart] = m;
  const startChap = parseInt(chapStr);

  // Map full book name to FHL abbreviation
  const abbr = FHL_BOOK_ABBR[book.trim()];
  if (!abbr) { console.warn('FHL: unknown book', book); return null; }

  // Determine end chapter (handle cross-chapter like "1:1-2:25")
  const crossChap = endPart.match(/^(\d+):/);
  const endChap = crossChap ? parseInt(crossChap[1]) : startChap;

  try {
    let allVerses = [];
    for (let chap = startChap; chap <= endChap; chap++) {
      const url = `https://bible.fhl.net/json/qb.php?chineses=${encodeURIComponent(abbr)}&chap=${chap}&version=rcuv`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.status === 'success' && data.record?.length) {
        data.record.forEach(v => {
          const clean = v.bible_text.replace(/<[^>]+>/g, '').trim();
          allVerses.push(`${v.chap}:${v.sec} ${clean}`);
        });
      }
    }
    if (!allVerses.length) return null;
    const result = allVerses.join('\n');
    _scriptureCache[dateKey] = result;
    return result;
  } catch(e) {
    console.error('FHL fetch error:', e);
    return null;
  }
}

function render() {
  const r = currentReading();
  const available = isAvailable(currentSection, currentIndex);
  const isToday = isTodaySelected();

  // Header progress — scoped to the CURRENTLY-VIEWED plan.
  // A "plan" = all month-sections that share the same PLAN_META title
  // (e.g. 八/九/十月 all belong to the 66-day plan). Denominator = that plan's
  // total days; numerator = days actually read (✓) within that plan.
  const _allSecs = Object.keys(PLAN_DATA);
  const _curTitle = (PLAN_META[currentSection] || {}).title;
  const _planSecs = _allSecs.filter(sec =>
    _curTitle ? (PLAN_META[sec] || {}).title === _curTitle : sec === currentSection);
  const _total = _planSecs.reduce((s, sec) => s + PLAN_DATA[sec].length, 0);
  let completed = 0;
  _planSecs.forEach(sec => {
    PLAN_DATA[sec].forEach((_, i) => { if (readDays.has(dayKey(sec, i))) completed++; });
  });
  document.getElementById('hdr-done').textContent = completed;
  document.getElementById('hdr-total').textContent = `/${_total}`;
  const pct = Math.round(completed / (_total || 1) * 100);
  const circumference = 2 * Math.PI * 15.9;
  document.getElementById('progress-ring').setAttribute('stroke-dasharray', `${circumference * pct / 100} ${circumference}`);

  // Card re-animate
  const card = document.getElementById('main-card');
  card.classList.remove('fade-in'); void card.offsetWidth; card.classList.add('fade-in');

  // Header series title
  const meta = PLAN_META[currentSection];
  document.getElementById('hdr-title').textContent = meta ? meta.title : '';
  document.getElementById('hdr-subtitle').textContent = meta ? meta.subtitle : '';

  // Book tag & badges
  document.getElementById('book-tag').textContent = r.book;
  document.getElementById('today-badge').classList.toggle('hidden', !isToday);
  document.getElementById('locked-badge').classList.toggle('hidden', available);
  document.getElementById('day-meta').textContent = `第 ${r.day} 天 · 2026 年 ${r.date}`;
  document.getElementById('passage').textContent = r.passage;
  document.getElementById('day-num').textContent = r.day;
  document.getElementById('focus').textContent = available ? r.focus : '這天的內容將在當天解鎖';

  // Show/hide content vs locked
  document.getElementById('tabs-row').classList.toggle('hidden', !available);
  document.getElementById('panel-scripture').classList.toggle('hidden', !available || currentTab !== 'scripture');
  document.getElementById('panel-content').classList.toggle('hidden', !available || currentTab !== 'content');
  document.getElementById('panel-prayer').classList.toggle('hidden', !available || currentTab !== 'prayer');
  document.getElementById('locked-panel').classList.toggle('hidden', available);

  if (available) {
    // Mark this day as read
    const k = dayKey(currentSection, currentIndex);
    if (!readDays.has(k)) { readDays.add(k); saveReadDays(); }

    const scriptureBody = document.getElementById('scripture-body');
    const scriptureText = SCRIPTURE[r.date] || '';
    if (scriptureText) {
      renderScriptureText(scriptureBody, scriptureText);
    } else {
      scriptureBody.innerHTML = '<span style="color:rgba(255,255,255,.3)">載入經文中…</span>';
      fetchFHLScripture(r.passage, r.date).then(text => {
        if (text) renderScriptureText(scriptureBody, text);
        else scriptureBody.innerHTML = '<span style="color:rgba(255,255,255,.3)">（經文準備中）</span>';
      });
    }
    document.getElementById('navigation').textContent = r.navigation;
    document.getElementById('practice-god').textContent = r.practiceGod;
    // Show people practice block only if it has content (July entries)
    const peopleDiv = document.getElementById('practice-people');
    const peopleBlock = peopleDiv.closest('.practice-people');
    if (r.practicePeople) {
      peopleDiv.textContent = r.practicePeople;
      peopleBlock.classList.remove('hidden');
    } else {
      peopleBlock.classList.add('hidden');
    }
    document.getElementById('prayer').textContent = r.prayer;
    document.getElementById('verse').textContent = r.verse;
    document.getElementById('tags').textContent = r.tags;
  }

  // Bottom nav buttons — generic across all sections
  const _navSecs = Object.keys(PLAN_DATA);
  const _navSecIdx = _navSecs.indexOf(currentSection);
  document.getElementById('btn-prev').disabled = _navSecIdx === 0 && currentIndex === 0;
  const _curData = PLAN_DATA[currentSection] || [];
  let nextAvail = false;
  if (currentIndex < _curData.length - 1) nextAvail = isAvailable(currentSection, currentIndex + 1);
  else if (_navSecIdx < _navSecs.length - 1) nextAvail = isAvailable(_navSecs[_navSecIdx + 1], 0);
  document.getElementById('btn-next').disabled = !nextAvail;

  // "回今天" button
  document.getElementById('btn-today').classList.toggle('hidden', todayInfo.index === -2 || isTodaySelected());
  renderNotes();

  // Dynamically render all section grids — grouped into collapsible Year › Month toggles
  const allGridsEl = document.getElementById('all-grids');
  allGridsEl.innerHTML = '';
  const MONTH_ZH = { january:'一月', february:'二月', march:'三月', april:'四月',
    may:'五月', june:'六月', july:'七月', august:'八月', september:'九月',
    october:'十月', november:'十一月', december:'十二月' };
  const MONTH_NUM = { january:1, february:2, march:3, april:4, may:5, june:6,
    july:7, august:8, september:9, october:10, november:11, december:12 };
  const nowMonth = new Date().getMonth() + 1;

  // Build a day-grid element for one section
  function buildMonthGrid(sec, readings) {
    const gridDiv = document.createElement('div');
    gridDiv.className = 'grid grid-cols-7 gap-1.5';
    readings.forEach((rd, i) => {
      const avail = isAvailable(sec, i);
      const isT   = todayInfo.section === sec && i === todayInfo.index;
      const isRead = readDays.has(dayKey(sec, i));
      const sel    = currentSection === sec && i === currentIndex;
      const btn = document.createElement('button');
      btn.className = `day-btn p-1 text-center text-xs font-bold ${sel ? 'selected' : isT ? 'today' : isRead ? 'past' : 'future'} ${!avail ? 'locked' : ''}`;
      btn.style.minHeight = '42px';
      const dateDisplay = rd.date.replace(/^\d+\//, '').replace(/^(\d+)月(\d+)日$/, '$1/$2');
      btn.innerHTML = `<div style="font-size:9px;opacity:.6;margin-bottom:1px">${dateDisplay}</div><div style="font-size:12px">${rd.day}</div>${isRead && !sel ? '<div style="font-size:8px;color:#c9a84c;opacity:.7">✓</div>' : ''}`;
      if (avail) {
        btn.onclick = () => { currentSection = sec; currentIndex = i; currentTab = 'scripture'; render(); };
      } else {
        btn.title = '尚未解鎖';
      }
      gridDiv.appendChild(btn);
    });
    return gridDiv;
  }

  // Group sections by year (all current data is 2026; falls back gracefully)
  const YEAR = 2026;
  const yearDetails = document.createElement('details');
  yearDetails.className = 'yr-toggle';
  yearDetails.open = yearOpenState; // remembered; defaults to expanded
  yearDetails.addEventListener('toggle', () => { yearOpenState = yearDetails.open; });
  const yearSummary = document.createElement('summary');
  yearSummary.innerHTML = `<span class="chev">▶</span><span>${YEAR}</span>`;
  yearDetails.appendChild(yearSummary);
  const yearBody = document.createElement('div');
  yearBody.className = 'yr-body';

  Object.entries(PLAN_DATA).forEach(([sec, readings]) => {
    const meta = PLAN_META[sec];
    const monthLabel = MONTH_ZH[sec] || sec;
    const mNum = MONTH_NUM[sec] || 99;

    const moDetails = document.createElement('details');
    moDetails.className = 'mo-toggle';
    // Use remembered state if user toggled it; otherwise default: current & future expanded, past collapsed
    moDetails.open = (sec in monthOpenState) ? monthOpenState[sec] : (mNum >= nowMonth);
    moDetails.addEventListener('toggle', () => { monthOpenState[sec] = moDetails.open; });
    const moSummary = document.createElement('summary');
    moSummary.innerHTML = `<span class="chev">▶</span><span class="mo-name">${monthLabel}</span>${meta ? `<span class="mo-title">${meta.title}</span>` : ''}`;
    moDetails.appendChild(moSummary);
    const moBody = document.createElement('div');
    moBody.className = 'mo-body';
    moBody.appendChild(buildMonthGrid(sec, readings));
    moDetails.appendChild(moBody);
    yearBody.appendChild(moDetails);
  });

  yearDetails.appendChild(yearBody);
  allGridsEl.appendChild(yearDetails);

  switchTabUI(currentTab);
}

function switchTab(tab) {
  if (!isAvailable(currentSection, currentIndex)) return;
  currentTab = tab;
  document.getElementById('panel-scripture').classList.toggle('hidden', tab !== 'scripture');
  document.getElementById('panel-content').classList.toggle('hidden', tab !== 'content');
  document.getElementById('panel-prayer').classList.toggle('hidden', tab !== 'prayer');
  switchTabUI(tab);
}

function switchTabUI(tab) {
  ['scripture','content','prayer'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
}

function navigate(dir) {
  const sections = Object.keys(PLAN_DATA);
  const secIdx = sections.indexOf(currentSection);
  if (dir === -1) {
    if (currentIndex > 0) {
      if (!isAvailable(currentSection, currentIndex - 1)) return;
      currentIndex--;
    } else if (secIdx > 0) {
      const prevSec = sections[secIdx - 1];
      const lastIdx = PLAN_DATA[prevSec].length - 1;
      if (!isAvailable(prevSec, lastIdx)) return;
      currentSection = prevSec; currentIndex = lastIdx;
    } else return;
  } else {
    const data = PLAN_DATA[currentSection] || [];
    if (currentIndex < data.length - 1) {
      if (!isAvailable(currentSection, currentIndex + 1)) return;
      currentIndex++;
    } else if (secIdx < sections.length - 1) {
      const nextSec = sections[secIdx + 1];
      if (!isAvailable(nextSec, 0)) return;
      currentSection = nextSec; currentIndex = 0;
    } else return;
  }
  currentTab = 'scripture';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToday() {
  if (todayInfo.index === -2) return;
  currentSection = todayInfo.section;
  currentIndex = todayInfo.index;
  currentTab = 'scripture';
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

// Font size slider
(function() {
  const slider = document.getElementById('fs-slider');
  const label = document.getElementById('fs-label');
  const saved = localStorage.getItem('bible-fs');
  if (saved) { slider.value = saved; document.documentElement.style.setProperty('--fs', saved + 'px'); label.textContent = saved; }
  slider.addEventListener('input', () => {
    const v = slider.value;
    document.documentElement.style.setProperty('--fs', v + 'px');
    label.textContent = v;
    localStorage.setItem('bible-fs', v);
  });
})();

// Init: start on today's reading
const _sections = Object.keys(PLAN_DATA);
if (todayInfo.index === -2) {
  currentSection = _sections[0] || 'july'; currentIndex = 0;
} else {
  currentSection = todayInfo.section;
  currentIndex = todayInfo.index;
}
render();
