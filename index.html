    practicePeople:"尋找一位正因現實環境受挫而失去信心的肢體，用神的話語和正面的肯定去激勵他重新站起來。",
    prayer:"慈愛的神，祢是那使無變為有、叫死人復活的主。當我的環境看來一片荒涼死寂時，求祢挪去我的小信，讓我把靈魂的錨緊緊扣在祢不落空的應許上，用信心看見祢的作為。阿們。",
    verse:"「亞伯拉罕信神，這就算為他的義。」（羅馬書 4:3）", tags:"#星空應許 #無中生有 #錨" },
  { date:"7/5", day:5, book:"羅馬書", passage:"羅馬書 5:1-21",
    focus:"苦難是靈性肌肉的重訓，而恩典是永不乾涸的泉源。",
    navigation:"既然因信稱義，我們就與神和好了，但這並不意味著人生從此一帆風順。保羅大膽地指出，連苦難都可以成為我們歡喜的理由，因為苦難能鍛鍊出忍耐、老練與盼望。這就像是靈性的重訓，每一次的壓迫都在擴張我們生命承載恩典的容量。更重要的是，神的愛藉著聖靈已經澆灌在我們心裡。無論世界的風浪多大，基督在我們還作罪人時就為我們死，這份沉甸甸的愛，就是我們在風雨中絕不搖擺的鐵證。",
    practiceGod:"為你目前生命中正經歷的一個「微苦難」或挑戰向神獻上感謝，求聖靈將祂的愛再次澆灌下來。",
    practicePeople:"今天預備一份小點心或一杯咖啡，送給身邊正承擔極大工作或生活壓力的人，為他打氣。",
    prayer:"主啊，謝謝祢在風雨中作我最穩固的盾牌。求聖靈將祢源源不絕的愛再次澆灌在我的心裡，好讓目前的苦難挑戰成為我靈性重訓的養分，磨練出不絕望的盼望，並有餘力關懷受壓的人。阿們。",
    verse:"「惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。」（羅馬書 5:8）", tags:"#重訓 #澆灌 #暴風雨中的錨" },
  { date:"7/6", day:6, book:"羅馬書", passage:"羅馬書 6:1-23",
    focus:"你的舊密碼已過期，今天起換上自由的新身分。",
    navigation:"很多人誤以為恩典可以當作放縱的通行證，但保羅強調，當我們受洗歸入基督時，那滿身惡習、被罪捆綁的「舊我」就已經宣告死亡並埋葬了。現在活著的，是一個與基督一同復活的「新我」。現代人常被過去的壞習慣、成癮或原生家庭的陰影緊緊扣留，但這章經文是你的靈性自由宣言。罪不再是你的老闆，你不需要再聽從它的指令。你可以主動把自己的眼、耳、口、手當作公義的器具獻給神，活出真正的主權獨立。",
    practiceGod:"做一個象徵性的動作（如握拳再放開），宣告某個捆綁你很久的壞習慣已與基督同死，今天你要為神而活。",
    practicePeople:"在與家人的互動中，刻意克制住平常容易脫口而出的情緒性壞脾氣，改用溫柔的言語回應。",
    prayer:"親愛的主，謝謝祢為我撕下了過去被罪控告的標籤。我宣告過去的惡習與創傷已與祢同埋葬。今天，我將我的身體與口舌獻上作公義的器具，求祢引導我用溫柔的言語，活出自由的新生命。阿們。",
    verse:"「因為知道我們的舊人和他同釘十字架，使罪身滅絕，叫我們不再作罪的奴僕。」（羅馬書 6:6）", tags:"#斷開捆綁 #新生 #自由" },
  { date:"7/7", day:7, book:"羅馬書", passage:"羅馬書 7:1-25",
    focus:"承認靠自己會搞砸，正是經歷基督拯救的起點。",
    navigation:"這一章保羅寫下了人類內心深處最真實的掙扎：「我所願意的善，我反不做；我所不願意的惡，我倒去做。」這種嚴重的內耗與無力感，每個現代人都感同身受——我們知道要自律、要溫柔、要正向，卻往往在現實中崩潰。保羅指出，單靠律法與意志力是無法勝過人性中的殘餘引力的。但這段看似絕望的呼喊，最終卻導向了驚天動地的讚美：「感謝神！靠著我們的主耶穌基督就能脫離了。」認輸，才是贏的開始。",
    practiceGod:"在禱告中對神承認：「主啊，這件事我靠自己真的辦不到，我需要祢。」將控制權完全交託。",
    practicePeople:"當看到別人的軟弱或搞砸事情時，收起批判，因為我們都在同樣的掙扎中，試著用體恤的心陪伴他。",
    prayer:"主啊，我真誠地面對自己內心的拉扯與內耗，承認單靠自己的意志力一定會搞砸。我願意放手，將生命的方向盤交託給祢，謝謝祢在我無力時作我的拯救，用祢的恩典帶我脫離掙扎。阿們。",
    verse:"「我真是苦啊！誰能救我脫離這取死的身體呢？感謝神，靠著我們的主耶穌基督就能脫離了。」（羅馬書 7:24-25）", tags:"#掙扎 #放手 #拯救的光" },
  { date:"7/8", day:8, book:"羅馬書", passage:"羅馬書 8:1-39",
    focus:"在聖靈的護航裡，沒有任何事物能切斷神對你的愛。",
    navigation:"羅馬書第八章是全書的高峰。保羅宣告那些在基督裡的，如今「就不定罪了」。現代人活在充滿定罪感與不安全感的環境中，隨時害怕被拋棄。但保羅為我們拉開了一個宇宙級的保護網：聖靈在我們心裡深切代求，並且我們已經得著了兒子的名分。即使受苦，這苦楚與將來的榮耀相比也微不足道。最後，那串歷史性的宣告——無論是死、是生、是現在的事、是將來的事，都不能叫我們與神的愛隔絕。這是最完美的終極安全感。",
    practiceGod:"用3分鐘默想神對你那份「不離不棄」的愛，並在心中對神說：「謝謝祢，在祢裡面我全然安全。」",
    practicePeople:"給一位正經歷極大挫折、覺得自己被神或被世界拋棄的肢體一個深沉的擁抱，或者為他親手寫一張鼓勵的卡片。",
    prayer:"阿爸天父，謝謝祢給了我合法的兒女名分，讓我在聖靈的代求中得著全然的安全感。我宣告，世上沒有任何艱難能將我與祢的愛隔絕，求祢用這份無敵的愛，安慰我身邊正在受挫的朋友。阿們。",
    verse:"「誰能使我們與基督的愛隔絕呢？難道是患難嗎？是困苦嗎？是逼迫嗎？……」（羅馬書 8:35）", tags:"#無敵的愛 #護航 #金光護罩" },
  { date:"7/9", day:9, book:"羅馬書", passage:"羅馬書 9:1-33",
    focus:"上帝擁有主權，祂的揀選絕不落空。",
    navigation:"第九章探討了深奧的「神聖主權與揀選」。現代文化崇尚個人主義與絕對掌控，我們總希望上帝按照我們的藍圖和劇本來演。但保羅提醒我們，窯匠難道沒有權柄用泥塊做出不同的器皿嗎？上帝的恩典與憐憫不受人的意志所左右，祂的計劃有更高的維度。這不是要讓我們感到宿命，而是要讓我們在驚嘆中放下妄想掌控明天的重擔，安息在祂完全公義且慈愛的至高主權中。",
    practiceGod:"學習在一個你一直想要神「照你意思行」的事情上放手，禱告宣告：「主啊，祢是窯匠，我是泥土，願祢的旨意成就。」",
    practicePeople:"在小組或群體中，刻意去接納並讚美一位「與你風格完全不同」的同工，欣賞神在每個人身上獨特的塑造。",
    prayer:"至高的主，祢是神聖的窯匠，我是被祢細心揉捏的泥土。我承認我常妄想掌控自己的明天，今天我選擇放手，臣服於祢美善的主權之下。求祢挪去我的抗拒，讓我安息在祢絕不落空的計劃裡。阿們。",
    verse:"「據此看來，這不在乎那願意的，也不在乎那奔跑的，只在乎發憐憫的神。」（羅馬書 9:16）", tags:"#窯匠的手 #主權 #星際軌道" },
  { date:"7/10", day:10, book:"羅馬書", passage:"羅馬書 10:1-21",
    focus:"相信並宣告，把生命最好的消息分享出去。",
    navigation:"保羅在這裡強調了拯救的簡單與迫切——「心裡相信，口裡承認」。現代人常常把事情複雜化，以為要修行到某個程度才能得救，但神的道其實離我們不遠，就在我們口裡，在我們心裡。然而，保羅也提出了一個關鍵的行動問題：如果沒有人傳，人怎麼能聽見呢？在這個充斥著壞消息、八卦與對立的網路時代，我們被呼召成為那個帶領人遇見平安、傳遞福音好消息的「美善雙腳」。",
    practiceGod:"在早晨醒來時，大聲口裡承認耶穌是你今天各樣決定（職場、家庭）的主，讓話語宣告帶來屬靈權柄。",
    practicePeople:"預備一個簡單的信仰見證（大約2分鐘），並在心裡設定一個目標，在接下來這週找機會與一位未信的朋友分享。",
    prayer:"主耶穌，謝謝祢讓拯救的恩典如此靠近。今天我口裡承認、心裡相信祢是我生命中每個決定的主。求祢賜我佳美的腳蹤，挪去我的害羞與懼怕，讓我的生命成為向身邊人傳遞真平安的好消息擴音器。阿們。",
    verse:"「報福音、傳喜信的人，他們的腳蹤何等佳美！」（羅馬書 10:15）", tags:"#佳美腳蹤 #傳遞好消息 #心靈擴音器" },
  { date:"7/11", day:11, book:"羅馬書", passage:"羅馬書 11:1-36",
    focus:"神的智慧深不可測，萬物最終都歸於祂。",
    navigation:"本章展示了救贖歷史的宏大拼圖。保羅解釋了為什麼以色列人看似跌倒，卻成了外邦人得救的契機，而最終神仍要憐憫眾人。這讓我們看見，上帝能把歷史的殘局、甚至人類的失敗，編織進祂完美的拯救計劃中。現代人在看新聞或面對混亂的世界局勢時常感到絕望，但當我們拉高視野，就會像保羅一樣發出由衷的讚嘆：神的智慧何其高深！萬有都是本於祂、倚靠祂、歸於祂。",
    practiceGod:"讀完經文後，不求索取，單純用保羅在最後的頌讚（33-36節）作為你對神深不可測之智慧的敬拜。",
    practicePeople:"面對教會或職場中看似完全「不可救藥」或與神對立的人，不要放棄，持續用信心在禱告中為他的翻轉守望。",
    prayer:"萬有的主宰，祢的智慧何其高深，祢的判斷深不可測！當我看著混亂的世界或殘破的局勢感到絕望時，求祢拉高我的屬靈視野，看見萬有最終都歸於祢。我要用讚美來代替擔憂，全心倚靠祢。阿們。",
    verse:"「深哉，神豐富的智慧和知識！他的判斷何其難測！他的蹤跡何其難尋！」（羅馬書 11:33）", tags:"#深不可測 #宇宙拼圖 #全景視野" },
  { date:"7/12", day:12, book:"羅馬書", passage:"羅馬書 12:1-21",
    focus:"獻上生活作為最酷的祭物，用良善顛覆世界。",
    navigation:"羅馬書從這一章開始轉入精彩的生活實踐。保羅呼籲我們將「身體獻上當作活祭」。現代文化不斷給我們洗腦，要我們符合這個世界的模子（隨波逐流），但真正的敬拜不是主日唱幾首歌，而是在週一到週六的職場與生活中，心意更新而變化。這章也給出了極度具體的社群守則：愛人不可虛假、與喜樂的人同樂、與哀哭的人同哭，甚至不自己伸冤，而是用炭火般的良善去感化仇敵。",
    practiceGod:"在出門前禱告，將自己的雙眼、雙手和舌頭奉獻給神，作為今天在職場/學校中服事祂的聖潔祭物。",
    practicePeople:"刻意尋找一個你平常不太對盤或曾得罪你的人，在今天找機會讚美他的一項優點，或者主動協助他的工作。",
    prayer:"親愛的主，我不願再被這個世界的世俗模子給強行塑造。今天我將我的全人、我的職場生活獻上作為活祭。求聖靈更新我的思維，讓我能敏銳他人的哀哭與喜樂，以源源不絕的良善戰勝一切惡念。阿們。",
    verse:"「不要效法這個世界，只要心意更新而變化，叫你們察驗何為神的善良、純全、可喜悅的旨意。」（羅馬書 12:2）", tags:"#活祭 #心意更新 #逆流而上" },
  { date:"7/13", day:13, book:"羅馬書", passage:"羅馬書 13:1-14",
    focus:"在黑暗的世代中，披戴耶穌活出清晨的光彩。",
    navigation:"本章探討了基督徒與社會權柄的關係，以及日常道德。保羅提醒我們，在地上要作遵紀守法、按時納稅的好公民，因為一切權柄出於神。但更扎心的是他對時間的敏感度：黑夜已深，白晝將近！現代社會充滿了暗昧的行為（放縱、嫉妒、紛爭），許多人過著黑白顛倒、靈性昏睡的生活。保羅呼籲我們該是「睡醒的時候了」，要脫去暗昧的行為，直接把耶穌基督當作外衣「披戴」在身上，讓你的日常行為經得起陽光的檢視。",
    practiceGod:"檢查自己一整天的時間分配，求聖靈光照是否有任何沉迷於社群或虛浮娛樂的「靈性昏睡」狀態，並做出調整。",
    practicePeople:"實踐「凡事都不可虧欠人，惟有彼此相愛要常以為虧欠」，今天主動結清一筆拖延的款項或人情債。",
    prayer:"主耶穌，黑夜已深，求祢喚醒我昏睡的靈魂。今天我要脫去暗昧懶散的行為，將祢當作光明的衣袍重新披戴在身上。讓我的行事為人誠實端正，在相愛中絕不虧欠任何人，活出清晨般的生命光彩。阿們。",
    verse:"「黑夜已深，白晝將近；我們就當脫去暗昧的行為，帶上光明的兵器。」（羅馬書 13:12）", tags:"#黎明防線 #披戴基督 #晨光" },
  { date:"7/14", day:14, book:"羅馬書", passage:"羅馬書 14:1-23",
    focus:"接納不同的特質，不要讓你的自由成為別人的絆腳石。",
    navigation:"保羅處理了教會內部因為吃肉、守日等相對教義引發的內耗。在現代教會或小組中，我們也常因為政治立場、教養觀念或敬拜風格的不同而彼此論斷。保羅提出了一個偉大的神國原則：神的國不在於吃喝，而在於聖靈裡的公義、和平與喜樂。你有強壯的信心和自由很好，但更偉大的成熟是願意為了「不絆倒軟弱的肢體」而主動限制自己的自由。我們不是為了對錯而活，而是為了建造彼此。",
    practiceGod:"在內心深處向神交託：不再作別人的審判官，因為每個人最終都是向神獨自交帳，還給神絕對的審判權。",
    practicePeople:"今天在聚會或聊天中，刻意避開容易引發爭論的敏感話題，專注於彼此生命的建造與鼓勵。",
    prayer:"神國的主，求祢赦免我常想當別人的審判官。提醒我神的國不在於外在教條的對錯，而是在於聖靈中的公義與和平。賜我包容的胸懷，甘願為了不絆倒弟兄姊妹而限制自己的自由，專注建造群體。阿們。",
    verse:"「因為神的國不在乎吃喝，只在乎公義、和平，並聖靈中的喜樂。」（羅馬書 14:17）", tags:"#神國拼圖 #和平之子 #包容的胸懷" },
  { date:"7/15", day:15, book:"羅馬書", passage:"羅馬書 15:1-33",
    focus:"擔當別人的軟弱，同心合意唱出信仰的交響樂。",
    navigation:"保羅在這章提出了效法基督的極致榜樣：不求自己的喜悅。堅固的人應當擔當不堅固人的軟弱。這與現代社會強調「利己主義」、「我自己好就好」的風氣完全背道而馳。教會就像是一個交響樂團，如果人人都只吹奏自己的主旋律，只會帶來刺耳的噪音；但當我們彼此接納、互相補位時，就能同心合意地用一個聲音榮耀上帝。",
    practiceGod:"禱告求神賜下「忍耐與安慰」，使你在面對教會中比較難相處的肢體時，有從神而來的力量堅持下去。",
    practicePeople:"主動去關心、協助小組或教會中一位公認較為軟弱、需要被照顧的肢體，用實際行動承擔他的重擔。",
    prayer:"賜忍耐與安慰的神，求祢賜給我們同心合意的心。效法耶穌不求自己喜悅的榜樣，讓我有力量主動擔當軟弱肢體的重擔。願我們在群體中放下個人的尖銳，用彼此接納的和聲，交織出榮耀祢的生命交響樂。阿們。",
    verse:"「但願賜忍耐安慰的神叫你們彼此同心，效法基督耶穌，一心一口榮耀神。」（羅馬書 15:5-6）", tags:"#交響樂 #彼此接納 #同心合意" },
  { date:"7/16", day:16, book:"羅馬書", passage:"羅馬書 16:1-27",
    focus:"在同工的感謝名單中，看見默默奉獻的偉大。",
    navigation:"羅馬書的結尾看似是一串枯燥的問安名單，但只要仔細閱讀，就會發現這是一幅充滿溫度的「天國英雄榜」。保羅提到了女執事非比、同甘共苦的百基拉和亞居拉，以及許多默默無聞卻在主裡勞苦的人。現代人習慣追逐鎂光燈與C位，但神的國度是由無數個在台下默默奉獻、接待、代禱的普通人撐起來的。每個人在神眼中都有名字，都是不可或缺的策略夥伴。",
    practiceGod:"為了你在信仰路上曾遇過的屬靈長輩、同工向神獻上感謝，謝謝神透過這群人編織了你的生命。",
    practicePeople:"在今天寫一封感謝的訊息，傳給教會中一位默默服事（如音控、招待、清潔或行政）的同工，表達你的看見與謝意。",
    prayer:"全智的神，謝謝祢在天國名冊上記下每個默默奉獻的名字。我為著身邊那些甘心站在台下、低調服事的同工向祢獻上由衷的感謝。求祢親自堅固他們的腳步，也讓我成為一個懂得感恩、樂意補位的夥伴。阿們。",
    verse:"「願榮耀，因耶穌基督，歸與獨一全智的神，直到永遠。阿們！」（羅馬書 16:27）", tags:"#無名英雄 #天國名冊 #永恆榮耀" },
  { date:"7/17", day:17, book:"加拉太書", passage:"加拉太書 1:1-24",
    focus:"堅守純正的福音，拒絕討好世界的山寨信仰。",
    navigation:"歡迎來到加拉太書！這是一卷保羅帶著神聖憤怒寫下的書信，因為加拉太教會正被「山寨版福音」給污染，試圖在恩典之外加上律法的包袱。保羅非常嚴厲地宣告：如果有人傳別的福音，他就該受咒詛！現代人的山寨福音可能是「成功神學」或「道德主義」——以為只要表現好，神才會愛我。保羅用自己的生命見證（從逼迫者變成使徒）直言：我不是要討人的喜歡，我是要作基督的僕人。純淨的福音，才有純淨的能力。",
    practiceGod:"審視自己的禱告動機，是否有時把神當作滿足慾望的工具？求神恢復你對祂純粹的敬畏與愛。",
    practicePeople:"當身邊的肢體因表現不佳而深感內疚時，不要用道德標準去加重他的負擔，要用純粹的恩典話語安慰他。",
    prayer:"主基督，求祢保守我的心不被世界塞滿山寨的律法與包裝。我不要過度迎合人的眼光，我渴望單單作祢真誠的僕人。求祢恢復我對純淨恩典的渴慕，讓我用這無條件的愛，安慰因表現不完美而內疚的肢體。阿們。",
    verse:"「我現在是要得人的心呢？還是要得神的心呢？我豈是討人的喜歡嗎？」（加拉太書 1:10）", tags:"#拒絕山寨 #基督僕人 #純粹" },
  { date:"7/18", day:18, book:"加拉太書", passage:"加拉太書 2:1-21",
    focus:"與基督同釘十字架，讓祂在你的生命中接管駕駛座。",
    navigation:"保羅在這章記錄了他與大徒弟彼得的正面衝突，因為彼得在猶太人面前裝假。這提醒我們，連屬靈巨擘都可能落入「假冒偽善」的陷阱。隨後保羅說出了全聖經最震撼的宣告之一：加拉太書 2:20。我們已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著。現代人活得很累，是因為我們一直想坐在自己生命的駕駛座上掌控一切。把方向盤交給基督，靠著愛我們的神子的信心而活，這才是真正的輕鬆與釋放。",
    practiceGod:"閉上眼睛，想像自己把生命的方向盤交給坐在身旁的耶穌，對祂說：「主啊，今天祢來開車，我聽祢的。」",
    practicePeople:"當今天在職場或人際關係中感到「自我（ego）」受挫、想發脾氣時，心中默念：「現在活著的不再是我，乃是基督。」讓情緒冷卻。",
    prayer:"主耶穌，今天我向我的驕傲與掌控欲宣告同釘十字架。我正式將生命的方向盤交託給祢，請祢接管我的心思意念。當我的自我受挫、憤怒將起時，求祢讓我在祢裡面安息，宣告現在活著的乃是基督。阿們。",
    verse:"「現在活著的不再是我，乃是基督在我裡面活著。」（加拉太書 2:20）", tags:"#方向盤交出 #同釘十字架 #新生命" },
  { date:"7/19", day:19, book:"加拉太書", passage:"加拉太書 3:1-29",
    focus:"不要當靈性的無知人，靠聖靈入門就絕不靠肉體成全。",
    navigation:"保羅大聲疾呼：「無知的加拉太人哪！」這句話同樣在對現代基督徒敲警鐘。我們常常「靠聖靈入門」，體驗到神的愛而流淚得救，但過了幾年，我們卻開始「靠肉體成全」——企圖用自己的表現、事工的成就、讀經的時數來向神邀功、向人炫耀。保羅說，律法只是把我們引向基督的「訓蒙師」。現在我們因著信，都已經披戴基督，在祂裡面不分階級、身分，全部都是神合法的產業繼承人。",
    practiceGod:"放下今天所有事工的成就感，單純回到像小孩子一樣的單純，對神說：「阿爸父，謝謝祢，我是祢的寶貝孩子。」",
    practicePeople:"在教會群體中，刻意打破因社會地位、財富或學歷帶來的無形隔閡，主動去跟不同背景的人同桌團契。",
    prayer:"親愛的阿爸天父，謝謝祢讓我藉著信心白白披戴基督，成為合法的產業繼承人。求祢拿走我想靠著事工成就或道德好表現來向祢邀功的無知。讓我今天回到最單純的孩子身分，跨越階級去愛不同的人。阿們。",
    verse:"「你們既靠聖靈入門，如今還靠肉體成全嗎？你們是這樣無知嗎？」（加拉太書 3:3）", tags:"#聖靈入門 #拒絕內卷 #天國繼承人" },
  { date:"7/20", day:20, book:"加拉太書", passage:"加拉太書 4:1-31",
    focus:"脫離奴僕的恐懼，大聲呼叫神為「阿爸，父！」",
    navigation:"許多現代基督徒與上帝的關係像「雇工」——做多少事、拿多少薪水，沒做好就害怕被開除。保羅在這章宣告，時候滿足了，神差遣祂的兒子來，是要叫我們得著「兒子的名分」。神甚至把兒子的靈放入我們心裡，使我們能親暱地喊祂「阿爸，父！」雇工做事是出於恐懼，兒子做事是出於愛。保羅甚至用生動的比喻，寧願承受生產之苦，也要看到基督的生命在加拉太人心裡成形，這就是福音的終極渴望。",
    practiceGod:"在今天每一次禱告的開頭，刻意放慢速度，深情地呼喊三聲「阿爸，父」，體會那份毫無恐懼的父子/父女連結。",
    practicePeople:"身為父母或屬靈同伴的你，今天用無條件的愛去包容孩子或羊群的犯錯，不急著責備，先給予接納的擁抱。",
    prayer:"阿爸，父！謝謝祢差遣兒子的靈進入我的心，徹底粉碎了我靈魂裡那份害怕被開除的奴僕恐懼。我是祢心愛的兒女，求祢讓基督的生命在我裡面成熟成形，使我能用這份毫無條件的愛，去擁抱犯錯的人。阿們。",
    verse:"「你們既為兒子，神就差他兒子的靈進入你們的心，呼叫：『阿爸！父！』」（加拉太書 4:6）", tags:"#阿爸父 #不再是奴僕 #生命成形" },
  { date:"7/21", day:21, book:"加拉太書", passage:"加拉太書 5:1-26",
    focus:"順著聖靈行事，在自由中結出豐盛的生命果子。",
    navigation:"基督釋放了我們，是要我們得自由！但現代人常把自由誤解為「只要我喜歡，有什麼不可以」的放縱。保羅指出，放縱情慾只會帶來嫉妒、惱怒、紛爭等靈性惡臭。真正的自由，是擁有「不做惡事的自由」，並且甘心樂意用愛心彼此服事。這章提出了著名的「聖靈九果」：仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。這些果子不是靠意志力裝飾上去的，而是當我們每天順著聖靈的引導生活時，生命自然散發出的迷人香氣。",
    practiceGod:"檢視聖靈九果，選出一個你目前最缺乏的（例如：節制或忍耐），求聖靈今天在你的心中特別動工培育。",
    practicePeople:"實踐「用愛心彼此服事」，今天為家人或同事做一件微小但貼心的服事（例如：順手倒垃圾、洗碗或幫忙買午餐）。",
    prayer:"釋放我的主，謝謝祢賜我真自由。求聖靈今天在我的生命泥土中，栽培出仁愛、忍耐與節制的果子。主啊，挪去我的自私與血氣，讓我心甘情願透過微小貼心的實踐，在生活中用愛心彼此服事。阿們。",
    verse:"「聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。」（加拉太書 5:22-23）", tags:"#聖靈果子 #真自由 #香氣溢出" },
  { date:"7/22", day:22, book:"加拉太書", passage:"加拉太書 6:1-18",
    focus:"行善不灰心，因為順著聖靈撒種的必收成永生。",
    navigation:"加拉太書的尾聲充滿了極具操作性的群體智慧。保羅提醒我們，若看見肢體被過犯所勝，要用「溫柔的心」把他挽回過來，並且要互相擔當重擔。更重要的是，保羅提出了一個宇宙恆常的律：人種的是什麼，收的也是什麼。在現代這個講求速成的時代，行善和服事往往短時間看不到效果，讓人容易疲憊灰心。請記住這句應許：若不灰心，到了時候就要收成！不要為自己的面子驕傲，要單單誇耀耶穌基督的十字架。",
    practiceGod:"面對服事或信仰生活中的瓶頸，向神做一個「不灰心」的宣告，求祂為你的靈性續航力加添神聖的燃料。",
    practicePeople:"當得知某位肢體正處於經濟、身體或情緒的極大重擔中，主動聯絡他，對他說：「這段路，我陪你一起扛。」並給予具體協助。",
    prayer:"恆久忍耐的主，在漫長的撒種過程中，我的肉體常常感到疲憊灰心。求祢將十字架的榮耀刻在我心中，作我永不枯竭的燃料。讓我行善不喪志，並賜我溫柔的心與實際行動，去與軟弱肢體同扛重擔。阿們。",
    verse:"「我們行善，不可喪志；若不灰心，到了時候就要收成。」（加拉太書 6:9）", tags:"#不灰心撒種 #挽回與擔當 #十字架的榮耀" },
  { date:"7/23", day:23, book:"歌羅西書", passage:"歌羅西書 1:1-29",
    focus:"基督是一切的核心，祂在凡事上居首位。",
    navigation:"歡迎進入歌羅西書！這是一卷將耶穌基督的榮耀放大到極致的書信。當時歌羅西教會受到了神祕主義和異端的干擾，保羅直接拋出了「基督最高論」：耶穌是那不能看見之神的像，萬有都是靠祂造的，也是為祂造的。現代世界有太多事物在爭奪我們心中的焦點（金錢、名聲、甚至事工）。保羅提醒我們，基督才是那維繫宇宙運作、也是住存在我們心裡那「榮耀的盼望」。當基督在你的凡事上居首位時，你生命零散的拼圖才能找到正確的位置。",
    practiceGod:"在禱告中尊崇耶穌是你生命中每一部分的「萬王之王」（包括你的財務、婚姻、未來），宣告祂居首位。",
    practicePeople:"面對你目前正在牧養或關懷的對象，效法保羅的志向：用諸般的智慧勸戒、教導他，要把他「在基督裡完完全全地引到神面前」。",
    prayer:"榮耀的元首基督，祢是那不能看見之神的像。今天我將我的金錢、未來與家庭完全尊祢為大，宣告祢在我的凡事上高居首位。願祢這至高的榮耀盼望，成為我牧養、引導他人的唯一核心。阿們。",
    verse:"「他在萬有之先；萬有也靠他而立。他也是教會全體之首……使他可以在凡事上居首位。」（歌羅西書 1:17-18）", tags:"#居首位 #宇宙中心 #榮耀盼望" },
  { date:"7/24", day:24, book:"歌羅西書", passage:"歌羅西書 2:1-23",
    focus:"在基督裡生根建造，拒絕世俗虛空的哲學洗腦。",
    navigation:"保羅擔心歌羅西人被世俗的虛空妄言和人間遺傳給「擄去」。現代社會是一個巨大的洗腦機器，透過短影音、廣告和主流價值觀，不斷灌輸我們「你不夠好、你需要擁有更多才能幸福」的虛假哲學。但保羅大聲宣告：神本性的一切豐盛，都有形有體地居住在基督裡面，而我們在祂裡面也已經「得了豐盛」。你不需要靠精緻的律法主義或神秘體驗來給自己加分，你只需要在基督裡紮根，祂已經在十字架上公開贏得了勝仗，把所有的控告塗抹掉了。",
    practiceGod:"刻意安排一段30分鐘遠離手機的時間，單純藉著讀經與默想，讓自己的靈性生命在基督的肥沃土壤中深根。",
    practicePeople:"面對身邊正被世俗「比較文化」壓得喘不過氣的朋友，用神的話語提醒他：他在基督裡已經得著了最完美的豐盛。",
    prayer:"主基督，這世界每天都在對我進行虛空的哲學洗腦，試圖用比較奪走我的平安。我宣告我在祢裡面已經得著了一切的豐盛。求祢讓我的靈修生活在祢裡面生根建造，能用十架凱旋的真理，釋放被壓的人。阿們。",
    verse:"「你們既然接受了主基督耶穌，就當遵他而行，在他裡面生根建造，信心堅固……」（歌羅西書 2:6-7）", tags:"#生根建造 #看穿虛空 #十架凱旋" },
  { date:"7/25", day:25, book:"歌羅西書", passage:"歌羅西書 3:1-25",
    focus:"脫去舊人的髒衣服，換上天國最新款的恩慈套裝。",
    navigation:"既然我們與基督一同復活，思維邏輯就必須升級，要「思念上面的事」。保羅用了一個極具畫面感的比喻：脫衣服與穿衣服。我們要像脫掉發臭的舊衣服一樣，脫去惱恨、憤怒、惡毒和謊言；同時，要穿上天國最新款的衣服——憐憫、恩慈、謙虛、溫柔和忍耐。最重要的是，要讓「基督的平安在心裡裁判（作主）」。這章還延伸到了家庭與職場：無論做什麼，都要像給主做的，而不是給人做的。",
    practiceGod:"在今天做任何決定或陷入情緒拉扯時，安靜下來問自己：「此時此刻，基督的平安在我的心裡投贊成票還是反對票？」",
    practicePeople:"面對家人或極難伺候的老闆/客戶，在心中默默對自己說：「今天我是為耶穌做的。」用最高標準的溫柔與敬業回應他。",
    prayer:"與我一同復活的主，今天我要脫去憤怒與惡毒的髒衣。求祢為我披上憐憫與溫柔的天國衣服。讓基督的平安作我心中的裁判長，在職場、家庭中，使我所說所做都奉祢的名，甘心樂意為祢而行。阿們。",
    verse:"「無論做什麼，或說話或行事，都要奉主耶穌的名，藉著他感謝父神。」（歌羅西書 3:17）", tags:"#天國服飾 #基督的平安 #為耶穌而做" },
  { date:"7/26", day:26, book:"歌羅西書", passage:"歌羅西書 4:1-18",
    focus:"言語要帶著和氣與鹽味，在日常中抓住展現信仰的窗口。",
    navigation:"歌羅西書的尾聲聚焦在門徒的公關與人際智慧。保羅呼籲我們要恆切禱告，並且在與未信主的人交往時要「用智慧」。他提到一個非常生動的指標：你們的言語要常常帶著和氣，好像「用鹽調和」。鹽能防腐、能提味。現代網絡世界充滿了辛辣、諷刺與攻擊性的語言，基督徒的對話應該要成為社會的防腐劑，讓人感到溫暖且有深度。",
    practiceGod:"為教會的牧者、宣教士或全職同工恆切禱告，求神為他們開傳道的門，賜給他們無懼的膽量。",
    practicePeople:"今天在社群媒體留言或與人對話時，刻意過濾掉任何負面消極的詞彙，讓你的話語充滿鼓勵、和氣與智慧的「鹽味」。",
    prayer:"智慧的主，求祢用聖靈防腐的鹽，調和我的舌頭。當我面對網絡或日常對話時，除去我的血氣與諷刺，讓我的言語充滿帶著和氣的鹽味。也求祢為福音開傳道的門，加添牧者與同工無懼的膽量。阿們。",
    verse:"「你們的言語要常常帶著和氣，好像用鹽調和，就可知道該怎樣回答各人。」（歌羅西書 4:6）", tags:"#鹽味言語 #恆切禱告 #智慧公關" },
  { date:"7/27", day:27, book:"腓立比書", passage:"腓立比書 1:1-30",
    focus:"無論環境如何受限，活著就是基督，死了就有益處。",
    navigation:"歡迎來到充滿喜樂的腓立比書！這卷書最奇妙的地方在於，它是保羅在伸手不見五指的監獄裡寫成的，但「喜樂」這個詞卻貫穿全書。保羅向我們展示了什麼叫做「環境無法囚禁的生命」。他坐在監獄裡，卻看見福音因此被興旺；他面對生死的抉擇，卻活出驚人的高度：「因我活著就是基督，我死了就有益處。」現代人常因為工作受挫、財務吃緊就失去喜樂，但保羅向我們證明，當你活著的目的完全是為了基督時，沒有任何環境能剝奪你的核心喜樂。",
    practiceGod:"面對目前把你關住的「環境監獄」（如不順遂的現狀），宣告這環境反而要叫福音興旺，並為此讚美神。",
    practicePeople:"效法保羅對腓立比教會的愛，在心裡默默為你小組的每位組員提名禱告，並由衷地為他們在信仰上的長進感到歡欣。",
    prayer:"監獄中賜喜樂的主，不論我的現狀如何受限，我宣告環境無法囚禁我的靈魂！我活著的終極目的就是基督。求祢挪去我因資源匱乏帶來的沮喪，讓我在困境中高歌，持續用信心守望並長進我所愛的肢體。阿們。",
    verse:"「因我活著就是基督，我死了就有益處。」（腓立比書 1:21）", tags:"#監獄中的歌聲 #活著就是基督 #超越環境的喜樂" },
  { date:"7/28", day:28, book:"腓立比書", passage:"腓立比書 2:1-30",
    focus:"效法基督的虛己與下降，在世上作發光的星體。",
    navigation:"這章包含了著名的新約聖經神學高峰——「基督頌」。保羅呼籲教會要同心，而秘訣就是「以基督耶穌的心為心」。耶穌展現了一種與世界完全相反的「下降美學」：祂本有神的形象，卻反倒虛己，取了奴僕的形象，甚至順服至死。現代文化教我們不斷向上爬、爭權奪利、證明自己多厲害；但天國的偉大卻在於誰願意走下去服事。當我們甘心放下權利、不發怨言、不說爭論的話時，我們就會像黑夜中的「明體（星星）」一樣，在扭曲的世代中發出耀眼的光芒。",
    practiceGod:"默想耶穌在十字架上的傾倒與虛己，在禱告中對神說：「主啊，我願意放下我的面子與特權，求祢賜我一顆僕人的心。」",
    practicePeople:"在今天的團隊合作或家庭生活中，當發生意見不合時，刻意實踐「各人看別人比自己強」，先聆聽並成就別人的想法。",
    prayer:"主耶穌，求祢將祢謙卑下降的十架美學深深烙印在我心裡。拿走我想在團隊或家庭中爭競出頭的傲慢，賜我一顆順服虛己的僕人之心。讓我甘心成全、看別人比自己強，在黑夜世代中如星星般為祢發光。阿們。",
    verse:"「你們當以基督耶穌的心為心……反倒虛己，取了奴僕的形象，成為人的樣式。」（腓立比書 2:5-7）", tags:"#下降美學 #以基督的心為心 #夜空中的星" },
  { date:"7/29", day:29, book:"腓立比書", passage:"腓立比書 3:1-21",
    focus:"丟棄過去的偶像與履歷，忘記背後努力向著標竿直跑。",
    navigation:"保羅在這章大膽地丟出了他的靈性斷捨離。他列舉了自己過去引以為傲的宗教履歷（純種猶太人、法利賽人、律法上的無可指責），但隨後他宣告：為了認識耶穌，他已經把這一切看作「糞土（垃圾）」。現代人身上貼滿了各種標籤：名校畢業、高薪職位、完美外表，我們常被這些標籤給綁架。保羅教導我們，最崇高的知識就是認識基督。不要沉溺於過去的成功，也不要被過去的失敗捆綁，拍拍灰塵，忘記背後，努力面前的，向著神在基督裡召你拿的天國獎賞直跑！",
    practiceGod:"拿出一張紙，寫下你目前最引以為傲的外在成就（或最讓你自卑的過去），在禱告中宣告：與認識基督相比，這一切都微不足道。",
    practicePeople:"關懷一位正沉溺於過去失敗陰影、或者正因中年危機失去方向的肢體，陪伴他一起尋找神在前方為他預備的生命標竿。",
    prayer:"主耶穌，與認識祢這至高至美的至寶相比，世上的名利標籤皆是糞土。求祢給我屬靈的勇氣進行靈性斷捨離，讓我徹底忘記背後的成就與失敗，拍拍灰塵，雙眼單單注視天國標竿，全力奔跑。阿們。",
    verse:"「我只有一件事，就是忘記背後，努力面前的，向著標竿直跑。」（腓立比書 3:13-14）", tags:"#靈性斷捨離 #向著標竿直跑 #天國公民" },
  { date:"7/30", day:30, book:"腓立比書", passage:"腓立比書 4:1-23",
    focus:"靠著加力量的基督，在任何環境中都能學會知足的秘訣。",
    navigation:"這是腓立比書充滿力量與安慰的終章。保羅留下了那句激勵無數人的終極應許：「我靠著那加給我力量的，凡事都能做。」但請注意，這句話的上下文不是世俗的成功學，而是關乎「靈性的知足」。現代社會充斥著比較與消費主義，不斷激發我們靈魂的飢餓感。保羅卻在監獄中親自示範，無論是處豐富還是處卑賤，他都得著了隨事隨在的秘訣。這是一種由內而外的強大，因為有一位神會照祂榮耀的豐富，在基督裡滿足你一切的需要。",
    practiceGod:"面對未來未知的生活挑戰，在神面前宣告：「主啊，靠著祢賜的力量，我宣告我能帶著喜樂與知足勝過一切。」",
    practicePeople:"實踐「彼此幫貼」，今天慷慨地給予身邊某位在經濟、或事工上需要資源的肢體一筆實際的奉獻或實質的援助。",
    prayer:"凡事都能的主，當消費主義與比較不斷激發我靈魂的飢餓時，求祢用祢榮耀的豐富填滿我。我宣告靠著祢賜的力量，在任何高山低谷中我都學會了知足，並樂意以慷慨的支援，成為他人豐富的祝福。阿們。",
    verse:"「我靠著那加給我力量的，凡事都能做。」（腓立比書 4:13）", tags:"#凡事都能 #靈性知足 #神聖燃料" },
  { date:"7/31", day:31, book:"腓利門書", passage:"腓利門書 1:1-25",
    focus:"福音突破階級屏障，在基督裡用愛修復破碎的關係。",
    navigation:"這卷短短的私人信件，展示了福音落地在人際關係中時最震撼的張力。保羅在獄中帶領了逃跑的奴隸阿尼西謀信主，隨後他寫信給奴隸主腓利門，懇求他不僅要饒恕阿尼西謀，更要「接納他如同親愛的弟兄」。在當時羅馬帝國階級森嚴、逃奴會被判死刑的背景下，這簡直是顛覆社會結構的要求。這讓我們看見，真正的基督教信仰不只是個人的修養，更是能在受損、背叛與破碎的社會關係中，帶來完全的和好與恢復。",
    practiceGod:"感謝神在我們還是得罪祂的「逃奴」時，就藉著耶穌接待我們。求神賜下天國的愛，來擴張自己饒恕他人的容量。",
    practicePeople:"思想在你目前的人際網絡中，是否有一個長久疏離、或曾傷害過你的「阿尼西謀」？主動在心中饒恕他，並在今天傳一則簡單平安的問候給對方，跨出和好的第一步。",
    prayer:"恩典和好的神，謝謝祢在我們還是罪惡逃奴時，就張開雙臂接納我們成為親愛的兒女。求祢除去我心中深藏的怨恨高牆，賜我突破階級與傷害的愛，主動去饒恕、修復那段受損的關係，讓生命重歸和好。阿們。",
    verse:"「他不再是奴僕，乃是高過奴僕，是親愛的兄弟。」（腓利門書 1:16）", tags:"#恩典和好 #不再是奴僕 #打破高牆" }
  ],
  august: [
  { date:"8月1日", day:1, book:"以賽亞書", passage:"以賽亞書 1:1-全",
    focus:"看清生命混亂的根源，回到天父懷中重啟人生。",
    navigation:"以賽亞書一開頭就如同法庭的控訴，上帝不是在發洩情緒，而是像一位心碎的父親在呼喚悖逆的兒女。現代人常常落入一種「宗教過動症」的盲點中，以為只要生活塞滿聚會、奉獻或看似崇高的道德行為，就能掩蓋內心與神關係的疏離。然而，上帝看重的從來不是表面的儀式感，而是內心的真實與公義。當我們的「靈性作業系統」因為罪與自我中心而卡頓，我們需要的是徹底的翻轉與潔淨。這段經文提醒我們，別再用宗教包裝逃避生命破口，唯面對軟弱，來到祂面前尋求潔淨，那被罪玷污如硃紅的生命才能被洗淨如白雪。",
    practiceGod:"找一個安靜的 10 分鐘做「心靈掃描」，誠實面對自己最近是否用忙碌的宗教活動代替了與神的親密關係，向祂獻上真心悔改。",
    practicePeople:"留意身邊一位正處於不公對待或處境艱難的朋友，不說教、不講大道理，用實際行動表達關懷。",
    prayer:"主啊，我承認有時我想用表面的好表現掩蓋內心的荒涼。謝謝祢震醒我，求祢今天洗淨我心中的硃紅，讓我單單回到祢的愛中。阿們。",
    verse:"「你們的罪雖像硃紅，必變成雪白；紅如丹顏，必白如羊毛。」（以賽亞書 1:18）", tags:"#洗淨 #白雪 #重啟 #天父的呼喚" },
  { date:"8月2日", day:2, book:"以賽亞書", passage:"以賽亞書 2:1-全",
    focus:"移開眼前的偶像，將眼光重新對焦於末後榮耀的聖山。",
    navigation:"以賽亞帶領我們看見一個極具震撼力的末後全景：耶和華殿的山必堅立，萬民都要流歸這山。現代生活充滿了各式各樣隱形的偶像，可能是對金錢的追逐、地位的焦慮，或是對科技與權力的依賴。我們常常將眼光鎖定在這些短暫且會震動的事物上，導致內心充滿恐懼。然而先知提醒我們，當上帝榮耀彰顯時，世上一切自高自大的都必降為卑。這是一次溫柔的「視力校正」，當我們願意卸下眼前的狂傲，把生命主權交還給那座不震動的聖山，就能在混亂的世代中找到不隨波逐流的錨。",
    practiceGod:"檢查今天花最多時間關注的「科技偶像」（社群軟體、股市、新聞），刻意關機 一段時間(譬如1小時)，將這段時間分別出來默想神的偉大。",
    practicePeople:"在人際關係中練習卸下「自高」的防衛。今天在與家人或同事溝通時，刻意放下爭對錯的執著，用謙卑聆聽的態度去成就他人。",
    prayer:"主啊，這世界總叫我仰望名利，讓我常陷在比較與焦慮中。今天我宣佈卸下狂傲，求祢開我的眼界，讓我一生流歸祢的榮耀中。阿們。",
    verse:"「來吧，我們登耶和華的山，奔雅各神的殿。主必將祂的道教訓我們，我們也要行祂的路。」（以賽亞書 2:3）", tags:"#聖山 #真理航向 #謙卑 #視力校正" },
  { date:"8月3日", day:3, book:"以賽亞書", passage:"以賽亞書 3:1-全",
    focus:"當社會的支柱搖晃時，唯有公義的根基能賜下真正的安穩。",
    navigation:"以賽亞書第三章描繪了失去秩序、社會支柱瓦解的混亂景象。當一個社會或個人除去糧食、水、英雄與謀士，只剩下表面的虛榮與驕傲時，崩潰是必然的結果。現代人常常將安全感建立在「外在系統」上，例如穩定的經濟或精緻的外在包裝。但這段經文給了我們扎心的提醒：當我們內心失去了對公義與真理的敬畏，外在的精緻很快就會化為荒涼。經文對奢華嬌縱的描繪，正是現代消費主義與「精緻窮」的寫照。上帝要我們看透外在點綴的虛無，在生命中建立由內而外的公義秩序。",
    practiceGod:"進行一次「生活減法」：今天刻意不購買任何非必要的奢侈品或飲料，並向神宣告：祢才是我生命中唯一的供應與真正安穩。",
    practicePeople:"關懷身邊一位正在經歷「生活支柱搖晃」（如面臨失業、失戀、經濟危機）的朋友，發一則長文簡訊或實際陪伴，成為他此時的溫暖支柱。",
    prayer:"主啊，當看見身邊的環境動盪時，我的心常會恐懼。求祢赦免我常把安全感建立在外在物質上，今天我要在祢裡面建立公義根基。阿們。",
    verse:"「你們要論義人說：他必得福樂，因為要吃自己行為所結的果子。」（以賽亞書 3:10）", tags:"#生命根基 #真實平安 #看透虛華 #不震動的國" },
  { date:"8月4日", day:4, book:"以賽亞書", passage:"以賽亞書 4:1-全",
    focus:"經歷火洗後的生命，必在神的榮耀覆罩下煥發華美。",
    navigation:"以賽亞書第 4 章帶領我們看見審判後驚人的復興圖景。先知描繪錫安經過公義與毀滅的審判後，上帝親自以「公義的靈」與「焚燒的靈」潔淨祂的百姓。洗淨罪污的目的不是為了毀滅，而是為了淘汰虛浮的偽裝，讓「耶和華發生的苗」重新發芽，彰顯極大的榮耀與華美。在現代生活中，我們常習慣用外在的社群形象、職稱或物質成果來包裹自己，深怕暴露軟弱。但經文提醒我們，唯有經歷聖靈火熱的潔淨，卸下虛浮的包裝，生命才能結出真實不腐壞的果實。當我們願意接受神的煉淨，上帝的臨在就會像雲彩與火光，成為我們最強大的防護罩。",
    practiceGod:"在禱告中誠實向神承認自己內心那些經不起考驗的虛榮與對外在評價的焦慮，求神的「焚燒之靈」燒盡灰燼，恢復起初純潔的信心。",
    practicePeople:"主動陪伴一位剛經歷挫折或失敗的朋友，不急著檢討他，而是用神的愛包容並鼓勵他，成為他風暴中的庇護與溫暖遮蓋。",
    prayer:"主啊，謝謝祢不只洗淨我的罪，更用祢的榮耀成為我生命的遮蔽與防護罩。求祢使我在任何試煉中不至灰心，讓我生命的新芽反映祢的華美。阿們。",
    verse:"「耶和華發生的苗必華美榮耀，地的出產必為以色列逃脫的人顯為榮華茂盛。」（以賽亞書 4:2）", tags:"#華美苗裔 #聖靈潔淨 #榮耀遮蓋 #真安全感" },
  { date:"8月5日", day:5, book:"以賽亞書", passage:"以賽亞書 5:1-全",
    focus:"別讓上帝精心栽培的生命，只結出荒涼的野葡萄。",
    navigation:"以賽亞書第 5 章以著名的「葡萄園之歌」拉開序幕。上帝把祂的百姓比作極佳的葡萄園：修挖石塊、栽種優良品種、建造守望樓，傾注了無限的愛與資源，期望結出公平與公義的甜美葡萄，沒想到最後竟只結出倒胃口的野葡萄。先知隨後痛陳「六禍」，揭露了當代貪婪、享樂、指鹿為黑白與自以為聰明的社會破口。這給現代基督徒一個極大的靈性警訊：我們享受了神豐富的恩典與資源，我們的生命是否結出了相稱的果子？還是我們在世俗風潮中，不知不覺也結出了貪婪與自私的野葡萄？唯有常在主裡，生命的葡萄樹才能真正結出甜美果實。",
    practiceGod:"進行一次「生命果實檢視」：誠實來到神面前，承認那些「看似精緻卻結出野葡萄」的自私破口，懇求聖靈重新在你的心田栽種順服與聖潔。",
    practicePeople:"察覺身邊一位正處於軟弱或迷茫中的肢體，不急著指責或下定義，而是用溫柔陪伴與實質幫助（如送一份點心或聆聽），扶持他重回恩典中。",
    prayer:"主啊，謝謝祢在我生命中細心栽培。求祢赦免我常順應世俗結出野葡萄，求祢的靈開我的眼睛，讓我真心結出公義與公平的果子榮耀祢。阿們。",
    verse:"「萬軍之耶和華的葡萄園就是以色列家；祂所喜愛的樹就是猶大人。祂指望的是公平，誰知倒有暴虐；指望的是公義，誰知倒有冤聲。」（以賽亞書 5:7）", tags:"#葡萄園 #甜美果實 #公義與公平 #生命檢視" },
  { date:"8月6日", day:6, book:"以賽亞書", passage:"以賽亞書 6:1-全",
    focus:"在聖潔榮耀的震撼中，回應上帝「在這裡，請差遣我」的使命。",
    navigation:"第六章是以賽亞生命中極其關鍵的轉折點。當烏西雅王崩克，地上的君王崩逝、國勢動盪之際，以賽亞看見了主坐在高高的寶座上。這表明地上的政權雖然會更迭，天上的寶座卻永遠立定。在撒拉弗「聖哉！聖哉！聖哉！」的讚美聲中，以賽亞深刻體會到自己的嘴唇不潔，進而接受了紅炭的潔淨。這段經文為現代基督徒提供了深度的「使命校準」。我們常因為環境的變動感到沮喪，但當我們真正在靈裡看見神的聖潔與榮耀，我們的自卑與恐懼就會化為烏有。神尋找的是被祂聖潔震撼、願意被潔淨、並勇敢回應「我在這裡，請差遣我」的人。",
    practiceGod:"在安靜中反覆默想神「聖哉、聖哉、聖哉」的榮耀景象，檢視自己最近言語是否有不潔之處，求神的聖火洗滌你的口舌與心靈。",
    practicePeople:"勇於接下身邊一份「沒有人想做的事」或服務（如教會的清潔或職場的額外負擔），以「我在這裡，請差遣我」的心態主動去服務身邊的人。",
    prayer:"主啊，求祢開啟我的心眼，讓我看見祢高高坐在寶座上的榮耀！求祢用祭壇的火潔淨我的嘴唇與內心，當祢呼喚時，我願說：我在這裡，請差遣我！阿們。",
    verse:"「我又聽見主的聲音說：我可以差遣誰呢？誰肯為我們去呢？我說：我在這裡，請差遣我！」（以賽亞書 6:8）", tags:"#寶座榮耀 #潔淨 #使命 #我在這裡" },
  { date:"8月7日", day:7, book:"以賽亞書", passage:"以賽亞書 7:1-全",
    focus:"在危機面前拒絕恐懼，緊緊抓住「以馬內利」的超然應許。",
    navigation:"第七章記錄了亞哈斯王面臨兩國聯軍進攻的極度恐懼。上帝透過先知以賽亞告訴他：「你當謹慎平靜，不要害怕」，並主動賜下「以馬內利（神與我們同在）」的兆頭。然而亞哈斯卻選擇倚靠亞述的軍事勢力，拒絕了上帝的保護。現代人在面臨職場競爭、經濟壓力或人際風暴時，也常像亞哈斯一樣，內心搖動如樹木被風吹動。我們習慣尋求世俗的捷徑，卻忽略了神最寶貴的應許就是祂的同在。「以馬內利」是你絕境中最強大的安全網，真正的安全感不是來自環境的平靜，而是來自確信掌管宇宙的神此時此刻正與我們同在。",
    practiceGod:"當今天感到焦慮時，停下手中的事做三次深呼吸，並在心中宣告「以馬內利，神與我同在」，將主權交還給神。",
    practicePeople:"主動關懷身邊一位正面臨重大壓力或決定而感到惶恐的朋友，用「神同在」的亮光鼓勵他，並陪伴他做一個有信心的祈禱。",
    prayer:"主啊，當眼前的風浪大到讓我心搖動時，求祢提醒我祢是「以馬內利」的神。求祢賜我平靜安穩的心，堅定相信祢永遠與我同在。阿們。",
    verse:"「因此，主自己要給你們一個兆頭，必有童女懷孕生子，給他起名叫以馬內利。」（以賽亞書 7:14）", tags:"#以馬內利 #神與我們同在 #不害怕 #平靜安穩" },
  { date:"8月8日", day:8, book:"以賽亞書", passage:"以賽亞書 8:1-全",
    focus:"不隨波逐流於世俗恐懼，尊萬軍之耶和華為唯一的聖者與避難所。",
    navigation:"以賽亞書第 8 章展現了極其張力十足的屬靈抉擇。當周圍的國家與民眾因為局勢動盪而陷入極度恐懼、瘋狂結盟、甚至求問鬼神時，上帝對以賽亞說：「這百姓說同盟，你們不要說同盟；他們所怕的，你們不要怕，也不要畏懼。」神呼籲祂的僕人要「尊萬軍之耶和華為聖，以祂為你們所怕的」，神必親自成為聖所與避難所。現代人面對經濟變局或職場焦慮時，也常被集體恐懼所淹沒，急著尋找世俗的避險手段。但經文提醒我們，當世人在黑暗中摸索時，屬神的人要以神的話語為標準，將生命緊緊繫於神的應許，成為持守真理的光明見證。",
    practiceGod:"檢查自己最近內心深處最害怕失去的一件事物，在安靜中向神宣告：「我不隨波逐流於集體焦慮，我尊萬軍之耶和華為我的聖所與唯一的避難所！」",
    practicePeople:"當身邊同事或朋友正在瘋狂傳播恐懼或消極情緒時，刻意扮演「平靜錨點」，不加入抱怨，而是分享一句具鼓勵性、有盼望的話語安定人心。",
    prayer:"主啊，當世界充滿動盪與恐懼時，求祢賜我堅定的信心。我不跟隨世俗的同盟與焦慮，我要尊祢為聖，讓祢成為我生命中最穩固的聖所。阿們。",
    verse:"「但要尊萬軍之耶和華為聖，以祂為你們所怕的，所威嚇的。祂必作聖所。」（以賽亞書 8:13-14）", tags:"#尊神為聖 #堅固避難所 #拒絕焦慮 #真理錨點" },
  { date:"8月9日", day:9, book:"以賽亞書", passage:"以賽亞書 9:1-全",
    focus:"黑暗中光芒已然照耀，在奇妙策士與和平之君裡尋得終極拯救。",
    navigation:"第九章描繪了從黑暗幽暗轉為大光照耀的奇妙翻轉。「在黑夜行走的百姓看見了大光」，這大光並非來自人類的科技，而是來自上帝賜下的一位嬰孩——祂是奇妙策士、全能的神、永在的父、和平的君。現代人的生活看似物質豐富，但內心卻常經歷無名的孤獨與混亂。我們試圖用各種娛樂來解開生命的結，但唯有這位「奇妙策士」能洞察我們最深的困境；唯有「和平的君」能平息我們內心無休止的角力。這段經文給予我們極大的盼望：不論你現在處於多深的谷底，神的救贖政權已經擔在祂的肩膀上，祂的熱心必成就這事。",
    practiceGod:"開口讚美耶穌是你的「奇妙策士」與「和平的君」，將你目前最混亂、最無法解開的難題（如職涯、家庭）完全陳明在祂面前，尋求智慧。",
    practicePeople:"將「和平」帶給一位曾與你有摩擦或關係緊張的人，發出一則展現善意與包容的訊息，成為締造和平的使者。",
    prayer:"主啊，謝謝祢成為我生命中的大光，照亮我內心的幽暗。當我迷茫時，祢是奇妙策士；當我焦慮時，祢是和平之君。願祢的政權在我生命中掌權。阿們。",
    verse:"「因有一嬰孩為我們而生；有一子賜給我們。政權必擔在祂的肩膀上；祂名稱為奇妙策士、全能的神、永在的父、和平的君。」（以賽亞書 9:6）", tags:"#大光 #奇妙策士 #和平之君 #極大盼望" },
  { date:"8月10日", day:10, book:"以賽亞書", passage:"以賽亞書 10:1-全",
    focus:"別拿上帝賜予的成就與器皿，當成自己狂傲自滿的資本。",
    navigation:"以賽亞書第 10 章深刻揭露了權力與驕傲的盲點。上帝使用強盛的亞述作為懲戒百姓破口的「棍棒」，但亞述王卻自高自大，以為全憑自己的智慧與軍力打下天下。先知用極具震撼力的比喻質問：「斧頭豈可向用斧頭砍木的自誇呢？鋸豈可向用鋸的自大呢？」神宣告必嚴懲狂傲自滿者，並終將為祂的餘民折斷強權的重軛。這給現代職場與事工中的我們極大的警醒：我們手中的才能與成就，都不過是上帝恩典調配的工具。當我們取得成功時，極易落入斧頭自誇的陷阱。唯有保持謙卑，明白自己只是上帝手中的器皿，我們才能靠神的大能打破一切重軛。",
    practiceGod:"檢視自己最近獲得的讚譽或工作成就，在神面前做一個「歸榮耀於神」的禱告，誠實承認若沒有神的恩賜，自己什麼也不能做。",
    practicePeople:"主動去肯定身邊一位默默付出、常被忽視的同工或下屬，讚賞他手上的忠心服事，將榮耀與鼓勵分享出去，不獨佔光芒。",
    prayer:"主啊，赦免我偶爾會在成就中沾沾自喜，忘了自己只是祢手中的器皿。求祢赐我謙卑的心，讓我明白一切能力都來自於祢，並靠祢的大能折斷重軛。阿們。",
    verse:"「斧頭豈可向用斧頭砍木的自誇呢？鋸豈可向用鋸的自大呢？這是和棍揮動那舉棍的，樹棒舉起那非木的人一樣。」（以賽亞書 10:15）", tags:"#謙卑器皿 #歸榮耀於神 #折斷重軛 #主權在神" },
  { date:"8月11日", day:11, book:"以賽亞書", passage:"以賽亞書 11:1-全",
    focus:"仰望耶西的本發出的公義嫩芽，在基督的和平國度裡經歷軟弱變剛強。",
    navigation:"第 11 章描繪了極具震撼力的彌賽亞國度全景：從耶西的本（殘株）必發一條嫩芽，聖靈的七重恩膏（智慧、聰明、謀略、大能、知識、敬畏耶和華）必安息在祂身上。先知更帶領我們看見「豺狼與綿羊同居，豹子與山羊羔同臥」的超然和平畫面。現代人的生命常像砍倒後的樹墩殘株，經歷挫折、傷害或資源耗盡後覺得自己毫無盼望。但這段經文宣告，神最擅長在看似枯乾的殘株中抽發全新的嫩芽！耶穌基督帶來的不是世俗政治的強權，而是公義與聖靈的治理。當我們讓聖靈管理心思意念，生命中的對立與衝突就能被和平所取代，枯乾的殘株也能重新吐露繁茂的枝葉。",
    practiceGod:"默想聖靈的七重恩膏，祈求聖靈的智慧與敬畏耶和華的靈澆灌你，特別在你正感到枯乾或資源匱乏的領域，求神抽發新芽。",
    practicePeople:"主動去修補關係：尋找身邊一位性格差異極大、常有衝突的人，學習「豺狼與綿羊同居」的包容，主動釋放善意與和解。",
    prayer:"主啊，謝謝祢是耶西殘株上抽出的嫩芽。當我覺得生命枯乾挫敗時，求祢聖靈的恩膏充滿我，讓祢的公義與和平治理我的心，使我生命再吐新芽。阿們。",
    verse:"「從耶西的本必發一條；從他根生的枝子必結果實。耶和華的靈必住在祂身上，就是使祂有智慧和聰明的靈，謀略和大能的靈，知識和敬畏耶和華的靈。」（以賽亞書 11:1-2）", tags:"#耶西嫩芽 #聖靈恩膏 #豺狼與綿羊 #和平國度" },
  { date:"8月12日", day:12, book:"以賽亞書", passage:"以賽亞書 12:1-全",
    focus:"從救恩的泉源歡然取水，在全地揚聲歌頌神的拯救與偉大。",
    navigation:"第十二章是一首極其優美的救恩讚美詩。先知帶領我們經歷過審判與煉淨後，看見了拯救的泉源。「神是我的拯救；我要倚靠祂，並不懼怕。因為主耶和華是我的力量，是我的詩歌。」現代生活步調極快，我們常感到靈魂乾渴、精疲力竭，就像在荒漠中行走。我們常試圖從世俗的認同或娛樂中「取水」，卻越喝越渴。這段經文提醒我們，上帝自己就是那源源不絕的救恩泉源。當我們透過讚美與感謝回到祂面前，我們就是「歡然取水」。讚美不只是一種宗教儀式，更是一種靈性的擴容，讓我們汲取神無盡的力量。當你開口歌頌神的偉大，焦慮與恐懼就會被主耶和華的力量所取代。",
    practiceGod:"今天在通勤或空檔時，放一首讚美詩歌，心無旁貸地一同歌唱，體驗從神「救恩的泉源歡然取水」的喜樂與力量。",
    practicePeople:"分享一個神在你生命中拯救或供應的真實見證給身邊的朋友或家人，將神在全地的極美事傳揚開來，感染身邊的人。",
    prayer:"主啊，祢是我的拯救、力量與詩歌！謝謝祢在我靈魂乾渴時成為永不乾涸的泉源。今天我要歡然向祢取水，讚美祢在全地所行的極美事！阿們。",
    verse:"「看哪！神是我的拯救；我要倚靠祂，並不懼怕。因為主耶和華是我的力量，是我的詩歌，祂也成了我的拯救。」（以賽亞書 12:2）", tags:"#救恩泉源 #歡然取水 #力量與詩歌 #揚聲讚美" },
  { date:"8月13日", day:13, book:"以賽亞書", passage:"以賽亞書 13:1-全",
    focus:"看清世俗霸權的虛無與傾覆，將生命的根基對準上帝終極的公義審判。",
    navigation:"以賽亞書第 13 章開啟了列國審判的宏偉篇章，先知強烈預言了當時極度輝煌、威震全地的巴比倫帝國終將面臨上帝公義的降罰與荒涼。巴比倫在聖經中象徵著人類高舉自我、抵擋上帝的傲慢體系。經文宣告「耶和華的日子臨近了」，地上的強權與奢華雖然看似不可一世，但在天地的創造主面前，都不過是短暫的雲煙。這給現代生活在競爭激烈的資本與成就社會中的我們一個重大的靈性醒悟：千萬不要被眼前的世俗繁華、社會地位或外在的名利所蒙蔽，將生命建立在會動盪傾覆的系統上。當我們看清這世界的虛幻，就能將心志轉向上帝永不動搖的國度。",
    practiceGod:"默想世上一切物質名利皆會過去，向神禱告：「主啊，我不追求世俗巴比倫的虛浮榮華，我要將一生建設在祢永恆的國度中。」",
    practicePeople:"陪伴身邊一位因職場競爭、工作壓力或未來發展而焦慮不安的朋友，祝福他能在物質之外看見更寶貴的生命價值與永恆平安。",
    prayer:"主啊，當眼前的世界崇尚繁華與權力時，求祢賜我看透虛無的智慧。我不被世俗的巴比倫所吸引，我要堅定地仰望祢公義的寶座。阿們。",
    verse:"「耶和華的日子臨近了！這日來到，好像毀滅從全能者來到一樣。」（以賽亞書 13:6）", tags:"#巴比倫傾覆 #看透虛浮 #永恆國度 #屬靈清醒" },
  { date:"8月14日", day:14, book:"以賽亞書", passage:"以賽亞書 14:1-全",
    focus:"看透明亮之星降卑的警訊，在謙卑服事中體會真安息。",
    navigation:"第 14 章包含了對巴比倫王傲慢落空的諷刺歌，並發出了著名的警告：「明亮之星，早晨之子啊，你何竟從天墜落！」經文中巴比倫王心中說：「我要升到天上，我要高舉我的寶座在神眾星以上……我要與至上者同等」，結果卻落入陰間極深之處。這揭示了「自我膨脹與高傲」是靈性毒藥的本質。現代社會鼓勵個人主義與自我張揚，我們常不自覺地陷入「想比別人高一等」的內耗競爭中，結果帶來無盡的焦慮與孤立。經文後半段是上帝賜給百姓安息與脫離苦難的應許。真正的榮耀不是高高在上凌駕他人，而是在上帝面前承認自己的有限，在謙卑服事中得享安息。",
    practiceGod:"檢視自己內心是否有「想證明自己比別人強」的驕傲動機，在神面前做一個降服的禱告，將掌聲與榮耀完全交給神。",
    practicePeople:"主動選擇做一件「隱密不求掌聲」的善事（如默默清理公共空間或匿名協助），練習擺脫追求人前光彩的虛榮心。",
    prayer:"主啊，保佑我的心不落入明亮之星驕傲墜落的陷阱。求祢賜我謙卑服事的態度，讓我不在競爭中尋求自我誇耀，而是在祢裡面得享真安息。阿們。",
    verse:"「明亮之星，早晨之子啊，你何竟從天墜落！你這攻敗列國的何竟被砍倒在地上！」（以賽亞書 14:12）", tags:"#明亮之星 #遠離驕傲 #降服謙卑 #真安息" },
  { date:"8月15日", day:15, book:"以賽亞書", passage:"以賽亞書 15:1-全",
    focus:"在鄰國與他人的悲劇面前，放下冷漠，體會先知為受苦者發出的哀哭。",
    navigation:"第 15 章是一首對摩押帝國一夕崩潰的悲歌。摩押是以色列的鄰邦與宿敵，當一夜之間摩押的城邑化為荒廢，百姓削髮剃須、哭泣奔跑時，以賽亞並非幸災樂禍，而是發出了扎心的嘆息：「我心為摩押哀鳴！」這揭示了上帝心腸的深度：神的審判帶有哀傷，祂並不喜悅惡人滅亡，先知的心更是體貼神的憐憫，為鄰國的患難同情流淚。現代人常生活在資訊爆炸與冷漠隔絕中，對別人的悲劇或競爭對手的挫敗容易心生幸災樂禍或漠不關心。但這段經文喚醒我們的同理心，提醒我們屬神的人應當有「與哀哭的人同哀哭」的擴容心腸，在災難與困境面前展現跨越藩籬的憐憫。",
    practiceGod:"默想天父憐憫萬民的心腸，為世界上正在經歷戰亂、天災或集體創傷的國家與地區獻上同理且迫切的代禱。",
    practicePeople:"主動去關懷一位曾與你有過競爭或摩擦、但目前正面臨人生低潮的朋友，放下過去的芥蒂，送上一份真誠的慰問與幫助。",
    prayer:"主啊，求祢除去我心中的冷漠與幸災樂禍。賜我如同先知般同理的心，使我能體會祢對受苦世人的哀傷，用憐憫與愛去撫平傷痛。阿們。",
    verse:"「我心為摩押哀鳴；他的貴族逃到珥拉、伊基拉、施利施亞。他們哭泣上魯希坡；在和羅念的路上發哀號聲。」（以賽亞書 15:5）", tags:"#同理哀哭 #憐憫心腸 #跨越藩籬 #上帝的眼淚" },
  { date:"8月16日", day:16, book:"以賽亞書", passage:"以賽亞書 16:1-全",
    focus:"投靠大衛帳幕中的公義寶座，在驕傲敗壞前尋得庇護。",
    navigation:"第 16 章繼續論及摩押的命運，先知勸告摩押向錫安送羊羔禮物，投靠大衛的帳幕。經文指出摩押敗落的主因是「聽見摩押人驕傲，是極其驕傲；聽見他狂妄、驕傲、憤怒」。當誇大無實的狂傲被拆穿時，摩押的堅固城化為荒廢。然而經文特別預言：「必有寶座因慈愛立堅；必有一位誠誠實實坐在其上，在大衛帳幕中施行審判，尋求公平，速行公義。」這指向基督的王權。現代人面對困境時，常因死要面子或堅持傲慢而拒絕尋求協助，最終導致崩潰。經文呼籲我們要在驕傲敗壞前，放下虛浮的身段，投靠基督那滿有慈愛與公義的寶座。",
    practiceGod:"檢視自己是否有因為「死要面子」而死撐不願向神禱告尋求幫助的領域，在神面前放下驕傲，誠實向祂投靠。",
    practicePeople:"向身邊一位陷入困境的朋友伸出溫和手掌，不戳破他的面子，而是用充滿尊嚴與愛的行動提供鼓勵與支持。",
    prayer:"主啊，求祢赦免我內心隱密處的狂妄與面子破口。我選擇投靠在大衛帳幕中的慈愛寶座，願祢的公義與憐憫成為我唯一的避難所。阿們。",
    verse:"「必有寶座因慈愛堅立；必有一位誠誠實實坐在其上，在大衛帳幕中施行審判，尋求公平，速行公義。」（以賽亞書 16:5）", tags:"#慈愛寶座 #放下傲慢 #大衛帳幕 #尋求庇護" },
  { date:"8月17日", day:17, book:"以賽亞書", passage:"以賽亞書 17:1-全",
    focus:"當堅固城化為荒堆，將眼光從世俗保障轉向造你的主。",
    navigation:"第 17 章宣告了大馬士革與以色列北國（以法蓮）的審判。他們所倚靠的強盟與堅固城邑在一夕間化為廢墟，「人肥胖的身體必至消瘦」。但就在這極度荒涼的背景中，經文發出了靈性的曙光：「當那日，人必仰望造他們的主，眼光敬畏以色列的聖者。他們必不仰望祭壇，也不仰望手所造的。」現代人常把安全感建立在健康的身體、穩定的收入或人脈網絡上，像經營堅固城一樣。但當風浪來襲、世俗保障搖晃時，往往就是上帝對我們進行「靈性視力校正」的時刻。神讓外在的依靠顯出虛無，為要讓我們不再崇拜自己手所造的成果，而是重新仰望那創造我們的永恆之主。",
    practiceGod:"安靜檢視自己是否把某個「手所造的成果」（如存款數字、考績、職稱）當成安全感來源，宣告今天將眼光重新對焦於造你的主。",
    practicePeople:"鼓勵身邊一位正在經歷「外在保障崩解」（如遭逢裁員、健康告急）的朋友，陪伴他度過危機，並溫柔引導他認識不改變的神。",
    prayer:"主啊，當眼前的堅固城搖晃時，求祢開我的眼界，讓我不再仰望自己手所造的保障，而是一生深深敬畏與仰望創造我的主。阿們。",
    verse:"「當那日，人必仰望造他們的主，眼光敬畏以色列的聖者。」（以賽亞書 17:7）", tags:"#仰望造物主 #視力校正 #破除虛假安全感 #敬畏聖者" },
  { date:"8月18日", day:18, book:"以賽亞書", passage:"以賽亞書 18:1-全",
    focus:"在世界騷動與大國興衰中，看上帝如何安靜看守並掌管局勢。",
    navigation:"第 18 章指向遠方的古實（埃塞俄比亞）與大國的喧嚷。各國忙著派遣使者、張羅軍備，全地充斥著緊張與焦慮的氣氛。然而上帝卻說：「我要安靜，在我的居所觀看，如同日光中的清熱，又如割收成時的雲霧。」當世界各國狂熱奔波時，上帝在天上維持著至高、鎮定與超然的掌控。祂等候適當的時機，一舉剪去蔓延的枝條。現代人常被社群媒體上的國際局勢、政治紛爭或經濟恐慌搞得心神不寧，急於做出血氣的反應。這段經文給我們極大的安定感：宇宙的主宰並未失控，祂正安靜而精準地掌管歷史的每一刻。我們不需要跟著世界驚慌失措，只要安靜倚靠祂。",
    practiceGod:"學習上帝「安靜觀看」的超然心態，今天進行 15 分鐘「靈性鎮定操練」，不滑手機不看新聞，單單將世界的混亂交在神手中。",
    practicePeople:"當身邊的人因為時局或環境變化而情緒激動焦慮時，以沉穩安定的回應安定人心，帶給身邊人從神而來的超然平靜。",
    prayer:"主啊，當世界騷動喧嚷時，謝謝祢提醒我祢正安靜掌權。求祢賜我超然鎮定的心，不被世俗的恐懼所牽動，安然信靠祢。阿們。",
    verse:"「耶和華對我如此說：我要安靜，在我的居所觀看，如同日光中的清熱，又如刈麥熱天時的雲霧。」（以賽亞書 18:4）", tags:"#上帝安靜掌權 #勝過喧嚷 #超然鎮定 #靈性錨點" },
  { date:"8月19日", day:19, book:"以賽亞書", passage:"以賽亞書 19:1-全",
    focus:"看清世俗智慧與偶像的破產，期待上帝對萬國極大的醫治與和解。",
    navigation:"第 19 章是對埃及的預言，充滿了神聖的幽默與終極的復興盼望。號稱文明古國、擁有豐富哲學與地理優勢的埃及，在上帝面前「偶像搖晃，心膽消化」，謀士的智慧化為愚昧，尼羅河水乾涸破產。世人所崇拜的經驗與智慧在神面前一文不值。然而經文後半段出現了震撼的翻轉：上帝打擊埃及，卻是要「醫治他們」！埃及人必認識耶和華，甚至預言埃及、亞述與以色列三國將通大道，一同成為全地的祝福。這揭示了神審判的最終目的不是毀滅，而是醫治與大和解。現代人常過度迷信專家智慧或個人經驗，唯有認識神才能找到真出路，且神能使宿敵在恩典中化敵為友。",
    practiceGod:"誠實檢視自己是否過度依賴世俗的「謀士與經驗」，在禱告中尋求神的屬天智慧，承認人智慧的有限。",
    practicePeople:"扮演「和睦的大道」：主動促進職場或家庭中長期對立的兩方進行對話，用神的愛與包容化解敵意，帶來醫治與和解。",
    prayer:"主啊，世人的智慧在祢面前終將破產。謝謝祢擊打乃為醫治，求祢醫治我們生命中的破口，並使我們成為促進和平與和解的器皿。阿們。",
    verse:"「耶和華必擊打埃及，擊打又醫治，他們就歸順耶和華。祂必聽他們的禱告，醫治他們。」（以賽亞書 19:22）", tags:"#擊打與醫治 #破除世俗智慧 #萬國和解 #和平大道" },
  { date:"8月20日", day:20, book:"以賽亞書", passage:"以賽亞書 20:1-全",
    focus:"順服先知象徵性的順服行動，不把安全感建立在脆弱的埃及盟友上。",
    navigation:"第 20 章是一個極具戲劇性的行動預言。上帝命令先知以賽亞露身赤腳行走三年，作為指著埃及和古實所立的預兆，預告這兩個被以色列人視為強大靠山的國家，終將被亞述戰敗、赤身蒙羞被擄。先知用極其卑微與犧牲形象的順服行動，給百姓一個極大的視覺震撼：你們所仰望、所誇耀的屏障，竟是如此脆弱與蒙羞！現代人也常有自己的「埃及盟友」——可能是某個有權勢的人脈、某個看似穩妥的投資計畫或世俗保障。但上帝透過這段經文提醒我們，任何頂替上帝位置的世俗倚靠，最後都會暴露其赤身露體的脆弱。唯有將安全感建立在神身上，才不至蒙羞。",
    practiceGod:"檢視自己最近是否暗中把安全感寄託在某個「世俗靠山」上，向神禱告：「主啊，我卸下對世俗屏障的依賴，單單以祢為我的盾牌。」",
    practicePeople:"當身邊朋友因為所信任的世俗保障（如合作夥伴背叛、公司倒閉）而感到蒙羞挫敗時，給予不批判的陪伴與實質扶持。",
    prayer:"主啊，求祢赦免我常想尋求世俗的埃及作為靠山。謝謝先知順服的提醒，讓我看清世俗保障的虛浮，使我一生單單靠祢不至蒙羞。阿們。",
    verse:"「以色列人必因所仰望的古實，所誇耀的埃及，驚晃蒙羞。」（以賽亞書 20:5）", tags:"#不靠世俗屏障 #順服行動 #真保障 #永不蒙羞" },
  { date:"8月21日", day:21, book:"以賽亞書", passage:"以賽亞書 21:1-全",
    focus:"在黑夜沉沉的世代中，作忠心的守望者傳遞破曉的亮光。",
    navigation:"第 21 章描繪了荒漠大海的夜間異象與著名的守望者對答。「守望的啊，夜裡如何？守望的啊，夜裡如何？守望者說：早晨將到，黑夜也來。」先知被立為牆頭的守望者，在黑夜中晝夜站立、殷勤察看，預警巴比倫的傾覆與列國的動盪。現代社會常給人一種道德下滑、人心迷茫的「黑夜感」，許多人在焦慮與不安中發出「夜裡如何」的拷問。這段經文呼召基督徒承接「守望者」的命定：我們不能在黑夜中沉睡或隨波逐流，而要在禱告與真理中保持警醒，為職場、家庭與城市守望，向身邊迷茫的人宣告基督破曉的盼望。",
    practiceGod:"進行一次「守望者禱告」：為你的家庭、職場與國家進行 15 分鐘的守望代禱，宣告神的破曉晨光要驅散一切黑暗與焦慮。",
    practicePeople:"回應身邊一位陷入困境、詢問「未來在哪裡」的朋友，用神話語的盼望鼓勵他，成為他黑夜生命中的守望者。",
    prayer:"主啊，在這黑夜沉沉的世代中，求祢賜我警醒的心，使我立於守望樓上。讓我看見祢破曉的曙光，並忠心將盼望傳遞給身邊的人。阿們。",
    verse:"「有人聲從西珥呼問我說：守望的啊，夜裡如何？守望的啊，夜裡如何？守望者說：早晨將到，黑夜也來。你們若要問就問，可以復來。」（以賽亞書 21:11-12）", tags:"#夜裡如何 #忠心守望者 #破曉晨光 #真理明燈" },
  { date:"8月22日", day:22, book:"以賽亞書", passage:"以賽亞書 22:1-全",
    focus:"警惕吃喝享樂的麻木心態，將生命的鑰匙交給那穩固的釘子基督。",
    navigation:"第 22 章描繪了耶路撒冷（異象谷）在危機中的荒謬景象。面對敵人壓境，百姓不向神悔改哭泣，反而落入擺設宴席、吃肉喝酒的末世麻木心態，喊著：「我們吃喝吧！因為明天要死了！」同時，經文揭露了官員舍伯那追求個人名聲與豪華墳墓的自私，並預言上帝要將大衛家的鑰匙放在忠臣以利亞敬肩膀上——「他開無人能關，他關無人能開」，像釘在堅固處的釘子。這直接預言了基督的權柄。現代人面對危機時，也常陷入「及時行樂、逃避現實」的麻木中，或追求虛浮的名聲。經文提醒我們，不要把安全感掛在脆弱的人身上，要鎖定那唯一的堅固釘子基督。",
    practiceGod:"檢視自己是否有用「享樂消费或逃避心態」來麻木內心焦慮的習慣，來到神面前求祂成為你心中那座「堅固處的釘子」。",
    practicePeople:"在團隊或家庭中承接責任，像以利亞敬一樣成為大家可以倚靠的穩固後盾，用忠心與服事取代自私與逃避。",
    prayer:"主啊，拯救我脫離「吃喝吧因為明天要死」的麻木與逃避。我將生命的鑰匙完全交給耶穌，求祢成為我生命中那永遠穩固的釘子。阿們。",
    verse:"「我必將大衛家的鑰匙放在他肩頭上。他開，無人能關；他關，無人能開。我必官他錨在堅固處，像釘子一樣。」（以賽亞書 22:22-23）", tags:"#堅固處的釘子 #大衛的鑰匙 #擺脫麻木享樂 #忠心服事" },
  { date:"8月23日", day:23, book:"以賽亞書", passage:"以賽亞書 23:1-全",
    focus:"看清商業繁華與財富的短暫，讓一切資源歸耶和華為聖。",
    navigation:"第 23 章是對海上貿易巨頭推羅的默示。推羅是當時的全球金融與航運中心，「大水之上的糧食、列國的商家」使她極其輝煌自誇。然而上帝定意要摧毀推羅的驕傲，使其華美的港口與財富在一夕間化為荒涼。經文最後預言，推羅經歷七十年後，她的貿易所得「必歸耶和華為聖，不再積攢存留」，要供給留在耶和華面前的人。這給現代商業社會極大的靈性震撼：商業成果與經濟財富固然吸引人，但若沒有神，再龐大的經濟帝國也會土崩瓦解。這段經文呼籲我們重整「財富觀」——不要成為金錢的奴隸，而是將工作與商業所得「歸耶和華為聖」，作為服事神與祝福他人的器皿。",
    practiceGod:"進行一次「財務主權奉獻禱告」：檢視自己的理財觀念，將手中的收入與資產向神宣告「歸耶和華為聖」，尋求神對你財務的引導。",
    practicePeople:"用你手上的經濟資源或專業能力，主動去支持一項公益事工或資助身邊有需要的貧困者，讓財富轉化為真實的愛心。",
    prayer:"主啊，世上的繁華與財富都會過去。求祢保佑我的心不被金錢所奴役，我願將我所有的資源歸祢為聖，成為祝福他人的管家。阿們。",
    verse:"「她的資財和賺的利息要歸耶和華為聖，不再積攢存留；因為她的資財必供給住在耶和華面前的人吃飽，穿耐久的衣服。」（以賽亞書 23:18）", tags:"#歸耶和華為聖 #擺脫金錢奴役 #重整財富觀 #永恆價值" },
  { date:"8月24日", day:24, book:"以賽亞書", passage:"以賽亞書 24:1-全",
    focus:"在地動山搖的全地審判中，揚聲歌頌上帝至高的榮耀。",
    navigation:"第 24 章開啟了被稱為「以賽亞的小啟示錄」（24-27章）的全球性景況描繪。經文展現了全地因離棄律例、背棄永約而面臨的徹底翻轉與荒涼：「地必空虛混沌，盡都荒涼……宴樂的聲音止息」。然而，就在這全地震盪、絕望鋪天蓋地之際，經文奇蹟般地出現了一群餘民的歌聲：「這些人要高聲歡呼；他們為耶和華的威嚴，從海那邊揚聲……在東方榮耀耶和華！」這揭示了極震撼的靈性對比：當屬世的系統崩解時，屬上帝的人因著看見神的聖潔與至高主權，反而能在風暴中心唱出讚美的歌。我們的平安不建立在地上的穩定，而是建立在天上的寶座。",
    practiceGod:"當面對周圍環境的動盪或壞消息時，練習不發抱怨，而是開口讚美上帝的威嚴與公義，用讚美打破內心的恐懼。",
    practicePeople:"在團隊或社群陷入集體消極沮喪時，成為那傳出「海這邊歡呼聲」的人，帶給周圍人屬天的信心與正向能量。",
    prayer:"主啊，即便天地震盪、地上的系統崩解，祢依然在寶座上掌權！求祢賜我超越環境的信心，讓我在風暴中依然能揚聲歌頌祢的榮耀。阿們。",
    verse:"「這些人要高聲歡呼；他們為耶和華的威嚴，從海那邊揚聲。因此，你們要在東方榮耀耶和華，在眾海島榮耀耶和華—以色列神的名。」（以賽亞書 24:14-15）", tags:"#風暴中的讚美 #全地掌權 #高聲歡呼 #不震動的信仰" },
  { date:"8月25日", day:25, book:"以賽亞書", passage:"以賽亞書 25:1-全",
    focus:"在上帝預備的盛宴中，歡慶眼淚被擦去、死亡被吞滅的終極勝歌。",
    navigation:"第 25 章是一首充滿極致溫柔與璀璨盼望的救恩讚美詩。先知帶領我們看見上帝為萬民所預備的聖山盛宴——「用肥甘設擺宴席，用陳酒和滿髓的肥甘」。最令人動容的是，上帝要「在這山上吞滅遮蓋萬民的帕子」，並且「主耶和華必擦去各人臉上的眼淚，去除祂百姓的羞辱，因為這是耶和華說的」。這直接預言了基督十字架與復活吞滅死亡的終極得勝！現代人在生活中承載了太多的眼淚、委屈與死亡的陰影。但這段經文給我們最深的慰藉：我們的上帝不是冷酷的審判者，而是一位親手為我們擦乾眼淚、擺設盛宴的慈愛天父。當我們仰望這終極的拯救，眼前的苦難就顯得短暫而輕微。",
    practiceGod:"將你心中累積的委屈、眼淚與傷痛誠實陳明在神面前，默想天父溫柔地用手「擦去你臉上眼淚」的畫面，接收祂的安慰。",
    practicePeople:"主動去關懷一位正處於喪親、失戀或極度哀傷中的朋友，陪伴他，用溫柔的態度傳遞神必親自擦乾眼淚的盼望。",
    prayer:"主啊，謝謝祢為我預備恩典的盛宴，更謝謝祢應許要親手擦去我臉上所有的眼淚，吞滅死亡與羞辱。我要歡喜快樂接納祢的拯救！阿們。",
    verse:"「祂已經吞滅死亡直到永遠。主耶和華必擦去各人臉上的眼淚，又除掉普天下祂百姓的羞辱，因為這是耶和華說的。」（以賽亞書 25:8）", tags:"#擦去眼淚 #吞滅死亡 #聖山盛宴 #終極安慰" },
  { date:"8月26日", day:26, book:"以賽亞書", passage:"以賽亞書 26:1-全",
    focus:"將心意堅定倚靠於神，在混亂的世界中進入「十分平安」的避難所。",
    navigation:"第二十六章宣告了一首信心的歌。經文中極具力量的應許是：「堅心倚賴祢的，祢必保守他十分平安，因為他倚靠祢。」在希伯來原文中，「十分平安」代表雙重的、完美的、極致的平安。現代人的心靈常處於一種碎片化與高度警覺的狀態，隨時被新聞、社群訊息與突發狀況牽動。我們渴望平安，卻常把平安建立在「一切順利」的前提上。但先知告訴我們，真正的平安不是環境沒有風浪，而是心思堅定鎖定在耶和華這座「永久的磐石」上。當我們的心意像錨一樣扎根於神，世上的震盪就無法撼動內心的平靜。",
    practiceGod:"練習「心意對焦」：每當思想開始陷入焦慮或胡思亂想時，立刻喊停，並在心中反覆宣告：「我的心堅心倚賴祢，祢必保守我十分平安。」",
    practicePeople:"成為身邊焦慮者的「平安港灣」：主動聆聽一位正處於高度壓力中的同事或朋友，不急著給建議，用溫和安定的態度為他帶去平靜。",
    prayer:"主啊，祢是永久的磐石。當外在環境不斷震盪時，我選擇將思想與心意堅定對焦於祢。求祢用祢那超乎想像的「十分平安」保衛我的心懷意念。阿們。",
    verse:"「堅心倚賴祢的，祢必保守他十分平安，因為他倚靠祢。」（以賽亞書 26:3）", tags:"#十分平安 #堅心倚靠 #永久磐石 #心靈錨點" },
  { date:"8月27日", day:27, book:"以賽亞書", passage:"以賽亞書 27:1-全",
    focus:"在神細心的栽培與打討中，去除罪孽，結出充滿全地的榮耀果實。",
    navigation:"第 27 章以擊殺象徵邪惡勢力的鱷魚（快蛇與曲蛇）開場，接著展現了一幅美麗的「紅酒園」圖景。上帝親自看守這園子，「時刻澆灌，晝夜看守，恐怕有人損害」。經文揭示了上帝對百姓懲罰的嚴格分寸：神打討百姓，不像打討打擊百姓的人那樣殘酷，神的打討是適度的量度，目的是為了「除去雅各的罪孽，這就是止息他罪過的果實」。最終，以色列要發芽開花，果實充滿世界。這給我們極大的靈性安慰：我們生命中經歷的管教與苦難，不是上帝發怒毀滅我們，而是細心園丁的修剪與打討，要為我們洗去雜質，使我們結出滿有生命的果實。",
    practiceGod:"在安靜中感謝神在生命中給你的「修剪與管教」，承認這不是為了傷害你，而是天父細心看守、要讓你發芽開花的恩典。",
    practicePeople:"用寬容與耐心對待身邊一位正在經歷管教或軟弱改過中的肢體，不落井下石，而是給予他發芽開花的空間與鼓勵。",
    prayer:"主啊，謝謝祢時刻看守、晝夜澆灌我這紅酒園。求祢藉由恩典修剪我生命中的雜質，使我的生命能發芽開花，結出榮耀祢的果實。阿們。",
    verse:"「當那日，有出酒的葡萄園，你們要歌唱指著園說：我耶和華是看守園子的，我要時刻澆灌，晝夜看守，恐怕有人損害。」（以賽亞書 27:2-3）", tags:"#紅酒園 #細心看守 #適度修剪 #發芽開花" },
  { date:"8月28日", day:28, book:"以賽亞書", passage:"以賽亞書 28:1-全",
    focus:"拒絕醉酒沉溺的虛浮，安設基督為試驗過、穩固的基石。",
    navigation:"第 28 章是一篇強烈的「禍哉」宣告。先知痛斥以法蓮（北國）官長與祭司沉溺於酒食、驕傲如將殘之花，甚至嘲笑先知的教導是「命上加命，律上加律，一點東一點西」。他們自以為與死亡立約、以謊言為避難所。然而上帝宣告：「看哪，我在錫安安放石頭作為根基，是試驗過的石頭，是寶貴的角石，穩固的根基；信靠的人必不懵懂。」經文最後用農夫打穀的智慧比喻神的管教精準而有分寸。現代人也常陷入用沉溺（如酒精、娛樂、工作狂）來逃避現實的盲點，並把安全感建立在謊言避難所上。神呼籲我們將生命建立在基督這塊穩固的角石上。",
    practiceGod:"檢視自己是否有用「麻痺或逃避心態」來應付壓力的習慣，向神宣告將生命根基重新安設在基督這塊「寶貴角石」上。",
    practicePeople:"在團隊中堅持誠實與正直，拒絕用「謊言或包裝」來避難，用穩健可靠的態度成為他人可以信任的根基。",
    prayer:"主啊，拯救我脫離驕傲與虛浮的麻痺。謝謝祢在錫安為我安放了試驗過的寶貴角石耶穌基督，讓我信靠祢就永不懵懂、永不搖動。阿們。",
    verse:"「所以，主耶和華如此說：看哪，我在錫安安放石頭作為根基，是試驗過的石頭，是寶貴的角石，穩固的根基；信靠的人必不懵懂。」（以賽亞書 28:16）", tags:"#寶貴角石 #穩固根基 #擺脫麻痺 #誠實正直" },
  { date:"8月29日", day:29, book:"以賽亞書", passage:"以賽亞書 29:1-全",
    focus:"擺脫「嘴唇親近、心卻遠離」的宗教形式，體驗神口中奇妙又神奇的翻轉。",
    navigation:"第 29 章針對亞里伊勒（耶路撒冷）發出警訊。百姓落入最可怕的屬靈危機：他們表面上守節聚會，但上帝說：「這百姓親近我，用嘴唇尊敬我，心卻遠離我；他們敬畏我，不過是順從人的吩咐。」這種宗教形式化導致他們的靈性沉睡，聖經對他們像封閉的書卷。然而上帝宣告祂要行「奇妙的事，就是奇妙又神奇的事」，使聾子聽見書上的話，瞎子看見光明，謙卑人因耶和華大有喜樂。這給現代基督徒極大的扎心反省：我們的聚會與讀經是習慣性的儀式，還是心靈深處的真實相遇？神渴望打破我們的宗教包裝，用聖靈開啟我們的眼目，經歷真正的奇妙翻轉。",
    practiceGod:"做一個「心靈誠實掃描」：在神面前放下表面的儀式感，開口向神說內心最真實、最不加修飾的心聲，求神重燃你起初的愛心。",
    practicePeople:"打破表面客套的宗教社交，今天主動與一位肢體進行一次「深度的生命交流」，分享真實的軟弱與神的恩典，彼此扶持。",
    prayer:"主啊，赦免我常落入嘴唇親近祢、心卻遠離祢的宗教形式中。求祢開我的眼目與耳目，在我生命中行奇妙又神奇的事，使我因祢大有喜樂。阿們。",
    verse:"「主說：因為這百姓親近我，用嘴唇尊敬我，心卻遠離我；他們敬畏我，不過是順從人的吩咐。所以我在這百姓中要行奇妙的事，就是奇妙又神奇的事。」（以賽亞書 29:13-14）", tags:"#嘴唇與心 #奇妙又神奇 #打破宗教包裝 #真實相遇" },
  { date:"8月30日", day:30, book:"以賽亞書", passage:"以賽亞書 30:1-全",
    focus:"停下無謂的奔波與外求，在「歸回安息與平靜安穩」中重獲屬天力量。",
    navigation:"第三十章是一篇對現代「忙碌焦慮症」的扎心警訊。當時以色列人面對外敵，不求問神，反而急忙騎快馬奔波，企圖與埃及結盟。上帝透過以賽亞說出了經典的真理：「你們得救在乎歸回安息，得力在乎平靜安穩；你們竟自不肯。」現代人也常陷入這種「內耗式努力」：遇到問題就瘋狂找方法、問意見、上網搜解答，讓心靈處於高度運轉的消耗中，卻不願意靜下來來到神面前。經文提醒我們，真正的得力不是來自更快的速度，而是來自停下腳步歸回安息。當你願意停止用自己的血氣硬撐，上帝的手才能接手，主必等候要施恩給你。",
    practiceGod:"安排一段 15 分鐘無手機干擾的安靜時間，單單安靜坐在神面前，將內心所有的急躁與控制欲放下，歸回安息。",
    practicePeople:"勸勉或陪伴身邊一位工作過勞、極度焦慮的朋友，鼓勵他給自己適度的休息，並為他禱告「得力在乎平靜安穩」。",
    prayer:"主啊，我承認我常常習慣靠自己的力量奔波，總以為做得更多就能解決問題。今天我選擇停下腳步，歸回祢的安息。求祢在我平靜安穩的時刻，賜我屬天的力量。阿們。",
    verse:"「主耶和華—以色列的聖者曾如此說：你們得救在乎歸回安息；得力在乎平靜安穩；你們竟自不肯。」（以賽亞書 30:15）", tags:"#歸回安息 #平靜安穩 #從新得力 #停止內耗" },
  { date:"8月31日", day:31, book:"以賽亞書", passage:"以賽亞書 31:1-全",
    focus:"不靠埃及的馬匹與車輛，仰望如鳥飛翔保護耶路撒冷的大能上帝。",
    navigation:"第 31 章繼續深化對「靠人不靠神」的警告。「禍哉！那些下埃及求救兵的，是倚靠馬匹，倚靠車輛甚多，倚靠馬兵甚強，卻不仰望以色列的聖者，也不求問耶和華。」先知指出，埃及人不過是人，並不是神；他們的馬不過是血肉，並不是靈。當上帝伸出手時，幫人的和受幫的都要一同跌倒。隨後經文給出極優美的對比：上帝保護耶路撒冷，要「如鳥飛翔遮覆」，親自提防並拯救。這給現代人極大的提醒：我們常被世俗「強大的資源或背景」（馬匹與車輛）所吸引，以為那就是勝敗關鍵。但唯有神的靈能賜下真正的保護與勝敗。",
    practiceGod:"檢視自己是否過度迷信「世俗資源或背景」的大能，向神禱告：「主啊，我不靠馬匹車輛，我單單仰望如鳥飛翔保護我的上帝。」",
    practicePeople:"當團隊面臨資源匱乏、看似落後對手時，鼓勵大家不看資源多少，而是禱告尋求神的智慧與聖靈的大能引導。",
    prayer:"主啊，世人的馬匹不過是血肉，唯有祢是永活的靈。求祢赦免我眼目常被世俗資源所迷惑，今天我要藏在祢如鳥飛翔遮覆的翅膀下得著保護。阿們。",
    verse:"「萬軍之耶和華必能力保護耶路撒冷，如鳥飛翔遮覆；祂必保護拯救，越過保存。」（以賽亞書 31:5）", tags:"#如鳥飛翔 #不靠馬匹車輛 #聖靈大能 #神聖遮覆" }
  ],
  september: [
  { date:"9月1日", day:32, book:"以賽亞書", passage:"以賽亞書 32:1-全",
    focus:"渴望公義君王的治理，讓聖靈澆灌使曠野變為肥田。",
    navigation:"第 32 章描繪了公義君王治理的景況：「看哪，必有一王憑公義行政……必有一人像避風所和避暴雨的隱密處，又像乾旱地的溪水，大石的響影遮蔽疲倦的人。」經文接著警醒安逸驕奢的女子，指出若沒有聖靈，繁華終將化為荒涼；「等到聖靈從上澆灌我們，曠野就變為肥田，肥田看如樹林」。公義的果效必是平安，公義的效驗必是平靜安穩。這給現代人心靈極大的渴慕：我們內心的乾涸與焦慮，唯有等待聖靈的澆灌才能徹底翻轉。當我們讓基督在生命中憑公義作王，聖靈就能使我們乾涸的生命曠野變為結實纍纍的肥田。",
    practiceGod:"開口祈求聖靈再次澆灌你的心靈，向神禱告：「聖靈啊，求祢從上澆灌我，使我內心乾涸的曠野變為結實纍纍的肥田。」",
    practicePeople:"成為身邊人生命的「大石影子」：在職場或家庭中，用耐心與包容為疲倦焦慮的人提供一個可以喘息、獲得支持的避風所。",
    prayer:"主啊，願祢憑公義在我生命中作王。求祢的聖靈從上降下澆灌我，使我內心的曠野變為肥田，並活出公義帶來的極致平靜與安穩。阿們。",
    verse:"「等到聖靈從上澆灌我們，曠野就變為肥田，肥田看如樹林。那時，公平要住在曠野，公義要住在肥田。」（以賽亞書 32:15-16）", tags:"#聖靈澆灌 #曠野變肥田 #公義君王 #大石影子" },
  { date:"9月2日", day:33, book:"以賽亞書", passage:"以賽亞書 33:1-全",
    focus:"在危機與競爭的威脅面前，敬畏耶和華是你一生最堅固的後盾與寶庫。",
    navigation:"第 33 章面對毀滅者（亞述）的欺詐與侵略，先知發出了迫切的祈求：「耶和華啊，求祢施恩於我們；我們等候祢。求祢每早晨作我們的翅膀，在艱難的時候作我們的拯救！」經文隨後宣告了極具力量的真理：「敬畏耶和華是他的寶障（寶庫），你一生一世必得安穩，有豐盛的拯救、智慧和知識。」先知帶領我們看見，地上的國度會震盪，但行事公義、說話正直、塞耳不聽流血之言的人，必在高處居住，他的糧食必有供給，他的水必不斷絕。這給現代生活在競爭壓力與威脅中的我們極大的安全感：敬畏神不是限制，而是我們一生最豐盛的保障。",
    practiceGod:"在今天清晨或開始工作前做一個「每早晨的禱告」：求神每早晨成為你的力量與翅膀，並以敬畏神作為你今天的最高指引。",
    practicePeople:"堅持「行事公義、不聽讒言」的品格：在職場中拒絕參與背後議論、抹黑或不誠實的勾當，用清白的手活出屬神的尊貴。",
    prayer:"主啊，求祢每早晨作我的翅膀，在遇到艱難時作我的拯救。我要以敬畏祢為我一生最寶貴的資產，求祢保佑我在高處安然居住。阿們。",
    verse:"「你一生一世必得安穩；有豐盛的拯救、智慧，和知識；敬畏耶和華是他的寶障。」（以賽亞書 33:6）", tags:"#每早晨作翅膀 #敬畏神的寶障 #安穩居住 #公義品格" },
  { date:"9月3日", day:34, book:"以賽亞書", passage:"以賽亞書 34:1-全",
    focus:"看清世俗敵對勢力的終局，查考耶和華的書卷無一缺失。",
    navigation:"第 34 章描繪了上帝對列國與以東（象徵仇敵與肉體勢力）的審判。經文用極具震撼力的烈火、荒涼與野獸佔據的比喻，展示了敵對上帝的系統終將傾覆廢棄。然而，就在這荒涼的背景中，經文發出了關於上帝話語的精準宣告：「你們要查考宣讀耶和華的書。這無一缺少，無一任意成雙；因為我的口已經吩咐，祂的靈將祂們聚集。」這表明上帝對歷史的預言與應許精準無誤，必定應驗。現代人常被世俗各種流行思潮、網紅觀點所吸引，卻忽視了神話語的真實與權威。這段經文呼籲我們重新回歸神的話語，精準查考並堅信神每一句應許都必成就。",
    practiceGod:"建立「認真查考神話語」的心志：今天花時間仔細研讀一段經文，深信神的口已經吩咐，祂的話語無一缺失、必定應驗。",
    practicePeople:"用神話語中確鑿的應許（而非世俗的安慰套話）去鼓勵一位對未來感到茫然的朋友，幫助他把信心建立在神不改變的話語上。",
    prayer:"主啊，世上的強權與思潮都會如煙雲消散，唯有祢的話語立定在地。求祢賜我熱愛祢話語的心，讓我天天查考並堅信祢的應許無一缺失。阿們。",
    verse:"「你們要查考宣讀耶和華的書。這無一缺少，無一任意成雙；因為我的口已經吩咐，祂的靈將祂們聚集。」（以賽亞書 34:16）", tags:"#查考耶和華的書 #應許無一缺失 #神話語的權威 #永恆真理" },
  { date:"9月4日", day:35, book:"以賽亞書", passage:"以賽亞書 35:1-全",
    focus:"曠野必像玫瑰開花，在上帝的救贖中看見荒涼生命的大翻轉。",
    navigation:"第三十五章描繪了一幅充滿生機與極致美麗的救贖圖景：曠野和乾旱之地必然歡喜，沙漠要像玫瑰開花！經文中提到盲人眼開、聾人耳聰、瘸子跳躍、啞巴歌唱，並有一條大道稱為「聖路」。對於現代人而言，生命中難免會經歷「曠野期」——可能是長期看不到果效的工作、乾涸的人際關係，或是感到枯乾的靈性。這段經文給予我們震撼的信心宣告：上帝是善於在曠野中開道路、在乾旱中降甘霖的神！你眼前的荒涼絕不是終點，而是神彰顯大能的舞台。上帝呼籲我們要「堅固軟弱的手，穩固戰兢的膝」，因為祂的拯救必會來到。",
    practiceGod:"將你生命中最感到「乾涸、荒涼」的領域寫在紙上，對著它宣告：「這曠野必像玫瑰盛開，神的大能必在此顯明！」",
    practicePeople:"去鼓勵身邊一位正在經歷生命「曠野期」或身心軟弱的朋友，用溫暖的言語「堅固他軟弱的手」，並為他的困境獻上懇切祈禱。",
    prayer:"主啊，祢是能在曠野中開道路、讓沙漠開花的神！我將我生命中的乾涸與荒涼交在祢手中。求祢使我軟弱的手堅固，開我的心眼看見祢榮耀的救贖！阿們。",
    verse:"「曠野和乾旱之地必然歡喜；沙漠也必快樂；又像玫瑰開花，滿盈開花，折發大聲歡呼。」（以賽亞書 35:1-2）", tags:"#曠野開花 #沙漠甘霖 #聖路 #極大喜樂" },
  { date:"9月5日", day:36, book:"以賽亞書", passage:"以賽亞書 36:1-全",
    focus:"面對拉比沙基的心理戰與仇敵吼叫，選擇靜默不言，將冤屈交給神。",
    navigation:"第 36 章進入以賽亞書的核心歷史轉折（36-39章）。亞述大軍壓境，將軍拉比沙基站在耶路撒冷城牆外，用猶大言語發動了極其猖狂的心理戰與言語攻擊。他嘲笑以色列人的信心，離間百姓與希西家王，狂言「有哪國的神拯救自己的國脫離亞述王的手呢？」面對仇敵排山倒海的恐嚇與羞辱，希西家王與百姓展現了極高的屬靈智慧：「百姓靜默不言，並不回答一句，因為王曾吩咐說：不要回答他。」現代人在職場或生活中，也常遭遇不公的攻擊、言語的霸凌或仇敵的心理戰恐嚇。經文教導我們：不需要與仇敵對罵血氣爭辯，靜默不言，將戰場完全交給上帝。",
    practiceGod:"學習「靜默不言」的屬靈節制：當遭遇誤解或言語攻擊時，不憑血氣爭辯，而是立刻在心中轉向神，將冤屈與戰場交給神。",
    practicePeople:"當身邊同工或朋友遭受無理的言語霸凌或心理打擊時，成為他安定的陪伴者，鼓勵他不要被仇敵的恐嚇拉入血氣爭鬧中。",
    prayer:"主啊，當仇敵猖狂吼叫、用言語打擊我的信心時，求祢賜我靜默不言的智慧。我不憑血氣回答，我選擇安靜將戰場完全交給祢。阿們。",
    verse:"「百姓靜默不言，並不回答一句，因為王曾吩咐說：不要回答他。」（以賽亞書 36:21）", tags:"#靜默不言 #勝過心理戰 #不憑血氣 #神是防線" },
  { date:"9月6日", day:37, book:"以賽亞書", passage:"以賽亞書 37:1-全",
    focus:"把難題與恐嚇信攤開在神面前，經歷上帝一夜之間的奇蹟大拯救。",
    navigation:"第 37 章是信心的極致高峰。面對亞述王的恐嚇信，希西家王撕裂衣服、穿上麻衣進入耶和華的殿，做了一個極其震撼的動作：他「將信在耶和華面前展開」，禱告說：「耶和華—以色列的神啊，求祢側耳而聽，開眼而看……拯救我們，使天下萬國都知道唯有祢是耶和華！」上帝透過以賽亞回應希西家：「你既然祈求我，我必保護拯救這城。」當夜，耶和華的使者出去，在亞述營中擊殺了十八萬五千人，強大的亞述帝國一夕潰敗。這給現代人極大的屬靈戰略：當你收到人生的「恐嚇信」（如診斷書、催繳單、解僱通知）時，帶到神的寶座前展開，上帝的大能必親自為你爭戰。",
    practiceGod:"做一次「展開恐嚇信禱告」：把你目前面臨的最大難題、帳單或焦慮寫下來，實體攤開在禱告處，誠實求神親自接手爭戰。",
    practicePeople:"陪伴一位正處於絕境、收到人生「壞消息」的朋友，帶領他一同向神禱告，將難題完全陳明在神面前，尋求神的神聖介入。",
    prayer:"主啊，我將我生命中所有的難題與恐嚇信全都在祢面前展開！求祢側耳而聽，開眼而看，彰顯祢大能的拯救，使天下知道唯有祢是真神。阿們。",
    verse:"「希西家從使者手裡接過書信來，看完了，就上耶和華的殿，將信在耶和華面前展開。」（以賽亞書 37:14）", tags:"#攤開難題 #迫切祈禱 #一夜拯救 #神親自爭戰" },
  { date:"9月7日", day:38, book:"以賽亞書", passage:"以賽亞書 38:1-全",
    focus:"在病危與絕境中轉臉朝牆迫切祈禱，經歷神延長壽命與投罪於背後的恩典。",
    navigation:"第 38 章記錄了希西家王病危臨終的經歷。上帝透過以賽亞告訴他：「你當留遺命給你的家，因為你必死，不能活了。」希西家沒有絕望放棄，而是「轉臉朝牆，禱告耶和華」，流淚痛哭痛悔。上帝聽見了他的禱告，看見了他的眼淚，奇蹟般地賜給他加增十五年壽命的應許，並以日影後退十度的兆頭作為印證。希西家在感恩詩中寫下了極震撼的救恩宣告：「祢倒愛我的靈魂，便救我脫離毀壞的坑，因為祢將我一切的罪扔在祢的背後！」現代人在面對疾病、絕境或看似定局的壞結果時，這段經文鼓勵我們「轉臉朝牆」——排除了世俗干擾，單單面對神，上帝的慈愛能扭轉定局。",
    practiceGod:"學習希西家「轉臉朝牆」的專注禱告：關掉所有通訊設備，排除一切人的聲音，單單面對神，向神傾倒內心最深處的眼淚與祈求。",
    practicePeople:"去探望身邊一位正處於重病或絕望中的朋友，用希西家經歷神「加增恩典與醫治」的見證鼓勵他，為他進行迫切的醫治禱告。",
    prayer:"主啊，謝謝祢聽見我的禱告，看見我的眼淚。謝謝祢倒愛我的靈魂，救我脫離毀壞的坑，將我一切的罪扔在祢背後！求祢賜我翻轉與醫治。阿們。",
    verse:"「看哪，我受大痛苦，本為得平安；祢倒愛我的靈魂，便救我脫離毀壞的坑，因為祢將我一切的罪扔在祢的背後。」（以賽亞書 38:17）", tags:"#轉臉朝牆 #眼淚與祈禱 #罪扔背後 #生命加增" },
  { date:"9月8日", day:39, book:"以賽亞書", passage:"以賽亞書 39:1-全",
    focus:"警惕成功後的炫耀與鬆懈，不做展示庫房的糊塗人，留心屬靈傳承。",
    navigation:"第 39 章是一個令人唏噓的警訊。希西家經歷了神蹟病癒與亞述潰敗的極大得勝後，巴比倫使者攜帶禮物前來祝賀。希西家在成功的喜悅中落入了鬆懈與虛榮的破口，竟「喜歡使者，就把自己寶庫的金銀、香料、素油，和武庫，並所有的財寶，都給他們看；他家中和全國之內，沒有一樣不給他們看的」。先知以賽亞隨後警示：這些被展示的財寶與後代，終將被帶到巴比倫去。這給現代基督徒極大的靈性提醒：我們常能在低谷中迫切靠神，卻容易在「得勝與成功後」因虛榮與誇耀而失腳。不要向世界展示你的財富與能力，要永遠向神保持謙卑，留心屬靈產業的傳承。",
    practiceGod:"檢視自己最近是否有「想向人炫耀個人成果或成就」的虛榮傾向，在神面前悔改，禱告求神保守你在得勝後依然謙卑。",
    practicePeople:"在團隊或家庭中關注「屬靈生命的長期傳承」，不只留給下一代物質財富，更注重將敬畏神的信仰真理傳給身邊的人。",
    prayer:"主啊，求祢保守我的心，讓我在經歷得勝與恩典後不至鬆懈狂傲。我不向世界展示自己的庫房與虛榮，我要永遠謙卑服事祢。阿們。",
    verse:"「希西家喜歡使者，就把自己寶庫的金銀、香料、素油，和武庫，並所有的財寶，都給他們看。」（以賽亞書 39:2）", tags:"#擺脫成功後虛榮 #不炫耀庫房 #謙卑持守 #屬靈傳承" },
  { date:"9月9日", day:40, book:"以賽亞書", passage:"以賽亞書 40:1-全",
    focus:"卸下生命的疲憊與重擔，在專心等候耶和華中「如鷹展翅上騰」。",
    navigation:"第四十章是以賽亞書極其重要的分水嶺，上帝開頭就溫柔地喊著：「你們的神說：你們要安慰，安慰我的百姓！」這是一篇專為疲乏者所寫的應許。經文對比了人類的渺小與神的偉大：連少年人都會疲乏困倦，強壯的也會全然跌倒，但「那等候耶和華的必從新得力。他們必如鷹展翅上騰」。現代人生活在高壓的節奏下，「慢性疲勞」與「靈性枯竭」成了普遍的常態。我們常試圖靠意志力死撐，結果卻更加混亂。這段經文提醒我們，重新得力的關鍵不在於自身有多強壯，而在於「等候」——將眼光從困境移開，仰望那創造地極、永不疲倦的上帝。當老鷹等候熱氣流上升時，牠不需要費力振翅就能高飛；同樣地，當我們學會等候神，聖靈的大能就會托住我們，讓我們越過障礙。",
    practiceGod:"給自己 20 分鐘無干擾的「等候神」時間，不求什麼，單單在神面前默想祂的偉大與權能，讓聖靈重新充滿你疲憊的心靈。",
    practicePeople:"主動關懷身邊一位看起來非常疲憊、壓力山大的同事或家人，請他喝一杯咖啡，並將「如鷹展翅上騰」的祝褔送給他。",
    prayer:"主啊，我承認靠著自己的力量我會疲乏困倦。今天我來到祢面前專心等候祢。求祢賜我力量，使我如鷹展翅上騰，奔跑卻不困倦，行走也不疲乏！阿們。",
    verse:"「但那等候耶和華的必從新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。」（以賽亞書 40:31）", tags:"#從新得力 #如鷹上騰 #等候神 #神聖安慰" },
  { date:"9月10日", day:41, book:"以賽亞書", passage:"以賽亞書 41:1-全",
    focus:"在恐懼與孤單中，緊緊握住上帝公義右手賜下的堅固與扶持。",
    navigation:"第四十一章是上帝對膽怯心靈最深情的安全感宣告：「你不要害怕，因為我與你同在；不要驚惶，因為我是你的神。我必堅固你，我必幫助你；我必用我公義的右手扶持你。」這一段經文重複出現了「不要害怕」，因為上帝深知人性的軟弱與對未知的恐懼。現代人面對不確定的經濟前景、未知的健康狀況或複雜的人際關係，常常感到孤立無援。但上帝在這裡把自己比作一位緊緊牽著孩子的父親，祂說：「是我耶和華—你的神攙扶你的右手！」你不是一個人在孤軍奮戰，宇宙的創造主正親自作為你的後盾。這段經文要徹底打破你的孤單感，讓你明白，不論前面的挑戰多麼高聳如山，神要使你成為有尖齒打糧的新器具，把山嶺打得粉碎。",
    practiceGod:"將手張開，想像上帝正親自牽著你的右手。向神誠實承認你內心最害怕的一件事，然後宣告：「神與我同在，祂必用公義右手扶持我！」",
    practicePeople:"寫一張充滿鼓勵的小卡片給身邊一位性格較內向、容易焦慮或正面臨困難的朋友，讓他在你的文字中感受到神的扶持。",
    prayer:"主啊，謝謝祢親自攙扶我的右手，對我說「不要害怕」。當恐懼再次襲來時，求祢讓我深信祢與我同在，祢公義的右手必堅固我、幫助我過得勝的生活。阿們。",
    verse:"「你不要害怕，因為我與你同在；不要驚惶，因為我是你的神。我必堅固你，我必幫助你；我必用我公義的右手扶持你。」（以賽亞書 41:10）", tags:"#不要害怕 #神與你同在 #公義右手 #堅固扶持" },
  { date:"9月11日", day:42, book:"以賽亞書", passage:"以賽亞書 42:1-全",
    focus:"體會壓傷的蘆葦神不折斷的溫柔，跟隨神在黑暗中開闢的新路。",
    navigation:"第 42 章引出了第一首「受苦僕人歌」。先知描繪神的僕人彌賽亞：「壓傷的蘆葦，祂不折斷；將殘的燈火，祂不吹滅。祂憑真實將公義宣導出去。」同時，上帝宣告祂要做一件嶄新事：「我耶和華憑公義召你……引導瞎子走不認識的路，在黑暗中開光明。」現代人在高度競爭與功利導向的社會中，一旦表現不佳或心靈受創，就常感到自己像一根被壓傷的蘆葦、一盞即將熄滅的燈火，深怕被社會淘汰。但耶穌帶來了超乎想像的溫柔與忍耐！祂絕不輕易放棄任何一個傷痕累累的心靈。當我們自覺微弱時，正是在祂的溫柔中被修復、被差遣去成為世上光芒的時刻。",
    practiceGod:"誠實向神坦露自己生命中「壓傷、微弱」的領域，默想耶穌不折斷、不吹滅的溫柔，讓祂的愛親自撫平你內心的創傷。",
    practicePeople:"用「不折斷壓傷蘆葦」的耐心對待身邊一位情緒不穩定、工作常犯錯的同事或肢體，不批判淘汰，而是給予溫柔的扶持與再試一次的機會。",
    prayer:"主耶穌，謝謝祢對我是如此溫柔。當我覺得自己像壓傷的蘆葦時，祢不折斷我；當我像將殘的燈火時，祢不吹滅我。求祢修復我，使我再次興起發光。阿們。",
    verse:"「壓傷的蘆葦，祂不折斷；將殘的燈火，祂不吹滅。祂憑真實將公義宣導出去。」（以賽亞書 42:3）", tags:"#壓傷的蘆葦 #將殘的燈火 #溫柔救主 #神做新事" },
  { date:"9月12日", day:43, book:"以賽亞書", passage:"以賽亞書 43:1-全",
    focus:"揮別過去的包袱與陰影，看上帝要在你生命中「做一件新事」！",
    navigation:"第四十三章給予我們一個震撼人心的視野翻轉：上帝說：「你們不要懷念以往的事，也不要思想古時的事。看哪，我要做一件新事；如今就要顯明，你們豈不知道嗎？我必在曠野開道路，在沙漠開江河。」現代人最容易落入的陷阱之一，就是被「過去」所囚禁——過去的失敗、受過的傷害、或是曾經的輝煌。我們常帶著舊有的傷痕與思維模式來過今天，導致我們無法看見神在我們生命中正在預備的突破。上帝在這章經文中提醒我們，祂是創造我們、提我們名召我們的救贖主。祂看我們為寶為尊。祂要打破過去的限制，在你看似毫無希望的曠野與沙漠中，開闢出嶄新的道路與江河！現在就是放下包袱、擁抱新事的時刻。",
    practiceGod:"進行一次「過去包袱的清理」：在一張紙上寫下你一直無法釋懷的過去失敗或傷害，禱告交給神後撕掉，宣告接受神要做的「新事」。",
    practicePeople:"給予身邊一位曾犯過錯或處於低潮的朋友一個「重新開始」的機會，不拿過去的標準衡量他，用鼓勵帶給他全新的信心。",
    prayer:"主啊，謝謝祢在我眼中看我為寶為尊。今天我選擇放下過去的失敗與遺憾，不再懷念以往的事。我憑信心宣告，祢要在我的生命中做一件嶄新的事！阿們。",
    verse:"「看哪，我要做一件新事；如今就要顯明，你們豈不知道嗎？我必在曠野開道路，在沙漠開江河。」（以賽亞書 43:19）", tags:"#做一件新事 #曠野開路 #沙漠開江河 #擺脫過去" },
  { date:"9月13日", day:44, book:"以賽亞書", passage:"以賽亞書 44:1-全",
    focus:"看清雕刻偶像的虛空與荒謬，浸泡在上帝澆灌的聖靈與福分中。",
    navigation:"第 44 章以極具諷刺意味的筆觸描繪了人雕刻偶像的愚昧：人用同一棵樹木，砍下一半拿來燒火烤餅取暖，另一半卻雕刻成神像跪拜祈求「求你拯救我，因為你是我的神」！先知揭露了人類心靈被某種盲目所蒙蔽的荒謬。接著，上帝給出無比甘甜的應許：「我要將水澆灌乾渴之處，將河澆灌乾旱之地；我要將我的靈澆灌你的後裔，將我的福澆灌你的子孫。」現代人雖然不跪拜木雕，卻常把受造物（如金錢、美貌、事業成果）當成偶像來崇拜祈求。神提醒我們，受造物無法救你，唯有上帝能將聖靈與生命之水澆灌你乾渴的心靈。",
    practiceGod:"檢視自己是否把某個「受造物」當成了心靈的偶像，向神禱告：「主啊，我離棄一切不能拯救我的虛空偶像，求祢將聖靈之水澆灌我的乾渴之處。」",
    practicePeople:"為你的下一代或身邊的年輕人進行「聖靈澆灌代禱」，求神將祂的靈與祝福厚厚澆灌在他們的生命中，讓他們從小認識真神。",
    prayer:"主啊，求祢保佑我的心不落入拜偶像的荒謬中。世上的一切受造物都不能拯救我，唯有祢能拯救我。求祢將聖靈與拯救之水厚厚澆灌我的生命。阿們。",
    verse:"「因為我要將水澆灌乾渴之處，使水湧流在乾旱之地。我要將我的靈澆灌你的後裔，將我的福澆灌你的子孫。」（以賽亞書 44:3）", tags:"#擺脫虛空偶像 #聖靈澆灌 #生命甘霖 #福降子孫" },
  { date:"9月14日", day:45, book:"以賽亞書", passage:"以賽亞書 45:1-全",
    focus:"承認上帝至高的主權，在創造與歷史細節中經歷拯救。",
    navigation:"第 45 章展示了上帝跨越文化與歷史的超然主權。上帝甚至稱外邦波斯王古列為祂的「受膏者」，為百姓的緣故提他的名召他，親自打破銅門、砍斷鐵鎖，將暗中的寶物賜給他，雖然古列當時並不認識耶和華！上帝隨後發出了震撼宇宙的宣告：「我是耶和華，再沒有別神；除了我以外再沒有神……造光，又造暗；施平安，又降災禍；造就這一切的是我耶和華。」泥土豈可對造它的瓦器匠說「你做什麼」呢？這給現代人極大的順服與敬畏：上帝的掌權超越我們的理解，祂能使用看似不屬靈的環境或外邦資源來成就祂對你的拯救。",
    practiceGod:"向神做一個「泥土對瓦器匠的完全降服禱告」：承認上帝在你生命中的絕對主權，不再質疑神帶領的道路，安然順服祂的塑造。",
    practicePeople:"當團隊或家庭遇到看似「不屬靈或非預期」的外在突發狀況時，引導大家看見神在背後超然的調配與恩典掌控，不急著埋怨。",
    prayer:"主啊，祢是泥土的瓦器匠，祢是獨一無二的真神。我不再對祢的帶領抱持懷疑，我願完全降服在祢大能的手中，信靠祢打破銅門鐵鎖的拯救。阿們。",
    verse:"「我是耶和華，再沒有別神；除了我以外再沒有神。你雖不認識我，我必給你束腰……造光，又造暗；施平安，又降災禍；造就這一切的是我耶和華。」（以賽亞書 45:5-7）", tags:"#獨一真神 #瓦器匠與泥土 #打破銅門鐵鎖 #超然主權" },
  { date:"9月15日", day:46, book:"以賽亞書", passage:"以賽亞書 46:1-全",
    focus:"體會上帝抱你、懷你直到年老的深情，不靠需要人扛抬的虛無偶像。",
    navigation:"第 46 章展示了極具震撼力的「扛抬對比」。巴比倫的神明貝利和尼波是被雕刻的偶像，需要馱在牲畜上，成為疲倦牲畜的重馱，連偶像自己都被擄去；但上帝對祂的百姓說：「雅各家，以色列家一切餘剩的要聽我：你們自出母腹，就蒙我保抱；自出母胎，便蒙我懷攖。直到你們年老，我仍這樣；直到你們髮白，我仍懷攖。我已造作，也必保抱；我必懷抱，也必拯救。」這是多麼動人的深情！世俗的偶像（如名利、物質）需要你費盡心思去「扛抬」維護，搞得你精疲力竭；唯有上帝是從你出母腹到年老髮白，一生親自「抱你、懷你」的神！",
    practiceGod:"閉上眼睛，想像自己是一個被天父抱在懷中的孩子。向神禱告：「天父，我放下一切需要我自己苦苦扛抬的重馱，享受祢一生保抱我的愛。」",
    practicePeople:"主動去探望或關懷身邊一位年長、身體衰弱的長輩，用神的應許安慰他：「神必保抱你直到年老髮白」，帶給他屬天不變的安全感。",
    prayer:"天父啊，謝謝祢！世上的偶像需要我辛苦去扛抬，唯有祢自出母腹就保抱我、懷攖我直到年老髮白。今天我要安心躺在祢溫暖的懷抱中。阿們。",
    verse:"「直到你們年老，我仍這樣；直到你們髮白，我仍懷攖。我已造作，也必保抱；我必懷抱，也必拯救。」（以賽亞書 46:4）", tags:"#保抱直到髮白 #不靠人扛抬 #天父深情 #永遠的安全感" },
  { date:"9月16日", day:47, book:"以賽亞書", passage:"以賽亞書 47:1-全",
    focus:"看清巴比倫傲慢的破產，遠離「唯有我、再沒有別的」的自大陷阱。",
    navigation:"第 47 章是對傲慢的巴比倫女子的審判。巴比倫曾自誇「我必永作女王」，心中狂傲地宣告：「唯有我，除我以外再沒有別的；我必不至寡居，也不至喪子。」她依賴自己豐富的占星、邪術與世俗智慧，以為沒有人看見她的惡行。然而上帝宣告，災禍必在一刻之間忽然臨到，她的占星家與謀士在烈火面前連自己都無法拯救。這給現代生活在自我中心文化中的我們極大的警醒：當一個人或社會開始落入「唯有我、我最厲害」的自大心理時，就是危險與崩潰的開始。唯有敬畏神、承認自己的渺小，才能避開突然臨到的禍患。",
    practiceGod:"檢視自己最近是否有落入「自以為比別人聰明、唯我獨尊」的驕傲心態，在神面前深自謙卑悔改，承認自己毫無可誇。",
    practicePeople:"在人際溝通中練習「多聆聽、少自誇」，主動去請教身邊經驗不如你的人，用尊重與謙卑代替自大與凌駕。",
    prayer:"主啊，拯救我脫離「唯有我、再沒有別的」這種隱密的傲慢與自大。求祢賜我敬畏與謙卑的心，讓我明白唯有祢是至高者，我不靠自己的聰明。阿們。",
    verse:"「你心裡說：唯有我，除我以外再沒有別的。我必不至寡居，也不至喪子。哪知喪子、寡居這兩件事在一刻之間，一日之內必臨到你。」（以賽亞書 47:8-9）", tags:"#遠離傲慢 #除神以外別無可誇 #謙卑警醒 #敬畏至高者" },
  { date:"9月17日", day:48, book:"以賽亞書", passage:"以賽亞書 48:1-全",
    focus:"在苦難的爐中被煉淨，聽從上帝吩咐使你的平安如江河湧流。",
    navigation:"第 48 章上帝對頑梗的百姓發出了扎心的呼喚。上帝知道人是頑梗的，項是鐵頸，額是銅頭，因此上帝在苦難的爐中試煉我們，「選拔你，並非如精煉銀子，乃是在苦難的爐中試煉你」。上帝深情地發出嘆息：「甚願你素來聽從我的命令！你的平安就必如江河，你的公義就必如海浪。」經文最後發出了清晰的宣告：「耶和華說：惡人必不得平安！」現代人在生活中常覺得缺乏平安，動輒感到焦慮與焦躁。這段經文揭示了平安的真諦：平安不是靠世俗手段爭取來的，而是來自順服上帝的真理指引。當我們聽從神的吩咐，平安就會像源源不絕的江河般湧入生命。",
    practiceGod:"檢視自己最近是否有某個神早已指明的吩咐（如饒恕、誠實、奉獻）你卻一直推拖，今天選擇順服，體驗「平安如江河」的湧流。",
    practicePeople:"陪伴身邊一位內心極度焦躁不安的朋友，分享順服神話語帶來的平靜經歷，鼓勵他放下憂慮，享受神賜下的江河平安。",
    prayer:"主啊，求祢赦免我過往如鐵頸銅頭般的頑梗。謝謝祢在苦難的爐中煉淨我，今天我願聽從祢的一切吩咐，讓祢的平安如江河、公義如海浪充溢我。阿們。",
    verse:"「甚願你素來聽從我的命令！你的平安就必如江河；你的公義就必如海浪。」（以賽亞書 48:18）", tags:"#苦難的爐 #平安如江河 #順服得勝 #擺脫頑梗" },
  { date:"9月18日", day:49, book:"以賽亞書", passage:"以賽亞書 49:1-全",
    focus:"體會天父永不離棄的深情，知道自己的名字已被「銘刻在祂掌上」。",
    navigation:"第四十九章描繪了上帝對祂百姓無微不至、超乎母愛的深情。當錫安哀嘆說：「耶和華離棄了我，主忘記了我」時，上帝給出了一個極具震撼力的回答：「婦人焉能忘記她吃奶的嬰孩，不憐恤她所生的兒子？即或有忘記的，我卻不忘記你。看哪，我將你銘刻在我掌上！」現代人在高度競爭與功利導向的社會中，極易產生被忽視感或被拋棄感。我們常覺得自己表現不夠好，就會被神或人遺忘。但這段經文給了我們最扎實的身份認同：上帝對你的愛比母愛更堅定，祂把你的名字刻在祂的手掌心上！每一次祂張開手，就看見你的名字。",
    practiceGod:"看看自己的手掌，默想上帝把你的名字深深「銘刻在祂掌上」。向天父獻上感恩，感謝祂永不忘記你、永不離棄你。",
    practicePeople:"留意身邊一位常被邊緣化或感到孤獨的朋友，主動叫出他的名字，給予他真誠的讚美與關注，讓他感受到自己是被重視的。",
    prayer:"天父啊，謝謝祢用比母愛更深沉的愛愛我。當我覺得被孤立或被遺忘時，求祢提醒我，我的名字已經銘刻在祢的掌上。願祢的愛撫平我內心一切的不安。阿們。",
    verse:"「看哪，我將你銘刻在我掌上；你的牆垣常在我眼前。」（以賽亞書 49:16）", tags:"#銘刻掌上 #永不忘記 #天父深情 #勝過母愛" },
  { date:"9月19日", day:50, book:"以賽亞書", passage:"以賽亞書 50:1-全",
    focus:"領受受教者的耳朵與舌頭，在黑暗無光時依然施展對神的倚靠。",
    navigation:"第 50 章展現了彌賽亞僕人的完美順服與堅韌信心。上帝賜給僕人「受教者的耳朵與舌頭」，使他「知道用言語扶助疲乏的人」。僕人每早晨受教，即使面對凌辱吐唾沫、打他背拔他鬍須的逼迫，他硬著臉面如磐石，因為知道主耶和華必幫助他，他必不至蒙羞。經文最後給所有在黑暗中的人發出呼召：「你們中間誰是敬畏耶和華、聽從祂僕人聲音的？這人在黑暗中行，沒有亮光，當倚靠耶和華的名，憑依自己的神。」這給現代人在經歷「靈性黑夜」或環境極度黑暗時極大的力量：即使看不到亮光，仍要憑信心咬牙倚靠神。",
    practiceGod:"在清晨禱告中求神賜你「受教者的耳朵」，安靜聆聽神的聲音，並求神給你可以「扶助疲乏者」的智慧言語。",
    practicePeople:"用溫柔且充滿真理的話語，去扶助身邊一位正在經歷「疲乏與靈性黑夜」的朋友，成為他暗夜中的安慰者。",
    prayer:"主啊，每早晨提醒我的耳朵，賜我受教者的心與舌頭，使我知道如何扶助疲乏的人。當我在黑暗中無光時，我仍要硬著臉面如磐石，堅定倚靠祢。阿們。",
    verse:"「主耶和華賜我受教者的耳朵，使我知道用言語扶助疲乏的人。主每早晨提醒，提醒我的耳朵，使我能聽，像受教者一樣。」（以賽亞書 50:4）", tags:"#受教者的耳朵 #扶助疲乏人 #臉面如磐石 #黑夜中的倚靠" },
  { date:"9月20日", day:51, book:"以賽亞書", passage:"以賽亞書 51:1-全",
    focus:"追想被磐石鑿出之恩，興起！穿上能力，不害怕必被啃咬的世人。",
    navigation:"第 51 章是對追求公義之人的強烈振奮。上帝呼籲百姓：「你們這追求公義、尋求耶和華的，當追想你們是由哪塊磐石鑿出的！」追想上帝如何從亞伯拉罕一個人招他並賜福倍增他。上帝三次發出呼召「興起！興起！穿上能力！」上帝問：「你是誰，竟怕那必死的人？怕那要如草被啃咬的人類，卻忘記了造你的耶和華？」上帝的公義與拯救必存到永遠。現代基督徒在世俗反對或壓力面前容易膽怯退縮。神提醒我們追想自己的屬靈根源與身份，上帝的手臂曾砍碎拉哈伯（埃及），今天也必穿上能力保護你，使你歡呼歸回錫安。",
    practiceGod:"追想上帝過去在你生命中如何從無到有救拔你的恩典歷史，向神禱告：「主啊，我追想祢的恩典，今天我要穿上能力，不再害怕世人的眼光。」",
    practicePeople:"鼓勵身邊一位因為害怕他人議論或反對而不敢堅定立場的朋友，陪伴他站立得穩，穿上屬天的勇敢。",
    prayer:"主啊，謝謝祢提醒我追想那鑿出我的磐石！我何必害怕那如草般必死的人類？我要響應祢的呼召興起，穿上能力，歡呼走在祢公義的大道上。阿們。",
    verse:"「你們這追求公義、尋求耶和華的，當追想你們是由哪塊磐石鑿出的，是由哪塊土坑掘出的。」（以賽亞書 51:1）", tags:"#追想磐石恩典 #興起穿上能力 #不害怕世人 #永遠的拯救" },
  { date:"9月21日", day:52, book:"以賽亞書", passage:"以賽亞書 52:1-全",
    focus:"抖落塵土，拍去頸項的鎖鏈，傳揚佳美福音的歡呼與聖潔。",
    navigation:"第 52 章是一首充滿釋放與勝利的號角歌。「錫安啊，興起！興起！穿上你的華美衣服！聖城耶路撒冷啊，抖落塵土起來坐在位上！被擄的錫安女子啊，解開你頸項的鎖鏈！」上帝宣告百姓是被白白賣掉的，也必不加金銀被贖回。先知發出了讚嘆：「那報佳音，傳平安，報好信，傳救恩的，對錫安說：你的神掌權了！這人的腳蹤何等佳美！」經文最後呼籲屬神的人要自潔，離開污穢。現代人常被罪惡感、過去的失敗鎖鏈綑綁，像坐在塵土中。神呼籲我們抖落塵土，披上基督的華美衣服，勇敢去傳揚「神掌權了」的佳美福音！",
    practiceGod:"進行一次「解開鎖鏈的宣告禱告」：靠著基督的寶血，宣告抖落心中一切自卑、罪惡感與塵土，穿上基督賜給你的華美義袍。",
    practicePeople:"成為那「腳蹤何等佳美」的人：主動將耶穌基督拯救的好消息，分享給身邊一位尚未信主、生命被困住的朋友。",
    prayer:"主啊，謝謝祢白白救贖了我！今天我靠祢的大能抖落身上的塵土，解開鎖鏈，穿上華美的衣服。願我的腳蹤何等佳美，一生傳揚祢掌權的好訊息！阿們。",
    verse:"「聽啊，你守望者的聲音！他們揚起聲來，一同歡呼；因為耶和華歸回錫安的時候，他們必親眼看見。那報佳音，傳平安，報好信，傳救恩的，對錫安說：你的神掌權了！這人的腳蹤何等佳美！」（以賽亞書 52:7-8）", tags:"#抖落塵土 #解開鎖鏈 #佳美腳蹤 #神掌權了" },
  { date:"9月22日", day:53, book:"以賽亞書", passage:"以賽亞書 53:1-全",
    focus:"默想受苦僕人的無私救贖，在祂的鞭傷與刑罰中得享醫治與平安。",
    navigation:"第五十三章是整卷以賽亞書最震撼人心的一頁——受苦僕人的預言。先知以無比精準且深情的筆觸描繪了耶穌基督在十字架上的救贖：「祂為我們的過犯受害，為我們的罪孽壓傷。因祂受的刑罰，我們得平安；因祂受的鞭傷，我們得醫治。我們都如羊走迷，各人偏行己路，耶和華使我們眾人的罪孽都歸在祂身上。」現代人常帶著滿身的內在傷痕與罪惡感在生活，試圖用各種方式自我懲罰。但這段經文揭示了福音的核心：你所有的刑罰，耶穌已經為你承受了；你所有的傷痕，耶穌已經帶到十字架上了！當你接受這份救贖，醫治與平安就會流進你的生命。",
    practiceGod:"預備心進行一段深度的「十字架默想」：誠實將內心的罪惡感、創傷與身體的疾苦交給耶穌，宣告因祂的鞭傷你已得醫治。",
    practicePeople:"以「受苦僕人」的愛去寬恕一位曾經傷害過你的人，選擇放下心中的怨恨，像耶穌一樣用包容與赦免代替報復。",
    prayer:"主耶穌，謝謝祢為我的過犯受害，為我的罪孽壓傷。因祢受的刑罰我得享平安，因祢受的鞭傷我得到醫治。我願將生命完全奉獻給祢！阿們。",
    verse:"「哪知祂為我們的過犯受害，為我們的罪孽壓傷。因祂受的刑罰，我們得平安；因祂受的鞭傷，我們得醫治。」（以賽亞書 53:5）", tags:"#受苦僕人 #因鞭傷得醫治 #因刑罰得平安 #極致之愛" },
  { date:"9月23日", day:54, book:"以賽亞書", passage:"以賽亞書 54:1-全",
    focus:"大山可以挪開，上帝不離開的慈愛與平安之約必永不改變。",
    navigation:"第五十四章是對經歷煉淨後的生命發出的極大應許。上帝對那些感到羞愧、孤獨的心靈說：「大山可以挪開，小山可以遷移；但我的慈愛必不離開你；我施憐憫的平安之約也不遷移。」經文中還鼓勵要「張大你帳幕之地，擴張你居所的幔子」，因為神要賜下極大的倍增與復興。現代人的生活充滿了不確定性——地上的經濟大山會搖晃，人際關係的小山會崩塌，使我們常處於患得患失中。但上帝在這裡用「不可動搖的約」來給我們定心丸。地上的萬物都會變遷，但上帝對你的慈愛與憐憫誓約永遠不變！確立了這份安全感，你就能勇敢擴張帳幕。",
    practiceGod:"走出戶外看看遠處的大山，並在心中宣告：「即使這大山挪開，神的慈愛也絕不離開我！」擴充你的屬靈心胸，向神求更大的異象。",
    practicePeople:"給予身邊一位正處於自我懷疑或挫敗中的朋友一句堅定的承諾與支持，成為他列表中「不輕易離開」的忠誠夥伴。",
    prayer:"主啊，謝謝祢與我立下永不遷移的平安之約！當世上的一切都在變幻搖晃時，祢不離開的慈愛是我唯一的錨。求祢擴張我生命的幔子，帶領我走入豐盛。阿們。",
    verse:"「大山可以挪開，小山可以遷移；但我的慈愛必不離開你；我施憐憫的平安之約也不遷移。這是憐憫你的耶和華說的。」（以賽亞書 54:10）", tags:"#不離慈愛 #平安之約 #擴張帳幕 #永不動搖" },
  { date:"9月24日", day:55, book:"以賽亞書", passage:"以賽亞書 55:1-全",
    focus:"前來白白享受恩典的大饗宴，堅信神的話語決不徒然返回。",
    navigation:"第五十五章發出了舊約中最熱情的福音邀請：「你們一切乾渴的，當就近水來！沒有銀錢的也可以來！你們來，買了吃……白白得來！」上帝呼籲人們不要再花錢買那不能使人飽足的。接著，先知揭示了上帝話語的大能：雨雪從天而降滋潤地土，神口所出的話語也必如此，「決不徒然返回，卻要成就神所熱切喜悅的」。現代人常陷入功利主義思維，總覺得要付出極大代價才能換取平安，結果精疲力竭。這段經文提醒我們，神最寶貴的恩典是白白賜下的！同時，只要堅守上帝給你的應許，祂的話語就帶著成就的能力，絕不徒然返回。",
    practiceGod:"挑選一句上帝給你的應許經文，今天反覆開口宣告五次，堅信神的話語帶有大能，決不徒然返回，必在環境中成就奇事。",
    practicePeople:"請一位經濟困頓或心靈乾渴的朋友吃個飯，不帶任何回報地服事他，讓他在這份免費的愛中體驗天父白白賜下的恩典。",
    prayer:"主啊，謝謝祢發出恩典的邀請，讓我這乾渴的人可以白白來飲用救恩的水。我堅信祢口所出的每一句應許都帶有大能，決不徒然返回！阿們。",
    verse:"「雨雪從天而降，並不返回，卻滋潤地土……我口所出的話也必如此，決不徒然返回，卻要成就我所熱切喜悅的。」（以賽亞書 55:10-11）", tags:"#白白恩典 #水與奶 #神的話語 #決不徒然" },
  { date:"9月25日", day:56, book:"以賽亞書", passage:"以賽亞書 56:1-全",
    focus:"持守安息日與公義，天父的殿必稱為萬民禱告的殿。",
    navigation:"第 56 章展示了上帝極其廣闊與包容的救恩懷抱。上帝宣告外邦人與被社會邊緣化的太監，只要緊守安息日、持守上帝的約，神必領他們到祂的聖山，「使他們在禱告的殿中喜樂……因為我的殿必稱為萬民禱告的殿」。經文隨後痛斥那些失職盲目的守望者（「啞巴狗，不能叫喚，只知做夢，躺臥，貪睡」）。這給現代教會與基督徒極大的警醒：上帝的家是為所有人敞開的「萬民禱告之殿」，不應有任何階級或偏見的藩籬。同時，我們不能作靈性上貪睡麻木的啞巴狗，要忠心持守安息與聖潔，在禱告中為萬民發聲。",
    practiceGod:"檢視自己對聚會與安息日的態度，向神禱告：「主啊，求祢使我在禱告的殿中喜樂，讓我的心成為專一尋求祢的禱告之殿。」",
    practicePeople:"打破排外心理：主動去歡迎並服事教會或社群中剛來的新朋友、外籍人士或邊緣族群，讓他們在上帝的家體驗被愛與接納。",
    prayer:"主啊，謝謝祢這不偏待人的恩典，讓我的心與祢的殿成為萬民禱告的殿。求祢保佑我不作靈性麻木的啞巴狗，使我在禱告中充滿喜樂與忠心。阿們。",
    verse:"「我必領他們到我的聖山，使發兩在禱告的殿中喜樂。他們的燔祭和平安祭，在我的祭壇上必蒙悅納，因為我的殿必稱為萬民禱告的殿。」（以賽亞書 56:7）", tags:"#萬民禱告的殿 #包容的救恩 #持守安息日 #靈性警醒" },
  { date:"9月26日", day:57, book:"以賽亞書", passage:"以賽亞書 57:1-全",
    focus:"上帝與高傲者遠離，卻親自與心靈痛悔謙卑的人同居並賜醫治。",
    navigation:"第 57 章深刻對比了假冒偽善的拜偶像者與真實謙卑尋求神的人。先知痛陳當代人在山谷與樹下瘋狂尋求邪俗偶像的淫行，然而那至高至上、永遠長存、名為聖者的上帝宣告：「我住在至高至聖的所在，也與心靈痛悔謙卑的人同居；要使謙卑人的靈甦醒，也使痛悔人的心甦醒。」上帝看見人的悖逆與塗炭，但祂宣告：「我看見他的道路，想要醫治他；又要引導他，使他和跟他一同憂傷的人再得安慰。」這給現代人最溫柔的真理：神不看重外在的虛浮與驕傲，神唯獨看重並住在謙卑痛悔的心靈中，要親自賜下甦醒與醫治。",
    practiceGod:"在神面前做一個「極深謙卑降服的禱告」：承認自己的微小與軟弱，邀請至高至聖的上帝親自居住在你痛悔謙卑的心靈中。",
    practicePeople:"去安慰一位正在為自己的過錯或失敗深感痛悔的朋友，告訴他上帝不輕看痛悔的心，並陪伴他經歷神甦醒與醫治的恩典。",
    prayer:"至高至聖的天父，謝謝祢竟願意與我這心靈痛悔謙卑的人同居！求祢甦醒我的靈，醫治我的道路，使我在祢聖潔的臨在中得著安慰與平安。阿們。",
    verse:"「因為那至高至上、永遠長存、名為聖者的如此說：我住在至高至聖的所在，也與心靈痛悔謙卑的人同居；要使謙卑人的靈甦醒，也使痛悔人的心甦醒。」（以賽亞書 57:15）", tags:"#至高至聖 #與謙卑人同居 #心靈甦醒 #醫治與安慰" },
  { date:"9月27日", day:58, book:"以賽亞書", passage:"以賽亞書 58:1-全",
    focus:"解開不公義的鎖鏈，讓禁食與敬拜轉化為照顧弱勢的真實愛心。",
    navigation:"第五十八章是一篇關於真實敬拜與禁食的深刻檢討。當時的人抱怨自己禁食刻苦，上帝卻不理會。上帝透過先知痛批他們的偽善：他們一邊禁食，一邊互相爭競、欺壓工人。上帝所喜悅的禁食是：「鬆開兇惡的繩，解下軛上的索，使被欺壓的得自由……把餅分給飢餓的人，將飄流的窮人接到家中」。當人活出這種愛的生命時，「你的光就必發現如晨光，你的醫治要速速顯現！耶和華也必時常引導你，使你像澆灌的園子。」現代人也常落入將信仰宗教化的危險。這段經文提醒我們：真正的靈性必然帶來社會關懷與實踐。",
    practiceGod:"進行一次「心靈動機的淨化操練」：在禱告中誠實檢視自己最近的讀經與事工，是否流於形式或討人喜歡，求聖靈重燃你專一愛神、謙卑尋求神的起初熱情。",
    practicePeople:"主動去關心一位身邊常被忽略、處於社會邊緣或經濟困難的人，提供他實質的幫助（如送餐、物資或陪伴），鬆開他身上的重擔。",
    prayer:"主啊，求祢拯救我脫離宗教偽善的盲點。求祢賜我憐憫的心，讓我看見身邊受壓傷與飢餓的人。當我活出愛與公義時，願祢使我像澆灌的園子！阿們。",
    verse:"「耶和華也必時常引導你，在乾旱之地使你心滿意足，骨頭強壯。你必像澆灌的園子，又像不乾涸的泉源。」（以賽亞書 58:11）", tags:"#真實敬拜 #解開軛索 #晨光破曉 #澆灌的園子" },
  { date:"9月28日", day:59, book:"以賽亞書", passage:"以賽亞書 59:1-全",
    focus:"承認罪孽使我們與神隔絕，看上帝親自穿上公義鎧甲作救贖者。",
    navigation:"第 59 章深刻揭露了罪對人生的破壞力。「耶和華的膀臂並非縮短，不能拯救，耳朵並非發沉，不能聽見；但你們的罪孽使你們與神隔絕！」先知描繪了一幅社會公義傾覆、真理在街上跌倒、誠實人反成獵物的混亂景象。上帝看見無人拯救，無人代求，就甚不喜悅。於是上帝「親自用自己的膀臂施行拯救……以公義為鎧甲，以拯救為頭盔，以報仇為衣服，以熱心為外袍」。救贖主必來到錫安，與百姓立永約，將聖靈與神的話語永不離開他們的口。這給我們極大的救恩震撼：在人類絕望無助時，神親自穿上鎧甲作我們的救贖主！",
    practiceGod:"進行一次「罪孽剖析與感恩禱告」：誠實向神承認自己無法自救的罪性，感謝神親自穿上公義鎧甲降臨十字架拯救你。",
    practicePeople:"主動去關心身邊一位正處於冷漠、孤立或被排擠的朋友，不隨波逐流落井下石，用充滿熱心與恩慈的行動（如發一則關心訊息、請喝一杯飲料或傾聽）陪伴他，將神的救贖溫暖帶給他。",
    prayer:"主啊，謝謝祢的膀臂並未縮短！當我們因罪與祢隔絕、無人代求時，謝謝祢親自穿上公義鎧甲作我的救贖主。願祢的聖靈與話語永不離開我的口。阿們。",
    verse:"「耶和華的膀臂並非縮短，不能拯救，耳朵並非發沉，不能聽見；但你們的罪孽使你們與神隔絕。」（以賽亞書 59:1-2）", tags:"#手臂未縮短 #罪使人隔絕 #公義鎧甲 #救贖主降臨" },
  { date:"9月29日", day:60, book:"以賽亞書", passage:"以賽亞書 60:1-全",
    focus:"在幽暗遮蓋大地的世代中，「興起發光」，成為照亮世界的燈台。",

    prayer:"主啊，謝謝祢讓祢的榮耀發現照耀我！雖然周圍的世界充滿幽暗，但我宣告我不再隱藏。求祢賜我勇氣興起發光，引導身邊的人走向祢的光明！阿們。",

    focus:"領受聖靈的恩膏，傳好消息給謙卑人，使傷心者得到醫治與華冠。",

    practicePeople:"尋找身邊一位正處於悲哀或創傷中的朋友，用充滿溫情與喜樂的行動，為他戴上「華冠代替灰塵」。",

    verse:"「亞伯拉罕不認識我們，以色列也不承認我們，祢卻是我們的父！耶和華啊，祢是我們的父；從古以來，祢的名是我們的救贖主。」（以賽亞書 63:16）", tags:"#祢是我們的父 #苦難中同受苦難 #救贖主 #追想恩典" },

    practiceGod:"做一個「泥土對窯匠的投降禱告」：承認自己所有的義不過像污穢衣服，開口說：「主啊，我是泥土，祢是窯匠，求祢手重新塑造我。」",

    navigation:"第 65 章上帝揭示了祂對悖逆百姓整天張手召呼的痛心，痛陳他們在園中獻祭、在墳墓坐著的偽善與偶像行徑。但上帝宣告祂必保全祂的僕人（「葡萄樹上結出新酒」）。隨後，經文展現了舊約中最璀璨的終極願景——「看哪！我造新天新地；從前的事件不再被記念，也不再追想。你們當因我所造的永遠歡喜快樂！」在新天新地裡，不再有壽數短少的嬰孩，沒有徒然勞碌，豺狼與羊羔必一同吃食，在聖山都不傷人不害物。這給現代生活在破碎、疾病與死亡陰影中的我們極大的終極盼望：這世界不是我們的終點，神預備了全新的新天新地！",

  { date:"10月5日", day:66, book:"以賽亞書", passage:"以賽亞書 66:1-全",

    practicePeople:"將「新天新地」的終極盼望分享給身邊一位對世界現狀感到絕望的朋友，幫助他感受到這世界並非通往毀滅，而是通往神榮耀的更新。",

    verse:"「天是我的座位；地是我的腳凳。你們要為我造何等的殿宇？何處是我安息的所呢？耶和華說：這一切是我手所造的……但我所看顧的，就是虛心痛悔、因我話語而戰兢的人。」（以賽亞書 66:1-2）", tags:"#天為座位 #虛心痛悔 #因神話語戰兢 #新天新地" }

  '6/23': `42:1 他帶我出來向北，進到外院，帶我到那些對著空地、對著北邊樓房的聖屋那裡。

43:16 爐壇是四方的，長十二肘，寬十二肘。
43:17 壇台是四方的，長十四肘，寬十四肘，四圍的沿高半肘，底座四圍各寬一肘，壇的階梯朝東。
43:18 他對我說：人子啊，主耶和華如此說：建造祭壇獻燔祭、灑血的條例是這樣：
43:19 你要將一隻公牛犢給祭司利未人撒督的後裔——就是那些近前來事奉我的人——作贖罪祭，這是主耶和華說的。
43:20 你要取些公牛的血，抹在壇的四角上和壇台的四角並四圍的沿上，要這樣潔淨壇，為壇贖罪。
43:21 你要把那贖罪祭的公牛，燒在殿所指定的地方，在聖所以外。
43:22 第二天，你要把無殘疾的公山羊獻為贖罪祭，要像潔淨壇如用公牛一樣潔淨壇。
43:23 潔淨完了，要獻無殘疾的公牛犢和羊群中無殘疾的公綿羊。
43:24 要獻在耶和華面前，祭司要撒鹽在其上，獻給耶和華為燔祭。
43:25 每天要獻公山羊一隻為贖罪祭，也要獻公牛犢一隻和羊群中的公綿羊一隻，都要沒有殘疾的，如此辦理七天。
43:26 要這樣七天為壇贖罪，潔淨壇，壇就被奉獻了。
43:27 這些日子滿了以後，從第八天起，祭司要在壇上獻你們的燔祭和平安祭，我就悅納你們。這是主耶和華說的。`,

  '6/25': `44:1 他帶我回到朝外聖所朝東的外門，這門關著。
44:2 耶和華對我說：這門要關閉，不可敞開，誰也不可由其中進入，因為耶和華以色列的神已由其中進入，所以要關閉。
44:3 至於王，他是王，要坐在這門的門廊裡在耶和華面前吃飯，他要由這門的門廊而入，也由這門而出。
44:4 他帶我由北門來到殿前，我觀看，見耶和華的榮耀充滿了耶和華的殿，我就俯伏在地。
44:5 耶和華對我說：人子啊，你要留心，用眼觀看，用耳聆聽我對你所說耶和華殿的一切條例和一切法則，要留心殿的進口和聖所的出口。
44:6 你要對那悖逆的以色列家說：主耶和華如此說：以色列家啊，你們所行的一切可憎的事可以止住了。
44:7 你們引外邦人，就是身心未受割禮的人進入我的聖所，在你們獻我食物、脂油、血的時候，污穢了我的殿；你們這樣行，在諸般可憎的事上破壞了我的約。
44:8 你們沒有看守我的聖物，卻為你們自己在聖所立人代守。
44:9 主耶和華如此說：以色列中一切外邦人，就是身心未受割禮的，都不可進入我的聖所。
44:10 以色列人走迷、離棄我隨從偶像的利未人，必因自己的罪孽擔當刑罰。
44:11 然而他們要在我聖所作使役，把守殿門，在殿中服役，要為百姓宰殺燔祭牲和其他祭牲，站在百姓面前事奉他們。
44:12 他們因曾在偶像前服事這些百姓，使以色列家陷入罪孽，所以我向他們舉手起誓，他們必擔當自己的罪孽，是主耶和華說的。
44:13 他們不可走近我，不可給我供祭司的職，也不可近我聖物中的至聖物，卻要擔當他們的羞辱，就是所行可憎之事的羞辱。
44:14 然而，我要使他們看守殿，辦其中一切的使役，辦殿中所需辦的事。
44:15 以色列人走迷的時候，祭司利未人撒督的子孫卻看守了我聖所的職分，他們要近前來事奉我，站在我面前將脂油與血獻給我，這是主耶和華說的。
44:16 他們要進入我的聖所，就近我的桌子事奉我，守我所吩咐的。
44:17 他們進入內院門的時候，要穿細麻衣；在內院門和殿內供職的時候，不可穿羊毛衣服。
44:18 他們頭上要戴細麻布的冠冕，腰要束細麻布的褲子，不可穿使人出汗的衣服。
44:19 他們出到外院，進入外院到民那裡的時候，要脫下供職的衣服，放在聖屋裡，穿上別的衣服，免得因聖衣使民成聖。
44:20 他們不可剃頭，也不可蓄長髮，只要剪短頭髮。
44:21 祭司進內院的時候，都不可喝酒。
44:22 他們不可娶寡婦和被休的婦人為妻，只可娶以色列後裔中的處女，或娶祭司留下的寡婦。
44:23 他們要教導我的民分辨聖俗，使他們分辨潔淨與不潔淨的。
44:24 有爭訟的事，他們要站著判斷，要按我的典章判斷，守我一切的法則和條例，並要守我的安息日為聖日。
44:25 他們不可進到死人那裡使自己不潔淨，只可為父親、母親、兒子、女兒、弟兄，和未嫁人的姐妹使自己不潔淨。
44:26 人潔淨之後，要再給他計算七天。
44:27 他進入聖所，進內院在聖所中供職的日子，要獻贖罪祭，這是主耶和華說的。
44:28 他們的產業就是我；我是他們的產業。你們不可在以色列中給他們地業；我就是他們的地業。
44:29 他們要吃素祭、贖罪祭，和贖愆祭；以色列中一切永獻的物都要歸他們。
44:30 各樣初熟的果子，並你們一切所奉的供物，都要歸祭司；你們也要把初磨的麵給祭司，使福氣臨到你的家。
44:31 祭司不可吃自死的或被野獸撕裂的鳥獸。`,

  '6/26': `45:1 你們拈鬮將地分給以色列各支派為業的時候，要將一份地作為獻給耶和華的聖地，長二萬五千肘，寬一萬肘；這一帶之地四圍都要成為聖地。
45:2 其中要有聖所一塊，長五百肘，寬五百肘，四圍有空地五十肘。
45:3 在這量度之地內，要量長二萬五千肘，寬一萬肘的地，其中要有聖所，就是至聖之地。
45:4 這地是聖地，從這地中要有為侍奉聖所的祭司所得的地，就是進前來事奉耶和華的人所得的地；這地要作他們房屋的基地，並作聖所的聖地。
45:5 又量長二萬五千肘，寬一萬肘的地，這地要歸在殿中事奉的利未人，作為他們居住的城邑。
45:6 你們要給城邑指定一塊地，寬五千肘，長二萬五千肘，這與聖地並排，要歸以色列全家。
45:7 歸王的地在聖地和城邑地的兩旁，靠近聖地和城邑地，在西要往西，在東要往東；長與各支派的地相等，東至東界，西至西界。
45:8 這地在以色列中作王的地業。我所立的王不再欺壓我的民，要按支派將地業分給以色列家。
45:9 主耶和華如此說：以色列的王啊，這就夠了！要除掉強暴和搶奪的事，施行公平和公義，停止奪取我民地業的事，這是主耶和華說的。
45:10 你們要用公道的天平、公道的伊法、公道的罷特。
45:11 伊法和罷特要量一樣，就是罷特要能盛賀梅珥的十分之一，伊法也要能盛賀梅珥的十分之一；其量要照賀梅珥定規。
45:12 一舍客勒是二十季拉；二十舍客勒，二十五舍客勒，十五舍客勒，要作你們的彌那。
45:13 你們所當奉的供物是這樣：一賀梅珥麥子要奉六分之一伊法；一賀梅珥大麥也要奉六分之一伊法。
45:14 論到油，每柯珥油（就是十罷特，又名一賀梅珥，因為十罷特就是一賀梅珥）要奉十分之一罷特。
45:15 以色列肥美的草場每二百隻中要奉一隻羊，作素祭、燔祭，並平安祭，為以色列民贖罪，這是主耶和華說的。
45:16 國中的眾民都要把這供物給以色列的王。
45:17 王要辦以色列家在各節期的燔祭、素祭、奠祭、逾越節，並各安息日和以色列家一切節期的事，也要辦贖罪祭、素祭、燔祭，並平安祭，為以色列家贖罪。
45:18 主耶和華如此說：正月初一日，你要取無殘疾的公牛犢，潔淨聖所。
45:19 祭司要取些贖罪祭牲的血，抹在殿的門框、壇台四角的沿上，並內院門的門框上。
45:20 當月初七日，你要為誤犯罪的和愚昧無知犯罪的人如此而行，你們要為殿贖罪。
45:21 正月十四日，你們要守逾越節，這節要吃無酵餅，共守七天。
45:22 當那日，王要為自己和國中的眾民預備公牛為贖罪祭。
45:23 這節七天，每天要獻無殘疾的公牛七隻、公綿羊七隻，為耶和華作燔祭；每天獻公山羊一隻為贖罪祭。
45:24 他所獻的素祭，每公牛要獻細麵一伊法，每公綿羊獻細麵一伊法；每伊法細麵加油一欣。
45:25 七月十五日的節，七天他也要這樣辦理，贖罪祭、燔祭、素祭，和油都照樣辦。`,

  '6/27': `46:1 主耶和華如此說：內院朝東的門，在六個工作的日子要關閉，在安息日要敞開，在朔日也要敞開。
46:2 王要從這門的門廊進入，站在門的門框旁邊，祭司要獻他的燔祭和平安祭；他就在門口敬拜，然後出去，這門直到晚上才關閉。
46:3 在安息日和朔日，這地的眾民也要在這門口耶和華面前敬拜。
46:4 安息日，王要將燔祭獻給耶和華，就是無殘疾的羊羔六隻，並無殘疾的公綿羊一隻；
46:5 素祭，每公綿羊獻細麵一伊法，每羊羔獻素祭量多量少由他自動而定；每伊法細麵加油一欣。
46:6 朔日，要獻無殘疾的公牛犢一隻，羊羔六隻，公綿羊一隻，都要沒有殘疾的。
46:7 他要獻素祭，每公牛和公綿羊各獻細麵一伊法，每羊羔量多量少由他自動而定；每伊法細麵加油一欣。
46:8 王進來的時候，要從這門的門廊進入，也要由這門出去。
46:9 各節期，這地的眾民朝見耶和華的時候，從北門進入敬拜的，要從南門而出；從南門進入的，要從北門而出，不可從所進的門而出，要從對面的門出去。
46:10 他們進入的時候，王要在他們中間進入；他們出去的時候，王也要出去。
46:11 在各節期和聖會的時候，素祭每公牛要獻細麵一伊法，每公綿羊要獻細麵一伊法；每羊羔量多量少由他自動而定；每伊法細麵加油一欣。
46:12 王獻甘心祭，無論是燔祭，是平安祭，是向耶和華甘心獻的，有人要給他開朝東的門，他就獻他的燔祭和平安祭，如同在安息日所獻的；他出去之後，要把門關上。
46:13 每天你要獻一歲沒有殘疾的羊羔一隻為燔祭，要每早晨獻一隻。
46:14 每早晨要同獻素祭，就是細麵六分之一伊法，並油三分之一欣，為常獻的素祭，這在耶和華面前是永遠的定例。
46:15 這樣，每早晨要獻羊羔、素祭，並油，為常獻的燔祭。
46:16 主耶和華如此說：王若將產業賜給他的兒子，這產業要歸他的兒子，是屬他們的業，是可以承受為業的。
46:17 但王若將產業賜給他的臣僕，這產業要歸臣僕到自由之年；以後還要歸王；王的產業只可傳給他的兒子。
46:18 王不可奪取民的產業，不可侵佔他們的地業；他要從自己的地業中，把產業賜給他的兒子，免得我的民離散，各人失去他的地業。
46:19 他帶我從門旁的門口進入祭司的聖房，就是朝北的聖房，在那裡有一個地方靠著西邊。
46:20 他對我說：這是祭司煮贖愆祭、贖罪祭，並烤素祭之地，免得帶到外院，在民中使人成聖。
46:21 他帶我出到外院，使我從院的四角走過；我見外院各角都有院子。
46:22 外院四角的院子，每院長四十肘，寬三十肘，這四個角上的院子量度一樣。
46:23 這四個院子四圍有牆，牆根有煮食的地方。
46:24 他對我說：這是廚房，殿的侍役在這裡煮百姓的祭物。`,

  '6/28': `47:1 他帶我回到殿門，見殿的門檻以下有水往東流出（原來殿面朝東），水從殿的右邊、祭壇的南邊流出。
47:2 他帶我從北門出去，由外道帶我到朝東的外門，見水從右邊流出。
47:3 那人往東出去，手拿準繩，量了一千肘，使我從水中過去，水深到踝子骨。
47:4 他又量了一千肘，使我從水中過去，水深到膝；又量了一千肘，使我過去，水深到腰；
47:5 又量了一千肘，水深成河，使我不能過去，因為水勢甚深，成了可以游泳、不可走過去的水。
47:6 他對我說：人子啊，你看見了甚麼？他就帶我回到河邊。
47:7 我回到河邊，見在河的兩岸有極多的樹木。
47:8 他對我說：這水往東方去，流下到亞拉巴，直到海；所發出來的水流到海裡，海中的水就必得醫治。
47:9 這河所到之處，凡滋生的動物都必生活，並且因這水流到那裡，海中的魚也甚多，因為這水到那裡，海水就變甜了；這河所到之處，百物都必生活。
47:10 必有漁夫站在河邊，從隱基底直到隱以革蓮，都作曬網之處；那裡的魚各從其類，好像大海的魚甚多。
47:11 只是沼澤和窪地不得治好，要留為出鹽之所。
47:12 在河的兩岸，各樣結果子的樹，枝葉都不枯乾，果子也不斷絕，每月都結新果子，因為這水是從聖所流出來的；其上的果子作食物，其葉子作藥材。
47:13 主耶和華如此說：以色列十二支派分地業為業，要以這地為界；約瑟要得兩分。
47:14 你們要彼此平分，我曾舉手起誓，應許將這地給你們的列祖，這地必歸你們為業。
47:15 這地的四界：北邊從大海，走哈特隆路，到西達達，
47:16 哈末，比羅他，示巴臨（在大馬色和哈末境界之間），以及豪蘭境界的哈薩亥提根。
47:17 所以北界從大海到哈薩以難，北邊以大馬色地，南邊以哈末地為界，這是北界。
47:18 東邊從豪蘭、大馬色，並基列，以色列地中間，以約旦河為界，從北界量起，直到東海，這是東界。
47:19 南邊從他瑪到米利巴加低斯的水，再到埃及小河，直到大海，這是南界。
47:20 西邊就是大海，從南界到哈末的正對面，這是西界。
47:21 你們要按以色列的各支派，將這地在你們中間分了。
47:22 你們要拈鬮，將這地分給你們自己和寄居在你們中間、在你們中間生了兒女的外人為業；他們在以色列人中與你們一同算為本地人，要與你們一同在以色列支派中分地為業。
47:23 外人寄居在哪支派中，你們就在那裡分地給他，這是主耶和華說的。`,

  '7/1': `1:1 耶穌基督的僕人保羅，奉召為使徒，特派傳神的福音。
1:2 這福音是神從前藉眾先知在聖經上所應許的，
1:3 論到他兒子我主耶穌基督；按肉體說，是從大衛後裔生的；
1:4 按聖善的靈說，因從死裡復活，以大能顯明是神的兒子。
1:5 我們從他受了恩惠並使徒的職分，在萬國之中叫人為他的名信服真道；
1:6 其中也有你們這蒙召屬耶穌基督的人。
1:7 我寫信給你們在羅馬、蒙神愛、奉召作聖徒的眾人。願恩惠、平安從我們的父神並主耶穌基督歸與你們！
1:8 第一，我靠著耶穌基督，為你們眾人感謝我的神，因為你們的信德傳遍了天下。
1:9 我在福音上用心靈事奉神的，他可以見證我怎樣不住的提到你們，
1:10 在禱告之間常常懇求，或者照神的旨意，終能得平坦的道路往你們那裡去。
1:11 因為我切切地想見你們，要把些屬靈的恩賜分給你們，使你們可以堅固；
1:12 這樣，我在你們中間，因你我彼此的信心，可以同得安慰。
1:13 弟兄們，我不願意你們不知道，我屢次定意往你們那裡去，要在你們中間得些果子，如同在其餘的外邦人中一樣，只是到如今仍有阻隔。
1:14 無論是希臘人、化外人、聰明人、愚拙人，我都欠他們的債，
1:15 所以情願盡我的力量，將福音也傳給你們在羅馬的人。
1:16 我不以福音為恥；這福音本是神的大能，要救一切相信的，先是猶太人，後是希臘人。
1:17 因為神的義正在這福音上顯明出來；這義是本於信，以至於信。如經上所記：「義人必因信得生。」
1:18 原來，神的忿怒從天上顯明在一切不虔不義的人身上，就是那些行不義阻擋真理的人。
1:19 神的事情，人所能知道的，原顯明在人心裡，因為神已經給他們顯明。
1:20 自從造天地以來，神的永能和神性是明明可知的，雖是眼不能見，但藉著所造之物就可以曉得，叫人無可推諉。
1:21 因為，他們雖然知道神，卻不當作神榮耀他，也不感謝他，他們的思念變為虛妄，無知的心就昏暗了。
1:22 自稱為聰明，反成了愚拙，
1:23 將不能朽壞之神的榮耀變為偶像，彷彿必朽壞的人和飛禽、走獸、昆蟲的樣式。
1:24 所以，神任憑他們逞著心裡的情慾行污穢的事，以致彼此玷辱自己的身體。
1:25 他們將神的真實變為虛謊，去敬拜事奉受造之物，不敬奉那造物的主；主乃是可稱頌的，直到永遠。阿們！
1:26 因此，神任憑他們放縱可羞恥的情慾。他們的女人把順性的用處變為逆性的用處；
1:27 男人也是如此，棄了女人順性的用處，慾火攻心，彼此貪戀，男和男行可羞恥的事，就在自己身上受這妄為當得的報應。
1:28 他們既然故意不認識神，神就任憑他們存邪僻的心，行那些不合理的事；
1:29 裝滿了各樣不義、邪惡、貪婪、惡毒；滿心是嫉妒、兇殺、爭競、詭詐、毒恨；
1:30 又是讒毀的、背後說人的、怨恨神的、侮慢人的、狂傲的、自誇的、捏造惡事的、違背父母的、
1:31 無知的、背約的、無親情的、不憐憫人的。
1:32 他們雖知道神判定行這樣事的人是當死的，然而他們不但自己去行，還喜歡別人去行。`,

  '7/2': `2:1 你這論斷人的，無論你是誰，也無可推諉。你在甚麼事上論斷人，就在甚麼事上定自己的罪；因你這論斷人的，自己所行卻和別人一樣。
2:2 我們知道這樣行的人，神必照真理審判他。
2:3 你這人哪，你論斷行這樣事的人，自己所行的卻和別人一樣，你以為能逃脫神的審判嗎？
2:4 還是你藐視他豐富的恩慈、寬容、忍耐，不曉得他的恩慈是領你悔改呢？
2:5 你竟任著你剛硬不悔改的心，為自己積蓄忿怒，以致神震怒、顯他公righteous審判的日子來到。
2:6 他必照各人的行為報應各人：
2:7 凡恆心行善、尋求榮耀、尊貴和不能朽壞之福的，就以永生報應他們；
2:8 惟有結黨、不順從真理、反順從不義的，就以忿怒、惱恨報應他們；
2:9 將患難、困苦加給一切作惡的人，先是猶太人，後是希臘人；
2:10 卻將榮耀、尊貴、平安加給一切行善的人，先是猶太人，後是希臘人。
2:11 因為神不偏待人。
2:12 凡沒有律法犯了罪的，也必不按律法滅亡；凡在律法以下犯了罪的，也必按律法受審判。
2:13 原來在神面前，不是聽律法的為義，乃是行律法的稱義。
2:14 沒有律法的外邦人若順著本性行律法上的事，他們雖然沒有律法，自己就是自己的律法。
2:15 這是顯出律法的功用刻在他們心裡，他們是非之心同作見證，並且他們的思念互相較量，或以為是，或以為非。
2:16 就在神藉耶穌基督審判人隱祕事的日子，照我的福音所言。
2:17 你稱為猶太人，又倚靠律法，並以歸於神為誇；
2:18 又曉得神的旨意，並能分別是非，是受過律法教訓的；
2:19 又深信自己是給瞎子領路的，是黑暗中人的光，
2:20 是蠢笨人的師傅，是小孩子的先生，在律法上有知識和真理的模範。
2:21 你既是教導別人，還不教導自己嗎？你講說人不可偷竊，自己還偷竊嗎？
2:22 你說人不可姦淫，自己還姦淫嗎？你厭惡偶像，自己還偷竊廟中之物嗎？
2:23 你以律法自誇，自己倒犯律法，藐視神嗎？
2:24 神的名在外邦人中，因你們受了褻瀆，正如經上所記的。
2:25 你若行律法，割禮固然於你有益；若犯了律法，你的割禮就算沒有割禮。
2:26 所以那未受割禮的，若遵守律法的條例，他雖然未受割禮，豈不算是有割禮嗎？
2:27 而且那本來未受割禮的，若能全守律法，豈不是要審判你這有儀文和割禮竟犯律法的人嗎？
2:28 因為外面是猶太人的，不是真猶太人；外面肉身的割禮，也不是真割禮。
2:29 惟有裡面是猶太人的，才是真猶太人；真割禮也是心裡的，在乎靈，不在乎儀文。這人的稱讚不是從人來的，乃是從神來的。`,

  '7/3': `3:1 這樣說來，猶太人有甚麼長處？割禮有甚麼益處呢？
3:2 凡事大有好處：第一是神的聖言交託他們。
3:3 即便有不信的，這有何妨呢？難道他們的不信就廢掉神的信嗎？
3:4 斷乎不能！不如說，神是真實的，人都是虛謊的。如經上所記：「你責備人的時候，顯為公義；被人議論的時候，可以得勝。」
3:5 我們的不義若顯出神的義來，我們可以怎麼說呢？神降怒，是他不義嗎？（我說的是人的常話。）
3:6 斷乎不能！若是這樣，神怎能審判世界呢？
3:7 若神的真實，因我的虛謊越發顯出他的榮耀，為甚麼我還受審判，好像罪人呢？
3:8 為甚麼不說「我們可以作惡以成善呢？」——這是謗讟我們的人說我們有這意思。這等人受罰是該當的。
3:9 這卻怎麼樣呢？我們比他們強嗎？決不是的！因我們已經證明，猶太人和希臘人都在罪惡之下。
3:10 就如經上所記：「沒有義人，連一個也沒有。
3:11 沒有明白的；沒有尋求神的；
3:12 都是偏離正路，一同變為無用。沒有行善的，連一個也沒有。
3:13 他們的喉嚨是敞開的墳墓；他們用舌頭弄詭詐；嘴唇裡有虺蛇的毒氣；
3:14 滿口是咒罵苦毒。
3:15 殺人流血，他們的腳飛跑；
3:16 所經過的路便行殘害暴虐的事；
3:17 平安的路他們沒有走過；
3:18 他們眼中不怕神。」
3:19 我們曉得律法上的話都是對律法以下之人說的，好塞住各人的口，叫普世的人都伏在神審判之下；
3:20 所以凡有血氣的，沒有一個因行律法能在神面前稱義，因為律法本是叫人知罪。
3:21 但如今，神的義在律法以外已經顯明出來，有律法和先知為證：
3:22 就是神的義，因信耶穌基督加給一切相信的人，並沒有分別。
3:23 因為世人都犯了罪，虧缺了神的榮耀；
3:24 如今卻蒙神的恩典，因基督耶穌的救贖，就白白地稱義。
3:25 神設立耶穌作挽回祭，是憑著耶穌的血，藉著人的信，要顯明神的義；因為他用忍耐的心寬容人先時所犯的罪，
3:26 好在今時顯明他的義，使人知道他自己為義，也稱信耶穌的人為義。
3:27 既是這樣，哪裡能誇口呢？沒有可誇的了。用何法沒有的呢？是用立功之法嗎？不是，乃用信主之法。
3:28 所以我們看定了：人稱義是因著信，不在乎遵行律法。
3:29 難道神只作猶太人的神嗎？不也是作外邦人的神嗎？是的，也作外邦人的神。
3:30 神是一位；他要因信稱那受割禮的為義，也要因信稱那未受割禮的為義。
3:31 這樣，我們因信廢了律法嗎？斷乎不是！更是堅固律法。`,

  '7/4': `4:1 如此說來，我們的祖宗亞伯拉罕憑著肉體得了甚麼呢？
4:2 倘若亞伯拉罕是因行為稱義，就有可誇的；只是在神面前並無可誇。
4:3 經上說甚麼呢？說：「亞伯拉罕信神，這就算為他的義。」
4:4 做工的得工價，不算恩典，乃是該得的；
4:5 惟有不做工的，只信稱罪人為義的神，他的信就算為義。
4:6 正如大衛稱那在行為以外蒙神算為義的人是有福的。
4:7 他說：「得赦免其過、遮蓋其罪的，這人是有福的。
4:8 主不算為有罪的，這人是有福的。」
4:9 如此說來，這福是單加給那受割禮的人嗎？還是也加給那未受割禮的人呢？我們說：「亞伯拉罕的信，是算為他的義。」
4:10 是怎麼算的呢？是在他受割禮的時候呢？還是在他未受割禮的時候呢？不是在受割禮的時候，乃是在未受割禮的時候。
4:11 並且他受了割禮的記號，作他未受割禮的時候因信稱義的印證，叫他作一切未受割禮而信之人的父，使他們也算為義；
4:12 又作受割禮之人的父，就是那些不但受割禮，並且按我們的祖宗亞伯拉罕未受割禮而有的那種信心去行事為人的人。
4:13 因為神應許亞伯拉罕和他後裔，必得承受世界，這不是因律法，乃是因信而得的義。
4:14 若是屬乎律法的人才得為後嗣，信就歸於虛空，應許也就廢棄了；
4:15 因為律法是惹動忿怒的（在沒有律法的地方，也就沒有過犯）。
4:16 所以人得為後嗣是本乎信，因此就屬乎恩，叫應許對亞伯拉罕一切後裔都堅定，不但對那屬乎律法的，也對那效法亞伯拉罕之信的。
4:17 亞伯拉罕所信的，是那叫死人復活、使無變為有的神，他在主面前作我們世人的父。如經上所記：「我已經立你作多國的父。」
4:18 他在無可指望的時候，因信仍有指望，就得以作多國的父，正如先前所說：「你的後裔將要如此。」
4:19 他將近百歲的時候，雖然想到自己的身體如同已死，撒拉的生育已經斷絕，他的信心還是不軟弱；
4:20 並且仰望神的應許，總沒有因不信心裡起疑惑，反倒因信心裡得堅固，將榮耀歸給神，
4:21 且滿心相信神所應許的必能做到。
4:22 所以，這就算為他的義。
4:23 「算為他義」這句話，不是單為他寫的，
4:24 也是為我們將來得算為義之人寫的，就是我們這信神使我們的主耶穌從死裡復活的人。
4:25 耶穌被交給人，是為我們的過犯；復活，是為叫我們稱義。`,

  '7/5': `5:1 我們既因信稱義，就藉著我們的主耶穌基督得與神相和。
5:2 我們又藉著他，因信得進入現在所站的這恩典中，並且歡歡喜喜盼望神的榮耀。
5:3 不但如此，就是在患難中也是歡歡喜喜的；因為知道患難生忍耐，
5:4 忍耐生老練，老練生盼望；
5:5 盼望不至於羞恥，因為所賜給我們聖靈將神的愛澆灌在我們心裡。
5:6 因我們還軟弱的時候，基督就按所定的日期為罪人死。
5:7 為義人死，是少有的；為仁人死，或者有敢做的。
5:8 惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。
5:9 現在我們既靠著他的血稱義，就更要藉著他免去神的忿怒。
5:10 因為我們作仇敵的時候，且藉著神兒子的死，得與神和好；既已和好，就更要因他的生得救了。
5:11 不但如此，我們既藉著我主耶穌基督得與神和好，也就藉著他以神為樂。
5:12 這就如罪是從一人入了世界，死又是從罪來的，於是死就臨到眾人，因為眾人都犯了罪。
5:13 沒有律法之先，罪已經在世上；但沒有律法，罪也不算罪。
5:14 然而從亞當到摩西，死就作了王，連那些不與亞當犯一樣罪過的，也在他的權下。亞當乃是那以後來之人的預像。
5:15 只是過犯不如恩賜，若因一人的過犯，眾人都死了，何況神的恩典與那因耶穌基督一人恩典中的賞賜，豈不更加倍地臨到眾人嗎？
5:16 因一人犯罪就定罪，也不如恩賜，原來審判是由一人而定罪，恩賜乃是由許多過犯而稱義。
5:17 若因一人的過犯，死就藉著這一人作了王，何況那些受洪恩又蒙所賜之義的，豈不更要藉著耶穌基督一人在生命中作王嗎？
5:18 如此說來，因一次的過犯，眾人都被定罪；照樣，因一次的義行，眾人也就被稱義得生命了。
5:19 因一人的悖逆，眾人成為罪人；照樣，因一人的順從，眾人也成為義了。
5:20 律法本是外添的，叫過犯顯多；只是罪在哪裡顯多，恩典就更顯多了；
5:21 叫罪作王是在死中，照樣，恩典也藉著義作王，叫人因我們的主耶穌基督得永生。`,

  '7/6': `6:1 這樣，我們可以繼續在罪中，叫恩典顯多嗎？
6:2 斷乎不可！我們在罪上死了的人豈可仍在罪中活著呢？
6:3 豈不知我們這受洗歸入基督耶穌的人，是受洗歸入他的死嗎？
6:4 所以，我們藉著洗禮歸入死，和他一同埋葬，原是叫我們一舉一動有新生的樣式，像基督藉著父的榮耀從死裡復活一樣。
6:5 我們若在他死的形狀上與他聯合，也要在他復活的形狀上與他聯合；
6:6 因為知道我們的舊人和他同釘十字架，使罪身滅絕，叫我們不再作罪的奴僕；
6:7 因為已死的人是脫離了罪。
6:8 我們若是與基督同死，就信必與他同活；
6:9 因為知道基督既從死裡復活，就不再死，死也不再作他的主了。
6:10 他死是向罪死了，只有一次；他活是向神活著。
6:11 這樣，你們向罪也當看自己是死的；向神在基督耶穌裡，卻當看自己是活的。
6:12 所以，不要容罪在你們必死的身上作王，使你們順從身子的私慾；
6:13 也不要將你們的肢體獻給罪作不義的器具；倒要像從死裡復活的人，將自己獻給神，並將肢體作義的器具獻給神。
6:14 罪必不能作你們的主；因你們不在律法之下，乃在恩典之下。
6:15 這卻怎麼樣呢？我們在恩典之下，不在律法之下，就可以犯罪嗎？斷乎不可！
6:16 你們豈不曉得，你們獻自己作奴僕，順從誰，就作誰的奴僕嗎？或作罪的奴僕，以至於死；或作順命的奴僕，以至成義。
6:17 感謝神！因為你們從前雖然作罪的奴僕，現在卻從心裡順服了所傳給你們道理的模範。
6:18 你們既從罪裡得了釋放，就作了義的奴僕。
6:19 我因你們肉體的軟弱，就照人的常話對你們說。你們從前怎樣將肢體獻給不潔不法作奴僕，以至於不法；現在也要照樣將肢體獻給義作奴僕，以至於成聖。
6:20 你們作罪之奴僕的時候，就不被義約束了。
6:21 你們現在因所作的事有甚麼果子呢？那些事的結局就是死，你們現在以那些事為恥了。
6:22 但現在，你們既從罪裡得了釋放，作了神的奴僕，就有成聖的果子，那結局就是永生。
6:23 因為罪的工價乃是死；惟有神的恩賜，在我們的主基督耶穌裡，乃是永生。`,

  '7/7': `7:1 弟兄們，我現在對明白律法的人說，你們豈不曉得律法管人是在活著的時候嗎？
7:2 就如女人有了丈夫，丈夫還活著，就被律法約束；丈夫若死了，就脫離了丈夫的律法。
7:3 所以丈夫活著，她若歸於別人，便叫淫婦；丈夫若死了，她就脫離了丈夫的律法，雖然歸於別人，也不是淫婦了。
7:4 我的弟兄們，這樣說來，你們藉著基督的身體，在律法上也是死了，叫你們歸於別人，就是歸於那從死裡復活的，叫我們結果子給神。
7:5 因為我們屬肉體的時候，那藉著律法的惡慾就在我們肢體中發動，結成死亡的果子。
7:6 但我們既然在捆我們的律法上死了，現今就脫離了律法，叫我們服事主，要按著心靈的新樣，不按著儀文的舊樣。
7:7 這樣，我們可說甚麼呢？律法是罪嗎？斷乎不是！只是非因律法，我就不知何為罪。非律法說「不可起貪心」，我就不知何為貪心。
7:8 然而罪趁著機會，就藉著誡命叫諸般的貪心在我裡頭發動；因為沒有律法，罪是死的。
7:9 我以前沒有律法是活著的；但是誡命來到，罪又活了，我就死了。
7:10 那本來叫人活的誡命，反倒叫我死；
7:11 因為罪趁著機會，就藉著誡命引誘我，並且殺了我。
7:12 這樣看來，律法是聖潔的，誡命也是聖潔、公義、良善的。
7:13 既然如此，那良善的是叫我死嗎？斷乎不是！叫我死的乃是罪。但罪藉著那良善的叫我死，就顯出真是罪，叫罪因著誡命更顯出是惡極了。
7:14 我們原曉得律法是屬乎靈的，但我是屬乎肉體的，是已經賣給罪了。
7:15 因為我所做的，我自己不明白；我所願意的，我並不做；我所恨惡的，我倒去做。
7:16 若我所做的，是我所不願意的，我就應承律法是善的。
7:17 既是這樣，做這事的就不再是我，乃是住在我裡頭的罪。
7:18 我也知道在我裡頭，就是我肉體之中，沒有良善。因為，立志為善由得我，只是行出來由不得我。
7:19 故此，我所願意的善，我反不做；我所不願意的惡，我倒去做。
7:20 若我去做所不願意做的，就不再是我做，乃是住在我裡頭的罪做的。
7:21 我覺得有個律，就是我願意為善的時候，便有惡與我同在。
7:22 因為按著我裡面的意思，我是喜歡神的律；
7:23 但我覺得肢體中另有個律和我心中的律交戰，把我擄去，叫我附從那肢體中犯罪的律。
7:24 我真是苦啊！誰能救我脫離這取死的身體呢？
7:25 感謝神，靠著我們的主耶穌基督就能脫離了。這樣看來，我以內心順服神的律，我肉體卻順服罪的律了。`,

  '7/8': `8:1 如今，那些在基督耶穌裡的就不定罪了。
8:2 因為賜生命聖靈的律，在基督耶穌裡釋放了我，使我脫離罪和死的律了。
8:3 律法既因肉體軟弱，有所不能行的，神就差遣自己的兒子，成為罪身的形狀，作了贖罪祭，在肉體中定了罪案，
8:4 使律法的義成就在我們這不隨從肉體、只隨從聖靈的人身上。
8:5 因為隨從肉體的人體貼肉體的事，隨從聖靈的人體貼聖靈的事。
8:6 體貼肉體的，就是死；體貼聖靈的，乃是生命、平安。
8:7 原來體貼肉體的，就是與神為仇；因為不服神的律法，也是不能服，
8:8 而且屬肉體的人不能得神的喜歡。
8:9 如果神的靈住在你們心裡，你們就不屬肉體，乃屬聖靈了。人若沒有基督的靈，就不是屬基督的。
8:10 基督若在你們心裡，身體就因罪而死，心靈卻因義而活。
8:11 然而叫耶穌從死裡復活者的靈若住在你們心裡，那叫基督耶穌從死裡復活的，也必藉著住在你們心裡的聖靈，使你們必死的身體又活過來。
8:12 弟兄們，這樣看來，我們並不是欠肉體的債去順從肉體活著。
8:13 你們若順從肉體活著，必要死；若靠著聖靈治死身體的惡行，必要活著。
8:14 因為凡被神的靈引導的，都是神的兒子。
8:15 你們所受的，不是奴僕的心，仍舊害怕；所受的，乃是兒子的心，因此我們呼叫：「阿爸！父！」
8:16 聖靈與我們的心同證我們是神的兒女；
8:17 既是兒女，便是後嗣，就是神的後嗣，和基督同作後嗣。如果我們和他一同受苦，也必和他一同得榮耀。
8:18 我想現在的苦楚若比起將來要顯於我們的榮耀，就不足介意了。
8:19 受造之物切望等候神的眾子顯出來。
8:20 因為受造之物服在虛空之下，不是自己願意，乃是因那叫他如此的。
8:21 但受造之物仍然指望脫離敗壞的轄制，得享神兒女自由的榮耀。
8:22 我們知道一切受造之物一同歎息、勞苦，直到如今。
8:23 不但如此，就是我們這有聖靈初結果子的，也是自己心裡歎息，等候得著兒子的名分，乃是我們的身體得贖。
8:24 我們得救是在乎盼望；只是所見的盼望不是盼望，誰還盼望他所見的事呢？
8:25 但我們若盼望那所不見的事，就必忍耐等候。
8:26 況且，我們的軟弱有聖靈幫助，我們本不曉得當怎樣禱告，只是聖靈親自用說不出來的歎息替我們禱告。
8:27 鑒察人心的，曉得聖靈的意思，因為聖靈照著神的旨意替聖徒祈求。
8:28 我們曉得萬事都互相效力，叫愛神的人得益處，就是按他旨意被召的人。
8:29 因為他預先所知道的人，就預先定下效法他兒子的模樣，使他兒子在許多弟兄中作長子。
8:30 預先所定下的人又召他們來；所召來的人又稱他們為義；所稱為義的人又叫他們得榮耀。
8:31 既是這樣，還有甚麼說的呢？神若幫助我們，誰能敵擋我們呢？
8:32 神既不愛惜自己的兒子，為我們眾人捨了，豈不也把萬物和他一同白白地賜給我們嗎？
8:33 誰能控告神所揀選的人呢？有神稱他們為義了。
8:34 誰能定他們的罪呢？有基督耶穌已經死了，而且從死裡復活，現今在神的右邊，也替我們祈求。
8:35 誰能使我們與基督的愛隔絕呢？難道是患難嗎？是困苦嗎？是逼迫嗎？是飢餓嗎？是赤身露體嗎？是危險嗎？是刀劍嗎？
8:36 如經上所記：「我們為你的緣故終日被殺；人看我們如將宰的羊。」
8:37 然而，靠著愛我們的主，在這一切的事上已經得勝有餘了。
8:38 因為我深信無論是死，是生，是天使，是掌權的，是有能的，是現在的事，是將來的事，
8:39 是高處的，是低處的，是別的受造之物，都不能叫我們與神的愛隔絕；這愛是在我們的主基督耶穌裡的。`,

  '7/9': `9:1 我在基督裡說真話，並不謊言，有我的良心被聖靈感動，給我作見證：
9:2 我是大有憂愁，心裡時常傷痛；
9:3 為我弟兄，我骨肉之親，就是自己被咒詛，與基督分離，我也願意。
9:4 他們是以色列人；那兒子的名分、榮耀、諸約、律法、禮儀、應許都是他們的。
9:5 列祖就是他們的祖宗；按肉體說，基督也是從他們出來的，他是在萬有之上，永遠可稱頌的神。阿們！
9:6 這不是說神的話落了空。因為從以色列生的，不都是以色列人；
9:7 也不因為是亞伯拉罕的後裔，就都作他的兒女；惟獨「從以撒生的，才要稱為你的後裔。」
9:8 這就是說，肉身所生的兒女不是神的兒女，惟獨那應許的兒女才算是後裔。
9:9 因為所應許的話是這樣說：「到明年這時候我要來，撒拉必生一個兒子。」
9:10 不但如此，還有利百加，既從一個人，就是從我們的祖宗以撒懷了孕，
9:11 雙子還沒有生下來，善惡還沒有做出來，為要顯明神揀選人的旨意，不在乎人的行為，乃在乎召人的主，
9:12 神就對利百加說：「將來大的要服事小的。」
9:13 正如經上所記：「雅各是我所愛的，以掃是我所惡的。」
9:14 這樣，我們可說甚麼呢？難道神有不公平的地方嗎？斷乎沒有！
9:15 因他對摩西說：「我要憐憫誰，就憐憫誰；要恩待誰，就恩待誰。」
9:16 據此看來，這不在乎那定意的，也不在乎那奔跑的，只在乎發憐憫的神。
9:17 因為經上有話向法老說：「我將你興起來，特要在你身上彰顯我的權能，並要使我的名傳遍天下。」
9:18 如此看來，神要憐憫誰，就憐憫誰；要叫誰剛硬，就叫誰剛硬。
9:19 這樣，你必對我說：「他為甚麼還指責人呢？有誰抗拒他的旨意呢？」
9:20 你這個人哪，你是誰，竟敢向神強嘴呢？受造之物豈能對造他的說：「你為甚麼這樣造我呢？」
9:21 窯匠難道沒有權柄從一團泥裡拿一塊做成貴重的器皿，又拿一塊做成卑賤的器皿嗎？
9:22 倘若神要顯明他的忿怒，彰顯他的權能，就多多忍耐寬容那可怒、預備遭毀滅的器皿，
9:23 又要將他豐盛的榮耀彰顯在那蒙憐憫、早預備得榮耀的器皿上，這有何不可呢？
9:24 這器皿就是我們被神所召的，不但是從猶太人中召來，也從外邦人中召來的。
9:25 就如神在何西阿書上說：「那本來不是我子民的，我要稱為我的子民；本來不是蒙愛的，我要稱為蒙愛的。」
9:26 「從前在甚麼地方對他們說，你們不是我的子民，將來就在那裡稱他們為永生神的兒子。」
9:27 以賽亞指著以色列人喊著說：「以色列人雖多如海沙，得救的不過是剩下的餘數；
9:28 因為主要在地上施行他的話，叫他的話都成全，速速地完結。」
9:29 又如以賽亞先前說過：「若不是萬軍之主給我們留下餘種，我們早已像所多瑪，蛾摩拉的樣子了。」
9:30 這樣說來，我們可說甚麼呢？那本來不追求義的外邦人反得了義，就是因信而得的義；
9:31 以色列人追求律法的義，反得不著律法的義。
9:32 這是甚麼緣故呢？是因為他們不憑著信心求，只憑著行為求，他們正跌在那絆腳石上。
9:33 就如經上所記：「我在錫安放一塊絆腳的石頭，跌人的磐石；信靠他的人必不至於羞愧。」`,

  '7/10': `10:1 弟兄們，我心裡所願的，向神所求的，是要以色列人得救。
10:2 我可以證明他們向神有熱心，但不是按著真知識；
10:3 因為他們不知道神的義，想要立自己的義，就不服神的義了。
10:4 律法的總結就是基督，使凡信他的都得著義。
10:5 摩西寫著說：「人若行那出於律法的義，就必因此活著。」
10:6 惟有出於信心的義如此說：「你不要心裡說：誰要升到天上去呢？」（就是要領基督降下來；）
10:7 「誰要下到陰間去呢？」（就是要領基督從死裡上來。）
10:8 他到底怎麼說呢？「這道離你不遠，正在你口裡，在你心裡」（就是我們所傳信主的道）。
10:9 你若口裡認耶穌為主，心裡信神叫他從死裡復活，就必得救；
10:10 因為人心裡相信，就可以稱義；口裡承認，就可以得救。
10:11 經上說：「凡信他的人必不至於羞恥。」
10:12 猶太人和希臘人並沒有分別，因為眾人同有一位主，他也厚待一切求告他的人。
10:13 因為「凡求告主名的，就必得救。」
10:14 然而，人未曾信他，怎能求他呢？未曾聽見他，怎能信他呢？沒有傳道的，怎能聽見呢？
10:15 若沒有奉差遣，怎能傳道呢？如經上所記：「報福音、傳喜信的人，他們的腳蹤何等佳美！」
10:16 只是人沒有都聽從福音，因為以賽亞說：「主啊，我們所傳的有誰信呢？」
10:17 可見信道是從聽道來的，聽道是從基督的話來的。
10:18 但我說，他們沒有聽見嗎？誠然聽見了。「他們的聲音傳遍天下，他們的言語傳到地極。」
10:19 但我說，以色列人不知道嗎？先有摩西說：「我要用那不成子民的，惹動你們的憤恨；我要用那無知的民，惹動你們的怒氣。」
10:20 又有以賽亞放膽說：「沒有尋找我的，我叫他們遇見；沒有訪問我的，我向他們顯現。」
10:21 至於以色列人，他說：「我整天伸手招呼那悖逆頂嘴的百姓。」`,

  '7/11': `11:1 我且說，神棄絕了他的百姓嗎？斷乎沒有！因為我也是以色列人，亞伯拉罕的後裔，便雅憫支派的人。
11:2 神並沒有棄絕他預先所知道的百姓。你們豈不曉得經上論到以利亞是怎麼說的呢？他在神面前怎樣控告以色列人說：
11:3 「主啊，他們殺了你的先知，拆了你的壇，只剩下我一個人，他們還要尋索我的命。」
11:4 神的回話是怎麼說的呢？說：「我為自己留下七千人，是未曾向巴力屈膝的。」
11:5 如今也是這樣，照著揀選的恩典，還有餘數。
11:6 既是出於恩典，就不在乎行為，不然，恩典就不是恩典了。
11:7 這樣說來，怎麼樣呢？以色列人所求的，他們沒有得著，惟有蒙揀選的人得著了，其餘的就成了頑梗不化的，
11:8 正如經上所記：「神給他們昏迷的心，眼睛不能看見，耳朵不能聽見，直到今日。」
11:9 大衛說：「願他們的筵席變為網羅，變為機檻，變為絆腳石，作他們的報應；
11:10 願他們的眼睛昏蒙，不得看見，願他們的腰常常彎曲。」
11:11 我且說，他們失腳，是要他們跌倒嗎？斷乎不是！反倒因他們的過失，救恩便臨到外邦人，要激動以色列人發憤。
11:12 若他們的過失，為天下的富足；他們的缺乏，為外邦人的富足；何況他們的豐滿呢？
11:13 我對你們外邦人說這話，因我是外邦人的使徒，所以敬重我的職分，
11:14 或者可以激動我骨肉之親發憤，可以救他們一些人。
11:15 若他們被丟棄，天下就得與神和好；他們被收納，豈不是死而復生嗎？
11:16 所獻的頭一塊麵若是聖潔，全團也就聖潔了；樹根若是聖潔，樹枝也就聖潔了。
11:17 若有幾根枝子被折下來，你這野橄欖得接在其中，一同得著橄欖根的肥汁，
11:18 你就不可向那些枝子誇口；若是誇口，當知道不是你托著根，乃是根托著你。
11:19 你若說：「那枝子被折下來，是特為讓我接上。」
11:20 不錯！他們因為不信，所以被折下來；你因為信，所以立得住。你不可自高，反要懼怕；
11:21 神既不愛惜原來的枝子，也必不愛惜你。
11:22 可見神的恩慈和嚴厲：向那跌倒的人是嚴厲的，向你是有恩慈的，只要你長久在他的恩慈裡；不然，你也要被砍下來。
11:23 而且他們若不是長久不信，仍要被接上；因為神能夠把他們重新接上。
11:24 你是從那天生的野橄欖上砍下來的，尚且逆著性得接在好橄欖上，何況這本樹的枝子，要接在本樹上呢！
11:25 弟兄們，我不願意你們不知道這奧祕（恐怕你們自以為聰明），就是以色列人有幾分是硬心的，等到外邦人的數目添滿了，
11:26 於是以色列全家都要得救。如經上所記：「必有一位救主從錫安出來，要消除雅各家的不虔不敬；
11:27 我除去他們罪的時候，這就是我與他們所立的約。」
11:28 就著福音說，他們為你們的緣故是仇敵；就著揀選說，他們為列祖的緣故是蒙愛的。
11:29 因為神的恩賜和選召是沒有後悔的。
11:30 你們從前不順從神，如今因他們的不順從，你們倒蒙了憐憫；
11:31 這樣，他們也是不順從，叫他們因著施給你們的憐憫，現在也就蒙憐憫。
11:32 因為神將眾人都圈在不順從之中，特意要憐憫眾人。
11:33 深哉，神豐富的智慧和知識！他的判斷何其難測！他的蹤跡何其難尋！
11:34 誰知道主的心？誰作過他的謀士呢？
11:35 誰是先給了他，使他後來償還呢？
11:36 因為萬有都是本於他，倚靠他，歸於他。願榮耀歸給他，直到永遠。阿們！`,

  '7/12': `12:1 所以弟兄們，我以神的慈悲勸你們，將身體獻上，當作活祭，是聖潔的，是神所喜悅的；你們如此事奉乃是理所當然的。
12:2 不要效法這個世界，只要心意更新而變化，叫你們察驗何為神的善良、純全、可喜悅的旨意。
12:3 我憑著所賜我的恩，對你們各人說：不要看自己過於所當看的，要照著神所分給各人信心的大小，看得合乎中道。
12:4 正如我們一個身子上有好些肢體，肢體也不都是一樣的用處。
12:5 我們這許多人，在基督裡成為一身，互相聯絡作肢體，也是如此。
12:6 按我們所得的恩賜，各有不同。或說預言，就當照著信心的程度說預言；
12:7 或作執事，就當專一執事；或作教導的，就當專一教導；
12:8 或作勸化的，就當專一勸化；施捨的，就當誠實；治理的，就當殷勤；憐憫人的，就當甘心。
12:9 愛人不可虛假，惡要厭惡，善要親近。
12:10 愛弟兄，要彼此親熱；恭敬人，要彼此推讓。
12:11 殷勤，不可懶惰；要心裡火熱，常常服事主。
12:12 在指望中要喜樂；在患難中要忍耐；禱告要恆切。
12:13 聖徒缺乏，要幫補；客要一味地款待。
12:14 逼迫你們的，要給他們祝福；只要祝福，不可咒詛。
12:15 與喜樂的人要同樂；與哀哭的人要同哭。
12:16 要彼此同心；不要志氣高大，倒要俯就卑微的人；不要自以為聰明。
12:17 不要以惡報惡；眾人以為美的事，要留心去做。
12:18 若是能行，總要盡力與眾人和睦。
12:19 親愛的弟兄，不要自己伸冤，寧可讓步，聽憑主怒；因為經上記著：「主說，伸冤在我，我必報應。」
12:20 所以，「你的仇敵若餓了，就給他吃；若渴了，就給他喝；因為你這樣行，就是把炭火堆在他的頭上。」
12:21 你不可為惡所勝，反要以善勝惡。`,

  '7/13': `13:1 在上有權柄的，人人當順服他，因為沒有權柄不是出於神的，凡掌權的都是神所命的。
13:2 所以，抗拒掌權的就是抗拒神的命；抗拒的必自取刑罰。
13:3 作官的原不是叫行善的懼怕，乃是叫作惡的懼怕。你願意不懼怕掌權的嗎？你只要行善，就可得他的稱讚；
13:4 因為他是神的用人，是與你有益的。你若作惡，卻當懼怕，因為他不是空空地佩劍；他是神的用人，是伸冤的，刑罰那作惡的人。
13:5 所以你們必須順服，不但是因為刑罰，也是因為良心。
13:6 你們納糧，也為這個緣故；因為他們是神的差役，常常特管這事。
13:7 凡人所當得的，就給他：當得糧的，給他納糧；當得稅的，給他上稅；當懼怕的，懼怕他；當恭敬的，恭敬他。
13:8 凡事都不可虧欠人，惟有彼此相愛，要常以為虧欠；因為愛人的就完全了律法。
13:9 像那「不可姦淫」、「不可殺人」、「不可偷盜」、「不可貪婪」，或有別的誡命，都包在「愛人如己」這一句話之內了。
13:10 愛是不加害於人的，所以愛就完全了律法。
13:11 況且你們曉得現今就是該趁早睡醒的時候；因為我們得救，現今比初信的時候更近了。
13:12 黑夜已深，白晝將近；我們就當脫去暗昧的行為，帶上光明的兵器。
13:13 行事要端正，好像行在白晝；不可荒宴醉酒；不可好色邪蕩；不可爭競嫉妒。
13:14 總要披戴主耶穌基督，不要為肉體安排，去放縱私慾。`,

  '7/14': `14:1 信心軟弱的，你們要接納，但不要辯論所疑惑的事。
14:2 有人信百物都可吃；但那軟弱的，只吃蔬菜。
14:3 吃的人不可輕看不吃的人；不吃的人不可論斷吃的人；因為神已經收納他了。
14:4 你是誰，竟論斷別人的僕人呢？他或站住，或跌倒，自有他的主人在；而且他也必要站住，因為主能使他站住。
14:5 有人看這日比那日強；有人看日日都是一樣，只是各人心裡要有定見。
14:6 守日的人是為主守的；吃的人是為主吃的，因他感謝神；不吃的人是為主不吃的，也感謝神。
14:7 我們沒有一個人為自己活，也沒有一個人為自己死；
14:8 我們若活著，是為主而活；若死了，是為主而死。所以我們或活或死，總是主的人。
14:9 因此，基督死了，又活了，為要作死人並活人的主。
14:10 你這個人，為甚麼論斷弟兄呢？又為甚麼輕看弟兄呢？因為我們都要站在神的台前。
14:11 經上寫著：「主說，我憑著我的永生起誓：萬膝必向我跪拜；萬口必向我承認。」
14:12 這樣看來，我們各人必要將自己的事在神面前說明。
14:13 所以，我們不可再彼此論斷，寧可定意，誰也不給弟兄放下絆腳跌人之物。
14:14 我憑著主耶穌確知深信，凡物本來沒有不潔淨的；惟獨人以為不潔淨的，在他就不潔淨了。
14:15 你若因食物叫弟兄憂愁，就不是按著愛人的道理行。基督已經替他死了，你不可因你的食物叫他敗壞。
14:16 不可叫你的善被人毀謗；
14:17 因為神的國不在乎吃喝，只在乎公義、和平，並聖靈中的喜樂。
14:18 在這幾件事上服事基督的，就為神所喜悅，又為人所稱許。
14:19 所以，我們務要追求和睦的事與彼此建立德行的事。
14:20 不可因飲食毀壞神的工程。凡物固然潔淨，但有人因食物叫人跌倒，就是他的罪了。
14:21 無論是吃肉，是喝酒，是什麼別的事，叫弟兄跌倒，一概不做才好。
14:22 你有信心，就當在神面前守著。人在自己以為可行的事上能不自責，就有福了。
14:23 若有疑心而吃的，就必有罪，因為他吃不是出於信心；凡不出於信心的事都是罪。`,

  '7/15': `15:1 我們堅固的人應該擔代不堅固人的軟弱，不求自己的喜悅。
15:2 我們各人務要叫鄰舍喜悅，使他得益處，建立德行。
15:3 因為基督也不求自己的喜悅，如經上所記：「那些辱罵你人的辱罵都落在我身上了。」
15:4 從前所寫的聖經，都是為教訓我們寫的，叫我們因聖經所生的忍耐和安慰，可以得著盼望。
15:5 但願賜忍耐、安慰的神叫你們彼此同心，效法基督耶穌，
15:6 一心一口，榮耀神我們主耶穌基督的父。
15:7 所以你們要彼此接納，如同基督接納你們一樣，使榮耀歸與神。
15:8 我說，基督是為神真理作了受割禮人的執事，要證實所應許列祖的話，
15:9 並叫外邦人因他的憐憫，榮耀神。如經上所記：「因此，我要在外邦中稱謝你，歌頌你的名。」
15:10 又說：「你們外邦人當與主的百姓一同歡樂。」
15:11 又說：「你們外邦人當讚美主；萬民哪，當頌讚他。」
15:12 又有以賽亞說：「將來有耶西的根，就是那興起來治理外邦的；外邦人要仰望他。」
