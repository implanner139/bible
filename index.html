15:13 但願盼望的神，因信將諸般的喜樂、平安充滿你們的心，使你們藉著聖靈的能力大有盼望。
15:14 弟兄們，我自己也深信你們是滿有良善，充足了諸般的知識，也能彼此勸戒。
15:15 然而我寫信給你們，在幾件事上稍微放膽提醒你們，是因為神給我的恩典，
15:16 使我為外邦人作基督耶穌的執事，作神福音的祭司，叫所獻的外邦人，被聖靈成聖，可以稱為全然可獻的祭。
15:17 所以，我在基督耶穌裡，在神的事上，是可以誇口的。
15:18 除了基督藉我做的那些事，我甚麼都不敢提，只提他藉我言語作為，用神蹟奇事的能力，並聖靈的能力，使外邦人順服，
15:19 以至我從耶路撒冷，直轉到以利哩古，到處傳遍了基督的福音。
15:20 我立了志向，不在基督的名被稱過的地方傳福音，免得建造在別人的根基上，
15:21 卻如經上所記：「未曾聞知他信息的，將要看見；未曾聽過的，將要明白。」
15:22 我因多次被攔阻，總不得到你們那裡去。
15:23 但如今，在這一帶地方，再沒有可傳福音的地方，而且這好幾年，我切心渴望到西班牙去的時候，可以到你們那裡，
15:24 盼望從你們那裡經過，得見你們，先與你們彼此交往，心裡稍微滿足，然後蒙你們送行。
15:25 但現在，我往耶路撒冷去，供應聖徒。
15:26 因為馬其頓和亞該亞人樂意湊出捐項，給耶路撒冷聖徒中的窮人。
15:27 這固然是他們樂意的，其實也算是所欠的債；因外邦人既然分享了他們屬靈的好處，就當把養身之物供給他們。
15:28 等我辦完了這事，把這捐項當面交給他們，我就要路過你們那裡，往西班牙去。
15:29 我也曉得我到你們那裡，是帶著基督豐盛的福氣來的。
15:30 弟兄們，我藉著我們主耶穌基督，又藉著聖靈的愛，勸你們與我一同竭力，為我向神祈求，
15:31 叫我脫離在猶太不順從的人，也叫我為耶路撒冷所辦的供給，能悅納聖徒；
15:32 並叫我順著神的旨意到你們那裡，與你們同得快樂，一同得著安息。
15:33 但願賜平安的神與你們眾人同在。阿們！`,

  '7/16': `16:1 我對你們舉薦我們的姐妹非比，她是堅革哩教會中的女執事，
16:2 請你們為主接待她，合乎聖徒的體統，她在那裡辦理了許多事，我也是其中的一個，你們有甚麼事需要她幫助，就幫助她。
16:3 問百基拉和亞居拉安，他們是在基督耶穌裡與我同工的，
16:4 也是為我的命捨己頸項的；不但我感謝他們，就是外邦的眾教會也感謝他們。
16:5 又問在他們家中的教會安。問我所親愛的以拜尼土安，他在亞細亞是歸基督初結的果子。
16:6 問馬利亞安，她為你們多受勞苦。
16:7 問我的親屬安多尼古和猶尼亞安，他們曾與我一同坐監；他們在使徒中是有名望的，也是比我先在基督裡的。
16:8 問我在主裡所親愛的暗百里安。
16:9 問在基督裡與我們同工的烏巴奴，並我所親愛的士大古安。
16:10 問那在基督裡經過試驗的亞比利安；問亞利多布家中的人安。
16:11 問我親屬希羅天安；問拿其數家中在主裡的人安。
16:12 問特呂非拿和特呂鳳安，她們在主裡勞苦；問我所親愛的彼息，她為主多受勞苦。
16:13 問在主裡所揀選的魯孚和他母親安，他的母親就是我的母親。
16:14 問亞新革力、弗勒公、黑米、八羅拔、黑馬，並和他們在一處的弟兄們安。
16:15 問腓羅羅哥和猶利亞，尼利亞和他的姐妹，又問阿林巴，並和他們在一處的眾聖徒安。
16:16 你們要親嘴問安，彼此務要聖潔。基督的眾教會都問你們安。
16:17 弟兄們，那些離間你們、叫你們跌倒，背乎所學之道的人，我勸你們要留意躲避他們；
16:18 因為這樣的人不服事我們的主基督，只服事自己的肚腹，用花言巧語誘惑那老實人的心。
16:19 你們的順從傳遍了天下，所以我為你們歡喜；但我願意你們在善上聰明，在惡上純樸。
16:20 賜平安的神快要將撒但踐踏在你們腳下。願我主耶穌基督的恩常和你們同在。
16:21 與我同工的提摩太，並我的親屬路求、耶孫、索西巴德問你們安。
16:22 我這代保羅寫信的德丟在主裡問你們安。
16:23 那款待我、也款待眾教會的該猶問你們安。城裡的管錢財的以拉都，並兄弟括土問你們安。
16:24 〔願我主耶穌基督的恩常和你們眾人同在！阿們！〕
16:25 惟有神能照我所傳的福音和所講的耶穌基督，並照永古隱藏不言的奧祕，堅固你們的心。
16:26 但如今這奧祕顯明出來，而且按著永生神的命，藉眾先知的書指示萬國的民，叫他們信服真道。
16:27 願榮耀因耶穌基督，歸於獨一全智的神，直到永遠。阿們！`,

  '7/17': `1:1 作使徒的保羅（不是由於人，也不是藉著人，乃是藉著耶穌基督，與叫他從死裡復活的父神），
1:2 並同我一切弟兄們，寫信給加拉太的各教會。
1:3 願恩惠、平安從父神並我們的主耶穌基督歸於你們。
1:4 基督照我們父神的旨意，為我們的罪捨己，要救我們脫離這罪惡的世代。
1:5 但願榮耀歸於神，直到永永遠遠。阿們！
1:6 我希奇你們這麼快離開那藉著基督之恩召你們的，去從別的福音。
1:7 那並不是福音，不過有些人攪擾你們，要把基督的福音更改了。
1:8 但無論是我們，是天上來的使者，若傳福音給你們，與我們所傳給你們的不同，他就應當被咒詛。
1:9 我們以前說過，我現在又說，若有人傳福音給你們，與你們所領受的不同，他就應當被咒詛。
1:10 我現在是要得人的心呢？還是要得神的心呢？我豈是討人的喜歡嗎？若仍舊討人的喜歡，我就不是基督的僕人了。
1:11 弟兄們，我告訴你們，我素來所傳的福音，不是出於人的意思，
1:12 因為我不是從人領受的，也不是人教導我的，乃是從耶穌基督啟示來的。
1:13 我從前在猶太教中所行的事，你們都聽見了，我極力逼迫神的教會，殘害了它；
1:14 我在猶太教中比我本國許多同歲的人更有長進，為我祖宗的遺傳更加熱心。
1:15 然而，那把我從母腹裡分別出來、又施恩召我的神，
1:16 既然樂意將他兒子啟示在我心裡，叫我把他傳在外邦人中，我就沒有與血氣的人商量，
1:17 也沒有上耶路撒冷去見那些比我先作使徒的，惟獨往亞拉伯去，後來回到大馬色。
1:18 過了三年，我才上耶路撒冷去見磯法，和他同住了十五天。
1:19 至於別的使徒，除了主的兄弟雅各，我都沒有看見。
1:20 我寫給你們的，不是謊話，這是我在神面前說的。
1:21 以後我到了敘利亞和基利家境內，
1:22 那時猶太各教會在基督裡的人，還沒有見過我的面，
1:23 不過聽說那從前逼迫我們的，現在傳揚他從前所殘害的那信仰，
1:24 他們就為我的事將榮耀歸於神。`,

  '7/18': `2:1 過了十四年，我同巴拿巴又上耶路撒冷去，並帶著提多同去。
2:2 我是奉啟示上去的，把我在外邦人中所傳的福音，私下陳明給那有名望的人，惟恐我現在或是從前徒然奔跑。
2:3 但與我同去的提多，雖是希臘人，也沒有被強迫受割禮。
2:4 因為有偷著引進來的假弟兄，私下窺探我們在基督耶穌裡的自由，要叫我們作奴僕；
2:5 我們就是一刻的工夫也沒有容讓順從他們，為要叫福音的真理仍存在你們中間。
2:6 至於那些有名望的，不管他們從前是怎樣的人，我都無所謂，神不以外貌取人——那些有名望的，並沒有加添我甚麼。
2:7 反之，他們看見了我奉託傳福音給那未受割禮的人，正如彼得奉託傳福音給那受割禮的人；
2:8 （因為那感動彼得去作受割禮之人使徒的，也感動我去作外邦人的使徒）；
2:9 又知道我所得的恩典，那稱為柱石的雅各、磯法、約翰，就向我和巴拿巴用右手行相交之禮，叫我們往外邦人那裡去，他們往受割禮的人那裡去。
2:10 只是願意我們記念窮人；這也是我本來熱心去行的。
2:11 後來磯法到了安提阿，因為有該責備的地方，我就當面抵擋他。
2:12 因為他來以先，曾和外邦人一同吃飯；及至他們來到，他因怕奉割禮的人，就退去與外邦人隔開了。
2:13 其餘的猶太人也都隨著他裝假，甚至巴拿巴也隨夥裝假。
2:14 但我一看見他們行得不正，不是按著福音的真理，就在眾人面前對磯法說：你既是猶太人，卻按外邦人的規矩而行，不按猶太人的規矩，你怎麼還勉強外邦人隨從猶太人呢？
2:15 我們這生來是猶太人，不是外邦罪人；
2:16 既知道人稱義不是因行律法，乃是因信耶穌基督，連我們也信了基督耶穌，使我們因信基督稱義，不因行律法稱義；因為凡有血氣的，沒有一人因行律法稱義。
2:17 我們若求在基督裡稱義，卻仍舊是罪人，難道基督是叫人犯罪的嗎？斷乎不是！
2:18 我素來所拆毀的，若重新建造，這就證明自己是犯罪的人。
2:19 我因律法，就向律法死了，叫我可以向神活著。
2:20 我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活，他是愛我，為我捨己。
2:21 我不廢掉神的恩；義若是藉著律法得的，基督就是徒然死了。`,

  '7/19': `3:1 無知的加拉太人哪，耶穌基督釘十字架，已經活畫在你們眼前，誰又迷惑了你們呢？
3:2 我只要問你們這一件：你們受了聖靈，是因行律法呢？是因聽信福音呢？
3:3 你們既靠聖靈入門，如今還靠肉體成全嗎？你們是這樣無知嗎？
3:4 你們受苦如此之多，都是徒然的嗎？難道果真是徒然的嗎？
3:5 那賜給你們聖靈，又在你們中間行異能的，是因你們行律法呢？是因你們聽信福音呢？
3:6 正如「亞伯拉罕信神，這就算為他的義。」
3:7 所以，你們要知道那以信為本的人，就是亞伯拉罕的子孫。
3:8 並且聖經既然預先看明，神要叫外邦人因信稱義，就早已傳福音給亞伯拉罕，說：「萬國都必因你得福。」
3:9 可見那以信為本的人，和有信心的亞伯拉罕一同得福。
3:10 凡以行律法為本的，都是被咒詛的；因為經上記著：「凡不常照律法書上所記一切之事去行的，就被咒詛。」
3:11 沒有一個人靠著律法在神面前稱義，這是明顯的；因為「義人必因信得生。」
3:12 律法原不本乎信，只說：「行這些事的，就必因此活著。」
3:13 基督既為我們受了咒詛，就贖出我們脫離律法的咒詛；因為經上記著：「凡掛在木頭上都是被咒詛的。」
3:14 這便叫亞伯拉罕的福，因基督耶穌可以臨到外邦人，使我們因信得著所應許的聖靈。
3:15 弟兄們，我且照著人的常話說，雖然是人的文約，若已經立定了，就沒有能廢棄或加增的。
3:16 所應許的話是對亞伯拉罕和他子孫說的。神並不是說眾子孫，指著許多人，乃是說你那一個子孫，指著一個人，就是基督。
3:17 我是這樣說，神預先所立的約，不能被那四百三十年以後的律法廢掉，叫應許歸於虛空。
3:18 因為承受產業，若是出於律法，就不是出於應許；但神是憑著應許，把產業賜給亞伯拉罕。
3:19 這樣，律法是為甚麼有的呢？律法本是為過犯添上的，等候那蒙應許的子孫來到，並且是藉天使經中保之手設立的。
3:20 中保本不是為一方設立的；神卻是一位。
3:21 這樣，律法是與神的應許相抵背嗎？斷乎不是！若是所賜的律法能叫人得生，義就誠然本乎律法了。
3:22 但聖經把眾人都圈在罪裡，使所應許的福，因信耶穌基督，歸給那信的人。
3:23 但這因信得救的理，還沒有來以先，我們被看守在律法之下，直圈到那將來的真道顯明出來。
3:24 這樣，律法是我們訓蒙的師傅，引我們到基督那裡，使我們因信稱義。
3:25 但這因信得救的理既然來到，我們從此就不在師傅的手下了。
3:26 所以，你們因信基督耶穌，都是神的兒子。
3:27 你們受洗歸入基督的，都是披戴基督了。
3:28 並不分猶太人、希臘人，自主的、為奴的，或男或女，因為你們在基督耶穌裡都成為一了。
3:29 你們既屬乎基督，就是亞伯拉罕的後裔，是照著應許承受產業的了。`,

  '7/20': `4:1 我說那承受產業的，雖然是全業的主人，但為孩童的時候，卻與奴僕毫無分別，
4:2 乃在師傅和管家的手下，直等他父親預定的時候來到。
4:3 我們為孩童的時候，受管於世俗小學之下，也是如此。
4:4 及至時候滿足，神就差遣他的兒子，為女子所生，且生在律法以下，
4:5 要把律法以下的人贖出來，叫我們得著兒子的名分。
4:6 你們既為兒子，神就差他兒子的靈進入你們的心，呼叫：「阿爸！父！」
4:7 可見，從此以後，你不是奴僕，乃是兒子了；既是兒子，就靠著神為後嗣。
4:8 但從前你們不認識神，那時是給那些本來不是神的作奴僕。
4:9 現在你們既然認識神，更可說是被神所認識的，怎麼還要歸回那懦弱無用的小學，情願再給它作奴僕呢？
4:10 你們謹守日子、月份、節期、年份，
4:11 我為你們害怕，惟恐我在你們身上是枉費了工夫。
4:12 弟兄們，我勸你們要像我一樣；因為我也像你們一樣。你們一點沒有虧負我。
4:13 你們知道我頭一次傳福音給你們，是因為身體有疾病，
4:14 你們因我身體的緣故受試煉，沒有輕看我，也沒有厭棄我，反倒接待我，如同神的使者，如同基督耶穌。
4:15 那麼，你們當時所稱讚自己的福氣在哪裡呢？那時你們若能行，就是把自己的眼睛剜出來給我，也都情願；我可以給你們作見證。
4:16 如此，難道我因為向你們說真話，就成了你們的仇敵嗎？
4:17 那些人熱心待你們，卻不是好意，是要離間你們，叫你們熱心待他們。
4:18 在善事上，常常有人熱心待你們，原是好的，不獨我在你們那裡的時候才這樣（這卻是好的）。
4:19 我小子啊，我為你們再受生產之苦，直等到基督成形在你們心裡。
4:20 我巴不得現今在你們那裡，改換口氣，因為我為你們心裡作難。
4:21 你們這願意在律法以下的人，請告訴我，你們沒有聽見律法嗎？
4:22 因為律法上記著，亞伯拉罕有兩個兒子，一個是使女生的，一個是自主婦人生的。
4:23 然而，那使女所生的，是按著血氣生的；那自主婦人所生的，是憑著應許生的。
4:24 這都是比方，那兩個婦人，就是兩約；一約是出於西乃山，生子為奴，乃是夏甲。
4:25 這夏甲二字，是指著阿拉伯的西乃山，與現在的耶路撒冷同類，耶路撒冷和她的兒女都是為奴的。
4:26 但那在上的耶路撒冷是自主的，她是我們的母。
4:27 因為經上記著：「你這未曾生育的，當歡樂；你這未曾經過生產之苦的，當喊叫歡呼；因為沒有丈夫的，比有丈夫的兒女更多。」
4:28 弟兄們，我們是憑著應許作兒女，如同以撒一樣。
4:29 當時那按著血氣生的，逼迫了那按著聖靈生的，現在也是這樣。
4:30 然而經上是怎麼說的呢？「把使女和她兒子趕出去，因為使女的兒子，不可與自主婦人的兒子一同承受產業。」
4:31 弟兄們，這樣看來，我們不是使女的兒女，乃是自主婦人的兒女了。`,

  '7/21': `5:1 基督釋放了我們，叫我們得以自由，所以要站立得穩，不要再被奴僕的軛挾制。
5:2 我保羅告訴你們，若受割禮，基督就與你們無益了。
5:3 我再指著凡受割禮的人確實地說，他是欠著行全律法的債。
5:4 你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了。
5:5 我們靠著聖靈，憑著信心，等候所盼望的義。
5:6 原來在基督耶穌裡，受割禮不受割禮全無功效，惟獨使人生發仁愛的信心才有功效。
5:7 你們向來跑得好，有誰攔阻你們，叫你們不順從真理呢？
5:8 這樣的慫恿，不是出於那召你們的。
5:9 一點麵酵能使全團都發起來。
5:10 我在主裡很信你們不存別樣的心，但那攪擾你們的，無論是誰，必擔當他當受的判斷。
5:11 弟兄們，我若仍舊傳割禮，為甚麼還受逼迫呢？若是這樣，那十字架討厭人的地方就沒有了。
5:12 恨不得那些攪擾你們的人，把自己割絕了。
5:13 弟兄們，你們蒙召，是要得自由；只是不可將你們的自由當作放縱情慾的機會，總要用愛心互相服事。
5:14 因為全律法都包在「愛人如己」這一句話之內了。
5:15 你們要謹慎，若相咬相吞，只怕要彼此消滅了。
5:16 我說，你們當順著聖靈而行，就不放縱肉體的情慾了。
5:17 因為情慾和聖靈相爭，聖靈和情慾相爭，這兩個是彼此相敵，使你們不能做所願意做的事。
5:18 但你們若被聖靈引導，就不在律法以下。
5:19 情慾的事，都是顯而易見的，就如姦淫、污穢、邪蕩、
5:20 拜偶像、邪術、仇恨、爭競、忌恨、惱怒、結黨、紛爭、異端、
5:21 嫉妒、醉酒、荒宴等類；我從前告訴你們，現在又告訴你們，行這樣事的人必不能承受神的國。
5:22 聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、
5:23 溫柔、節制；這樣的事，沒有律法禁止。
5:24 凡屬基督耶穌的人，是已經把肉體連肉體的邪情私慾，同釘在十字架上了。
5:25 我們若是靠聖靈得生，就當靠聖靈行事。
5:26 不要貪圖虛名，彼此惹氣，互相嫉妒。`,

  '7/22': `6:1 弟兄們，若有人偶然被過犯所勝，你們屬靈的人，就當用溫柔的心把他挽回過來；又當自己小心，恐怕也被引誘。
6:2 你們各人的重擔要互相擔當，如此，就完全了基督的律法。
6:3 人若無有，自己還以為有，就是自欺了。
6:4 各人應當察驗自己的行為，這樣，他所誇的就專在自己，不在別人了；
6:5 因為各人必擔當自己的擔子。
6:6 在道理上受教的，當把一切需用的供給施教的人。
6:7 不要自欺，神是輕慢不得的，人種的是甚麼，收的也是甚麼。
6:8 順著情慾撒種的，必從情慾收敗壞；順著聖靈撒種的，必從聖靈收永生。
6:9 我們行善，不可喪志；若不灰心，到了時候就要收成。
6:10 所以，有了機會，就當向眾人行善，向信徒一家的人更當這樣。
6:11 請看我親手寫給你們的字，是何等的大呢。
6:12 凡希圖在外貌上體面的人，都要勉強你們受割禮，無非是怕自己為基督的十字架受逼迫。
6:13 就是那些受割禮的，自己也不守律法；他們願意你們受割禮，不過是要藉著你們的肉體誇口。
6:14 但我斷不以別的誇口，只誇我們主耶穌基督的十字架；因這十字架，就我而論，世界已經釘在十字架上了；就世界而論，我已經釘在十字架上了。
6:15 受割禮不受割禮都無關緊要，要緊的就是作新造的人。
6:16 凡照此理而行的，願平安、憐憫加給他們，和神的以色列民。
6:17 從今以後，人都不要攪擾我，因為我身上帶著耶穌的印記。
6:18 弟兄們，願我們主耶穌基督的恩常在你們心裡。阿們！`,

  '7/23': `1:1 奉神旨意，作基督耶穌使徒的保羅，並兄弟提摩太，
1:2 寫信給歌羅西的聖徒，並在基督裡有忠心的弟兄。願恩惠、平安從神我們的父歸與你們！
1:3 我們感謝神，我們主耶穌基督的父，常常為你們禱告。
1:4 因為聽見你們在基督耶穌裡的信心，並你們愛一切聖徒的心；
1:5 是為那給你們存在天上的盼望；這盼望就是你們從前在福音真理的道上所聽見的。
1:6 這福音傳到你們那裡，也傳到普天之下，並且結果，增長，如同在你們中間，自從你們聽見福音，真知道神恩典的那天也是這樣。
1:7 正如你們從我們所親愛、一同作僕人的以巴弗所學的，他也為我們作了基督忠心的執事；
1:8 他把你們在聖靈裡的愛，告訴了我們。
1:9 因此，我們自從聽見的那日，也就為你們不住地禱告祈求，願你們在一切屬靈的智慧悟性上，滿心知道神的旨意；
1:10 好叫你們行事為人對得起主，凡事蒙他喜悅，在一切善事上結果子，漸漸地多知道神；
1:11 照他榮耀的權能，得以剛強，凡事歡歡喜喜地忍耐寬容；
1:12 又感謝父，他叫我們能與眾聖徒在光明中同得基業；
1:13 他救了我們脫離黑暗的權勢，把我們遷到他愛子的國裡；
1:14 我們在愛子裡得蒙救贖，罪過得以赦免。
1:15 愛子是那不能看見之神的像，是首生的，在一切被造的以先；
1:16 因為萬有都是靠他造的，無論是天上的，地上的，能看見的，不能看見的，或是有位的，主治的，執政的，掌權的，一概都是藉著他造的，又是為他造的。
1:17 他在萬有之先；萬有也靠他而立。
1:18 他也是教會全體之首。他是元始，是從死裡首先復生的，使他可以在凡事上居首位。
1:19 因為父喜歡叫一切的豐盛，在他裡面居住；
1:20 既然藉著他在十字架上所流的血，成就了和平，便藉著他叫萬有，無論是地上的、天上的，都與自己和好了。
1:21 你們從前與神隔絕，因著惡行，心裡與他為敵；
1:22 但如今他藉著基督的肉身受死，叫你們與自己和好，都成了聖潔，沒有瑕疵，無可責備，把你們引到自己面前。
1:23 只要你們在所信的道上恆心，根基穩固，堅定不移，不至被引動失去福音的盼望；這福音就是你們所聽過的，也是傳遍天下萬人聽見的，我保羅也作了這福音的執事。
1:24 現在我為你們受苦，倒覺歡樂；並且為基督的身體，就是為教會，要在我肉身上補滿基督患難的缺欠。
1:25 我照神為你們所賜我的職分，作了教會的執事，要把神的道理傳得全備，
1:26 這道理，就是歷世歷代所隱藏的奧祕，但如今向他的聖徒顯明了，
1:27 神願意叫他們知道，這奧祕在外邦人中有何等豐盛的榮耀，就是基督在你們心裡成了有榮耀的盼望。
1:28 我們傳揚他，是用諸般的智慧，勸戒各人，教導各人，要把各人在基督裡完完全全地引到神面前；
1:29 我也為此勞苦，照著他在我裡面運用的大能盡力而為。`,

  '7/24': `2:1 我願意你們曉得，我為你們和老底嘉人，並一切沒有親眼見過我面的人，是何等地盡心竭力，
2:2 要叫他們的心得安慰，因愛心互相聯絡，以致豐豐足足在悟性中有充足的信心，使他們真知道神的奧祕，就是基督；
2:3 所積蓄的一切智慧知識，都在他裡面藏著。
2:4 我說這話，是要使你們沒有人用花言巧語迷惑你們。
2:5 我身子雖與你們相離，心卻與你們同在，見你們規規矩矩，信主基督的心也堅固，我就歡喜了。
2:6 你們既然接受了主基督耶穌，就當遵他而行，
2:7 在他裡面生根建造，信心堅固，正如你們所領的教訓，感謝的心也更增益了。
2:8 你們要謹慎，恐怕有人用他的理學和虛空的妄言，不照著基督，乃照著人間的遺傳和世上的小學，就把你們擄去。
2:9 因為神本性一切的豐盛，都有形有體地居住在基督裡面；
2:10 你們在他裡面也得了豐盛，他是各樣執政掌權者的元首。
2:11 你們在他裡面，也受了不是人手所行的割禮，乃是基督使你們脫去肉體情慾的割禮。
2:12 你們既受洗與他一同埋葬，也就在此與他一同復活，都因信那叫他從死裡復活神的功用。
2:13 你們從前在過犯和未受割禮的肉體中死了，神赦免了你們（我們）一切過犯，便叫你們與基督一同活過來；
2:14 又塗抹了在律例上所寫攻擊我們、有礙於我們的字據，把它撤去，釘在十字架上；
2:15 既將一切執政的、掌權的，擄來示眾，藉著十字架誇勝他們。
2:16 所以，不拘在飲食上，或節期、月朔、安息日，都不可讓人論斷你們；
2:17 這些原是後事的影兒，那形體卻是基督。
2:18 不可讓人因著故意謙虛和敬拜天使，就奪去你們的獎賞；這等人因著所見過的加以詳述，隨著自己肉體的心思無故自高自大，
2:19 不持定元首；全身既然靠著他，藉著各節各筋得以相助聯絡，就因神大得長進。
2:20 你們若是與基督同死，脫離了世上的小學，為甚麼仍像在世俗中活著，服從那「不可拿、不可嘗、不可摸」等類的規條呢？
2:21 這都是照人所吩咐、所教導的，說這些規條乃是在用的時候就消滅的，
2:22 有崇拜的外貌，並假意謙遜，苦待己身，其實在克制肉體的情慾上是毫無功效。`,

  '7/25': `3:1 所以，你們若真與基督一同復活，就當求在上面的事；那裡有基督坐在神的右邊。
3:2 你們要思念那上面的事，不要思念地上的事；
3:3 因為你們已經死了，你們的生命與基督一同藏在神裡面。
3:4 基督是我們的生命，他顯現的時候，你們也要與他一同顯現在榮耀裡。
3:5 所以，要治死你們在地上的肢體，就如淫亂、污穢、邪情、惡慾，和貪婪（貪婪就與拜偶像一樣）。
3:6 因為這些事，神的忿怒必臨到那悖逆之子；
3:7 你們從前在這些事中活著的時候，也曾這樣行過。
3:8 但現在你們要棄絕這一切的事：惱恨、忿怒、惡毒、毀謗，並口中污穢的言語。
3:9 不要彼此說謊；因為你們已經脫去舊人和舊人的行為，
3:10 穿上了新人，這新人在知識上漸漸更新，正如造他主的形像。
3:11 在此並不分希臘人、猶太人，受割禮的、未受割禮的，化外人、西古提人，為奴的、自主的，惟有基督是包括一切，又住在各人之內。
3:12 所以，你們既是神的選民，聖潔蒙愛的人，就要存憐憫、恩慈、謙虛、溫柔、忍耐的心。
3:13 倘若這人與那人有嫌隙，總要彼此包容，彼此饒恕；主怎樣饒恕了你們，你們也要怎樣饒恕人。
3:14 在這一切之外，要存著愛心，愛心就是聯絡全德的。
3:15 又要叫基督的平安在你們心裡作主；你們也為此蒙召，歸為一體；且要存感謝的心。
3:16 當用各樣的智慧，把基督的道理豐豐富富地存在心裡，（或譯：當把基督的話豐豐富富地存在心裡，以各樣智慧）用詩章、頌詞、靈歌彼此教導，互相勸戒，心被恩感，歌頌神。
3:17 無論做甚麼，或說話，或行事，都要奉主耶穌的名，藉著他感謝父神。
3:18 你們作妻子的，當順服自己的丈夫，這在主裡面是相宜的。
3:19 你們作丈夫的，要愛你們的妻子，不可苦待她們。
3:20 你們作兒女的，要凡事聽從父母，因為這是主所喜悅的。
3:21 你們作父親的，不要惹兒女的氣，恐怕他們失了志氣。
3:22 你們作僕人的，要凡事聽從你們肉身的主人，不要只在眼前事奉，像是討人喜歡的，總要存心誠實敬畏主。
3:23 無論做甚麼，都要從心裡做，像是給主做的，不是給人做的；
3:24 因為你們知道，從主那裡必得著基業為賞賜，你們所事奉的乃是主基督。
3:25 那行不義的，必受不義的報應；主並不偏待人。`,

  '7/26': `4:1 你們作主人的，要公公平平地待僕人，因為你們知道，你們也有一位主在天上。
4:2 你們要恆切禱告，在此儆醒感恩。
4:3 也要為我們禱告，求神給我們開傳道的門，能以講說基督的奧祕（我為此被捆鎖），
4:4 叫我按著所該說的將這奧祕發明出來。
4:5 你們要愛惜光陰，用智慧與外人交往，
4:6 你們的言語要常常帶著和氣，好像用鹽調和，就可知道該怎樣回答各人。
4:7 有我親愛的兄弟推基古，他是忠心的執事，也是在主裡與我同作僕人的，他要把我一切的事都告訴你們；
4:8 我特意打發他到你們那裡去，好叫你們知道我們的光景，也叫他安慰你們的心。
4:9 我又打發和推基古同去的，有出於你們本地忠心親愛的兄弟阿尼西謀，他們要把這裡一切的事都告訴你們。
4:10 與我一同坐監的亞里達古問你們安，巴拿巴的表弟馬可也問你們安（說到這馬可，你們已經受了吩咐，他若到了你們那裡，你們要接待他）；
4:11 也有稱為猶士都的耶數問你們安；在奉割禮的人中，只有這三個人是為神的國與我一同做工的，也是叫我心裡得安慰的。
4:12 有你們那裡的人，作基督耶穌僕人的以巴弗，問你們安；他在禱告之間，常為你們竭力地祈求，願你們在神一切旨意上，得以完全，信心充足，確實站立。
4:13 他為你們和老底嘉、並希拉波立的弟兄們多多地勞苦，這是我可以給他作見證的。
4:14 所親愛的醫生路加和底馬問你們安。
4:15 請問老底嘉的弟兄們，並寧法和他家裡的教會安。
4:16 你們把這書信念了，也要叫老底嘉的教會念，你們也要念從老底嘉來的書信。
4:17 要告訴亞基布，務要謹慎，盡你從主所受的職事。
4:18 我保羅親筆問你們安。你們要記念我的捆鎖。願恩惠與你們同在！`,

  '7/27': `1:1 基督耶穌的僕人保羅和提摩太，寫信給凡住腓立比、在基督耶穌裡的眾聖徒，並諸位監督、諸位執事。
1:2 願恩惠、平安從神我們的父並主耶穌基督歸與你們！
1:3 我每逢想念你們，就感謝我的神；
1:4 每逢為你們眾人祈求的時候，常是歡歡喜喜地祈求。
1:5 因為從頭一天直到如今，你們是同心合意地興旺福音。
1:6 我深信那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子。
1:7 我為你們眾人有這樣的意念，原是應當的；因為我把你們放在心裡，無論我是在捆鎖之中，是辯明證實福音的時候，你們大家都與我一同得恩。
1:8 我體會基督耶穌的心腸，切切地想念你們眾人，這是神可以給我作見證的。
1:9 我所禱告的，就是要你們的愛心，在知識和各樣見識上，多而又多，
1:10 使你們能分別是非，作誠實無過的人，直到基督的日子，
1:11 並靠著耶穌基督結滿了仁義的果子，叫榮耀稱讚歸與神。
1:12 弟兄們，我願意你們知道，我所遭遇的事，更是叫福音興旺，
1:13 以致我受的捆鎖，在御營全軍和其餘的人中，已經顯明是為基督的緣故。
1:14 並且那在主裡的弟兄，多半因我受的捆鎖，就篤信不疑，越發放膽傳神的道，無所懼怕。
1:15 有些人傳基督，是出於嫉妒分爭；也有些人傳基督，是出於好意。
1:16 這一等人傳基督，是出於愛心，知道我是為辯明福音設立的；
1:17 那一等人傳基督，是出於結黨，並不誠實，意思要加增我捆鎖的苦楚。
1:18 這有何妨呢？或是假意，或是真心，無論怎樣，基督究竟被傳開了，為此我就歡喜，並且還要歡喜；
1:19 因為我知道，這事藉著你們的祈禱，和耶穌基督之靈的幫助，終必叫我得救。
1:20 照著我所切慕、所盼望的，沒有一事叫我羞愧，只要凡事放膽，無論是生是死，總叫基督在我身上照常顯大；
1:21 因我活著就是基督，我死了就有益處。
1:22 但我在肉身活著，若成就我工夫的果子，我就不知道該挑選甚麼。
1:23 我正在兩難之間，情願離世與基督同在，因為這是好得無比的；
1:24 然而，我在肉身活著，為你們更是要緊的。
1:25 我既然這樣確信，我知道仍要住在世間，且與你們眾人同住，使你們在所信的道上，並喜樂上，都可以長進；
1:26 叫你們在基督耶穌裡，因我再到你們那裡，就越發有所誇口。
1:27 只要你們行事為人與基督的福音相稱，叫我或來見你們，或不在你們那裡，可以聽見你們的風聲，知道你們同有一個心志，站立得穩，為所信的福音齊心努力。
1:28 凡事不怕敵人的驚嚇，這就是他們沉淪、你們得救的明證，都是出於神。
1:29 因為你們蒙恩，不但得以信服基督，也要為他受苦；
1:30 你們所爭戰的，與你們在我身上從前所看見、現在所聽見的，都是一樣的。`,

  '7/28': `2:1 所以，在基督裡若有甚麼勸勉，愛心有甚麼安慰，聖靈有甚麼交通，心中有甚麼慈悲憐憫，
2:2 你們就要意念相同，愛心相同，有一樣的心思，有一樣的意念，使我的喜樂可以滿足。
2:3 凡事不可結黨，不可貪圖虛浮的榮耀；只要存心謙卑，各人看別人比自己強。
2:4 各人不要單顧自己的事，也要顧別人的事。
2:5 你們當以基督耶穌的心為心：
2:6 他本有神的形象，不以自己與神同等為強奪的；
2:7 反倒虛己，取了奴僕的形象，成為人的樣式；
2:8 既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。
2:9 所以，神將他升為至高，又賜給他那超乎萬名之上的名，
2:10 叫一切在天上的、地上的，和地底下的，因耶穌的名，無不屈膝，
2:11 無不口稱耶穌基督為主，使榮耀歸與父神。
2:12 這樣看來，我親愛的弟兄，你們既是常順從的，不但我在你們那裡，就是我如今不在你們那裡，更要恐懼戰兢，做成你們得救的工夫；
2:13 因為你們立志行事，都是神在你們心裡運行，為要成就他的美意。
2:14 凡所行的，都不要發怨言，起爭論，
2:15 使你們無可指摘，誠實無偽，在這彎曲悖謬的世代，作神無瑕疵的兒女，在世間好像明光照耀，
2:16 將生命的道表明出來，叫我在基督的日子好誇我沒有空跑，也沒有徒然勞力。
2:17 我以你們的信心為祭物，我若被澆奠在其上，也是喜樂，並且與你們眾人一同喜樂。
2:18 你們也要照樣喜樂，並且與我一同喜樂。
2:19 我靠主耶穌希望快打發提摩太去見你們，叫我知道你們的事，心裡就得著安慰。
2:20 因為我沒有別人與我同心，實在掛念你們的事；
2:21 別人都求自己的事，並不求耶穌基督的事。
2:22 但你們知道提摩太已經歷過試驗，他興旺福音與我同勞，待我如同兒子待父親一樣。
2:23 所以，我一看出我的事要怎樣了結，就盼望立刻打發他去；
2:24 但我靠主自信我也快去。
2:25 然而，我想必須打發以巴弗提到你們那裡去；他是我的兄弟，與我一同做工，一同當兵，也是你們所差來的，供給我需用的。
2:26 他很想念你們眾人，並且極其難過，因為你們聽見他病了。
2:27 他果然病了，幾乎要死；然而神憐憫他，不但憐憫他，也憐憫我，免得我憂上加憂。
2:28 所以我越發急速打發他去，叫你們再見了他，可以喜樂，我也可以少些憂愁。
2:29 故此，你們務要在主裡歡然接納他；且要尊重這樣的人。
2:30 因為他為做基督的工夫，幾乎至死，不顧性命，要補足你們供給我的不足。`,

  '7/29': `3:1 我弟兄們，我還有話說，你們要靠主喜樂。我把這話再寫給你們，於我並不為難，於你們也是妥當的。
3:2 應當防備犬類，防備作惡的，防備妄自行割的；
3:3 因為真受割禮的，乃是我們這以神的靈敬拜、在基督耶穌裡誇口、不靠著肉體的人。
3:4 其實，我也可以靠肉體；若別人想他可以靠肉體，我更可以靠著了。
3:5 我第八天受割禮，我是以色列族便雅憫支派的人，是希伯來人所生的希伯來人；就律法說，我是法利賽人；
3:6 就熱心說，我是逼迫教會的；就律法上的義說，我是無可指摘的。
3:7 只是我從前以為與我有益的，我現在因基督都當作有損的。
3:8 不但如此，我也將萬事當作有損的，因我以認識我主基督耶穌為至寶。我為他已經丟棄萬事，看作糞土，為要得著基督；
3:9 並且得在他裡面，不是有自己因律法而得的義，乃是有信基督的義，就是因信神而來的義；
3:10 使我認識基督，曉得他復活的大能，並且曉得和他一同受苦，效法他的死；
3:11 或者我也得以從死裡復活。
3:12 這不是說，我已經得著了，已經完全了；我乃是竭力追求，或者可以得著基督耶穌所以得著我的（原因）。
3:13 弟兄們，我不是以為自己已經得著了，我只有一件事，就是忘記背後，努力面前的，
3:14 向著標竿直跑，要得神在基督耶穌裡從上面召我來得的獎賞。
3:15 所以我們中間，凡是完全人，都要存這樣的心；若在甚麼事上，存別樣的心，神也必以此指示你們。
3:16 然而，我們到了甚麼地步，就當照著甚麼地步行。
3:17 弟兄們，你們要一同效法我，也當留意看那些照我們榜樣行事的人。
3:18 因為有許多人行事，是基督十字架的仇敵，我屢次告訴你們，現在又流淚地告訴你們。
3:19 他們的結局就是沉淪；他們的神就是自己的肚腹，他們以自己的羞辱為榮耀，專以地上的事為念。
3:20 我們卻是天上的公民，並且等候救主，就是主耶穌基督從天上降臨；
3:21 他要按著那能叫萬有歸服自己的大能，將我們這卑賤的身體改變形狀，和他自己榮耀的身體相似。`,

  '7/30': `4:1 我所親愛、所想念的弟兄們，你們就是我的喜樂，我的冠冕。我親愛的弟兄，你們應當靠主站立得穩，我就是這樣勸你們。
4:2 我勸友阿爹，也勸循都基，要在主裡意念相同。
4:3 我也求你這真實同負一軛的，幫助這兩個女人，因為她們在福音上曾與我一同勞苦，還有革利免並其餘和我一同做工的人；他們的名字都在生命冊上。
4:4 你們要靠主常常喜樂，我再說，你們要喜樂！
4:5 當叫眾人知道你們謙讓的心；主已經近了。
4:6 應當一無掛慮，只要凡事藉著禱告、祈求和感謝，將你們所要的告訴神。
4:7 神所賜出人意外的平安，必在基督耶穌裡，保守你們的心懷意念。
4:8 弟兄們，那些真實的、可敬的、公義的、清潔的、可愛的、有美名的事，若有甚麼德行，若有甚麼稱讚，這些事你們都要思念。
4:9 你們在我身上所學習的，所領受的，所聽見的，所看見的，這些事你們都要去行，賜平安的神就必與你們同在。
4:10 我靠主大大地歡樂，因為你們思念我的心如今又發生；你們向來就思念我，只是沒有機會。
4:11 我學會了，無論在甚麼狀態，可以知足，這是很要緊的。
4:12 我知道怎樣處卑賤，也知道怎樣處豐富，或飽足、或飢餓、或有餘、或缺乏，在各事上，並在一切事上，我都得了祕訣。
4:13 我靠著那加給我力量的，凡事都能做。
4:14 然而，你們和我同受患難，原是美事。
4:15 腓立比人哪，你們也知道，我初傳福音離了馬其頓的時候，論到授受的事，除了你們以外，並沒有別的教會供給我；
4:16 就是我在帖撒羅尼迦，你們也一次兩次地打發人供給我的需用。
4:17 我並不求甚麼饋送，所求的，就是你們的果子漸漸增多，歸在你們的賬上。
4:18 但我樣樣都有，並且有餘；我已經充足了，因我收了以巴弗提從你們那裡帶來的，當作極美的香氣，為神所收納、所喜悅的祭物。
4:19 我的神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。
4:20 但願榮耀歸給我們的父神，直到永永遠遠。阿們！
4:21 請問在基督耶穌裡的各位聖徒。在我這裡的弟兄們問你們安。
4:22 眾聖徒問你們安，在凱撒家裡的人，格外問安。
4:23 願主耶穌基督的恩常在你們心裡！`,

  '7/31': `1 基督耶穌被囚的保羅，同兄弟提摩太，寫信給我們所親愛的同工腓利門，
2 並姐妹亞腓亞，並與我們同當兵的亞基布，以及在你家中的教會。
3 願恩惠、平安從父神並主耶穌基督歸與你們！
4 我在禱告中提到你的時候，常為你感謝我的神，
5 因聽說你有愛心，對主耶穌並對眾聖徒都有信心。
6 願你與人所同有的信心，因多知道你們所有的善事，就在基督裡顯出功效來。
7 弟兄啊，我們同有喜樂，同得安慰；因為你使眾聖徒的心，藉著你都暢快了，我也為此大有喜樂。
8 所以，我在基督裡雖然可以放膽，吩咐你所當做的事；
9 但我寧可用愛心求你；我這有年紀的保羅，現在又是為基督耶穌被囚的，
10 為我在捆鎖中所生的兒子阿尼西謀，求你，
11 他從前於你有用，但現在於你我都有用。
12 我現今把他親自，就是把我的心，打發到你那裡去了。
13 我本來有意留下他在我這裡，在我為福音所受的捆鎖中，他可以替你伺候我；
14 但不知道你的意思，我就不願意做，叫你的好處不是出於勉強，乃是出於甘心。
15 他暫時離開你，或者是叫你永遠得著他，
16 不再是奴僕，乃是高過奴僕，是親愛的兄弟；在我看他是如此，何況在你看，無論就著人情，還是就著主說，更是如此了。
17 你若以我為同伴，就收納他，如同收納我一樣。
18 他若虧負你，或欠你甚麼，都歸在我的賬上，
19 我保羅親筆寫說，我必償還；不用說，你就是你自己也是虧欠於我的。
20 是的，弟兄啊，願我在主裡因你得著益處，在基督裡使我的心暢快。
21 我寫信給你，我知道你必順從，我也知道你所做的，必超過我所說的。
22 此外，請你給我預備住處；因為我盼望，藉著你們的禱告，我必被賜給你們。
23 那與我一同在基督耶穌裡坐監的以巴弗拉問你安；
24 並我的同工馬可、亞里達古、底馬、路加，也都問你安。
25 願我們主耶穌基督的恩常在你們心裡。阿們！`,

  '6/29': `48:1 各支派按名所得之地記在下面：從北端，靠著哈特隆路，通到哈末口，從大馬色北界哈薩以難地，北邊靠著哈末，從東到西，是但的一分。
48:2 在但的境界旁邊，從東到西，是亞設的一分。
48:3 在亞設的境界旁邊，從東到西，是拿弗他利的一分。
48:4 在拿弗他利的境界旁邊，從東到西，是瑪拿西的一分。
48:5 在瑪拿西的境界旁邊，從東到西，是以法蓮的一分。
48:6 在以法蓮的境界旁邊，從東到西，是流便的一分。
48:7 在流便的境界旁邊，從東到西，是猶大的一分。
48:8 在猶大的境界旁邊，從東到西，是你們所當奉獻的地，寬二萬五千肘，長與各支派的分一樣，從東到西，其中的聖所在其正中。
48:9 你們所當奉獻的地，長二萬五千肘，寬一萬肘。
48:10 這所奉獻的聖地，祭司要得北邊長二萬五千肘，西邊寬一萬肘，東邊寬一萬肘，南邊長二萬五千肘，耶和華的聖所在其正中。
48:11 這地要歸撒督子孫中分別為聖的祭司，這些人在以色列人走迷的時候，不像利未人那樣走迷，乃是忠心守我所吩咐的。
48:12 所奉獻的地業，要從地業中歸他們，是至聖的，在利未人的地業旁邊。
48:13 在祭司地旁邊，利未人要得的地，長二萬五千肘，寬一萬肘；全長共二萬五千肘，寬一萬肘。
48:14 他們不可賣地業，不可交換，土地的初熟之物也不可歸別人，因為這是耶和華的聖地。
48:15 這二萬五千肘旁邊所剩的五千肘，不是聖地，是歸城的，可以居住，可以作郊野；城要在其中。
48:16 城的尺寸是這樣：北邊四千五百肘，南邊四千五百肘，東邊四千五百肘，西邊四千五百肘。
48:17 城的郊野，北邊二百五十肘，南邊二百五十肘，東邊二百五十肘，西邊二百五十肘。
48:18 所奉獻的聖地旁邊，往東剩下的長一萬肘，往西剩下的長一萬肘，這是在所奉獻的聖地旁邊剩下的；其中所出的要作城中服役之人的食物。
48:19 以色列各支派中，在城裡服役的人，要耕種這地。
48:20 所當奉獻的地，共長二萬五千肘，寬二萬五千肘，是四方的；你們要把這聖地並城的地業一同奉獻。
48:21 在所奉獻的聖地和城的地業兩旁所剩的地要歸王；就是在二萬五千肘的東邊直到東界，並在二萬五千肘的西邊直到西界，與各支派的分平行，要歸王；聖地和殿的聖所在其正中。
48:22 在利未人的地業和城的地業中間，歸王的地業在猶大和便雅憫兩界的中間。
48:23 其餘各支派：從東到西，是便雅憫的一分。
48:24 在便雅憫的境界旁邊，從東到西，是西緬的一分。
48:25 在西緬的境界旁邊，從東到西，是以薩迦的一分。
48:26 在以薩迦的境界旁邊，從東到西，是西布倫的一分。
48:27 在西布倫的境界旁邊，從東到西，是迦得的一分。
48:28 在迦得的境界旁邊，南邊從他瑪，直到米利巴加低斯的水，再到埃及小河，直到大海。
48:29 這是你們所當拈鬮分給以色列各支派的地，這些就是他們的分，這是主耶和華說的。
48:30 城的出口是這樣：北邊，量四千五百肘。
48:31 城門要按以色列支派的名字命名，北邊的三門：一是流便門，一是猶大門，一是利未門。
48:32 東邊量四千五百肘，也有三門：一是約瑟門，一是便雅憫門，一是但門。
48:33 南邊量四千五百肘，也有三門：一是西緬門，一是以薩迦門，一是西布倫門。
48:34 西邊量四千五百肘，也有三門：一是迦得門，一是亞設門，一是拿弗他利門。
48:35 城的四圍共一萬八千肘；從那日以後，這城的名字必稱為耶和華的所在。`,

  // ── 以賽亞書 Isaiah ──────────────────────────────────────────────
  '8/1': `1:1 以賽亞的異象，就是烏西雅、約坦、亞哈斯、希西家作猶大王的時候，亞摩斯的兒子以賽亞所得的。
1:2 天哪，要聽！地啊，側耳而聽！因為耶和華說：我養育兒女，將他們養大，他們卻悖逆我。
1:3 牛認識主人，驢認識主人的槽，以色列卻不認識，我的民卻不留意。
1:4 嗐！犯罪的國民，擔著罪孽的百姓，行惡的種類，敗壞的兒女！他們離棄耶和華，藐視以色列的聖者，與他生疏，往後退步。
1:5 你們為甚麼還要受責打呢？為甚麼還要悖逆呢？頭已經病了，全心發昏。
1:6 從腳掌到頭頂，沒有一處完全的，盡是傷口、青腫，並新打的傷，沒有收口，沒有纏裹，也沒有用油滋潤。
1:7 你們的地土已經荒涼，你們的城邑被火焚燬，你們的田地，在你們眼前被外人侵吞，既被外人傾覆，就成了荒涼。
1:8 錫安城剩下，好像葡萄園的草棚，瓜田的茅屋，被圍困的城邑。
1:9 若不是萬軍之耶和華給我們留下極少的餘種，我們早已像所多瑪，與蛾摩拉相同了。
1:10 你們這所多瑪的官長啊，要聽耶和華的話！你們這蛾摩拉的百姓啊，要側耳聽我們神的訓誨！
1:11 耶和華說：你們所獻的許多祭物與我何益呢？公羊的燔祭和肥畜的脂油，我已經夠了；公牛的血、羊羔的血、公山羊的血，我都不喜悅。
1:12 你們來朝見我，誰向你們討這些，使你們踐踏我的院宇呢？
1:13 你們不要再獻虛浮的供物。香品是我所憎惡的；月朔和安息日，並宣召的大會，也是我所憎惡的；作罪孽，又守嚴肅會，我也不能容忍。
1:14 你們的月朔和節期，我心裡恨惡，我都以為麻煩；我擔當，便不耐煩。
1:15 你們舉手禱告，我必遮眼不看；就是你們多多地祈禱，我也不聽。你們的手都滿了殺人流血的罪。
1:16 你們要洗濯、自潔，從我眼前除掉你們的惡行，要止住作惡，
1:17 學習行善，尋求公平，解救受欺壓的；給孤兒伸冤，為寡婦辨屈。
1:18 耶和華說：你們來，我們彼此辯論。你們的罪雖像硃紅，必變成雪白；雖紅如丹顏，必白如羊毛。
1:19 你們若甘心聽從，必吃地上的美物；
1:20 你們若不肯聽從，反倒悖逆，必被刀劍吞滅。這是耶和華親口說的。
1:21 忠信的城，成了妓女！從前充滿了公平，公義居在其中，現在卻有兇手居住。
1:22 你的銀子成了渣滓，你的酒用水攙兌。
1:23 你的官長居心悖逆，與賊作伴，各人喜愛賄賂，追求財禮；不為孤兒伸冤，寡婦的案件也不呈在他們面前。
1:24 所以，主萬軍之耶和華，以色列的大能者說：哎！我要向我的對頭消氣，向我的敵人報仇。
1:25 我必反手加在你身上，煉盡你的渣滓，除淨你的雜質，
1:26 我必復還你的審判官，如同起初一樣；復還你的謀士，如同起先一般。然後你必稱為公義之城，忠信之邑。
1:27 錫安必因公平得蒙救贖，其中歸正的人必因公義得蒙救贖。
1:28 但悖逆的和犯罪的必一同敗亡；離棄耶和華的必致消滅。
1:29 那時，你們必因所喜悅的橡樹，慚愧羞恥；你們必因所選擇的園子，臉紅。
1:30 你們必如葉子枯乾的橡樹，如無水澆灌的園子。
1:31 強壯的人必如麻絮，他所作的必如火星；都要一同燒滅，無人撲滅。`,

  '8/2': `2:1 亞摩斯的兒子以賽亞得默示，論猶大和耶路撒冷。
2:2 末後的日子，耶和華殿的山必堅立，超乎諸山，高舉過於萬嶺；萬民都要流歸這山。
2:3 必有許多國的民前往，說：來吧，我們登耶和華的山，奔雅各神的殿。他必將他的道教訓我們；我們也要行他的路。因為訓誨必出於錫安；耶和華的言語必出於耶路撒冷。
2:4 他必在列國中施行審判，為許多國民斷定是非。他們要將刀打成犁頭，把槍打成鐮刀。這國不舉刀攻擊那國；他們也不再學習戰事。
2:5 雅各家啊，來吧，我們在耶和華的光明中行走。
2:6 因為你離棄了你百姓雅各家，因為他們滿有從東方來的風俗，並行巫術像非利士人，與外邦人擊掌相交。
2:7 他們的地滿了金銀，財寶也無窮；他們的地滿了馬匹，車輛也無數。
2:8 他們的地滿了偶像；他們跪拜自己手所造的，就是自己指頭所作的。
2:9 人都屈身，各人自卑，所以不可赦免他們。
2:10 你進入磐石，藏在土中，躲避耶和華的驚嚇和他威嚴的榮光。
2:11 到那日，眼目高傲的必降為卑，人的狂傲必屈膝，惟獨耶和華被尊崇。
2:12 萬軍之耶和華降罰的日子，要臨到一切驕傲狂妄的人，臨到一切自高的人，他都必降為卑；
2:13 臨到利巴嫩高大的香柏樹和巴珊所有的橡樹；
2:14 臨到一切高山和一切高起的山崗；
2:15 臨到每座高臺和每座堅固城牆；
2:16 臨到他施所有的船隻和一切可愛的美物。
2:17 人的狂傲必屈膝，人的高傲必降卑；在那日，惟獨耶和華被尊崇。
2:18 偶像必全然廢棄。
2:19 耶和華興起，使地大震動，人就進入磐石穴中，進入土穴裡，躲避耶和華的驚嚇和他威嚴的榮光。
2:20 到那日，人必將他們向鼴鼠和蝙蝠所造拜的金偶像、銀偶像拋棄，
2:21 躲進磐石穴中，和岩石的縫裡，躲避耶和華興起使地大震動時的驚嚇和他威嚴的榮光。
2:22 你們休要倚靠世人，他鼻孔裡不過有氣息；他有甚麼可重看的呢？`,

  '8/3': `3:1 看哪，主萬軍之耶和華要從耶路撒冷和猶大除去他們所倚靠的，就是所倚靠的糧食和水，
3:2 就是勇士和戰士、審判官和先知、占卜的和長老、
3:3 五十夫長和尊貴人、謀士和有智慧的工匠，並精通符咒的人。
3:4 我必使孩童作他們的首領；嬰孩必轄管他們。
3:5 百姓彼此欺壓，人壓人，鄰舍壓鄰舍；少年人侮慢老年人，卑賤人藐視尊貴人。
3:6 那時，人必抓住他弟兄，就是他父家的人，說：你有外衣，你可以作我們的官長，這些敗落的事可以歸在你手下。
3:7 那日，他必揚聲說：我不能醫治你們的傷；在我家裡沒有糧食，也沒有外衣，你們不要立我作百姓的官長。
3:8 耶路撒冷搖搖欲墜，猶大傾倒，因為他們的言語和行為得罪耶和華，悖逆他榮耀的眼目。
3:9 他們臉上所現的，作見證反對他們；他們述說自己的罪，並不隱瞞，好像所多瑪一樣。他們有禍了！因為作惡自害。
3:10 你們要論義人說：他必享福樂，因為要吃自己行為所結的果子。
3:11 惡人有禍了！他必遭災難；因為要照自己手所行的受報。
3:12 至於我的百姓，孩童欺壓他們，婦女轄管他們。我的百姓啊，引導你們的使你們走錯，並毀壞你們所行的路。
3:13 耶和華起來辯論，站著審判眾民。
3:14 耶和華必審問他百姓中的長老和首領說：吃盡葡萄園果子的就是你們；向貧窮人所奪的，都在你們家中。
3:15 主萬軍之耶和華說：你們為何壓制我的百姓，搓磨貧窮人的臉呢？
3:16 耶和華說：因為錫安的女子狂傲，行走挺項，賣弄眼目，俊俏行步，腳下玎璫，
3:17 所以主必使錫安的女子的頭長瘡，耶和華必使她們的隱密處赤露。
3:18 到那日，主必除掉她們華美的腳鐲、頭網、月牙圈、
3:19 耳墜、手鐲、面網、
3:20 華冠、足鍊、腰帶、香盒、符囊、
3:21 戒指、鼻環、
3:22 禮服、外套、手巾、荷包、
3:23 手鏡、細麻衣、裹頭巾、蓋頭巾。
3:24 必有臭氣代替馨香，繩子代替腰帶，光禿代替美髮，麻衣代替華服，烙印代替美容。
3:25 你的男丁必倒在刀下；你的勇士必死在陣上。
3:26 錫安的城門必哀慟悲傷；她必荒涼，坐在地上。`,

  '8/4': `4:1 那日，七個女人必抓住一個男人，說：我們自己有糧食吃，自己有衣服穿，只要你給我們稱為你的名，把我們的羞辱除掉。
4:2 到那日，耶和華的苗裔必華美尊榮，地的出產必為以色列逃脫的人而有榮耀，有華美。
4:3 那時，凡剩在錫安、留在耶路撒冷的，就是一切住在耶路撒冷、在生命冊上所登錄的，必稱為聖。
4:4 主將審判的靈和焚燒的靈澆灌錫安女子，洗去她們身上的污穢，把耶路撒冷中殺人的血除掉，那時，
4:5 耶和華必在錫安全山並各會所之上，使白日有雲，有煙；黑夜有火焰的光。因為在一切榮耀之上必有遮蔽。
4:6 必有亭子，白日可以遮蔭，防備風雨，作為藏身之所。`,

  '8/5': `5:1 我要為我所親愛的唱歌，是我親愛的人關於他葡萄園的歌。我所親愛的有一個葡萄園，在肥美的山岡上。
5:2 他刨挖園子，撿去石頭，栽種上等的葡萄樹，在園中蓋了一座樓，又鑿了一個壓酒池；指望結好葡萄，反倒結了野葡萄。
5:3 耶路撒冷的居民和猶大人啊，請你們在我與我的葡萄園中間判斷。
5:4 我為我的葡萄園所做的，還有甚麼可做的呢？我指望結好葡萄，怎麼倒結了野葡萄呢？
5:5 現在我告訴你們，我要向我的葡萄園怎樣行。我必撤去籬笆，使它被吞滅；拆毀牆垣，使它被踐踏；
5:6 我必使它荒廢，不再修剪，不再鋤挖，荊棘蒺藜倒要生長。我也必命令雲不降雨在其上。
5:7 萬軍之耶和華的葡萄園，就是以色列家；他所喜愛的樹，就是猶大人。他指望的是公平，那知倒有暴虐；指望的是公義，那知倒有哀聲。
5:8 禍哉！那些以地連地、以房接房，以致不留餘地的，只顧自己獨居境內。
5:9 萬軍之耶和華在我耳中說：必有許多又大又美的房屋成為荒場，無人居住。
5:10 因為十畝葡萄園只出一罷特酒，一賀姆種子只出一伊法糧食。
5:11 禍哉！那些清早起來追求濃酒，留連到夜深、飲酒醺醺然的人！
5:12 他們在筵席上彈琴、鼓瑟，擊鼓、吹笛，飲酒；卻不顧念耶和華的作為，也不留心他手所做的事。
5:13 所以，我的百姓因無知識就進入了擄地；他們的尊貴人甚是飢餓，群眾極其乾渴。
5:14 因此陰間擴張其欲，開了無限量的口；他們的榮耀并群眾，他們的繁華並快樂之人，都落在其中。
5:15 平民屈身，尊貴人降卑，狂傲人的眼目也降低了。
5:16 惟有萬軍之耶和華因公平而崇高，聖者神因公義顯為聖。
5:17 那時羊羔必照常吃草，肥壯的畜類並移來的牲口，必在荒廢之地吃草。
5:18 禍哉！那些以虛假之繩牽罪孽，以車繩拉罪惡的人，
5:19 說：讓他速速施行他的作為，使我們得見；讓以色列聖者的謀算趕快成就，使我們知道。
5:20 禍哉！那些稱惡為善、稱善為惡，以暗為光、以光為暗，以苦為甜、以甜為苦的人。
5:21 禍哉！那些自以為有智慧，自以為有聰明的人。
5:22 禍哉！那些以能飲酒為勇士，以能調濃酒的人為大能的人，
5:23 他們因受賄賂，就稱惡人為義；將義人的義奪去。
5:24 所以，火焰怎樣吞滅碎草，乾草怎樣落在火焰之中，他們的根必像朽物，他們的花必像灰塵飛騰。因為他們棄絕萬軍之耶和華的律法，藐視以色列聖者的言語。
5:25 所以，耶和華的怒氣向他的百姓發作，他的手伸出攻擊他們，山嶺都震動；他們的屍首好像糞土，在大街上被丟棄。這樣，他的怒氣還沒有轉消，他的手仍伸出來。
5:26 他必豎立大旗，招遠方的國民，吹口哨，使他們從地極而來；他們必急速奔來。
5:27 他們中間沒有疲倦的，沒有絆跌的；都不打盹，都不睡覺；腰帶也不解，鞋帶也不斷。
5:28 他們的箭是銳利的，弓都是張開的；馬蹄好像堅石，車輪好像旋風。
5:29 他們的咆哮如獅子，如少壯獅子咆哮；他們要咆哮，抓住掠物，安然帶去，無人救回。
5:30 當那日，這民必有哀聲，如同海浪的響聲；仰觀地面，看見的只有黑暗和愁苦，光明已在雲中變為幽暗。`,

  '8/6': `6:1 當烏西雅王崩的那年，我見主坐在高高的寶座上。他的衣裳垂下，遮滿聖殿。
6:2 其上有撒拉弗侍立，各有六翅：用兩翅遮臉，兩翅遮腳，兩翅飛翔；
6:3 彼此呼喊說：聖哉！聖哉！聖哉！萬軍之耶和華；他的榮光充滿全地！
6:4 因呼喊者的聲音，門限的根基震動，殿充滿了煙雲。
6:5 那時我說：禍哉！我滅亡了！因為我是嘴唇不潔的人，又住在嘴唇不潔的民中，又因我眼見大君王萬軍之耶和華。
6:6 有一撒拉弗飛到我跟前，手拿紅炭，是用夾子從壇上取下來的；
6:7 用炭沾我的口，說：看哪，這炭沾了你的嘴；你的罪孽便除掉，你的罪惡就赦免了。
6:8 我又聽見主的聲音說：我可以差遣誰呢？誰肯為我們去呢？我說：我在這裡，請差遣我！
6:9 他說：你去告訴這百姓說：你們聽是要聽見，卻不明白；看是要看見，卻不曉得。
6:10 要使這百姓心蒙脂油，耳朵發沉，眼睛昏迷；恐怕眼睛看見，耳朵聽見，心裡明白，回轉過來，便得醫治。
6:11 我就說：主啊，這到幾時為止呢？他說：直到城邑荒涼，無人居住，房屋空閒無人，地土極其荒涼；
6:12 耶和華將人遷到遠方，在這境內被撇棄的地方甚多。
6:13 境內剩下的人若還有十分之一，也必被吞滅；好像發裡斯樹和橡樹，雖被砍伐，樹墩子仍在；這聖潔的種類在國中也是如此。`,

  '8/7': `7:1 烏西雅的孫子、約坦的兒子、猶大王亞哈斯在位時，亞蘭王利汛和利瑪利的兒子以色列王比加上來攻打耶路撒冷，卻不能攻取。
7:2 有人告訴大衛家說：亞蘭與以法蓮已經同盟。亞哈斯和他百姓的心就都跳動，好像林中的樹被風吹動一樣。
7:3 耶和華對以賽亞說：你和你的兒子示雅雅述出去，到上水池的溝端，在漂布地的大路上，去迎接亞哈斯；
7:4 對他說：你要謹慎安靜，不要因亞蘭王利汛並利瑪利兒子所發的烈怒，心裡恐懼，也不要膽怯；那不過是兩個冒煙的火把頭。
7:5 因為亞蘭，並以法蓮和利瑪利的兒子，同謀陷害你，說：
7:6 我們可以上去攻打猶大，使他驚惶，攻取它，然後立他比勒的兒子為王，在其中作王。
7:7 主耶和華如此說：這事必不成立，也不成就；
7:8 原來亞蘭的頭是大馬士革，大馬士革的頭是利汛；以法蓮的頭是撒馬利亞，撒馬利亞的頭是利瑪利的兒子。你們若是不信，定然不得立穩。
7:9 （以法蓮六十五年之內必然破壞，不再成為國民。）
7:10 耶和華又曉諭亞哈斯說：
7:11 你可以求耶和華你神賜你一個兆頭，或求諸深處，或求諸高處。
7:12 亞哈斯說：我不求，我不試探耶和華。
7:13 以賽亞說：大衛家啊，你們當聽！你們使人厭煩豈算小事，還要使我的神厭煩嗎？
7:14 因此，主自己要給你們一個兆頭，必有童女懷孕生子，給他起名叫以馬內利。
7:15 到他曉得棄惡擇善的時候，他必吃奶油與蜂蜜。
7:16 因為在這孩子還不曉得棄惡擇善之先，你所憎惡的那兩王之地，必致見棄。
7:17 耶和華必使亞述王降臨你，降臨你的民，降臨你父家，臨到的日子是自從以法蓮離開猶大以來所未有的。
7:18 到那日，耶和華要發口哨招埃及河源極遠之地的蒼蠅，和亞述地的蜜蜂來；
7:19 他們都要來，落在荒涼的山谷中，磐石的穴裡，一切的荊棘上，一切的草場中。
7:20 到那日，主必用雇來的剃頭刀，就是用大河那邊的亞述王，剃去頭髮和腳上的毛，並要剃去鬍鬚。
7:21 到那日，必有人養活一頭母牛，兩隻羊；
7:22 因所出的奶多，他必有奶油吃。凡在國中剩下的人都必有奶油和蜂蜜吃。
7:23 到那日，凡有千株葡萄樹價值銀子一千舍客勒之處，必盡長荊棘和蒺藜。
7:24 人去那裡，必帶弓箭；因為遍地盡是荊棘和蒺藜。
7:25 所有用鋤刨鋤的山地，你因怕荊棘和蒺藜都不去那裡；只可放牛，讓羊踐踏。`,

  '8/8': `8:1 耶和華對我說：你取一個大牌，用普通的筆在其上寫「瑪黑珥沙拉勒哈施罷斯」（就是快快搶奪、急急擄掠的意思）。
8:2 我就使烏利雅祭司和耶比利家的兒子撒迦利雅，為我作了可信的見證人。
8:3 我就親近我的妻，她懷孕生了一個兒子。耶和華對我說：給他起名叫瑪黑珥沙拉勒哈施罷斯。
8:4 因為在這孩子還不曉得叫父叫母的時候，大馬士革的財寶和撒馬利亞的擄物，必在亞述王面前被擄去。
8:5 耶和華又曉諭我說：
8:6 這百姓既厭棄西羅亞緩流的水，喜悅利汛和利瑪利的兒子，
8:7 因此，主必使大河翻騰的水猛烈地漲起來，就是亞述王和他一切的威勢，漫過一切的河道，漫過一切的堤岸，
8:8 漫流到猶大，漲溢氾濫，直到頸項。以馬內利啊！他展開翅膀，必遍滿你的地。
8:9 列國的人民哪，任憑你們喧嚷，終必破壞；遠方眾地的人哪，你們要側耳而聽，雖然束腰（就是預備打仗的意思），終必破壞；雖然束腰，終必破壞。
8:10 你們同謀，終歸無效；你們說定，必不成立；因為神與我們同在。
8:11 耶和華以大能的手教訓我，警戒我不可行這百姓所行的路。他說：
8:12 這百姓所說的謀反，你們不要說謀反，他們所怕的，你們不要怕，也不要畏懼。
8:13 但要尊萬軍之耶和華為聖，以他為你們所當怕的，所當畏懼的。
8:14 他必作為聖所，卻也作以色列兩家的絆腳石和磐石，作耶路撒冷居民的網羅和圈套。
8:15 許多人必在其上絆跌跌倒，而且跌碎；又中了網羅，被捉住。
8:16 我要把這見證書捲起來，封住我門徒中間的訓誨。
8:17 我要等候那掩面不顧雅各家的耶和華，我也要仰望他。
8:18 看哪！我與耶和華所給我的兒女都成了以色列中的預兆和奇蹟。這些事都出於住在錫安山的萬軍之耶和華。
8:19 有人對你們說：當求問那些交鬼的和行巫術的，就是聲音綿蠻、言語微細的；你們當回答說：民不當求問自己的神嗎？豈可為活人求問死人呢？
8:20 人當以訓誨和法度為標準！他們所說的，若不與此相符，必不得見晨光。
8:21 他們必經過這地，受艱難，受饑餓；他們飢餓的時候，心中煩躁，咒罵自己的王和自己的神，臉向上仰，
8:22 向地觀看，只見患難、黑暗，和令人苦惱的幽暗；他們必被趕入漆黑的幽暗中。`,

  '8/9': `9:1 但那受過痛苦的，必不再見幽暗。從前神使西布倫地和拿弗他利地被藐視，末後卻使這沿海的路，約旦河外，外邦人的加利利地，得著榮耀。
9:2 在黑暗中行走的百姓看見了大光；住在死蔭之地的人有光照耀他們。
9:3 你使這國民繁多，加增他們的喜樂；他們在你面前歡喜，好像收割的歡喜，像人分擄物那樣地快樂。
9:4 因為他們所負的重軛和肩頭上的杖，並欺壓他們人的棍，你都已折斷，好像在米甸的日子一樣。
9:5 因為戰士在亂殺之間所穿都帶血的衣服，並一切滾在血中的衣服，都必作為燃料，被火焚燒。
9:6 因有一嬰孩為我們而生，有一子賜給我們；政權必擔在他的肩頭上；他名稱為奇妙、策士、全能的神、永在的父、和平的君。
9:7 他的政權與平安必加增無窮，他必在大衛的寶座上治理他的國，以公平公義使國堅定穩固，從今直到永遠。萬軍之耶和華的熱心必成就這事。
9:8 主使言語臨到雅各，降在以色列；
9:9 以法蓮和撒馬利亞的居民，都必知道；他們心存驕傲，說：
9:10 磚牆塌了，我們必用鑿石建造；桑木砍了，我們必用香柏木代替。
9:11 因此，耶和華要激動利汛的敵人攻擊他，並要激動以色列的仇敵來，
9:12 就是前面的亞蘭人和後面的非利士人；他們要張口吞吃以色列。雖然如此，耶和華的怒氣還沒有轉消，他的手仍伸出來。
9:13 這百姓雖受責打，仍不歸向打他們的主；也不尋求萬軍之耶和華。
9:14 因此，耶和華一日之間，要從以色列中剪除頭與尾、棕樹枝與蒲草。
9:15 長老和尊貴人是頭；以謊言教人的先知是尾。
9:16 領這百姓的，使他們走錯了路；被領的人，都陷在迷惑之中。
9:17 所以，主不喜悅他們的少年人，也不憐恤他們的孤兒寡婦；因為各人都是褻瀆的，是行惡的，各人的口都說愚妄的話。雖然如此，耶和華的怒氣還沒有轉消，他的手仍伸出來。
9:18 邪惡像火焚燒，燒滅荊棘和蒺藜，在稠密的樹林中著火，就旋轉上騰如同煙柱。
9:19 因萬軍之耶和華的烈怒，地遭燒滅，百姓如火的燃料；人不顧惜弟兄。
9:20 他們向右搶奪，仍受饑餓；向左吞吃，不得飽足；各人吃自己本族人的肉。
9:21 瑪拿西吞吃以法蓮，以法蓮吞吃瑪拿西；他們又一同攻擊猶大。雖然如此，耶和華的怒氣還沒有轉消，他的手仍伸出來。`,

  '8/10': `10:1 禍哉！那些設立不義之律例的，和那些筆下所寫有害之規的，
10:2 為要屈枉窮乏人，奪去我民中困苦人的權利，以寡婦當作擄物，以孤兒當作掠物。
10:3 到懲罰的日子，並從遠方來的毀滅臨到的時候，你們怎樣行呢？你們向誰逃奔求助呢？你們的榮耀寄在哪裡呢？
10:4 他們只得屈身在被擄的人以下，仆倒在被殺的人以下。雖然如此，耶和華的怒氣還沒有轉消，他的手仍伸出來。
10:5 亞述是我憤怒的棍，手中拿我惱恨的杖。
10:6 我要打發他攻擊褻瀆的國民，命令他攻擊我所惱怒的百姓，擄掠他們的財物，搶奪他們的貨財，將他們踐踏，如同街上的泥土。
10:7 但他不這樣意思，他心也不這樣籌算；他心裡倒是要毀滅，要剪除不少的國。
10:8 因為他說：我的將領不都是君王嗎？
10:9 加勒挪不是像迦基米施嗎？哈馬不是像亞珥拔嗎？撒馬利亞不是像大馬士革嗎？
10:10 我手已夠著那有偶像的列邦，他們雕刻的偶像勝過耶路撒冷和撒馬利亞的；
10:11 我既向撒馬利亞和她的偶像這樣行，豈不也向耶路撒冷和她的偶像這樣行嗎？
10:12 主說：等主成就了他加在錫安山並耶路撒冷上的全工，我必罰亞述王所結的果子，就是他心裡高傲的樣式和他眼目狂傲的神氣。
10:13 因為他說：我是憑自己手的能力和智慧行這事的，我本有聰明；我挪移列國的疆界，搶奪他們所積蓄的財物，並且我像有力量的人，使坐寶座的人屈服。
10:14 我的手搜尋列國的財富，好像人搜尋有蛋的窩；我搜取全地，好像人拾棄下的蛋；沒有動翅膀的，沒有開嘴的，也沒有叫的。
10:15 斧子豈可向那用斧子砍木的自誇呢？鋸豈可向那用鋸的人自大呢？好像棍杖能揮動那舉起棍杖的人；好像棍棒能舉起那不是木頭的人。
10:16 所以，主萬軍之耶和華要在他肥壯之人身上，使形體消瘦；在他的榮耀底下有火著起，燃燒如火焰。
10:17 以色列的光必如火，他的聖者必如火焰；在一日之內，將亞述的荊棘和蒺藜焚燒燒盡。
10:18 他樹林和肥地的榮耀他必全然燒盡，好像病人消滅一樣。
10:19 樹林所剩的樹必稀少，就是孩子也能寫得清楚。
10:20 到那日，以色列剩下的人和雅各家逃脫的人，不再仰賴那打他們的人，卻要誠實倚靠耶和華以色列的聖者。
10:21 雅各家的餘剩者，就是剩下的人，必歸回全能的神那裡。
10:22 以色列啊，你的民雖多如海沙，其中只有餘剩的人得以歸回；滅絕的事，命定要施行，使公義如洪水滾滾而來。
10:23 已定了，主萬軍之耶和華在全地施行滅絕的事。
10:24 所以，主萬軍之耶和華如此說：住在錫安我的百姓啊，亞述王雖用棍擊打你，舉杖打你，像從前埃及打你一樣，你卻不要怕他。
10:25 因為不多幾時，向你發的忿怒要完結，我的怒氣要向他們發作，使他們滅亡。
10:26 萬軍之耶和華要奮起鞭打他，像在俄立磐石打敗米甸人一樣；他要舉杖向海，像在埃及一樣。
10:27 到那日，他的重擔必離開你的肩頭，他的軛必離開你的頸項；那軛因膏油的緣故必然損壞。
10:28 敵人來到亞葉，經過米磯崙，在密抹存放他的輜重；
10:29 他們渡過山口，在迦巴住宿；拉瑪人戰兢，掃羅的基比亞人逃跑。
10:30 迦琳的居民哪，放聲大叫！拉億沙人哪，要細聽！可憐的亞拿突人哪！
10:31 瑪得米拿的居民逃散；基比珥的居民走避。
10:32 他今日要在挪伯住宿，向錫安女兒山搖手。
10:33 看哪，主萬軍之耶和華要用大能將枝條砍下，高大的樹被砍倒，高的要降低。
10:34 他用鐵砍伐叢密的樹林，利巴嫩被大能者砍倒。`,

  '8/11': `11:1 從耶西的本（原文是根）必發一條，從他根生的枝子必結果實。
11:2 耶和華的靈必住在他身上，就是使他有智慧和聰明的靈，謀略和能力的靈，知識和敬畏耶和華的靈。
11:3 他必以敬畏耶和華為樂；行審判不憑眼見，斷是非也不憑耳聞；
11:4 卻要以公義審判貧窮人，以正直判斷世上的謙卑人，以口中的杖擊打世界，以嘴裡的氣殺戮惡人。
11:5 公義必作他腰間的帶，信實必作他脅下的帶。
11:6 豺狼必與綿羊羔同居，豹子與山羊羔同臥；少壯獅子與牛犢並肥畜同群；小孩子要牽引他們。
11:7 牛與熊同食，牛犢與小熊同臥；獅子必吃草，與牛一樣。
11:8 吃奶的孩子必玩耍在虺蛇的洞口；斷奶的嬰兒必按手在毒蛇的穴上。
11:9 在我聖山的遍處，這一切都不傷人，不害物；因為認識耶和華的知識要充滿遍地，好像水充滿洋海一般。
11:10 到那日，耶西的根立作萬民的大旗；外邦人必尋求他，他安息之所大有榮耀。
11:11 到那日，主必二次伸手救回自己百姓中所剩的餘民，就是在亞述、埃及、巴忒羅、古實、以攔、示拿、哈馬，並海島所剩下的。
11:12 他必向外邦人豎立大旗，召集以色列被趕散的人，又從天下四方聚集猶大分散的人。
11:13 以法蓮的嫉妒心必消除，猶大的仇敵必被剪除；以法蓮不嫉妒猶大，猶大也不攻擊以法蓮。
11:14 他們要向西飛到非利士人的海邊，一同擄掠東方人，伸手取以東和摩押，亞捫人也要順從他們。
11:15 耶和華要使埃及海（就是紅海）的舌（就是灣）乾枯，用大能的風，對大河，揮手吹來，將那河分作七股，使人穿鞋可以走過去。
11:16 為主從亞述所剩的余民，必有一條大道，如同以色列人從埃及地上來的時候一樣。`,

  '8/12': `12:1 到那日，你要說：耶和華啊，我要稱謝你！因為你雖然向我發怒，你的怒氣卻轉消了，你又來安慰我。
12:2 看哪！神是我的拯救；我要倚靠他，並不懼怕；因為主耶和華是我的力量，是我的詩歌，他也成了我的拯救。
12:3 所以，你們必從救恩的泉源歡然取水。
12:4 到那日，你們要說：當稱謝耶和華，求告他的名，將他所行的事傳揚在萬民中，題說他的名被尊崇。
12:5 要歌頌耶和華，因他所行的甚是美好；願這事傳遍天下。
12:6 錫安的居民哪，當揚聲歡呼，因為以色列的聖者在你們中間，而且為大。`,

  '8/13': `13:1 亞摩斯的兒子以賽亞所得的默示，是論巴比倫的。
13:2 你們要在淨光的山上豎立大旗，向他們揚聲；搖手，使他們進入貴胄的門。
13:3 我吩咐了我所潔淨的人，也召了我的勇士，就是那因我發怒而誇勝的，使他們完成我的憤怒。
13:4 有許多人的聲音，像是山上的聲音，又像是許多國民的聲音；是萬軍之耶和華點兵的聲音，是調兵出戰的聲音。
13:5 他們是從遠方的國中而來，從天邊而來，就是耶和華並他惱怒的兵器，要毀滅全地。
13:6 你們要哀號，因為耶和華的日子臨近了！這日來到，好像毀滅從全能者來到。
13:7 所以，人手都必軟弱；人心都必消化。
13:8 他們必驚惶悲傷；疼痛抓住他們，好像產難的婦人一樣。他們彼此驚奇，臉如火焰。
13:9 看哪，耶和華的日子臨到，必有殘忍、忿怒、烈怒，使這地荒涼，從其中滅絕罪人。
13:10 天上的眾星和各星宿都不發光；日頭一出就黑暗了，月亮也不放光。
13:11 我必因邪惡刑罰世界，因罪孽刑罰惡人，使驕傲人的狂妄止息，制伏強暴人的狂傲。
13:12 我必使人比精金更少，使人比俄斐純金更罕。
13:13 我萬軍之耶和華，因烈怒的緣故，要使天震動；當他發烈怒的日子，地要從本位搖動。
13:14 人民必如被趕散的獐鹿，又如無人收攏的羊群，各歸回故土，各逃奔本地。
13:15 凡被拿住的必被剌透；凡被捉著的必倒在刀下。
13:16 他們的嬰孩必在眼前摔碎；他們的房屋必被搶奪；他們的妻子必被玷污。
13:17 看哪，我必激動瑪代人來攻擊他們，瑪代人不重視銀子，也不喜愛金子。
13:18 他們必用弓射殺少年人，不憐憫婦人所生的；眼不顧惜孩子。
13:19 巴比倫素來為列國的榮耀，為迦勒底人所誇美的華美之地，必像神所傾覆的所多瑪、蛾摩拉一樣。
13:20 其中必永無人煙，世世代代無人居住；亞拉伯人也不在那裡支搭帳棚；牧人也不使羊群臥在那裡。
13:21 惟有曠野的走獸臥在那裡；貓頭鷹充滿那裡的房屋；鴕鳥住在那裡；野山羊在那裡跳舞。
13:22 豺狼在它的宮中咆哮，野狗在它的華麗宮殿中嗥叫。它遭滅絕的時候臨近，它的日子必不長久。`,

  '8/14': `14:1 耶和華必憐恤雅各，必再揀選以色列，將他們安置在本地；外邦人要連合他們，緊靠雅各家。
14:2 列國要帶他們回本地；以色列家要在耶和華的地上得外邦人為僕婢，並要擄掠那擄掠他們的，轄制那欺壓他們的。
14:3 耶和華在你受苦並勞碌，以及你被強逼服事的時候，必使你得平息。那時，
14:4 你必用這段言語來論說巴比倫王說：欺壓人的何竟息止！強逼人的何竟止息！
14:5 耶和華折斷了惡人的杖，打斷了掌權者的仗；
14:6 就是那發怒擊打眾族的，行施無息，以怒氣轄制列國，受無阻礙的迫害。
14:7 如今全地得享安息和平靜，人都發聲歌唱。
14:8 松樹和黎巴嫩的香柏樹都因你歡樂，說：自從你仆倒，再沒有人上來砍伐我們。
14:9 在你下面的陰間，從各處被激動，要迎接你來；在那裡叫了睡著的，就是世上的強暴人，都為你起來；叫列國所有的王都從寶座上起來。
14:10 他們都要發言對你說：你也變成軟弱像我們一樣，你也成了我們的樣子了。
14:11 你的威勢，和你琴瑟的聲音，都落到陰間；你下面鋪著蛆蟲，遮蓋你的是蟲子。
14:12 明亮之星，早晨之子啊，你何竟從天墜落？你這攻敗列國的，何竟被砍倒在地上？
14:13 你心裡曾說：我要升到天上；我要高舉我的寶座在神眾星以上；我要坐在聚會的山上，在北方的極處。
14:14 我要升到高雲之上；我要與至上者同等。
14:15 然而，你必墜落陰間，到坑中極深之處。
14:16 看見你的人，要定睛看你，仔細思想：難道這人就是使大地戰抖，使列國震動，
14:17 使世界如同荒野，使城邑傾覆，不釋放被擄之人歸家的嗎？
14:18 列國的王都享受尊榮，各在自己的陰宅裡安息；
14:19 惟獨你被拋棄，不得入你的陰宅，好像被丟棄，被人所憎惡，像被刺透的人，就是被刀殺的人，下到坑裡石頭那裡，像被踐踏的屍首一般。
14:20 你不得與列王一同埋葬，因為你毀壞你的地，殺害你的民。惡人的後裔永遠不出名。
14:21 為那行惡的列祖，要預備殺他兒子的地方，免得他們起來，得地為業，將城邑充滿天下。
14:22 萬軍之耶和華說：我必起來攻擊他們，將巴比倫的名號，並所剩的人口、子孫和後裔，一概剪除。這是耶和華說的。
14:23 我必使巴比倫為箭豬所有，又為積水之地；我也要用滅亡的掃帚掃淨他。這是萬軍之耶和華說的。
14:24 萬軍之耶和華起誓說：我怎樣思想定規，必照樣成就；我怎樣籌算，必照樣立定。
14:25 我必在我地折斷亞述人，在我山踐踏他；這樣，他的軛必離開以色列人，他的擔子必離開他們的肩頭。
14:26 這是定規全地的籌算；這是向萬國所伸出的手。
14:27 萬軍之耶和華既然定規，誰能廢棄呢？他的手已經伸出，誰能轉回呢？
14:28 亞哈斯王崩的那年，有這默示：
14:29 非利士全地啊，那打你的杖已經折斷，你不可歡喜；因為從蛇的根必生出毒蝮，他的果子是飛翔的火蛇。
14:30 最貧窮的人必有食物吃；窮乏人必安然躺臥；我卻要用飢荒殺滅你的根，也必殺死你所剩下的人。
14:31 城門哪，當哀號！城啊，當喊叫！非利士全地都消滅了！因為有煙從北方來，他行伍中並無散兵。
14:32 人當怎樣回答這國的使者呢？因為耶和華建立了錫安；他百姓中的困苦人必投奔在其中。`,

  '8/15': `15:1 論摩押的默示：摩押的亞珥，一夜之間被毀滅，歸於消滅！摩押的基珥，一夜之間被毀滅，歸於消滅！
15:2 摩押人上巴益（就是廟宇），又到底本，在邱壇上哭號；為尼波和米底巴，摩押人哀哭；各人頭上光禿，各人鬍鬚剃淨。
15:3 在他們街市上，各人腰束麻布；在房頂上，在寬闊處，人人哀哭，眼淚汪汪。
15:4 希實本和以利亞利揚聲號哭；他們的聲音聽達雅哈斯。所以摩押的兵士都喊叫；他的心靈極其戰抖。
15:5 我心為摩押哀號；他的貴胄逃到瑣珥，逃到以基拉施利施亞，他們上路哭泣；因為毀滅他們的路上，路斯億上坡，他們哭泣。
15:6 寧林的水必然乾涸，青草枯乾，嫩草滅沒，青綠之物一無所有。
15:7 所以，他們積蓄的財物，並所藏蓄的，都運過柳樹河。
15:8 哭聲遍傳摩押的四境；哀號聲傳到以基萊，哀哭聲傳到比珥以琳。
15:9 底們的水，充滿了血；我還要加增底們的患難：使逃避摩押的人，有獅子臨到，使那地所剩下的人，也有獅子臨到。`,

  '8/16': `16:1 你們當從西拉，取羊羔送給掌管那地之主，獻給錫安女兒的山。
16:2 摩押的女子在阿嫩渡口，必像飛鳥，像被驅散的雛鳥。
16:3 你們要籌謀，要決斷；當正午，使你的影如黑夜；要藏匿被趕散的人，不可賣脫逃跑的人。
16:4 要讓我被趕散的人在你們這裡寄居，摩押啊，要為他們作藏身之處，脫離那毀滅者。欺壓的事將要止息，毀滅的事必然滅沒；踐踏人的，從這地上滅絕。
16:5 必有寶座憑慈愛堅立；其上必有一人憑誠實坐在大衛帳幕中，審判、尋求公平、速行公義。
16:6 我們聽見了摩押的驕傲，是極其驕傲的；聽見他的狂傲、驕橫並憤怒，他的誇口是虛的。
16:7 所以，摩押人必為摩押哀號，眾人都哀號；你們要為基珥哈列設的葡萄餅歎息，那一味憂愁。
16:8 因為希實本的田和西比瑪的葡萄樹都枯萎了；列國的君王把葡萄樹最佳的枝子毀壞，那枝子伸到雅謙，飄過曠野；他的嫩枝伸出去，過過大海。
16:9 所以，我為西比瑪的葡萄樹哭泣，像雅謙的哭泣一樣；希實本和以利亞利啊，我要以眼淚滋潤你；因為你夏天的果子和收成，呼喊聲落到你身上。
16:10 從肥田中奪去了歡喜快樂；葡萄園裡無人歌唱，無人呼叫；踹酒的再不踹酒；我使歡呼的聲音止息。
16:11 所以，我心腸為摩押如琴發聲，我的心腸為基珥哈列設也是如此。
16:12 摩押人朝見，在邱壇上疲乏；他進入聖所禱告，也不蒙應允。
16:13 這是耶和華從前論摩押說的話。
16:14 現在耶和華說：三年之內，如同雇工人年限，摩押的榮耀，並他一切大眾的榮耀，都必藐視；其餘的人甚少，甚微，毫無能力。`,

  '8/17': `17:1 論大馬士革的默示：看哪，大馬士革已被棄置，不再為城，必變為亂堆。
17:2 亞羅珥的城邑被棄置，必成為羊群的地方；羊在那裡躺臥，無人使他們驚嚇。
17:3 以法蓮的保障必撤去；大馬士革的國權必滅絕；亞蘭所剩下的人必如以色列人的榮耀一樣。這是萬軍之耶和華說的。
17:4 到那日，雅各的榮耀必至衰微，他肥胖的身體必見消瘦。
17:5 必如收割的人收斂禾稼，用臂膀割取禾穗，又像人在利乏音谷拾取禾穗。
17:6 其中所剩下的，不過是零落的果子，好像打過的橄欖樹，在最高的枝頭上，只剩下兩三個果子；在多果樹的外枝上，只剩下四五個果子。這是耶和華以色列的神說的。
17:7 到那日，人必仰望造他們的主，眼目重看以色列的聖者；
17:8 不再仰望祭壇，就是他自己手所作的，不再重看他指頭所作的，無論是木偶是日像。
17:9 在那日，他堅固的城邑必如樹林中和山頂上所棄置的地方，就是被以色列人棄置的地方；都必荒涼。
17:10 因為你忘記了拯救你的神，不記念你能力的磐石；所以，你裁種佳美的植物，插上外邦的樹枝，
17:11 栽種的日子，你把籬笆圍上；早晨，你使你所種的發芽；但到收割的日子，所得的必飛去，那時則有苦楚，是無法醫治的痛苦。
17:12 哎！多民的喧嚷，他們喧嚷如同海浪；列邦奔騰，他們奔騰如同大水。
17:13 列邦奔騰，如同急流的大水；但神責備他們，他們就遠遠逃避，又被追趕如同山上的風前糠，如同暴風前的蓬草。
17:14 到了晚上，看見了大恐慌！早晨以前，敵人歸於消滅。這就是擄掠我們之人所得的分，是搶奪我們之人所受的報。`,

  '8/18': `18:1 唉！古實河外翅膀刷刷聲之地，
18:2 差遣使者在水面上，坐蒲草船過海。先知說：你們這快行的使者，去吧，往高大光滑皮膚的民那裡去。那民從開國以來，是被人敬畏的；是強暴橫行的；他們的地被江河分開。
18:3 世上一切的居民和地上的人哪，你們看見山上豎立的大旗，就要注目；你們聽見吹角的聲音，就要側耳。
18:4 因為耶和華對我這樣說：我要安靜，在我的居所觀看，如同日光中閃耀的晴熱，又如取物時的雲露。
18:5 收割之先，花已開放，花也成了將熟的葡萄，他必用鐮刀削去嫩枝，砍掉蔓延的枝條。
18:6 都要撇給山間的鷙鳥，和地上的野獸；鷙鳥必夏天聚集在其上，地上的野獸也必冬天聚集在其上。
18:7 到那時，這高大光滑皮膚的民，從開國以來，是被人敬畏的，是強暴橫行的，他們的地被江河分開，必帶禮物來到錫安山，就是萬軍之耶和華立名的地方。`,

  '8/19': `19:1 論埃及的默示：看哪，耶和華乘駕快雲，臨到埃及；埃及的偶像在他面前戰抖，埃及人的心在他裡面消化。
19:2 我必激動埃及人攻擊埃及人，弟兄攻擊弟兄，鄰舍攻擊鄰舍，這城攻擊那城，這國攻擊那國。
19:3 埃及人的心神必在裡面耗盡；我必敗壞他們的謀略；他們必求問偶像，並念咒的，交鬼的，行巫術的。
19:4 我必將埃及人交在殘忍主人的手中；強暴的王必轄制他們。這是主萬軍之耶和華說的。
19:5 海裡的水要乾涸；河流要消退乾涸。
19:6 河流要變臭，埃及的河道要減少乾涸；蘆葦和蒲草要枯乾。
19:7 靠尼羅河的莎草，並尼羅河旁，並一切在尼羅河旁種的田，都要枯乾；被風吹去，歸於無有。
19:8 打魚的人必哀號；凡在尼羅河裡撒鉤的，必都悲傷；在水面撒網的必都衰敗。
19:9 用梳好的麻布作工的，和織白布的，都必慚愧。
19:10 埃及的柱石（或作：有錢有勢的人）必崩壞；凡賣力作工的，心裡都必悲傷。
19:11 瑣安的首領，真是愚昧！法老最有智慧謀士的謀略，已成愚謀。你們怎敢對法老說：我是智慧人的子弟，是古代列王的後裔？
19:12 你的智慧人在哪裡呢？他們可以告訴你，萬軍之耶和華向埃及所籌算的是甚麼。
19:13 瑣安的首領都愚昧了，挪弗的首領都受了迷惑；他們是埃及支派的柱石，使埃及人走錯了路。
19:14 耶和華使彎曲的靈進入埃及裡面；首領使埃及一切所行的，都像醉酒之人嘔吐時所行的，彎彎曲曲。
19:15 埃及中，無論是頭，是尾，是棕樹枝，是蒲草，所作的事都無濟於事。
19:16 到那日，埃及人必像婦女一樣，他們因萬軍之耶和華在他們以上所舉起的手，必膽戰驚恐。
19:17 猶大地必使埃及人驚恐；向他提說那地，埃及人就懼怕；這是因萬軍之耶和華向埃及人所定的旨意。
19:18 到那日，埃及地必有五座城說迦南的方言，又指著萬軍之耶和華起誓；有一座城必稱為太陽城（或作：滅亡城）。
19:19 到那日，在埃及地中央必有一座壇歸於耶和華；在埃及的邊境，必有一根柱子歸於耶和華。
19:20 這壇在埃及地，必為萬軍之耶和華作記號和見證；埃及人因為受人欺壓，呼求耶和華，他就差一位救主、一位大能者，拯救他們。
19:21 這樣，耶和華必向埃及人顯現；到那日，埃及人必認識耶和華，也要奉祭物和供物事奉他，並向耶和華許願還願。
19:22 耶和華必擊打埃及，又醫治，他們就歸向耶和華；耶和華必允聽他們的禱告，醫治他們。
19:23 到那日，必有一條大路，從埃及通到亞述；亞述人要進入埃及，埃及人也要進入亞述，埃及人要與亞述人一同事奉耶和華。
19:24 到那日，以色列必與埃及、亞述三國一同使地上的人蒙福；
19:25 因為萬軍之耶和華賜福給他們，說：埃及我的百姓，亞述我手的工作，以色列我的產業，都是有福的。`,

  '8/20': `20:1 亞述王撒珥根差遣他珥探到亞實突，與他爭戰並取了那城。那時，
20:2 耶和華曉諭亞摩斯的兒子以賽亞說：你去解開你腰間的麻布，脫掉你腳上的鞋。他就這樣行，光著身子赤著腳走路。
20:3 耶和華說：我的僕人以賽亞，光著身子，赤著腳，已經行走三年，作為預兆和豫兆，警戒埃及和古實：
20:4 亞述王也必這樣擄去埃及人，遷移古實人，無論老少，都光著身子，赤著腳，露出下體，使埃及蒙羞。
20:5 那時，他們必因所仰望的古實，所誇耀的埃及，驚惶羞愧。
20:6 到那日，住在這海濱的必說：看哪，我們素所仰望的，就是我們為求脫離亞述王，所逃到的那國，他們遭遇如此，我們怎能逃脫呢？`,

  '8/21': `21:1 論海濱曠野的默示：有大風從南方颳來，好像在南地的旋風，從可畏的地方而來。
21:2 有嚴酷的異象，默示給我；欺騙的人行欺騙的事；毀滅的人施行毀滅。以攔哪，上去吧！瑪代啊，去圍吧！其中一切嘆息，我都使他止住。
21:3 所以我的腰間充滿了苦難；產難女人怎樣陣痛，我也一樣，聽見就覺心煩；見了就甚驚惶。
21:4 我的心迷迷糊糊，恐懼使我戰抖；我所羨慕的黃昏，變為我的驚嚇。
21:5 他們預備桌席，看守的人看守，他們吃喝；首領起來，用油抹盾牌。
21:6 主對我如此說：你去，設立守望的人，叫他將所看見的說出來。
21:7 他看見騎馬的人，成對的騎兵，騎驢的，騎駱駝的，他就留心，極其留心。
21:8 他像獅子大聲呼叫：主啊，我白日常站在守望臺上，整夜站在我崗位上；
21:9 看哪，有一隊騎兵，都是成對的騎馬人來了。那人就說：巴比倫傾倒了！傾倒了！她一切的神像，都打碎在地上。
21:10 我受踐踏的民，禾場上的穀啊，我從萬軍之耶和華以色列的神所聽見的，已傳告你們了。
21:11 論度瑪（度瑪就是以東）的默示：有人從西珥呼問我說：守望的人哪，夜裡怎樣了？守望的人哪，夜裡怎樣了？
21:12 守望的人說：早晨將到，黑夜也來，你們若要問就可以問；你們可以回頭再來。
21:13 論亞拉伯的默示：底丹的旅伴哪，你們必在亞拉伯的樹林中住宿。
21:14 提瑪地的居民拿水來給口渴的人喝，拿餅迎接逃亡的人。
21:15 因為他們逃避刀劍，就是出鞘的刀和彎弓，並嚴烈的戰役。
21:16 因為主對我這樣說：一年之內，如同雇工人的年限，基達的一切榮耀必歸消滅。
21:17 基達人的弓箭手，所剩的必稀少；這是耶和華以色列的神說的。`,

  '8/22': `22:1 論異象谷的默示：有甚麼事使你這全城的人，都上了房頂呢？
22:2 你這滿城歡騰、鬧嚷的城啊，那被殺的人不是被刀所殺，也不是死在爭戰中。
22:3 你的官長一同出走，不用弓就被擄去，你所有被找到的，雖曾逃遠，也都被擄去。
22:4 所以，我說：你們離開我，讓我苦苦地哭泣，不要因我民的毀滅，安慰我了。
22:5 因為主萬軍之耶和華有使人擾亂踐踏、令人哭泣的日子，臨到異象谷；城牆被拆毀，哀求的聲音達到山間。
22:6 以攔拿了箭袋，又有騎馬的和戰車的人；基珥人露出盾牌。
22:7 你最美的山谷必滿了戰車；騎馬的人必向城門擺列陣勢。
22:8 他揭去猶大的遮蔽，到那日，你就望見林屋的器械。
22:9 你們見大衛城的破口甚多，便積蓄下池的水。
22:10 你們數點耶路撒冷的房屋，拆毀房屋，加固城牆。
22:11 在兩道城牆中間，也挖了聚水池，可以取舊池的水；卻沒有仰望作這事的主，沒有看見定這事的他。
22:12 那日，主萬軍之耶和華叫人哭泣哀號，頭上光禿，腰束麻布；
22:13 誰知，人倒歡喜快樂，宰牛殺羊，吃肉喝酒，說：我們吃喝吧！因為明天要死了。
22:14 萬軍之耶和華親自默示我說：你們這罪孽，直到你們死，決不得赦免。這是主萬軍之耶和華說的。
22:15 主萬軍之耶和華說：你去見掌管王宮的書記（書記：或作家宰）舍伯那，
22:16 說：你在這裡作甚麼呢？你在這裡有甚麼人呢？竟在這裡鑿墳墓，在高處為自己鑿墳墓，在磐石中為自己鑿了居所。
22:17 看哪，耶和華必把你趕出，一定趕你。
22:18 他必把你縮成一團，輾成一球，拋在寬闊之地；書記啊，你必在那裡死，你榮華的車輛也在那裡；你主人的家，是你的羞辱。
22:19 我必趕你離開官職，把你從原位上傾倒。
22:20 到那日，我必召我僕人希勒家的兒子以利亞敬來；
22:21 我必將你的外袍給他穿上，將你的腰帶給他繫上，將你的政權交在他手中；他必作耶路撒冷居民和猶大家的父。
22:22 我必將大衛家的鑰匙放在他肩頭上；他所開的，沒有人能關；他所關的，沒有人能開。
22:23 我必將他釘在穩固之處，成為他父家榮耀的寶座。
22:24 他父家的一切榮耀，都要靠他支撐，包括後裔子孫，以及一切小器皿，從盆到一切罈子。
22:25 萬軍之耶和華說：當那日，釘在穩固之處的釘子必折斷，被砍落，那靠著它的擔子，也要滅絕；因為這是耶和華說的。`,

  '8/23': `23:1 論推羅的默示：他施的船隻啊，都要哀號！因為推羅毀滅，甚至沒有房屋，沒有可進入之地；這消息是從基提地傳來的。
23:2 海濱的居民哪，你們要靜默，是西頓的商家，從前在大水中使你豐盛的，如今填滿了你。
23:3 在大水中，西曷的糧食，就是尼羅河的莊稼，是她的進項；她成了列國的貿易場。
23:4 西頓當慚愧，因為大海說，就是那海中的保障說：我沒有勩疼，也沒有生產；我沒有養育男子，也沒有撫養童女。
23:5 這消息傳到埃及，他們就因推羅的消息甚是傷痛。
23:6 你們要逃往他施，沿海的居民哪，你們要哀號。
23:7 這就是你們歡樂的城，那古時所立，年代悠久，是她自己的腳帶她往遠方寄居的嗎？
23:8 那冠冕之城推羅，謀計這事，是誰呢？她的商家是王子；她的買賣人是世上的尊貴人。
23:9 這是萬軍之耶和華所定的，為要污辱一切高傲的榮耀，使地上一切的尊貴人被藐視。
23:10 他施的民哪，你們要歸回本地，如同漲過的尼羅河；腰帶已不再有了。
23:11 他將手伸到海上，震動列國；耶和華已吩咐毀滅迦南的保障。
23:12 他說：你被欺壓的西頓童女啊，你不能再歡樂了。起來，往基提去，在那裡也不得安息。
23:13 看哪，迦勒底人之地，從前沒有這國民；亞述人用野地的走獸立了他們，建立了高臺，設立他們的宮殿，使那城成為荒場。
23:14 他施的船隻哪，你們都要哀號，因你們的保障已毀滅。
23:15 到那時，推羅必被忘記七十年，照著一王的年日；七十年後，推羅的遭遇，就像妓女所唱的歌。
23:16 你這被忘記的妓女啊，拿琴遊行城中，巧彈多唱，使人記念你。
23:17 七十年後，耶和華必眷顧推羅，她仍歸舊業，與天下萬國的列王行淫。
23:18 但她所得的貨財，和所得的雇價，要歸耶和華為聖；不積蓄，不收藏，因為她的貨財必給那住在耶和華面前的人，使他們吃飽，穿耐久的衣服。`,

  '8/24': `24:1 看哪，耶和華使地空虛，使地荒涼，使地翻轉，又使其上的居民四散。
24:2 那時，百姓怎樣，祭司也怎樣；僕人怎樣，主人也怎樣；婢女怎樣，主母也怎樣；買物的怎樣，賣物的也怎樣；借錢的怎樣，借錢給人的也怎樣；放債的怎樣，欠債的也怎樣。
24:3 地必全然空虛，盡都荒涼；因為耶和華說了這話。
24:4 地悲哀衰殘，世界敗落衰殘；天地一起敗落，
24:5 地被其上的居民污穢；因為他們犯了律法，廢了律例，背了永約。
24:6 所以，咒詛吞滅了地，住在其上的顯為有罪；地上的居民被火焚燒，剩下的人甚少。
24:7 新酒悲哀，葡萄樹衰廢，心中歡樂的人都嘆息。
24:8 手鼓的快樂止息了，宴樂人的聲音歇了，豎琴的快樂也止息了。
24:9 他們不再飲酒唱歌；喝濃酒的人，以為苦。
24:10 荒涼的城拆毀了；各家關門，使人不能進去。
24:11 在街上因酒有哀號的聲音；一切喜樂都昏暗了；地上的歡樂都消逝了。
24:12 城中只有荒場；城門破壞，毫無修補。
24:13 在地上的列國民中，必是這樣：如同打過的橄欖樹，又如葡萄收盡之後所剩下的。
24:14 這些人要揚聲，為耶和華的威嚴，從海那邊歡呼。
24:15 所以，你們要在東方榮耀耶和華，在眾海島榮耀耶和華以色列神的名。
24:16 我們聽見從地極有歌聲說：榮耀歸給義者！但我說：我消瘦了，我消瘦了，我有禍了！行事詭詐的，大行詭詐；行事詭詐的，大大地行詭詐了。
24:17 地上的居民哪，坑和網羅，以及陷阱，都臨到你們。
24:18 必有人逃脫恐怖的聲音，卻陷入坑中；從坑中上來，必被網羅纏住。因為天上的窗戶開了，地的根基震動；
24:19 地破裂分開，地大大破碎，地震動搖撼。
24:20 地要像醉酒的人東倒西歪，搖撼如同吊床；罪過在其上沉重，必然塌陷，不能再起。
24:21 到那日，耶和華要在高處刑罰高處的軍旅，在地上刑罰地上的列王。
24:22 他們必聚集，好像囚犯聚集在坑中；他們必被關閉在牢獄中；過多日後，受刑罰。
24:23 那時月亮蒙羞，太陽慚愧；因為萬軍之耶和華在錫安山，在耶路撒冷作王；在他的長老面前，大有榮耀。`,

  '8/25': `25:1 耶和華啊，你是我的神；我要尊崇你，我要稱謝你的名；因為你以忠信誠實行了奇妙的事，成就了你古時所定的。
25:2 因為你使城變為石堆，使那堅固城變為荒場，把外邦人宮殿的城，不再為城，永遠不再建造。
25:3 所以，剛強的民必尊榮你；強暴之國的城必敬畏你。
25:4 因為你是窮乏人的保障，是患難中窮乏人的保障，是暴風雨中的避難所，是炎熱時的陰涼；因為強暴人的橫行如同暴風打牆一樣。
25:5 你必平息外邦人的喧嘩，好像乾燥之處的熱氣被雲影平息，剛強人唱凱歌的聲音也必平息。
25:6 在這山上，萬軍之耶和華必為萬民用肥甘設擺筵席，用陳酒和滿髓的肥甘，並澄清的陳酒設擺筵席。
25:7 他在這山上，必除去遮蓋萬民臉上的遮蓋，並掩蓋萬國的帕子。
25:8 他已吞滅死亡直到永遠。主耶和華必擦去各人臉上的眼淚，又除掉普天下他百姓的羞辱；因為這是耶和華說的。
25:9 到那日，人必說：看哪，這是我們的神；我們素來等候他，他必拯救我們。這是耶和華，我們素來等候他，我們必因他的救恩而快樂歡喜。
25:10 耶和華的手在這山上安歇；摩押在所在之地必遭踐踏，好像乾草被踏在糞池的水中一樣。
25:11 他必在其中伸手，好像游水的伸手游水，但他要使他的驕傲與他手所作的詭謀都降為卑。
25:12 你那城牆的高臺，他必使之傾倒，拆毀，直到地上，歸於塵土。`,

  '8/26': `26:1 到那日，在猶大地必唱這歌說：我們有堅固的城；神設諸救恩為牆，為垣。
26:2 敞開城門，使守信義的公義民族進入。
26:3 堅心倚賴你的，你必保守他十分平安，因為他倚靠你。
26:4 你們當倚靠耶和華直到永遠；因為耶和華是永久的磐石。
26:5 他把那些住高處的人降為卑；他把那高城拆平，拆平直到地上，歸於塵土。
26:6 腳必踏平它，就是窮苦人的腳，貧窮人的腳步。
26:7 義人所行的路是正直的；你，至直的，必修平義人的道路。
26:8 耶和華啊，我們在你審判的路上等候你；我們心裡所羨慕的，就是你的名，就是你的記念。
26:9 我心裡羨慕你，夜間我靈也殷切地尋求你；因為你在地上施行審判的時候，世上的居民就學習公義。
26:10 惡人得不著恩典，他在正直之地還要行不義，不見耶和華的威嚴。
26:11 耶和華啊，你的手高舉，他們仍不看見；他們卻要看見你為百姓所發的熱心，因而蒙羞；並且火要燒滅你的敵人。
26:12 耶和華啊，你必為我們立定平安；因為我們所作的事，都是你為我們成就的。
26:13 耶和華我們的神啊，你以外的主曾轄制我們；但我們只記念你，尊你的名。
26:14 他們已死，不能再活；他們已去世，不能再起；因為你刑罰他們，滅絕他們，使他們一切的記念消滅。
26:15 耶和華啊，你增添了這國民，增添了這國民，你得了榮耀；你擴張了這地一切的境界。
26:16 耶和華啊，他們在患難中尋求你；你的管教也臨到他們，他們禱告默求，就是你懲罰他們的時候。
26:17 耶和華啊，我們在你面前懷孕疼痛，生產的時候，不過生了風；地上未曾有拯救；世上的居民也沒有降生。
26:18 死人必復活，他們的屍首必興起，睡在塵埃的人哪，要醒起歌唱；因你的甘露是光明的甘露，地也要將死人交出來。
26:19 我的百姓啊，你們來進入內室，關上門，隱藏片時，等到忿怒過去。
26:20 看哪，耶和華從他的居所出來，要刑罰地上居民的罪孽；地也必露出其上的血，不再掩蓋被殺的人。
26:21 那日，耶和華必用他剛硬有力的大刀，刑罰鱷魚，就是那快行的蛇，刑罰鱷魚，就是那曲行的蛇，並殺海中的大魚。`,

  '8/27': `27:1 到那日，耶和華必用他剛硬有力的大刀，刑罰鱷魚，就是那快行的蛇，刑罰鱷魚，就是那曲行的蛇，並殺海中的大魚。
27:2 當那日，你們要念那美好的葡萄園！
27:3 我耶和華是看守葡萄園的；我要時刻澆灌，晝夜看守，免得有人損害。
27:4 我心中無忿恨；惟願荊棘蒺藜與我交戰，我就奮勇進攻，一同焚燒。
27:5 或者他可以投靠我為保障，與我和好，以致和好。
27:6 後日，雅各必生根，以色列必開花發芽，他們的果實必充滿天下。
27:7 耶和華打了他，是照他打那些打他之人嗎？他殺了他，是照他殺那些被他殺的人嗎？
27:8 你用驅逐的法子攻擊他，他所受的刑罰，是颳東風驅趕他的時候。
27:9 雅各罪孽的赦免，由此可見；除掉他罪的果效，在於他將祭壇一切的石頭，打碎如同燒透的石灰石，不再立木偶和日像。
27:10 因為堅固的城獨自荒涼，無人居住的住處，已被撇棄，像曠野一樣；牛犢在那裡吃草，在那裡躺臥，啃盡了那地的枝子。
27:11 枝子枯乾，必被折斷；婦女來，把它當柴燒。因為這是無聰明的民；所以，造他們的，不憐憫他們；塑造他們的，也不恩待他們。
27:12 以色列人哪，到那日，耶和華必從大河到埃及小河，一一地收斂你們。
27:13 到那日，必有大號角吹響，那些在亞述地快要滅亡的，和那些被趕散在埃及地的，都要來，在耶路撒冷聖山上敬拜耶和華。`,

  '8/28': `28:1 以法蓮醉漢的狂傲冠冕，有禍了！他榮華的花，是在肥美谷頂上，在酒所勝的人身上，是必衰殘的。
28:2 看哪，主有一位大能有力的人，如雹暴，如毀滅的暴風，如大水氾濫沖下，他必用手將那冠冕摔落在地。
28:3 以法蓮醉漢的狂傲冠冕，必被腳踐踏了。
28:4 那在肥美谷頂上，他榮華的花，是必衰殘的；又好像果子熟了，在夏天以先，人若看見就摘下來，纔到手就吞下去。
28:5 到那日，萬軍之耶和華必作剩下之民的榮耀冠冕，和華美頭冠。
28:6 又作那些坐官位審判人的，公義之靈，並城門前退敵之人的勇力。
28:7 只是這些人也因酒漿搖搖撞撞；因濃酒東倒西歪；祭司和先知因濃酒搖搖撞撞，被酒所困，因酒漿東倒西歪；他們看異象有錯謬，審判事有差錯。
28:8 各席上滿了嘔吐的污穢物，沒有一處乾淨。
28:9 他對誰講知識，向誰解釋信息呢？難道是向斷奶的，是向剛離懷的嗎？
28:10 因為他命上加命，令上加令，律上加律，例上加例，這裡一點，那裡一點。
28:11 他藉著口吃的嘴唇和異邦的舌，向這百姓說話。
28:12 他曾對他們說：你們可以在此安歇，你們可以使疲乏人得安歇；你們可以在此得舒暢。他們卻不肯聽。
28:13 所以，耶和華的話，向他們說，命上加命，令上加令，律上加律，例上加例，這裡一點，那裡一點，好使他們前行仆倒，跌落，受傷，陷入網羅，被捉住。
28:14 所以，你們這些管轄在耶路撒冷的百姓的說誇口話的人，當聽耶和華的話。
28:15 你們說：我們與死亡立約，與陰間結盟；敵軍如同洪水漫過的時候，不能到我們這裡，因為我們以謊言為逃避之所，在虛假中藏身。
28:16 所以，主耶和華如此說：看哪，我在錫安放一塊石頭作為根基，是試驗過的石頭，是穩固根基，寶貴的房角石；信靠的人必不著急。
28:17 我必以公平為準繩，以公義為線鉈；冰雹必衝去謊言的避所，大水必漫過藏身之處。
28:18 你們與死亡所立的約，必然廢棄；你們與陰間所結的盟，必然不立；敵軍漫過的時候，你們必被踐踏。
28:19 它漫過之時，必將你們帶走；因為每早晨它必漫過，白日黑夜都要漫過；明白這信息的，必受恐嚇。
28:20 床鋪短了，不夠伸腰；被窩窄了，不能遮身。
28:21 耶和華要起來，像在毗拉心山那樣；他要激動，像在基遍谷那樣，好做完他的工，就是奇異的工，成就他的事，就是稀奇的事。
28:22 所以，你們不可戲笑，恐怕捆綁你們的更緊；因為我從主萬軍之耶和華那裡聽見了，已定了要滅全地。
28:23 你們要側耳而聽我的話，細聽我的言語。
28:24 農夫豈是天天耕地拉犁，翻起土塊，還沒有整地播種嗎？
28:25 地既整平了，他豈不是撒大茴香，種小茴香，在地的四周種小麥，在那裡種大麥，在邊地種粗麥嗎？
28:26 因為他的神教導他理解，指示他。
28:27 大茴香非用重頭器械打，小茴香也不用碌碡碾；大茴香用棍子打，小茴香用杖擊。
28:28 做餅的糧食是要打碎的，人不只管打它；不只用碌碡碾它，不只讓馬蹄踹它。
28:29 這也是從萬軍之耶和華那裡出來的；他的謀略大而奇妙，智慧廣而超絕。`,

  '8/29': `29:1 哀哉！亞利伊勒（就是神的祭壇，或作：神的獅子）啊，大衛安營的城啊，你們年上加年，節期循環而行。
29:2 我必使亞利伊勒受艱難；那地必有悲傷哀號；那城對我，真如亞利伊勒（就是祭壇）。
29:3 我要四圍安營攻擊你，用壘包圍你，築臺攻擊你。
29:4 你必從地中被制伏，從土裡說話；你的聲音必從地裡發出，好像交鬼的說話；你的言語必發出細聲，從塵土說話。
29:5 然而你仇敵的多，必細如灰塵；強暴人的眾，必如過去的糠秕；這事成就是在頃刻之間，甚是突然。
29:6 萬軍之耶和華必用雷轟、地震、大聲，並旋風、暴風、吞滅的火焰，從天降臨，向他們討罪。
29:7 那時，與亞利伊勒爭戰的列國的眾人，就是一切攻擊他和他的保障，並使他受艱難的，必如夢境，如夜間的異象。
29:8 又如飢餓的人夢中吃飯，醒了，仍覺腹空；或如口渴的人夢中喝水，醒了，仍覺發渴，心裡甚不舒暢；攻擊錫安山列國的眾人，也要如此。
29:9 你們要遲疑，便失驚；你們要昏迷，便失聰；你們被酒所醉，卻不因酒，搖搖撞撞，卻不因濃酒。
29:10 因為耶和華將沉睡的靈澆灌你們，封閉你們的眼，就是先知的眼，又蒙蓋你們的頭，就是先見的頭。
29:11 所以，一切異象對你們，如同封住之書上的言語。人將這書交給識字的，說：請念吧！他說：我不能念，因為是封著的。
29:12 又將這書交給不識字的，說：請念吧！他說：我不識字。
29:13 主說：因為這百姓親近我，用嘴脣尊敬我，心卻遠離我；他們敬畏我，不過是領受人的吩咐。
29:14 所以，看哪，我要行奇妙的事，向這百姓行奇妙，又奇妙的事；他們智慧人的智慧，必然消滅；聰明人的聰明，必然隱藏。
29:15 禍哉！那些向耶和華深藏謀略的人，他們的作為都在暗中，他們說：誰看見我們呢？誰知道我們呢？
29:16 你們以為事情可以顛倒，窯匠可算為泥嗎？被製作的東西，豈可說製作它的人：他不製作我？作成的器物，豈可說制器的：他不聰明？
29:17 黎巴嫩不是要轉化為肥田，肥田不是看如樹林嗎？這不是在不多的時日後嗎？
29:18 到那日，耳聾的必聽見書上的言語；瞎子的眼，必從昏暗中明白。
29:19 謙卑的人必因耶和華增添歡喜；人中貧窮的必因以色列的聖者而快樂；
29:20 因為強暴人歸於無有，狂傲人消滅；一切得準機會作罪孽的，都被剪除。
29:21 就是那些在訴訟上陷害人的，在城門口設下羅網，捉拿仲裁者，並以空話傾敗義人的。
29:22 所以，救贖亞伯拉罕的耶和華，論到雅各家說：雅各從此不必抱慚愧，臉必不再變白；
29:23 但他看見他的子孫，就是我手的工作，在他中間，必尊我的名為聖，又尊雅各的聖者為聖，敬畏以色列的神。
29:24 心裡迷糊的，必得明白；埋怨的，必受教訓。`,

  '8/30': `30:1 耶和華說：禍哉！這悖逆的兒女，他們出謀，卻不由於我；他們結盟，卻不由於我的靈，以致罪上加罪。
30:2 他們起身下埃及，並沒有求問我；他們盼望法老的幫助，在埃及的蔭涼下避難。
30:3 但法老的幫助必致你們羞愧；在埃及的蔭涼下避難，必使你們慚愧。
30:4 他們的首領都在瑣安，他們的使者到了哈內斯，
30:5 他們都必因那不能幫助他們的民蒙羞，那民並無幫助，也無益處，惟有慚愧，也有凌辱。
30:6 論南地牲畜的默示：在危難窘迫之地，就是有母獅公獅、毒蛇飛龍的地方，他們把財物，馱在驢駒的背上，把貨物馱在駱駝的峰上，往那不能救他們的民那裡去。
30:7 埃及的幫助是枉然無益的；所以，我叫埃及為鬧而不動的拉哈伯。
30:8 現在你去，在他們面前將這話刻在版上，寫在書卷中，以便作為永遠的見證。
30:9 因為這是悖逆的百姓，虛謊的兒女；不肯聽從耶和華訓誨的兒女。
30:10 他們對先見說：不要見異象！對先知說：不要向我們講正直的話，以美言勸我們，說乖論謬吧！
30:11 你們要離開正路，偏行邪道，不要向我們提說以色列的聖者。
30:12 所以，以色列的聖者如此說：因為你們藐視這話，倚靠欺壓和狡猾，以此為根基；
30:13 所以，這罪孽在你們身上好像將要倒塌的高牆，漸漸凸出，立時速速地倒下。
30:14 要崩裂，好像窯匠的器皿被打碎，毫不顧惜，碎了，甚至找不到一塊碎片可以從爐中取火，或是從池中舀水。
30:15 主耶和華以色列的聖者曾如此說：你們得救在乎歸回安息；你們得力在乎平靜安穩；你們卻不肯。
30:16 你們說：不然，我們要騎馬逃跑；所以你們必然逃跑。又說：我們要騎快馬；所以追趕你們的，也必快跑。
30:17 一人恐嚇，你們就都逃跑；一千人的恐嚇，你們五個就都逃跑，直到你們剩下的，好像山頂的旗竿，山岡上的大旗。
30:18 耶和華必然等候，要施恩給你們；必然興起，要憐憫你們；因為耶和華是公平的神。凡等候他的，都是有福的。
30:19 耶路撒冷人哪，你們必不再哭泣。他必因你們呼求的聲音施大恩給你們；他聽見的時候，必回答你們。
30:20 主雖然以艱難給你們當餅，以患難給你們當水，你的教師卻不再隱藏；你的眼必看見你的教師。
30:21 你們或向左或向右，你們必聽見後邊有聲音說：這是正路，要行在其間。
30:22 你們必要玷污你那雕刻金偶像的銀包和銀偶像的金衣，把它們丟棄，像月經污穢之物；你要對它說：去吧！
30:23 那時，你播撒在地裡的種，耶和華必降雨；從地所生的糧食，必加倍豐盛；你的牲畜必在寬闊的草場吃草；
30:24 耕地的牛和驢駒，必吃用木鍬木杈揚淨，有鹽和味的草料。
30:25 在大行殺戮的日子，並高臺倒下的時候，各高山，各高岡，必有小河和水溝流出。
30:26 當耶和華纏裹他百姓的損傷，並醫治他所打傷之處的時候，月光必像日光，日光必加七倍，像七日的光一樣。
30:27 看哪，耶和華的名從遠方來，他的怒氣在燃燒，火焰極其猛烈；他的嘴脣滿有憤恨，他的舌頭如吞滅的火；
30:28 他的氣如漲溢的河，漲到頸項，要篩列國，使他們走滅亡的篩，並要用迷惑之嚼環，繫住列邦的腮骨。
30:29 你們必有歌聲，像人守聖節的夜間，並必有心裡的喜樂，像人吹笛，上耶和華的山，到以色列的磐石那裡。
30:30 耶和華必使人聽他威嚴的聲音，使人看見他降罰的手，是發烈怒的，並火焰燃燒，是陣雨，是暴風，是冰雹。
30:31 亞述人，必因耶和華的聲音戰驚；耶和華要用杖擊打他。
30:32 耶和華用杖擊打亞述人，就是所定受擊打的杖，每打一下，耶和華必調弦鼓琴，用怒氣的戰役與他交攻。
30:33 原來陀斐特是預備好的，為王預備的，又做了深又做了寬；其中的柴堆有火有很多的木頭；耶和華的氣，如一道硫磺火，點著了它。`,

  '8/31': `31:1 禍哉！那些下埃及求幫助的，是倚靠馬匹，倚賴甚多的車輛，並倚賴強壯的馬兵，卻不仰望以色列的聖者，也不求問耶和華的。
31:2 其實他是有智慧的，必帶來災禍，也不收回他的話，必興起攻擊那作惡人的家，又攻擊作孽之人的幫手。
31:3 埃及人不過是人，不是神；他們的馬不過是血肉，不是靈。耶和華伸出手來，幫助的必跌倒，受幫助的也必跌倒，都一同滅亡。
31:4 耶和華這樣對我說：獅子，就是壯獅，抓住食物，雖遇許多牧人向他呼喊，也不被他們的聲音驚惶，不因他們的喧嚷而縮服；這樣，萬軍之耶和華也必降臨，在錫安山和她的岡上爭戰。
31:5 萬軍之耶和華必像雀鳥護翼，保護耶路撒冷；也必保衛、拯救、越過，而保全它。
31:6 以色列人哪，你們當歸向你們所悖逆的主，
31:7 因為到那日，各人必丟棄他們手所造的金偶像和銀偶像，就是你們的手所作的。
31:8 亞述人必倒在刀下，卻非人的刀；刀必滅他，卻非人的刀。他要逃避刀劍，他的少年人必服苦役，
31:9 因為恐懼，他的磐石必逃去，他的首領必懼怕旗幟。這是耶和華說的，他的火在錫安，他的爐在耶路撒冷。`,

  '9/1': `32:1 看哪，將來有一王按公義行政；有首領按公平治理。
32:2 那人必像避風所，並暴風雨的隱秘處，像大乾旱時的流水河道，像疲乏地上大磐石的影子。
32:3 觀看的眼，必不迷糊；能聽的耳，必側耳而聽。
32:4 倉促行動之人的心，必明白知識；結巴的舌頭，必說話流利，清清楚楚。
32:5 愚頑人不再稱為高明；吝嗇人不再稱為大方。
32:6 因為愚頑人必說愚頑話，心裡想作罪孽，慣行褻瀆的事，說錯謬的話攻擊耶和華，使飢餓人的心無食可得，使口渴人的飲料缺乏。
32:7 吝嗇人所用的法子是惡的；他圖謀用謊言毀滅謙卑人，就是窮乏人說公道話的時候，毀滅他。
32:8 慷慨人卻謀慷慨事，也要靠慷慨站立得穩。
32:9 安逸無憂的婦女啊，起來聽我的聲音！無慮的女兒啊，側耳聽我的話！
32:10 無慮的女子啊，你們再過一年多必痛苦震驚；因為葡萄的收成失敗，果子的收成不到。
32:11 安逸無憂的婦女啊，你們當戰抖！無慮的女子啊，你們當震驚！脫去衣服，赤著身子，束麻布在腰間，
32:12 哭號捶胸，傷歎那肥田和結實的葡萄樹！
32:13 在我百姓的地上，荊棘蒺藜生長；哀哉！在一切快樂的家中和熱鬧城中！
32:14 因為宮殿必然荒廢，稠密的城必然孤棄；城門上的高臺和樓臺，要永遠作山洞，為野驢所樂，為羊群的草場；
32:15 等到聖靈從高處澆灌我們，曠野就成為肥田，肥田看如樹林。
32:16 那時，公平要居曠野，公義要居肥田。
32:17 公義的工作，必是平安；公義的效果，必是安靜和穩妥，直到永遠。
32:18 我的百姓，必住在平安的居所，安穩的住處，安靜的安歇所。
32:19 但要降冰雹，樹林也倒下；城邑也全然卑下了。
32:20 凡在各水旁種地的，把驢和牛放在那裡的，都是有福的。`,

  '9/2': `33:1 禍哉！你這毀滅人的，你自己倒不遭毀滅；你這行事詭詐的，人卻沒有以詭詐待你。你毀滅的事完畢，你自己要遭毀滅；你行詭詐完畢，人必以詭詐待你。
33:2 耶和華啊，求你憐憫我們，我們等候你；求你每早晨作我們的膀臂，也在患難時作我們的拯救。
33:3 人聽見喧嘩的聲音，列國就逃跑；你一興起，萬民就奔散。
33:4 你們的擄物，必被收取，好像蝗蟲的聚集；人必撲上去，像蚱蜢跳躍一樣。
33:5 耶和華是崇高的，他居在高處；他以公平公義充滿錫安。
33:6 你所處的時代必有穩固的根基；豐盛的救恩，智慧和知識，都是耶和華的恩典，他以敬畏耶和華為你的財寶。
33:7 看哪，他們的英雄在外頭哀號；求平安的使者痛苦哭泣。
33:8 大路荒涼，過路的人止息；他廢了約，藐視城邑，不顧人面。
33:9 地悲哀衰殘，黎巴嫩慚愧乾旱，沙崙像曠野；巴珊和迦密的樹木，都落下葉子。
33:10 耶和華說：我現在要起來，我現在要興起，我現在要被尊崇。
33:11 你們必懷秕稗，生碎草；你們的氣如火，必燒滅你們自己。
33:12 列民必燒成石灰，像砍下的荊棘被火燒著。
33:13 你們遠方的人，當聽我所行的事；你們近處的人，當承認我的能力。
33:14 錫安中的罪人，都被恐懼抓住；不敬虔的人被戰抖抓住，說：我們中間誰能與吞滅的火同住？我們中間誰能與長久燃燒的火同住？
33:15 行事公義、說話正直，厭惡欺壓所得之財，拒絕受賄賂，掩耳不聽流血之謀，閉眼不看邪惡之事的——
33:16 他必住在高處，磐石就是他的高壘，他的糧食必供應，他的水也必不缺。
33:17 你的眼必看見王在他的榮美中，必看見遼闊的地。
33:18 你的心必思想那恐嚇的事。那數銀子的，在哪裡呢？那稱量的，在哪裡呢？那數點樓臺的，在哪裡呢？
33:19 那強暴的百姓，你必不再看見；他們的言語，比較難明白；他們的口音，古怪，你不能聽出。
33:20 看，我們守節的城邑錫安啊！你的眼必看見耶路撒冷，是平安的居所，是不被遷移的帳幕；那帳幕的橛子，永遠不拔出，的繩索，一根也不折斷。
33:21 因為在那裡，耶和華必以威嚴的身分居住，那地方有寬闊的江河；其中必沒有搖槳的船隻，也沒有威武的船隻過去。
33:22 因為耶和華是我們的審判者，耶和華是給我們設律法的，耶和華是我們的王；他必拯救我們。
33:23 你的繩索鬆開了；不能撐住桅杆，不能張開帆布，那時，必有許多擄物分開；瘸腿的，也必奪取。
33:24 城內的居民必不說：我病了；其中居住的百姓，罪孽必然赦免。`,

  '9/3': `34:1 列國啊，你們要近前來聽！眾民哪，你們要側耳而聽！大地和其上所充滿的，世界和其中一切所出的，都要聽。
34:2 因為耶和華向萬國發怒，向他們的全軍發忿恨，將他們滅絕，交出他們受殺戮。
34:3 被殺的，必被拋棄；屍首的臭氣必散上來；諸山必被他們的血融化。
34:4 天上的萬象都要消沒，諸天要捲起，像書卷一樣；其上的萬象都要殘落，像葡萄葉子的殘落，又像無花果樹上的殘落。
34:5 因為我的刀在天上有了血，要臨到以東（以東原文作多瑪），就是我定要滅絕之民的身上，施行審判。
34:6 耶和華的刀滿了血，是羊羔羊羔的脂油，公羊和山羊的血；在波斯拉，耶和華有獻祭，在以東地有大屠殺。
34:7 野牛必同著他們下來，小牛並壯牛也是一樣；他們的地被血滋潤，塵土被脂油滋潤。
34:8 因為耶和華有報仇之日，有為錫安的爭訟伸冤之年。
34:9 以東的小河必變為石油，塵土必變為硫磺；那地必成為燃燒的石油，
34:10 晝夜不息，煙氣永遠上騰；必世世代代成為荒涼，永永遠遠無人經過。
34:11 鵜鶘和箭豬必佔據那地；鴞鳥和烏鴉要住在其中。他必將虛無的準繩，混沌的線鉈，拉在其上。
34:12 他們要召貴胄來，卻無一人應召；那地的君王也都歸於無有。
34:13 他的宮殿要長荊棘，他的保障要長蒺藜和薊草；要作野狗的住處，鴕鳥的居所。
34:14 曠野的走獸要和島上的走獸相遇；野山羊要與同伴相呼；夜間的怪物，必在那裡棲息，自找安歇之處。
34:15 箭蛇在那裡做窩，生蛋，抱蛋，聚集在影下；鳶鳥各與同類聚集在那裡。
34:16 你們要查考並宣讀耶和華的書；這些都沒有一樣缺少的，各不缺其偶；因為耶和華的口吩咐，他的靈將她們聚集。
34:17 他也為她們拈鬮，他的手也為她們用準繩分地；她們必永遠得那地為業，世世代代住在其中。`,

  '9/4': `35:1 曠野和乾旱之地，必然歡喜；沙漠也必快樂，又像玫瑰開花，
35:2 必開花繁盛，樂上加樂，也必歡呼。黎巴嫩的榮耀，並迦密與沙崙的華美，都必賜給它；眾人必看見耶和華的榮耀，我們神的華美。
35:3 你們要使軟弱的手堅壯，無力的膝有力。
35:4 對惶恐的人說：你們要剛強，不要懼怕；看哪，你們的神必來報仇，必來施行極大的報應；他必來拯救你們。
35:5 那時，瞎子的眼必睜開，聾子的耳必開通。
35:6 那時，瘸腿的，必跳躍如鹿；啞巴的舌頭，必能唱歌；在曠野必有水發出，在沙漠必有河湧流。
35:7 發光的沙，必變為水池；乾渴之地，必變為湧泉；在野狗躺臥之處，必有青草、蘆葦，和蒲草。
35:8 在那裡必有一條大道，稱為聖路；污穢人不得經過，必專為贖民行走；行路的人雖是愚味人，也不致失迷。
35:9 那裡必沒有獅子，猛獸也不登這路，在那裡都遇不見；只有蒙救贖的人在那裡行走。
35:10 並且耶和華救贖的民必歸回，歌唱來到錫安；永樂必歸於他們的頭上；他們必得著歡喜快樂，憂愁嘆氣盡都逃避。`,

  '9/5': `36:1 希西家王十四年，亞述王西拿基立上來攻擊猶大的一切堅固城，將城攻取。
36:2 亞述王從拉吉差遣拉伯沙基，率領大軍，往耶路撒冷去見希西家王。他就站在上池的水溝旁，在漂布地的大路上。
36:3 於是希勒家的兒子家宰以利亞敬，和書記舍伯那，並亞薩的兒子史官約亞，出來見他。
36:4 拉伯沙基對他們說：你們去告訴希西家說：大王亞述王如此說：你所倚靠的，有甚麼可以倚靠的呢？
36:5 你說，我有打仗的謀略和能力，這不過是空話；你如今倚靠誰才背叛我呢？
36:6 看哪，你是倚靠埃及那破折的蘆葦杖，那人若扶此杖，此杖就刺入他的手，穿透過去。埃及王法老向一切倚靠他的人，都是這樣。
36:7 你若對我說，我們倚靠耶和華我們的神；希西家豈不是將這神的邱壇和祭壇廢去，且對猶大和耶路撒冷說：你們當在這壇前敬拜嗎？
36:8 現在你把抵押給我主亞述王，我給你兩千匹馬，看你這一邊騎馬的人夠不夠。
36:9 你既靠埃及的戰車馬兵，怎能打退我主臣子中最小的將官呢？
36:10 現在我上來攻擊毀滅這地，是沒有耶和華的意思嗎？耶和華吩咐我說：你上去攻擊這地，毀滅它。
36:11 以利亞敬和舍伯那，並約亞，對拉伯沙基說：請你用亞蘭文和我們說話，因為我們懂得；不要用猶大話，因為站在城牆上的百姓都聽見了。
36:12 拉伯沙基說：我主差遣我來，是對你的主和你說這話嗎？不是也對那些坐在城牆上、將要和你們一同吃自己糞，喝自己尿的人說嗎？
36:13 拉伯沙基就站著，用猶大話大聲喊叫說：你們當聽大王亞述王的話。
36:14 王如此說：你們不要被希西家欺哄了，他不能救你們。
36:15 也不要讓希西家使你們倚靠耶和華，說，耶和華必拯救我們，這城必不交在亞述王的手中。
36:16 不要聽希西家的話，亞述王如此說：你們要向我求和，歸順我，各人就可以吃自己葡萄樹和無花果樹的果子，喝自己井裡的水，
36:17 等我來帶你們到一個地方，和你們本地一樣，就是有五穀和新酒之地，有糧食和葡萄園之地。
36:18 你們不要聽希西家迷惑你們說：耶和華必拯救我們。各國的神，有哪一個救自己的國脫離亞述王的手呢？
36:19 哈馬的神和亞珥拔的神在哪裡呢？西法瓦音的神在哪裡呢？他們救了撒馬利亞脫離我手嗎？
36:20 這些國的神中，誰曾救自己的國脫離我手呢？難道耶和華能救耶路撒冷脫離我手嗎？
36:21 百姓靜默，一言不答，因為王曾吩咐說：不要回答他。
36:22 於是希勒家的兒子家宰以利亞敬，和書記舍伯那，並亞薩的兒子史官約亞，都撕裂衣服，來到希西家那裡，將拉伯沙基的話告訴了他。`,

  '9/6': `37:1 希西家王聽見，就撕裂衣服，披上麻布，進了耶和華的殿。
37:2 他打發家宰以利亞敬，書記舍伯那，並祭司中的長老，都披著麻布，去見亞摩斯的兒子先知以賽亞。
37:3 他們對以賽亞說：希西家說，今日是急難、責罰和凌辱的日子，就如婦人將要生產，卻沒有力量生一樣。
37:4 或者耶和華你的神，聽見拉伯沙基的話，就是他的主亞述王差他來辱駡永生神的話，耶和華你的神聽見這些話，必要責罰；所以求你為這剩下的餘民揚聲禱告。
37:5 希西家王的臣僕到了以賽亞那裡。
37:6 以賽亞對他們說：你們對你們的主說：耶和華如此說，你所聽見的話，就是亞述王的僕人褻瀆我的話，你不要懼怕。
37:7 我必激動他一個心思，他要聽見一個風聲，就歸回本地，我要使他在那裡倒在刀下。
37:8 拉伯沙基回去，見亞述王正攻打立拿，因為他已聽見亞述王離開拉吉了。
37:9 亞述王聽見人論古實王特哈加說：他出來要與你打仗。他聽見了，就差遣使者去見希西家，說：
37:10 你們對猶大王希西家這樣說：不要讓你所倚靠的神欺哄你，說耶路撒冷不會交在亞述王的手中。
37:11 你曾聽見亞述王向各地所行的，就是滅絕的事；你豈能得以拯救呢？
37:12 我列祖所毀滅的，就是歌散、哈蘭、利悉，和在提拉撒的伊甸人，那些國的神曾拯救他們嗎？
37:13 哈馬的王，亞珥拔的王，西法瓦音城、希拿、以瓦城的王都在哪裡呢？
37:14 希西家從使者手裡接了書信，看完，就上耶和華的殿，將書信展開，鋪在耶和華面前。
37:15 希西家向耶和華禱告說：
37:16 坐在二基路伯上的萬軍之耶和華以色列的神啊，你獨是天下萬國的神；你創造了天地。
37:17 耶和華啊，求你側耳而聽；耶和華啊，求你睜眼而看；要聽西拿基立所說一切辱駡永生神的話。
37:18 耶和華啊，亞述王確實使這些國和他們的地土荒廢，
37:19 也把他們的神投在火中；因為他們本不是神，是人手所造的，是木頭、石頭，所以人把他們毀滅了。
37:20 耶和華我們的神啊，現在求你救我們脫離亞述王的手，使天下萬國都知道，惟有你是耶和華。
37:21 亞摩斯的兒子以賽亞就打發人去見希西家，說：耶和華以色列的神如此說：你既然禱告我，求我拯救你脫離亞述王西拿基立的手，
37:22 這是耶和華論他所說的話：錫安的女子藐視你，嗤笑你；耶路撒冷的女子向你搖頭。
37:23 你辱駡、褻瀆是誰呢？你揚聲、高舉你的眼目是攻擊誰呢？是攻擊以色列的聖者。
37:24 你藉你僕人辱駡主，說：我率領多輛戰車上山頂，到黎巴嫩極深之處，要砍伐高大的香柏樹和最美的松樹；並要進入它極高之處，進入它肥美的樹林；
37:25 我在外邦之地，已掘地喝水；我必用腳掌踏乾埃及的一切江河。
37:26 你沒有聽見嗎？這事是我古時所定的，是我遠古所籌謀的；現在我使這事成就，你就使堅固的城，化為瓦礫堆。
37:27 所以，那些城的居民，力量甚小，驚惶羞愧；像野地的草，像菜蔬，像房頂的草，像地裡的禾稼，在長成之先枯槁了。
37:28 你的坐下，你的出去，你的進來，你向我發的氣，我都知道。
37:29 因你向我發怒，狂傲的話語達到我耳中，所以，我要用鉤子鉤住你的鼻子，用嚼環放在你口裡，我要使你從你來的路轉回去。
37:30 這將作你的兆頭；你們今年吃自生的，明年吃自長的，至於後年就耕種收割，栽植葡萄園，吃其中的果子。
37:31 猶大家所逃脫剩下的，要更加往下扎根，往上結果。
37:32 因為必有餘剩的民從耶路撒冷而出，必有逃脫的人從錫安山而出；萬軍之耶和華的熱心，必成就這事。
37:33 所以，耶和華論亞述王如此說：他必不進入這城，也不在這裡射箭，不得拿盾牌到城前，也不築壘攻城。
37:34 他從那條路來，必從那條路回去，必不進入這城；這是耶和華說的。
37:35 因為我為自己的緣故，並為我僕人大衛的緣故，必保護拯救這城。
37:36 耶和華的使者出去，在亞述營中殺了十八萬五千人。清早有人起來，一看，都是死屍了。
37:37 亞述王西拿基立就拔營回去，住在尼尼微。
37:38 一日，他在他的神尼斯洛廟中叩拜，他的兒子亞得米勒和沙利色用刀殺了他，逃到亞拉臘地。他的兒子以撒哈頓接續他作王。`,

  '9/7': `38:1 那時，希西家病得要死。亞摩斯的兒子先知以賽亞去見他，對他說：耶和華如此說：你當留遺言給你的家，你必死，不能活了。
38:2 希西家就轉臉朝牆，禱告耶和華，
38:3 說：耶和華啊，求你記念我在你面前，怎樣存完全的心，盡心行事，並做你眼中看為善的事。希西家就痛哭了。
38:4 耶和華的話臨到以賽亞說：
38:5 你去告訴希西家說：耶和華你祖大衛的神如此說：我聽見你的禱告，看見你的眼淚；我必加增你的年日十五年。
38:6 我必救你和這城脫離亞述王的手，也必保護這城。
38:7 這是耶和華的兆頭，他要做他所應許的事。
38:8 看哪，亞哈斯的日晷的日影，我要使它往後退十度；於是，日頭先所走的十度，退後了十度。
38:9 猶大王希西家病而得愈所寫的：
38:10 我說：我正在壯年，必進入陰間的門；我的餘年被奪去。
38:11 我說：我不得再見耶和華，就是在活人之地見耶和華；我不得再看見世上的居民。
38:12 我的住處被迁移，被拔去，好像牧人的帳棚；我的生命像織布的將我的經剪斷。你使我從早到晚將要終結。
38:13 我勉強自己，直到早晨；他使我的骨骼像獅子折斷，使我從早到晚將要終結。
38:14 我像燕子呢喃，像白鶴鳴叫，又像鴿子哀鳴；我的眼睛因仰望而倦怠。耶和華啊，我受了欺壓，求你為我作保（作保：或作拯救我）。
38:15 我應當說甚麼呢？他既然對我說話，且把這事做成了；我一生在苦中，必以此回想（回想：或作而行），你使我謙卑了。
38:16 主啊，人活著是靠這些事；我的靈活著，也全因這些；求你醫治我，使我存活。
38:17 看哪！我受大苦，本為使我得平安；你因愛我的靈魂，便救我脫離敗壞的坑；因為你將我一切的罪，拋在你的背後。
38:18 因為陰間不能稱謝你，死亡不能頌揚你；下坑的人，不能盼望你的信實。
38:19 惟有活著的人，就是今日活著的人，他必稱謝你，如同我今日，為父將你的信實指示兒女。
38:20 耶和華拯救了我，所以我們要在耶和華的殿中，用絃樂的器具，終身歌唱。
38:21 以賽亞說：當取一塊無花果餅，貼在瘡上，希西家就必痊癒。
38:22 希西家說：我得痊癒，能上耶和華的殿，有甚麼兆頭呢？`,

  '9/8': `39:1 那時，巴比倫王巴拉但的兒子米羅達巴拉但，聽見希西家生病，後來痊癒，就差遣使者，送信和禮物來見他。
39:2 希西家為使者歡喜，將他府庫的金銀、香料、上好的膏油、他一切的武庫，並他倉庫一切所有的，都給他們看；希西家的宮殿和他全國之中，沒有一樣他沒有給他們看的。
39:3 先知以賽亞來見希西家王，問他說：這些人說甚麼？他們從哪裡來見你？希西家說：他們從遠方的巴比倫來見我。
39:4 以賽亞說：他們在你宮殿裡看見了甚麼？希西家說：我宮殿中所有的，他們都看見了；我倉庫中，沒有一樣我沒有給他們看的。
39:5 以賽亞對希西家說：你要聽萬軍之耶和華的話：
39:6 日子將到，凡你宮殿所有的，並你列祖積蓄到今日的，都要被擄到巴比倫去，不留下一樣；這是耶和華說的。
39:7 你所生的兒子，就是你所生的，也要被擄去，在巴比倫王宮中，作太監。
39:8 希西家對以賽亞說：你所說耶和華的話甚好；又說：在我那些日子必有平安和穩固。`,

  '9/9': `40:1 你們的神說：你們要安慰，安慰我的百姓。
40:2 要對耶路撒冷說安慰的話，又向它宣告說：它爭戰的日子已滿了，它的罪孽赦免了，它為自己的一切罪，從耶和華手中加倍受罰。
40:3 有人聲喊著說：在曠野預備耶和華的路，在沙漠地修平我們神的道。
40:4 一切山窪都要填滿，大小山崗都要削平；曲曲彎彎的地方，要改為正直，高高低低的地方，要改為平原。
40:5 耶和華的榮耀必然顯現，所有的人都要一同看見；因為這是耶和華親口說的。
40:6 有聲音說：你喊叫吧！有人說：我喊叫甚麼呢？說：凡有血氣的，盡都如草，他的美麗，都像野地的花。
40:7 草必枯乾，花必凋謝，因為耶和華的氣吹在其上；百姓誠然是草。
40:8 草必枯乾，花必凋謝；惟有我們神的話，必永遠立定。
40:9 傳好信息給錫安的啊，你要登高山；傳好信息給耶路撒冷的啊，你要高聲喊叫；不要懼怕，對猶大的城邑說，看哪，你們的神！
40:10 主耶和華必像大能者臨到；他的膀臂必為他掌權。他的賞賜在他那裡，他的報酬在他面前。
40:11 他必像牧人牧養自己的羊群，用膀臂聚集羊羔抱在懷中，慢慢引導那乳養小羊的。
40:12 誰曾用手心量諸水，用手虎口量蒼天，用升斗盛大地的塵土，用秤稱山嶺，用天平平岡陵呢？
40:13 誰曾測度耶和華的心，或作他的謀士指教他呢？
40:14 他與誰商議，誰教導他，誰將公平的路指示他，指教他知識，將通達的道指示他呢？
40:15 看哪，列國在他面前好像桶中的一滴，又算如天平上的微塵；他舉起眾島嶼，好像極微之物。
40:16 利巴嫩的樹木不夠當柴燒；利巴嫩的走獸不夠當燔祭。
40:17 萬國在他面前好像虛無，被他看為不及虛無，乃為虛空。
40:18 你們既然不把誰比作神，又用甚麼形像配他呢？
40:19 偶像是匠人鑄造，銀匠用金子包裹，為它鑄造銀鏈。
40:20 窮乏獻不起這些的，就揀選不能朽壞的樹木，尋找有智慧的匠人，立一個不能搖動的偶像。
40:21 你們豈不知道嗎？你們豈沒有聽見嗎？從起初，豈沒有人告訴你們嗎？自從立地的根基，你們豈沒有明白嗎？
40:22 神坐在地圈之上；地上的居民好像蝗蟲。他鋪張諸天如幔子，展開諸天如可住的帳棚。
40:23 他使君王歸於虛無，使地上的審判官成為虛空。
40:24 他們是剛才栽上，剛才種上，根剛才扎在地裡；他一吹在其上，便都枯乾，旋風將他們颳走如碎秸。
40:25 那聖者說：你們既然不把誰比作我，誰與我相等呢？
40:26 你們向上舉目，看誰創造這萬象，按數目領出，他一一稱其名；因他的權能，又因他的大力大能，連一個都不缺。
40:27 雅各啊，你為何說，我的道路向耶和華隱藏？以色列啊，你為何言，我當得的判斷，從我的神那裡過去了？
40:28 你豈不曾知道嗎？你豈不曾聽見嗎？永在的神耶和華創造地極，並不疲乏，也不困倦；他的智慧無法測度。
40:29 疲乏的，他賜能力；軟弱的，他加力量。
40:30 就是少年人也要疲乏困倦，強壯的也必全然跌倒；
40:31 但那等候耶和華的，必重新得力；他們必如鷹展翅上騰，他們奔跑卻不困倦，行走卻不疲乏。`,

  '9/10': `41:1 眾海島啊，當在我面前靜默；眾民族當重新得力；他們可以近前來，然後說話；我們可以彼此相辯。
41:2 誰從東方興起那義人，將列國交在他面前，使他制伏君王？他的刀使他們如塵土，他的弓使他們如風前的碎秸。
41:3 他追趕他們，所行的路是平安的；他的腳不踩地。
41:4 誰施行這事，成就這事呢？就是那從起初召各代的，我是耶和華，首先的，並與末後的人同在；我是一樣的。
41:5 眾海島看見，便懼怕；地極都戰抖，他們彼此靠近，互相幫助。
41:6 各人幫助他的鄰舍，對弟兄說：你壯膽吧！
41:7 木匠鼓勵冶金的，用錘打光的，鼓勵打鐵的；他說：焊得好，且說這偶像堅固，釘好了，不至搖動。
41:8 但以色列，你是我的僕人；雅各，我所揀選的人，是我朋友亞伯拉罕的後裔。
41:9 我從地極領你，從地角召你，對你說：你是我的僕人；我揀選你，並不棄絕你。
41:10 你不要害怕，因為我與你同在；你不要驚惶，因為我是你的神。我必堅固你，我必幫助你；我必用我公義的右手扶持你。
41:11 凡向你發怒的，必都抱愧蒙羞；與你相爭的，必如無有，要滅亡。
41:12 與你相鬥的，你必找他們，卻尋不著；與你爭戰的，必如無有，成為虛空。
41:13 因為我耶和華你的神，必攙扶你的右手，對你說：不要懼怕，我必幫助你。
41:14 你這蟲雅各，你們以色列人，不要害怕。耶和華說：我必幫助你；你的救贖主就是以色列的聖者。
41:15 看哪，我要使你成為有利齒的新打糧器，你必打山，碾碎它，使山嶺如糠秕。
41:16 你必揚起它，風要把它颳去；旋風要把它颳散。你卻要因耶和華歡樂，要以以色列的聖者為誇耀。
41:17 困苦窮乏的人尋求水，卻沒有，他們的舌頭因渴乾燥。我耶和華必應允他們，我以色列的神必不離棄他們。
41:18 我必在光禿的山開江河，在谷中開湧泉；我必使曠野變為水池，使乾旱之地變為湧泉。
41:19 我必在曠野種植香柏樹、皂莢樹、番石榴樹和野橄欖樹；我必在沙漠種植松樹、枞樹，並黃楊樹，
41:20 叫人看見，知道，思想，明白；這是耶和華的手所作的，是以色列的聖者所造的。
41:21 耶和華對假神說：你們當陳明你們的案，雅各的君說：你們當舉出你們確實的理由。
41:22 讓他們陳明，指示我們將要發生的事；從前的事，你們當說明，我們也要思想，要知道結局如何；或者將來的事，你們可以告訴我們。
41:23 你們當陳明以後的事，我們便知道你們是神；你們可以降福或降禍，使我們驚奇，一同觀看。
41:24 看哪，你們是虛空的；你們所做的是虛無；那揀選你們的是可憎惡的。
41:25 我從北方興起一人，他已來到；從日出之地，求告我名的，他必來到。他必踐踏官長，好像踐踏泥土，又像窯匠踐踏泥土一樣。
41:26 誰從起初指明這事，我們便知道；誰從先前說明，我們便說：他是公義的？其實，沒有人指明，沒有人說明，也沒有人聽見你們的話。
41:27 我首先對錫安說，看哪，看哪；我要賜給耶路撒冷報好信息的使者。
41:28 我看，諸神之中並無一個，他們中間也沒有謀士，我若問他們，他們也不能回答。
41:29 看哪，他們都是虛空，所行的都是虛無；他們的鑄像都是風，都是虛空。`,

  '9/11': `42:1 看哪，我的僕人，我所扶持、所揀選、心裡所喜悅的！我已將我的靈賜給他，他必將公理傳給外邦。
42:2 他不喧嚷，不揚聲，也不使街上聽見他的聲音。
42:3 壓傷的蘆葦，他不折斷；將殘的燈火，他不吹滅；他憑真實將公理傳開。
42:4 他不灰心，也不喪膽，直到他在地上設立公理；海島都等候他的訓誨。
42:5 創造諸天、鋪張諸天、將地和地所出的一併鋪開、賦予地上百姓生命、賦予行在其上之人氣息的神耶和華，說：
42:6 我耶和華憑公義召你，必攙扶你的手，保守你，使你作眾民的中保（中保：或作約），作外邦人的光，
42:7 開瞎子的眼，領被囚的出牢獄，領坐黑暗的出監牢。
42:8 我是耶和華，這是我的名；我必不將我的榮耀歸給假神，也不將我應受的讚美歸給雕刻的偶像。
42:9 看哪，先前的事已經成就，現在我將新事說明；這些事未發生以先，我就告訴你們。
42:10 航海的，海中的百物，海島和其中的居民，當向耶和華唱新歌，從地極讚美他。
42:11 曠野和其中的城邑，並基達人所居的村莊，都當揚聲；西拉的居民當歌唱，從山頂上揚聲歡呼。
42:12 他們當將榮耀歸給耶和華，在海島中傳揚他的讚美。
42:13 耶和華要像勇士出去，又要激動熱心，像戰士呼喊，大聲吶喊，要勝過仇敵。
42:14 我許久閉口，靜默不言，我忍住自己；現在，我要喊叫，像產難的婦人，我要消滅，我也要吞滅。
42:15 我要使大山小岡荒廢，使其上的花草枯乾；我要使江河變為島嶼，使水池乾涸。
42:16 我要引瞎子行不認識的路，領他們走不知道的道；在他們面前使黑暗變為光明，使彎曲變為正直；這些事我都要行，並不離棄他們。
42:17 但那倚靠雕刻的偶像，對鑄造的偶像說：你們是我們的神，的人，必退後大蒙羞辱。
42:18 你們這聾的當聽；你們這瞎的當看，好看見吧！
42:19 誰是瞎子，若非我的僕人？誰是聾的，若非我差遣的使者？誰是瞎子，像那與我和好的？誰是瞎子，像耶和華的僕人？
42:20 你看見了許多，卻不注意；耳朵開通，卻不聽見。
42:21 耶和華因自己公義的緣故，喜歡使律法為大，為尊。
42:22 但這百姓是被搶奪、被踐踏的；他們都陷在坑裡，被關在監獄中；他們被搶奪，無人搭救；被踐踏，沒有人說：歸還吧！
42:23 你們中間誰肯聽這事，誰肯側耳聽，且留意聽，以備將來呢？
42:24 誰使雅各作擄物，誰使以色列給搶奪者呢？不是耶和華嗎？是我們得罪了他；他們不肯遵行他的道，也不聽從他的律法。
42:25 所以，他將猛烈的怒氣，並爭戰的力量，倒在以色列身上；那怒氣在以色列四圍著起如火，他還不知道；在以色列焚燒，他也不介意。`,

  '9/12': `43:1 雅各啊，創造你的耶和華，以色列啊，造成你的那位，現在如此說：你不要害怕！因為我救贖了你。我曾提你的名召你，你是屬我的。
43:2 你從水中經過，我必與你同在；你趟過江河，水必不漫過你；你從火中行過，必不被燒，火焰也不著在你身上。
43:3 因為我是耶和華你的神，以色列的聖者，你的救主；我已經使埃及作你的贖價，使古實和西巴代替你。
43:4 因你在我眼中看為寶貴，我也承認你尊貴，並且我愛你；所以，我情願以人代替你，以列邦換你的生命。
43:5 你不要害怕！因為我與你同在；我必領你的後裔從東方來，又從西方將你招聚；
43:6 我要對北方說：交出來吧！對南方說：不要拘留！將我的兒子從遠方帶來，將我的女兒從地極領回。
43:7 凡稱為我名下的人，是我為自己的榮耀所創造的，是我所作成，所造作的。
43:8 你當帶出那有眼睛的瞎子，和有耳朵的聾子。
43:9 列國都要聚集，列民都要聚集在一處。其中誰能聲明這事，並將先前的事說與我們聽呢？他們可以帶見證人，得以稱義，或者使人聽了，說：這是實在的。
43:10 耶和華說：你們是我的見證，我所揀選的僕人，你們得知，且信服我，明白我就是耶和華；在我以前，沒有真神，在我以後，也沒有真神。
43:11 惟有我是耶和華；除了我以外，沒有救主。
43:12 我曾說明，曾拯救，曾聲明，那時，在你們中間沒有別神；所以，你們是我的見證，我也是神。這是耶和華說的。
43:13 從起初，我就是神；沒有人能從我手中救出甚麼；我所行的，誰能使它轉回呢？
43:14 你們的救贖主，以色列的聖者，耶和華如此說：因你們的緣故，我已打發人到巴比倫去，且必使一切人都逃走，使迦勒底人坐的船，成為他們的悲聲。
43:15 我是耶和華，你們的聖者，是創造以色列的，是你們的君王。
43:16 耶和華在海中開道路，在大水中開通道，又使戰車、馬匹、軍隊、勇士都出來，他們就臥下，不再起來，他們熄滅，如燈花一般。
43:17 那在紅海中開路，在諸水中開通道的，又使戰車馬兵都出來，他們一同躺臥，不再起來，熄滅如燈中火芯一樣。
43:18 你們不要記念以前的事，也不要思想古時的事。
43:19 看哪，我要做一件新事；如今要發現，你們豈不知道嗎？我必在曠野開道路，在沙漠開江河。
43:20 野地的走獸必尊重我，野狗和鴕鳥也必如此；因為我在曠野供應水，在沙漠開江河，使我的百姓，我所揀選的，得以暢飲。
43:21 是我為自己所造的民，他們要傳揚我的讚美。
43:22 雅各啊，你卻沒有求告我；以色列啊，你卻懒於事奉我。
43:23 你沒有將你的羊羔，獻給我作燔祭，也沒有以你的祭物，尊重我。我沒有因供物，使你服勞；也沒有因乳香，使你厭煩。
43:24 你沒有用銀子，為我買菖蒲，也沒有用祭物的脂油，使我飽足；你使我因你的罪惡服勞，使我因你的罪孽厭煩。
43:25 惟有我，為自己的緣故塗抹你的過犯；我也不記念你的罪惡。
43:26 你可以提醒我，我們可以彼此辯論；你可以陳明你的理，證明你自己有義。
43:27 你的始祖犯了罪，你的師傅違背了我。
43:28 所以，我要污辱聖所的官長，我也要使雅各受咒詛，使以色列被辱駡。`,

  '9/13': `44:1 雅各我的僕人，我所揀選的以色列啊，現在你當聽。
44:2 造作你，並在娘胎中造成你形象，要幫助你的耶和華如此說：我的僕人雅各，我所揀選的耶書崙（耶書崙就是以色列），你不要害怕。
44:3 因為我要將水澆灌口渴的人，將河水澆灌乾旱之地；我要將我的靈澆灌你的後裔，將我的福賜給你的子孫。
44:4 他們要在草中發生，像溪水旁的柳樹一樣。
44:5 一個要說：我是屬耶和華的；另一個要稱自己是雅各；另一個要用手寫上：我是屬耶和華的，並自稱以以色列為名。
44:6 耶和華以色列的君，以色列的救贖主，萬軍之耶和華如此說：我是首先的，我是末後的；除了我以外，沒有真神。
44:7 自從我立古時的民，誰能像我，宣告，並且說明，並且為自己陳說呢？讓他說明將來必遇的事，和必成就的事。
44:8 你們不要恐懼，也不要害怕；我豈不是從上古便將這事說給你們聽，說明了呢？並且你們是我的見證。除我以外，豈有真神嗎？誠然沒有磐石；我不知道一個。
44:9 製造雕刻偶像的，都是虛空；他們所寶貝的，都是無益的；他們的見證人是看不見，也不知道的，所以他們羞愧。
44:10 誰製造了一個神，並鑄造無益的偶像呢？
44:11 他的同伴都蒙羞；製造者也不過是人。讓他們都聚集站立，他們必恐懼，一同羞愧。
44:12 鐵匠用夾炭打鐵器，用錘子打鐵，用他有力的膀臂做成一個像；他又餓又乏，不喝水，便覺困倦。
44:13 木匠拉出準繩，用筆劃出，用刨子刨出，用圓規畫成人形，像美貌的人，要住在廟裡。
44:14 他砍伐香柏樹，取青松樹和橡樹，在樹林中選定了一棵，才種下了松樹，受雨長大。
44:15 這能做燒火用的木頭；他取其中一些燒火，取其中一些烤肉，吃飽了；又烤自己的身子，說：啊哈！我暖和了，我見火了。
44:16 其餘的木頭他用火焚燒，用這木頭製作偶像，向這偶像叩拜；他製作了一個雕刻的偶像，向它跪拜。
44:17 他用剩下的木頭做神，就是做自己雕刻的偶像；他在那偶像前俯伏，叩拜，禱告它，說：你是我的神，求你拯救我。
44:18 他們沒有知識，也沒有聰明；因為他們的眼睛昏迷，不能看見；他們的心蒙蔽，不能省悟。
44:19 他們心裡不省悟，無知識，無聰明，也不說：我用一半木頭燒了火，在其上烤了餅，烤了肉，也吃了；如今我豈可用其餘的做可憎惡的偶像，向這截木頭屈身呢？
44:20 他以灰為食，受了矇蔽的心引誘，偏離正路，不能自救，也不能說：我右手拿的，不是虛謊嗎？
44:21 雅各，以色列啊，你該記念這些事；因為你是我的僕人；以色列啊，我造成你，你是我的僕人，以色列啊，我必不忘記你。
44:22 我塗抹了你的過犯，像厚雲消散；我塗抹了你的罪惡，如薄雲滅沒。你當歸向我，因為我救贖了你。
44:23 諸天哪，你們要唱歌，因為耶和華做了這事；地極要呼喊，眾山要歌唱，森林和其中的各樹都要呼喊；因為耶和華救贖了雅各，並在以色列身上顯現他的榮耀。
44:24 耶和華救贖你，造成你在娘胎中的形象，他如此說：我是耶和華，是製造萬物的，是獨自鋪張諸天，鋪開大地的；誰與我同在呢？
44:25 我廢棄說謊言人的兆頭，駁倒觀兆者的道理，敗退有智慧之人的謀士，使他們的學問成為愚拙。
44:26 我立我僕人所說的話，成就我使者所說的謀；論耶路撒冷說：必有人居住；論猶大的城邑說：必被建造；我也要建起它倒了的廢墟。
44:27 我對深淵說：乾枯吧！我也要使你的江河乾涸。
44:28 我指著古列說：他是我的牧人，必成就我所喜悅的一切事，必下令建造耶路撒冷，奠定聖殿的根基。`,

  '9/14': `45:1 耶和華對他的受膏者古列如此說：我攙扶他的右手，使列國降伏在他面前，我也要解開君王的腰帶；我要在他面前打開兩扇門，使城門不得關閉。
45:2 我要在你前面行，修直彎曲之地，打碎銅門，砍斷鐵閂。
45:3 我要將暗中的財寶，和隱秘地方的財物，賜給你，使你知道提名召你的，就是耶和華以色列的神。
45:4 因我僕人雅各，我所揀選以色列的緣故，我曾提你的名，給你稱號，那時你還不認識我。
45:5 我是耶和華，在我以外並沒有別神；除了我以外，沒有真神。你雖不認識我，我必給你束腰，
45:6 使從日出之地到日落之處，都知道在我以外沒有別神；我是耶和華，在我以外並沒有別神。
45:7 我造光，又造暗；我施平安，又降災禍；造作這一切的，是我耶和華。
45:8 諸天哪，自上而降甘露，使雲彩降下公義；使地開發，叫救恩和公義一同生長；使地使它們一同發生；這都是我耶和華所創造的。
45:9 禍哉！那與造他的主爭論的，不過是地上的一塊瓦片。泥土豈可對摶泥土的說：你做甚麼呢？你所作的東西豈可說：你沒有手呢？
45:10 禍哉！那對父親說：你生的是甚麼，對母親說：你產的是甚麼的人。
45:11 耶和華以色列的聖者，就是造他的，如此說：你們竟來問我將來的事，又指著我兒子問我，又來吩咐我手所作的工，這是何理呢？
45:12 我造了大地，又創造了地上的人；我親手鋪張諸天，我也命定天上萬象。
45:13 我憑公義使古列興起，我必修直他一切的道路；他必建造我的城，釋放我被擄的民，不是為工價，不是為賞賜；這是萬軍之耶和華說的。
45:14 耶和華如此說：埃及勞碌得來的，和古實的貨物，并身量高大的西巴人，都要歸你；他們必跟隨你，帶著鎖鏈過來；他們要俯伏在你面前，求你說：神真在你這裡；除他以外，再沒有別神。
45:15 救主以色列的神啊，你實在是自隱的神。
45:16 凡製造偶像的，都一同蒙羞受辱，都必慚愧退去。
45:17 惟以色列必蒙耶和華所施的永遠得救；你們必永遠不慚愧，也不受辱。
45:18 創造諸天的耶和華，就是製造大地、造成它的主，是堅定大地，不使它空虛，而是叫人居住其上的，他如此說：我是耶和華，在我以外並沒有別神。
45:19 我說話不是在隱秘之地，也不是在黑暗之地；我沒有對雅各的後裔說：你們尋求我是徒然的。我耶和華所說的是公義，所說明的是正直。
45:20 你們從列國逃脫的人，當聚集前來，一同近前來；那些抬著木刻偶像，禱告不能救人之神的，毫無知識。
45:21 你們當聲明，當陳述，也當彼此商議：誰從上古指明這事？誰從那時說明這事？不是我耶和華嗎？在我以外並沒有真神；我是公義的神，是救主；除了我以外，沒有別神。
45:22 地極的人都當仰望我，就必得救；因為我是神，在我以外並沒有別神。
45:23 我指著自己起誓，我口所出的，是公義的話，並不反回：萬膝必向我跪拜；萬口必憑我起誓。
45:24 人必說：公義、力量，惟獨從耶和華而來。眾人都要來到他面前；凡向他發怒的，都必蒙羞。
45:25 以色列的後裔都要靠耶和華，被稱為義，並要誇耀。`,

  '9/15': `46:1 彼勒屈身，尼波彎腰；他們的偶像馱在獸上，馱在牲口上；你們所抬的，已經是重擔，使困乏的牲口遮蔽。
46:2 他們一同彎腰屈身，不能救護所擔的重擔，自己倒被擄去。
46:3 雅各家，以色列家一切所剩下的，你們要聽我說：你們自從生下，我就抱著；自從出胎，我就懷著。
46:4 直到你們年老，我仍是一樣；直到你們白髮，我仍懷著你們。我已造你，我也必保護你；我必懷著你，我也必拯救你。
46:5 你們將誰與我相比，與我同等，可以與我比較，使我們相仿呢？
46:6 那些從錢囊倒出金子，用天平秤銀子的，雇了金匠製造神像，他們俯伏，又叩拜的，
46:7 他們把偶像扛在肩上，抬著走，把它放在所在之處，它就站在那裡，不離本位；人呼求它，它不能答應，也不能救人脫離患難。
46:8 你們當記念這事，自己作大丈夫；悖逆的人哪，要心裡思想。
46:9 你們當追念上古的事；因為我是神，在我以外並沒有別神；我是神，再沒有能比我的。
46:10 我從起初指明末後的事，從古時言明未成的事，說：我的籌算必立定，凡我所喜悅的，我必成就。
46:11 我從東方召來鷙鳥，從遠方召來成就我籌算的人。我說了，必使這事成就；我謀定了，也必做成。
46:12 你們這些心中頑梗，遠離公義的，當聽我說：
46:13 我使我的公義臨近，不再遠離；我的救恩不遲延；我要為以色列我的榮耀，將救恩賜在錫安。`,

  '9/16': `47:1 巴比倫的處女啊，下來坐在塵埃；迦勒底的女兒啊，沒有寶座，要坐在地上；因為你不再稱為嬌嫩嫵媚的了。
47:2 要取磨石磨麵，要揭去帕子，脫去下裙，露出腿，趟過江河。
47:3 你的下體必露出，你的羞辱必顯現；我要報仇，不肯開恩。
47:4 我們的救贖主，他的名是萬軍之耶和華，是以色列的聖者。
47:5 迦勒底的女兒啊，你要靜默坐著，進入黑暗；因為你不再稱為列國的王后了。
47:6 我曾向我的百姓發怒，污辱了我的產業，將他們交在你手中；你毫無憐憫地待他們，把極重的軛加在老年人身上。
47:7 你說：我必永遠為王后；所以你不曾將這些放在心上，也不想到這事的結局。
47:8 你這喜好宴樂，安然居住的，現在當聽；你心中說：惟有我，除我以外再沒有別的；我必不至寡居，也不遭喪子之事。
47:9 這兩件事必忽然在一日之內臨到你，就是喪子和寡居；這事必按十分歸到你身上，因為你持弄法術甚多，廣施咒詛。
47:10 你倚靠自己的奸惡，說：沒有人看見我。你的智慧和知識，使你走錯了路，你心裡說：惟有我，除我以外再沒有別的。
47:11 所以，禍患要臨到你，你不知道怎樣用符術驅除；災難要落在你身上，你也不能補贖；你不知道的毀滅，要忽然臨到你。
47:12 你素來勞苦施行的法術，並持弄的許多咒詛，現在要站起來，或者可以得益，或者可以使仇敵驚恐。
47:13 你籌謀甚多，以致困倦；讓那些觀天象的，看星宿的，在月朔預言你所遭遇之事的，都站起來救你吧！
47:14 看哪，他們如同碎秸，被火焚燒，不能救自己脫離火焰之力；這火並非可以取暖的炭火，也非可以坐在其前的火。
47:15 這些你所勞苦持弄的，從幼年與你交通的，各奔各路，沒有人能救你。`,

  '9/17': `48:1 雅各家啊，你們是以以色列名稱呼的，是從猶大水源出來的；你們指著耶和華的名起誓，提說以色列的神，卻不憑誠實，不憑公義。
48:2 他們自稱為聖城的人，所倚靠的是以色列的神，他的名是萬軍之耶和華。
48:3 我從古時說明先前的事，它從我口中發出，我也使人聽見；我忽然行了這事，就都成就了。
48:4 因為我素來知道你頑梗，你的頸項是鐵的，你的額是銅的；
48:5 所以我從古時把這事告訴你，在它成就以前說與你聽，免得你說：這些事是我的偶像做的，是我雕刻的偶像，我鑄造的偶像所吩咐的。
48:6 你已聽見，要顯見這一切，你不肯說明嗎？從今以後，我告訴你新事，就是你所不知道的隱密事。
48:7 這是現今創造的，非從古昔起的；在今日以前，你也沒有聽見；免得你說：這是我早已知道的。
48:8 你從來沒有聽見，你也不早知道，你的耳朵不曾開通；因為我預先知道你必行奸詐，你自出胎就稱為悖逆的。
48:9 我為我的名的緣故，慢慢地發怒；為我的美名的緣故，暫時隱忍，不剪除你。
48:10 看哪，我熔化你，卻不像熔化銀子，在苦難的爐中試煉你。
48:11 我為自己的緣故，為我自己的緣故行這事；我豈容我的名被污辱呢？我必不將我的榮耀歸給別神。
48:12 雅各，我所呼召的以色列啊，你要聽我說：我是神，我是首先的，我是末後的。
48:13 我手立了地的根基，我右手鋪張了諸天；我一招呼，它們都立起來了。
48:14 你們都當聚集，要聽；他們中間誰曾說明這事？耶和華所愛的人，必向巴比倫成就他所喜悅的事，向迦勒底伸展他的臂膀。
48:15 惟有我說了，也召他來到；我帶他來，他的道路必然亨通。
48:16 你們靠近我，聽我說這話：我從起初並沒有秘密說話；從事情發生的時候，我就在那裡。現在，主耶和華差遣我和他的靈來（或：主耶和華并他的靈差遣我來）。
48:17 你們的救贖主，以色列的聖者，耶和華如此說：我是耶和華你的神，教導你對你有益，引導你當行的路。
48:18 甚願你素來聽從我的命令，你的平安就如河，你的公義就如海浪；
48:19 你的後裔就如沙，你所生的就如沙粒；他的名在我面前，不會被剪除，也不會被滅絕。
48:20 你們要從巴比倫出去，從迦勒底人中逃脫，用歡呼的聲音傳揚說：耶和華救贖了他的僕人雅各！
48:21 以色列人在曠野，他引導他們經過，他使磐石出水給他們喝；他打開磐石，水就湧出來。
48:22 耶和華說：惡人不得平安。`,

  '9/18': `49:1 眾海島啊，當聽我言！遠方的眾民哪，留心聽！耶和華從我出胎就召我，從我母腹就提我的名。
49:2 他使我的口如快刀，將我藏在他手陰裡；他又使我成為磨亮的箭，將我藏在他的箭袋裡。
49:3 他對我說：你是我的僕人以色列，我必藉你顯我的榮耀。
49:4 但我說：我勞碌是徒然，我所用的力量是虛無，虛空；然而我當得的理，必在耶和華那裡；我的賞賜，必在我的神那裡。
49:5 耶和華從我出胎，就造就我作他的僕人，要使雅各歸向他，使以色列到他那裡聚集；耶和華又看重我，我的神也成為我的力量。
49:6 他說：你作我的僕人，使雅各眾支派復興，使以色列中得保全的歸回，尚為小事；我還要使你作外邦人的光，叫你施行我的救恩，直到地極。
49:7 救贖以色列聖者的耶和華，論被人所藐視，被民所憎惡，被官長所虐待的，如此說：君王要看見就站起，首領也要下拜；都因信實的耶和華，就是揀選了你以色列的聖者。
49:8 耶和華如此說：在悅納的時候，我應允了你；在拯救的日子，我濟助了你；我要保護你，使你作眾民的中保（中保：或作約），復興遍地，使人承受荒涼的產業，
49:9 對那些被捆綁的人說：出來吧！對那些在黑暗的人說：顯露吧！他們在路上必得餵食，在一切淨光的山上，也有草場。
49:10 他們不飢不渴，炎熱和日頭必不傷害他們；因為憐憫他們的，必引導他們，領他們到水泉旁邊。
49:11 我要使我的諸山成為大道，我的道路也被修高。
49:12 看哪，這些從遠方來，這些從北方，從西方來，那些從秦國來。
49:13 諸天哪，當歡呼！大地啊，當快樂！眾山哪，當以歌聲發出響聲！因為耶和華已經安慰了他的百姓，也要憐憫他困苦的人。
49:14 錫安說：耶和華離棄了我，主忘記了我。
49:15 婦人焉能忘記她吃奶的嬰孩，不憐恤她所生的兒子？即或有忘記的，我卻不忘記你。
49:16 看哪，我將你刻在我掌上，你的牆垣常在我眼前。
49:17 你的兒女必速速回來；拆毀你的，毀壞你的，都必離你而去。
49:18 你舉目向四方觀看，他們都聚集來到你這裡。耶和華說：我指著我的永生起誓，你必要披戴他們為妝飾，佩帶他們，如同新婦一樣。
49:19 你那荒涼、淒涼，毀壞的地，因居民太多，地方甚窄，現在必太狹窄了，吞滅你的，也必遠離你。
49:20 你喪子之後所生的兒女，必在你耳中說：這地方我們居住太窄了，給我們地方居住吧！
49:21 那時，你心裡必說：這些兒女，我既喪子，孤寂，被擄，飄流，誰給我生的？誰養育的？我孤身獨居，這些兒女從哪裡來的呢？
49:22 主耶和華如此說：看哪，我要向列國舉手，向萬民豎立大旗；他們必將你的眾子懷抱送來，將你的眾女扛肩帶來。
49:23 君王要作你的養父，王后要作你的養母。他們必將臉俯伏在地，向你下拜，也要舔你腳上的塵土；你便知道我是耶和華；凡等候我的，必不羞愧。
49:24 勇士搶奪的，豈能從他奪回去嗎？戰勝的人所擄的，豈能解救嗎？
49:25 但耶和華如此說：就是被勇士擄去的，也可以奪回；從可畏的人那裡搶去的也可以解救；因為我要與你的對頭相爭，我要拯救你的兒女。
49:26 我要使欺壓你的人，吃自己的肉；他們必被自己的血喝醉，如同被酒喝醉；凡有血氣的，都必知道我耶和華是你的救主，是你的救贖主，是雅各的大能者。`,

  '9/19': `50:1 耶和華如此說：我休你們母親的休書在哪裡呢？我將你們賣給哪個債主了呢？你們是因自己的罪孽被賣，你們的母親是因你們的過犯被休。
50:2 我來的時候，為何無人呢？我呼喚的時候，為何無人答應呢？我的手豈是縮短，不能救贖嗎？我沒有能力拯救嗎？看哪，我一斥責，就使海乾枯；我使江河成為曠野；其中的魚因沒有水，腥臭而死。
50:3 我使諸天以黑暗為衣服，以麻布為遮蓋。
50:4 主耶和華賜我受教者的舌頭，使我知道怎樣用言語扶助疲乏的人。主每早晨提醒，提醒我的耳朵，使我能聽，像受教者一樣。
50:5 主耶和華開通我的耳朵；我並沒有悖逆，也沒有退後。
50:6 人打我的背，我任他打；人拔我腮頰的鬍鬚，我由他拔；人辱我，吐我的臉，我並不掩面。
50:7 主耶和華幫助我，所以我不抱愧；我硬著臉面，好像火石，我也知道我必不至羞愧。
50:8 稱我為義的，與我相近；誰與我爭論，可以與我對質；誰與我相爭，他可以就近我來。
50:9 看哪，主耶和華幫助我，誰能定我有罪呢？看哪，他們都要如衣服漸漸磨損，被蟲所吃。
50:10 你們中間誰是敬畏耶和華，聽從他僕人之話的？這人行在黑暗中，沒有光亮，當倚靠耶和華的名，仰賴自己的神。
50:11 看哪，你們所有點火的，用火把圍繞自己的，可以走在你們自己的火焰裡，在你們點著的火把中間。這是我手所定的；你們必躺在悲傷之地。`,

  '9/20': `51:1 你們這追求公義、尋求耶和華的人，要聽我言；你們要追念雕鑿你們的磐石，開鑿你們的坑穴。
51:2 要追念你們的祖宗亞伯拉罕和生你們的撒拉；因為亞伯拉罕獨身的時候，我召他，賜福給他，使他多子孫。
51:3 耶和華已安慰錫安，並安慰錫安一切的荒場，使曠野像伊甸，使沙漠像耶和華的園子；在其中，必有歡喜和快樂，感謝和歌唱之聲。
51:4 我的百姓啊，要聽我言！我的民哪，要側耳聽我的話！因為訓誨必從我這裡發出，我必以公平為萬民之光，轉眼就到。
51:5 我的公義臨近，我的救恩發出，我的膀臂要審判萬民；海島都要等候我，倚賴我的膀臂。
51:6 你們要向天舉目，觀看下地；因為天要如煙散滅，地要如衣服漸漸舊了，其上的居民，要像蚊蚋死去；惟有我的救恩永遠長存，我的公義也不廢掉。
51:7 你們心中知道公義，將我訓誨存在心裡的民哪，要聽我言！不要怕人的辱罵，被人的毀謗所驚嚇。
51:8 因為蟲子要把他們吃了，好像吃衣服；蛆蟲要吃他們，好像吃羊毛；惟有我的公義永遠長存，我的救恩直到萬代。
51:9 耶和華的膀臂啊，興起！興起！以能力為衣！興起，像古時的年日，像上古的世代！削砍拉哈伯，刺透鱷魚（原文是龍），不是你嗎？
51:10 使海（就是深洋的水）乾枯，使深淵的水變為可以使被救贖的人過去的路，不是你嗎？
51:11 耶和華救贖的民必歸回，歌唱來到錫安；永樂必歸到他們的頭上；他們必得歡喜快樂，憂愁嘆氣，都必逃避。
51:12 我，就是我，是安慰你們的；你是誰，竟怕那必死的人，怕那要變如草的人子，
51:13 卻忘記鋪張諸天，立定地基，造你的耶和華呢？又因那欺壓者圖謀毀壞，要發的怒氣，整天懼怕！那欺壓者的怒氣在哪裡呢？
51:14 被擄去的快得釋放，他不至死入坑中，日用的飲食也不缺乏。
51:15 我是耶和華你的神，我激動大海，使海浪洶湧；我的名是萬軍之耶和華。
51:16 我將我的話傳給你，用我的手蔭庇你，為要立定諸天，奠定地基，對錫安說：你是我的百姓。
51:17 耶路撒冷啊，你要醒起！醒起！站起來！你喝了耶和華忿怒之杯，就是昏惑人的爵；你喝盡了，連那爵的杯底，你都喝乾了。
51:18 她所生的一切兒女中，沒有一個引導她的；她所養育的一切兒女中，沒有一個攙扶她的手。
51:19 有兩件事臨到你，誰為你悲傷呢？就是荒涼和毀滅，饑荒和刀劍；我如何安慰你呢？
51:20 你的兒女昏迷，臥在各市街的角頭，如同野牛在網羅之中；都滿了耶和華的忿怒，你神的責罰。
51:21 所以，受苦的，醉了，卻非因酒，你要聽這話；
51:22 你的主，就是耶和華你的神，為他百姓伸訴的說：看哪，我把使人昏迷的爵，就是我忿怒的杯，從你手中取去，你不必再喝了；
51:23 我把這杯放在苦待你的人手中。他們曾對你說：你俯伏，讓我們踐踏過去；你便以背為地，以身體為街路，讓他們踐踏而過。`,

  '9/21': `52:1 錫安哪，興起！興起！以能力為衣；耶路撒冷，聖城啊，穿上你華美的衣服；因為從今以後，未受割禮的和不潔淨的，必不再進入你中間。
52:2 被擄之耶路撒冷，要脫去塵土，起來坐定；錫安的被囚之民（被囚之民：或作聖城），要解開頸項上的鎖鏈。
52:3 耶和華如此說：你們被賣，沒有得錢；你們被贖，也不用銀子。
52:4 主耶和華如此說：我的百姓從前下埃及，寄居在那裡，後來亞述人無故欺壓他們。
52:5 耶和華說：現在我在這裡，做甚麼呢？因為我的百姓無故被擄去；那些轄制我百姓的，呼號號叫，我的名整天被人褻瀆。
52:6 所以，我的百姓必知道我的名；到那日，他們必知道，說這話的，就是我，在這裡。
52:7 那報佳音，傳平安，報好信，傳救恩的，對錫安說：你的神作王了！這人的腳登山何等佳美！
52:8 你的守望者，都必揚起聲來，一同歌唱；因為他們要親眼見耶和華歸回錫安。
52:9 耶路撒冷的荒場啊，要歡聲歌唱；因為耶和華安慰了他的百姓，救贖了耶路撒冷。
52:10 耶和華在萬國眼前，露出聖臂；地極的人，都要看見我們神的救恩。
52:11 你們離去！離去！從那地出來，不要沾不潔淨的物；要從其中出來，你們扛抬耶和華器皿的人哪，要自潔。
52:12 你們出來不必急忙，也不必奔逃；因為耶和華在你們前面行，以色列的神在你們後面護衛（或作：在你們後頭）。
52:13 我的僕人行事必有智慧，他必被高舉，被抬起，成為至高。
52:14 許多人因他驚訝（他的面貌比別人損壞，他的形容比萬人憔悴），
52:15 他必洗淨許多國民；君王要向他閉口，因所未曾傳告他們的，他們必看見；所未曾聽見的，他們要明白。`,

  '9/22': `53:1 我們所傳的，有誰信呢？耶和華的膀臂向誰顯露呢？
53:2 他在耶和華面前生長如嫩芽，像根出於乾地；他無佳形美容，我們看見他的時候，也無美貌使我們羨慕他。
53:3 他被藐視，被人厭棄；多受痛苦，常經憂患。他被藐視，好像被人掩面不看的一樣；我們也不尊重他。
53:4 他誠然擔當我們的憂患，背負我們的痛苦；我們卻以為他受責罰，被神擊打苦待了。
53:5 哪知他為我們的過犯受害，為我們的罪孽壓傷。因他受的刑罰，我們得平安；因他受的鞭傷，我們得醫治。
53:6 我們都如羊走迷，各人偏行己路，耶和華使我們眾人的罪孽都歸在他身上。
53:7 他被欺壓，在受苦的時候卻不開口；他像羊羔被牽到宰殺之地，又像羊在剪毛的人手下無聲，他也是這樣不開口。
53:8 因受欺壓和審判，他被奪去，至於他同代的人，誰想他受鞭打、從活人之地被剪除，是因我百姓的過犯呢？
53:9 他雖然未行強暴，口中也沒有詭詐，人還是讓他與惡人同埋，誰知死的時候與財主同葬。
53:10 耶和華卻定意將他壓傷，使他受痛苦；他以自己為贖罪祭，便看見後裔，生命得以延長，耶和華所喜悅的事，必在他手中亨通。
53:11 他必看見自己勞苦得來的成果，便知足了；我的義僕使許多人因認識他而稱義，並且他要擔當他們的罪孽。
53:12 所以，我要使他與位大的同分，與強盛的均分擄物；因為他將命傾倒，以至於死，他也被列在罪犯之中，他卻擔當多人的罪，又為罪犯代求。`,

  '9/23': `54:1 不懷孕，不生產的，你當歌唱；你這未曾經歷產難的，當以歌聲歡呼揚聲；因為沒有丈夫的，比有丈夫的兒女更多；這是耶和華說的。
54:2 要擴張你帳幕之地，張大你所住之處的幔子，不要限止，要放長你的繩子，堅固你的橛子；
54:3 因為你要向左向右開展；你的後裔要得多國為業，使荒涼的城有人居住。
54:4 不要害怕，因為你必不致蒙羞；也不要慚愧，因為你必不至受辱；你必忘記幼年所受的羞辱，不再記念寡居的羞辱。
54:5 因為造你的是你的丈夫；萬軍之耶和華是他的名；救贖你的是以色列的聖者；他必稱為全地之神。
54:6 耶和華召你，如召被丟棄心中憂傷的婦人，就是幼年所娶被棄的妻；這是你神所說的。
54:7 我離棄你不過片時，卻要以極大的憐憫收聚你。
54:8 我的怒氣漲溢，我略略掩面一時，卻以永遠的慈愛憐憫你；這是耶和華你的救贖主說的。
54:9 這事對我有如挪亞的洪水，因為我怎樣起誓必不再使挪亞的洪水漫過大地，我也照樣起誓必不再向你發怒，也不斥責你。
54:10 大山可以挪開，小山可以遷移，但我的慈愛必不離開你；我平安的約也不遷移；這是憐憫你的耶和華說的。
54:11 你這受苦、被風飄蕩不得安慰的人哪，我要以雅黑萬（寶石的一種）為地基，以藍寶石奠根基，
54:12 以瑪瑙造你的女牆，以紅寶石造你的城門，以珍貴的寶石造你四圍的邊界。
54:13 你的兒女都要受耶和華的教訓，你的兒女必大享平安。
54:14 你必因公義得蒙堅立；必遠離欺壓，無所畏懼；又遠離驚嚇，驚嚇必不臨近你。
54:15 有誰聚集來攻擊你，那是無我的意思的；凡聚集來攻擊你的，必因你仆倒。
54:16 看哪，製造炭火的爐匠，和取兵器供人使用的，都是我所創造的；使人毀壞的，也是我所創造的。
54:17 凡為攻擊你造的器械，必不利用；凡在審判時興起用舌攻擊你的，你必定他為有罪。這是耶和華僕人的產業，是他們從我所得的義；這是耶和華說的。`,

  '9/24': `55:1 你們一切乾渴的，都當就近水來；沒有銀錢的，也可以來；你們都來，買了吃；不用銀錢，不用價值，也來買酒和奶。
55:2 你們為何花錢買那不足為食物的，用勞碌得來的買那不使人飽足的呢？你們要留意聽我的話，就能吃那美物，得享肥甘，心裡喜樂。
55:3 你們當就近我來，側耳而聽，就必得活；我必與你們立永約，就是應許大衛那可靠的恩典。
55:4 我已立他作多民的見證，作多民的君王和命令者。
55:5 你素不認識的國民，你要招呼；素不認識你的國民，要向你奔跑；都因耶和華你的神以色列的聖者，因他已榮耀你。
55:6 當趁耶和華可尋找的時候尋找他，當趁他近的時候求告他。
55:7 惡人當離棄自己的道路，不義的人當除掉自己的意念，歸向耶和華，耶和華就必憐恤他；當歸向我們的神，因為神必廣行赦免。
55:8 耶和華說：我的意念，非同你們的意念；我的道路，非同你們的道路。
55:9 天怎樣高過地，照樣，我的道路，高過你們的道路；我的意念，高過你們的意念。
55:10 雨雪從天而降，並不返回，卻滋潤地土，使地上發芽結實，使撒種的有種，使要吃的有糧。
55:11 我口所出的話，也必如此，決不徒然返回，卻要成就我所喜悅的，在我發它去成就的事上必然亨通。
55:12 你們必歡歡喜喜而出來，平平安安蒙引導；大山小山，必在你們面前發聲歌唱，田野的樹木，也都拍掌。
55:13 松樹長出代替荊棘，番石榴長出代替蒺藜；這要為耶和華留名，作為永遠的證據，不能剪除。`,

  '9/25': `56:1 耶和華如此說：你們應當守公平，行公義；因為我的救恩，臨近要來，我的公義，臨近要顯現。
56:2 謹守安息日而不干犯，謹慎手不作任何惡事的；如此行的人，和持守這事的人子，都是有福的！
56:3 與耶和華聯合的外邦人，不要說：耶和華必定將我從他的民中分別出來；太監也不要說：我是枯樹。
56:4 因為耶和華如此說：凡謹守我的安息日，揀選我所喜悅的事，持守我約的太監，
56:5 我必使他們在我殿中，在我牆內，有記念，有名號，比有兒女更美；我必賜他們永遠的名，不能剪除。
56:6 還有那些與耶和華聯合的外邦人，要事奉他，要愛耶和華的名，要作他的僕人，就是凡謹守安息日不干犯，又持守我約的人，
56:7 我必領他們到我的聖山，使他們在禱告我的殿中喜樂；他們的燔祭和平安祭，在我壇上必蒙悅納；因為我的殿必稱為萬民禱告的殿。
56:8 主耶和華，就是聚集以色列被趕散的，說：在他已聚集的人以外，我還要聚集別人，歸並到那已聚集的。
56:9 田野的諸獸啊，你們都來吃吧！林中的諸獸也都來吃吧！
56:10 以色列的守望者，他們都是瞎眼，全然無知；都是啞巴狗，不能吠叫；但貪睡，愛打盹，
56:11 這些狗，貪吃，不知足；牧人也不知道體恤別人；他們各行各路，各人為自己的利益，無一不是如此。
56:12 他們說：來吧，我去拿酒，我們喝濃酒；明日必如今日，而且加倍興盛。`,

  '9/26': `57:1 義人死亡，無人放在心上；虔誠人被收去，無人思念；這義人被收去，是免了將來的禍患；
57:2 他們進入平安；凡行正直的，都在死後安歇。
57:3 你們是巫婆的兒子，姦夫和娼婦的後裔，你們來近前來。
57:4 你們向誰戲謔呢？向誰大開口，吐出舌頭呢？你們不是悖逆的兒女，虛謊的後裔嗎？
57:5 你們在橡樹中，在各青翠樹下自行淫亂，在谷中，在磐石縫裡，殺害兒女。
57:6 你在谷中光滑的石頭，是你所選的；你把這些當作你的分，並向這些澆奠，獻上供物。這些事，我豈能容忍呢？
57:7 你在高而又高的山上，鋪了你的床，也上到那裡去獻祭。
57:8 你在門後，在門框後，設立你的記念；你離棄我，上那裡去，脫去衣服，上到高處，擴張你的床，也與那些人立約；你愛他們的床，選一個地方給自己。
57:9 你帶油去見摩洛（原文是王），又多加香料；又打發使者往遠處去，甚至降到陰間。
57:10 你行的路甚長，覺得疲憊，你還沒有說：這是枉然的；你手仍然有力量，所以你沒有衰弱。
57:11 你究竟是怕誰，懼誰，竟說謊言而不記念我，也不留意我呢？我不是許久閉口不言，你便不怕我嗎？
57:12 我要顯明你所謂公義，和你所做的事；這些都與你無益。
57:13 你呼求的時候，就讓你所聚集的拯救你吧！但這些都必被風吹去，一口氣就必颳去；倚靠我的，必得地為業，必承受我的聖山。
57:14 有人說：修造，修造，豫備道路，從我百姓的路上除去絆腳石。
57:15 那至高至上，居住永遠，名為聖者的，如此說：我住在至高至聖的所在，也與心靈痛悔謙卑的人同居，要使謙卑人的靈蘇醒，也使痛悔人的心蘇醒。
57:16 我不永遠爭辯，也不永遠發怒；因為人的靈，並我所造人的魂，若在我面前衰弱，我就不再發怒了。
57:17 我因他貪婪的罪孽，就發怒擊打他，又掩面發怒，他卻背道，隨心所欲地行。
57:18 我看見他所行的道，我也要醫治他，還要引導他，使他和那一同傷心的人，再得安慰。
57:19 我造就嘴唇所獻的果子；願那遠處的，近處的，平安，平安！我必醫治他。
57:20 惟獨惡人，好像翻騰的海，不能平靜，其中的水，常湧出污穢和淤泥來。
57:21 我的神說：惡人必不得平安。`,

  '9/27': `58:1 你當放開喉嚨，不要止住；揚起聲來，好像吹角；告訴我的百姓，他們的過犯，告訴雅各家，他們的罪惡。
58:2 他們天天尋求我，樂意知道我的道，好像行義、不離棄神的國民；他們向我求問公義的判斷，喜悅親近神，
58:3 說：我們禁食，你為何不看見呢？我們刻苦己心，你為何不理會呢？看哪，你們在禁食的日子，仍求利益，勒索你們的雇工。
58:4 你們禁食，卻彼此競爭，相爭，用惡拳相打；你們今日禁食，不能使你們的聲音聽聞於上。
58:5 這樣禁食，豈是我所揀選的禁食日呢？人刻苦己心，豈是這樣的意思呢？低垂著頭，好像蘆葦，用麻布和爐灰鋪在身下，你這就稱為禁食，稱為耶和華所悅納的日子嗎？
58:6 我所揀選的禁食，不是要鬆開兇惡的繩，解下軛上的索，使被欺壓的得自由，折斷一切的軛嗎？
58:7 不是要把你的糧食，分給飢餓的人，將漂流的窮人，接到你家中，見赤身的，給他衣服穿；顧及自己的骨肉，而不掩面不顧嗎？
58:8 這樣，你的光就必發現如早晨；你所得的醫治，要速速發生；你的公義，必在你前面行；耶和華的榮光，必作你的後盾。
58:9 那時，你求告，耶和華必應允；你呼求，他必說：我在這裡。你若從你中間除掉軛，和指指點點、說話狠毒的事，
58:10 你心若向飢餓的人發憐憫，使困苦的人得滿足；你的光就必在黑暗中發現，你的幽暗，必變如正午。
58:11 耶和華必時常引導你，在乾旱之地，使你心滿意足，骨頭健壯；你必像澆灌的園子，又像水流不絕的泉源。
58:12 你的兒女必修造久已荒廢之處，你必建立累代所立的根基；你必稱為補破口的，在境內修造路，使人居住的。
58:13 你若在安息日掉轉你的腳步，在我聖日，不以操勞為喜樂，稱安息日為可喜樂的，稱耶和華的聖日為可尊重的，而且尊敬這日，不辦自己的私事，不隨自己的私意，不說自己的私話，
58:14 你就要以耶和華為樂；耶和華要使你乘駕地的高處，又以你祖雅各的產業養育你；這是耶和華親口說的。`,

  '9/28': `59:1 耶和華的手，並非縮短，不能拯救，耳朵並非發沉，不能聽見；
59:2 但你們的罪孽，使你們與神隔絕；你們的罪惡，使他掩面不聽你們。
59:3 因為你們的手被血玷污，你們的指頭被罪孽玷污；你們的嘴脣說謊言，你們的舌頭出惡語。
59:4 無人憑公義告狀，無人憑誠實辨白；都倚靠虛妄，說謊言；所懷的是毒害，所生的是罪孽。
59:5 他們孵蝮蛇蛋，結蜘蛛網；人吃這蛋，必死；被踩的蛋，必吐出毒蛇。
59:6 所結的網，不能成為衣服；所作的，不能遮蓋自己；他們的行為，都是罪孽的行為；手所作的，都是強暴的事。
59:7 他們的腳奔跑行惡，他們急速流無辜人的血；意念是罪孽的意念，所經過的路上，都是毀滅和損傷。
59:8 平安的路，他們不知道；所行的事，沒有公平；他們為自己彎曲道路；凡走這路的，都不知道平安。
59:9 因此，公平離我們遠，公義追不上我們；我們等待光亮，卻見黑暗，等待光輝，卻行幽暗。
59:10 我們摸索牆壁，好像瞎子；我們摸索，好像無目之人；我們晌午絆跌，如在黃昏一樣；我們在壯盛之人中，像死人一般。
59:11 我們都咆哮像熊，哀鳴像鴿子；我們等待公平，卻沒有；等待拯救，卻離我們遠。
59:12 我們在你面前，過犯甚多；我們的罪惡作見證告我們；我們的過犯與我們同在；我們也知道自己的罪孽：
59:13 就是悖逆，不認識耶和華，並以背離我們的神，說欺壓和叛逆的話，懷孕生出謊言。
59:14 公平轉而退後，公義站在遠方；誠實在街上仆倒，正直的人不得進去。
59:15 誠實缺少，離開惡事的人反而受掠奪。耶和華看見這事，就因沒有公平，甚不喜悅。
59:16 他見無人拯救，無人代求，甚為詫異；就用自己的膀臂施行拯救，以自己的公義扶持自己。
59:17 他以公義為甲胄，以救恩為頭盔，以仇恨為外衣，以熱心為披風，都穿在身上。
59:18 他必按人的行為施報，以烈怒報給敵人，以報應報給仇敵，並向海島施行報應。
59:19 這樣，人從西方必懼怕耶和華的名，從日出之地必敬畏他的榮耀；因為仇敵來，如同洪水，是耶和華之氣吹動的。
59:20 必有一位救贖主，來到錫安，來到雅各家中，轉離過犯的人那裡；這是耶和華說的。
59:21 耶和華說：至於我與他們所立的約，乃是這樣：我加給你的靈，和我傳給你的話，必不離你的口，也不離你後裔的口，並你後裔的後裔的口；從今時直到永遠；這是耶和華說的。`,

  '9/29': `60:1 興起發光！因為你的光已來到；耶和華的榮耀發現照耀你。
60:2 看哪，黑暗遮蓋大地，幽暗遮蓋萬民；耶和華卻要發現照耀你，他的榮耀要現在你身上。
60:3 萬國要來就你的光；君王要來就你發現的光輝。
60:4 你要舉目觀看四方：眾人都聚集來到你這裡；你的眾子從遠方而來，你的眾女兒被抱在肋旁而來。
60:5 那時，你看見就有光榮；你心又跳動又寬暢；因為大海的豐富必轉歸你；列國的財物，必來歸你。
60:6 成群的駱駝，並米甸和以法的獨峰駝，必遮滿你；示巴的人都必來到，要奉上金子和乳香，並要傳說耶和華的讚美。
60:7 基達的羊群都必聚集到你這裡；尼拜約的公羊，要奉上供給你；都要作為悅納之物，上到我的壇上；我必使我榮耀的殿得榮耀。
60:8 這些飛翔如雲，如鴿子飛到窗戶，是誰呢？
60:9 眾海島定要等候我；他施的船隻必先來，將你的兒子連他們的金銀，從遠方帶來，為的是耶和華你神的名，是以色列聖者的緣故；因為他已榮耀你。
60:10 外邦人要建造你的城牆；他們的王要服事你；因為我曾在怒中擊打你，現在卻以恩典憐憫你。
60:11 你的城門必時常開放，晝夜不關，使人把列國的財物，帶到你這裡；將他們的君王也帶來。
60:12 因為不願服事你的國，民必滅亡；那些國，必定全然荒廢。
60:13 黎巴嫩的榮耀，就是松樹、枞樹，並黃楊樹，必一同歸你，為要修飾我聖所之地；我必使我腳踏之地得榮耀。
60:14 那些苦待你的人，必屈身來就你；藐視你的人，必向你腳掌下拜；他們必稱你為耶和華的城，以色列聖者的錫安。
60:15 你素來被遺棄，被憎惡，甚至無人經過；我卻使你成為永遠的榮耀，成為萬代的喜樂。
60:16 你必吃通國的財物，又因列王的豐盛自誇；你便知道我耶和華是你的救主，是你的救贖主，是雅各的大能者。
60:17 我要用金子代替銅，用銀子代替鐵，用銅代替木頭，用鐵代替石頭；也要以和平為你的官長，以公義為你的監督。
60:18 你境內不再聽見強暴的聲音，境內不再有荒涼毀滅的事；你必稱你的牆垣為救恩，你的城門為讚美。
60:19 日頭不再作你白晝的光，月亮也不再發光照耀你；耶和華卻要作你永遠的光，你的神要為你的榮耀。
60:20 你的日頭不再下落，你的月亮也不退縮；因為耶和華必作你永遠的光；你悲哀的日子也完畢了。
60:21 你的居民都成為義人，永遠得地為業；是我種的栽子，是我手的工作，為要彰顯我的榮耀。
60:22 至小的族，要加增成千；微弱的國，要成為強盛；我耶和華要按時速成這事。`,

  '9/30': `61:1 主耶和華的靈在我身上；因為耶和華用膏膏我，叫我傳好信息給謙卑的人，差遣我醫好傷心的人，報告被擄的得釋放，被囚的出監牢；
61:2 報告耶和華的恩年，和我們神報仇的日子；安慰一切悲哀的人，
61:3 賜華冠與錫安悲哀的人，代替灰塵；喜樂油代替悲哀，讚美衣代替憂傷之靈；使他們稱為公義樹，是耶和華所栽植的，叫他得榮耀。
61:4 他們必修造已久的荒場，建立先前淒涼之處，重修歷代荒涼之城。
61:5 那時，外人必起來牧養你們的羊群；外邦人必耕種你們的田地，修理你們的葡萄園。
61:6 你們卻要稱為耶和華的祭司，人必稱你們為我們神的僕役；你們必吃通國的財物，因得他們的榮耀，自誇。
61:7 你們必得加倍的好處，代替你們所受的羞辱；分得的喜樂，代替所受的凌辱；因此，他們必在境內得加倍的產業，永遠之樂必歸於他們。
61:8 因為我耶和華喜愛公平，恨惡搶奪和罪孽；我要憑誠實，施行報應，與他們立永約。
61:9 他們的後裔，在列國中被人認識；他們的子孫，在眾民中被人知道；凡看見他們的，都必認識他們是耶和華所賜福的後裔。
61:10 我因耶和華大大歡喜，我的心靠我的神高興；因為他以拯救為衣給我穿上，以公義為袍，給我披上，好像新郎戴上華冠，又像新婦佩戴珠寶。
61:11 田地怎樣使百苗生長，園子怎樣使所種的發芽；主耶和華必照樣使公義和讚美，在萬國中發出。`,

  '10/1': `62:1 我因錫安必不靜默，為耶路撒冷必不息聲，直到他的公義如光輝發出，他的救恩如明燈燃燒。
62:2 列國必見你的公義；列王必見你的榮耀；你必得新名，是耶和華親口所起的。
62:3 你在耶和華手中，要作為華冠，在你神手中，作為冕旒。
62:4 你不再稱為撇棄的（或作：遺棄的），你的地不再稱為荒涼的，你卻要稱為我所喜悅的（原文作：希弗西巴），你的地也必稱為有夫之婦（原文作：比拉），因為耶和華喜悅你，你的地也必歸他。
62:5 少年人怎樣娶處女，你的眾子也必照樣娶你；新郎怎樣喜悅新婦，你的神也必照樣喜悅你。
62:6 耶路撒冷啊，我在你城牆上設立守望者；他們晝夜必不靜默；呼籲耶和華的，你們不要息聲，
62:7 也不要給他靜默，直到他建立耶路撒冷，使耶路撒冷在地上成為可讚美的。
62:8 耶和華指著自己的右手，和他有力的膀臂，起誓說：我不再將你的五穀，給你仇敵吃；外邦人也不再喝你勞苦得來的新酒；
62:9 惟有收取五穀的，必吃五穀，讚美耶和華；收聚新酒的，必在我聖所的院中喝新酒。
62:10 你們要過去，從門中過去；預備百姓的路；修造，修造那大道，撿去石頭，為萬民豎立大旗。
62:11 看哪，耶和華已宣告到地極，對錫安的女子說：你的救主來到，他的賞賜在他那裡，他的報應在他面前。
62:12 他們必稱這民為聖民，為耶和華的救民；你也必稱為被尋見的，不再是被遺棄的城。`,

  '10/2': `63:1 這從以東的波斯拉來，穿紅衣服，打扮華美，大步行走，以自己的大力為誇勝的是誰呢？是我，是以公義說話，以大能施救的。
63:2 你的衣服為何有紅色，你所穿的為何像踹酒醡的衣服呢？
63:3 我獨自踹酒醡，眾民中無一人與我同在；我發怒將他們踹下，我忿恨將他們踏碎；他們的血濺在我的衣服上，我所有的衣裳，都被玷污了。
63:4 因為，施報仇之日在我心中，救贖我民之年已經來到。
63:5 我仰望，見無人幫助；我詫異，見無人扶持；於是我的膀臂為我施行拯救，我的忿恨扶持了我。
63:6 我發怒，踐踏眾民，發忿恨，將他們踏碎，使他們的血流在地上。
63:7 我要提起耶和華的慈愛和他一切向我們所施的恩惠，並他向以色列家所施的大恩，按著他的憐憫和豐盛的慈愛所施的恩惠。
63:8 他說：他們誠然是我的百姓，不行虛假的子民；這樣，他就作了他們的救主。
63:9 他們在一切苦難中，他也同受苦難；並且他面前的使者拯救他們；他以慈愛和憐憫救贖他們，在古時的一切日子，將他們抱起，懷抱他們。
63:10 他們竟悖逆，使他的聖靈擔憂；他就轉為他們的仇敵，親自攻擊他們。
63:11 那時，他們追念古時摩西的日子，說：將他子民從海中，率領他們上來的，在何處呢？將他聖靈賜在他們中間的，在哪裡呢？
63:12 使他榮耀的膀臂，在摩西的右手邊行動，在他們前面將水分開，要在自己面前得永遠的名，在哪裡呢？
63:13 帶領他們經過深處，如馬行走曠野，使他們不致失足的，在哪裡呢？
63:14 耶和華的靈使他們得安息，好像牲畜下到山谷；你這樣引導你的百姓，要建立自己榮美的名。
63:15 求你從天上垂看，從你聖潔榮耀的居所觀察；你的熱心，和你大能的作為，在哪裡呢？你愛慕的心腸，和你的憐憫，向我們止住了嗎？
63:16 你是我們的父；亞伯拉罕雖然不認識我們，以色列也不承認我們，你耶和華卻是我們的父，從萬古以來，你名是我們的救贖主。
63:17 耶和華啊，你為何使我們走差離開你的道，使我們心裡剛硬，不敬畏你呢？求你為你僕人，為你產業支派的緣故，回來吧！
63:18 你的聖民不過暫時得這地為業；我們的敵人踐踏你的聖所。
63:19 我們恰像你未曾治理的人，像未曾稱你名的人。`,

  '10/3': `64:1 願你裂天而降，願山在你面前震動，
64:2 好像火燒乾柴，又像火將水燒開，使你敵人知道你的名，使列國在你面前發抖。
64:3 你做了我們不能期望的可怕事；你降臨，山在你面前震動。
64:4 從古以來，人未曾聽見、耳未曾聞、眼未曾見，在你以外有甚麼神為等候他的人行事。
64:5 你迎接那歡喜行義，記念你道的人；你曾發怒，我們仍犯罪；這光景已久，我們還能得救嗎？
64:6 我們都像不潔淨的人，我們所有的義，都像污穢的衣服；我們都像葉子漸漸枯乾，我們的罪孽好像風吹我們飄蕩。
64:7 沒有人求告你的名，沒有人振作自己，抓住你；因為你掩面不顧我們，使我們因我們的罪孽消化。
64:8 耶和華啊，你是我們的父；我們是泥，你是窯匠；我們都是你手的工作。
64:9 耶和華啊，求你不要大發震怒，也不要永遠記念我們的罪孽；求你垂顧，我們都是你的百姓。
64:10 你的聖邑，變為曠野；錫安變為曠野，耶路撒冷成為荒場。
64:11 我們聖潔華美的殿，就是我們列祖讚美你的地，被火焚燒，我們所羨慕的地方，都變為荒場。
64:12 耶和華啊，有這些事，你還忍得住嗎？你要靜默，使我們大受苦難嗎？`,

  '10/4': `65:1 素來沒有訪問我的，現在求問我；沒有尋找我的，現在找到我；我對那不奉我名的國說：我在這裡！我在這裡！
65:2 我整天伸手，招我那悖逆的百姓；他們隨自己的意念，行不善之道；
65:3 這百姓時常當面惹我發怒，在園中獻祭，在磚臺上燒香，
65:4 坐在墳墓中，在隱秘處住宿，吃豬肉，他們碗中有污穢肉的羹湯；
65:5 說：你站開吧！不要挨近我，因為我比你聖潔。這些人是我鼻中的煙，是整天燃燒的火。
65:6 看哪，這事寫在我面前；我不肯靜默，必要施行報應，我必報應在他們懷中；
65:7 還要報應你們的罪孽，也報應你們列祖的罪孽，就是他們在山上燒過香，在岡上辱過我的罪孽；我必先量出他們的報應，報在他們懷中。
65:8 耶和華如此說：葡萄樹上若有新酒，人就說：不要毀壞，因為福在其中；我因我僕人的緣故，也必照樣行，不將他們全然毀滅。
65:9 我必從雅各中領出後裔，從猶大中領出承受我眾山之業的人；我所揀選的，必得這地為業，我的僕人也必住在那裡。
65:10 沙崙必成為羊群的草場；亞割谷，必成為牛群躺臥之處，都歸於尋求我的百姓。
65:11 但你們這些離棄耶和華，忘記我聖山的人，給布甲預備桌子，給命運之神，陳設混合的酒，
65:12 我必命定你們歸在刀下；你們都必屈身受殺戮；因為我呼叫，你們沒有答應；我說話，你們沒有聽見；反倒行我眼中看為惡的事，揀選我所不喜悅的事。
65:13 所以，主耶和華如此說：看哪，我的僕人必吃，你們卻飢餓；我的僕人必喝，你們卻乾渴；我的僕人必歡喜，你們卻蒙羞；
65:14 我的僕人因心中快樂，就唱歌歌唱；你們卻因心中憂愁，要哀號，並因心裡憂傷折斷，而哭泣。
65:15 你們的名必留給我所揀選的人，當作咒詛的話；主耶和華必殺你們，另給他的僕人起個新名。
65:16 這樣，在地上為自己求福的，必憑真實的神求福；在地上起誓的，必指真實的神起誓；因為從前的患難忘記了，也從我眼前隱藏了。
65:17 看哪！我造新天新地；從前的事，不再被記念，也不再追想。
65:18 你們卻要因我所造的，永遠歡喜快樂；因為我造耶路撒冷，使它成為人所喜樂的，造其中的居民，使他們成為人所歡欣的。
65:19 我必因耶路撒冷歡喜，因我的百姓快樂；其中必不再聽見哭泣的聲音，和哀號的聲音。
65:20 其中必沒有數日夭亡的嬰孩，也沒有壽數不滿的老人；因為百歲死的人，算為少年；有百歲死的罪人，算被咒詛。
65:21 他們要建造房屋，自己居住；栽種葡萄園，吃其中的果子。
65:22 他們建造的，別人不得住；他們栽種的，別人不得吃；因為我民的日子，必像樹木的日子；我選民親手勞碌得來的，必長久享用。
65:23 他們必不徒然勞碌，所生的，也不遭患難；因為他們是蒙耶和華賜福的後裔，他們的子孫也是一樣。
65:24 他們尚未求告，我就應允；正說話的時候，我就垂聽。
65:25 豺狼和羊羔必同吃草；獅子必吃草如牛；塵土必作蛇的食物；在我聖山的遍處，這一切都不傷人，不害物；這是耶和華說的。`,

  '10/5': `66:1 耶和華如此說：天是我的寶座，地是我的腳凳；你們要為我造何等的殿宇？哪裡是我安息的地方呢？
66:2 耶和華說：這一切都是我手所造的，所以就都有了；但我所看顧的，就是虛心痛悔、因我話而戰兢的人。
66:3 以色列中有殺牛作燔祭的，也有打人的；有獻祭的，也有獻豬血的；有燒乳香記念的，也有稱頌偶像的；這等人揀選自己的道路，心裡喜悅行那可憎惡的事；
66:4 我也揀選迷惑他們的事，使他們所懼怕的臨到他們；因為我呼喚，無人答應；我說話，他們不聽從；反倒行我眼中看為惡的事，揀選我所不喜悅的。
66:5 你們因耶和華話而戰兢的人，當聽他的話：你們的弟兄，就是恨惡你們、因我名趕出你們的，曾說：耶和華必得榮耀，使我們可以見你們的喜樂；但羞愧的，必是那些人。
66:6 有喧嚷的聲音出城，有聲音出聖殿，是耶和華向仇敵施行報應的聲音。
66:7 婦人有孕，尚未臨盆，就生了男孩，就是她腹痛以先，便產了一個男孩。
66:8 這樣的事，誰曾聽見？這樣的事，誰曾看見？國，豈能一日而生？民，豈能一時而產？因為錫安一臨產，便生下她的兒女。
66:9 耶和華說：我使她臨產，豈不使她生產呢？你的神說：我使她生育，豈能禁止生育呢？
66:10 你們愛慕耶路撒冷的，都要與她一同歡喜快樂；你們為她悲傷的，都要與她一同樂上加樂；
66:11 使你們在她安慰的懷中吃奶得飽，使你們在她豐盛的榮耀中歡喜踴躍。
66:12 耶和華如此說：看哪！我要將平安如江河，將列國的榮耀如漲溢的河流，歸她；你們要吃奶，也要被抱在肋旁，被膝上搖抱。
66:13 母親怎樣安慰兒子，我就照樣安慰你們；你們也必因耶路撒冷得安慰。
66:14 你們看見，就心中喜樂；你們的骨頭，必得滋潤，就像嫩草一樣；耶和華的手，向他的僕人所施的，必被人知道；他也要向他的仇敵發怒。
66:15 耶和華必在火中降臨，他的車輦多如旋風，以烈怒施行報應，以火焰申斥人。
66:16 因為耶和華要用火，並用刀，施行審判，降在一切有血氣的人身上；被耶和華所殺的人必多。
66:17 那些分別為聖，潔淨自己，在園中跟著一人到當中，吃豬肉和老鼠，並一切可憎之物的，必一同滅亡；這是耶和華說的。
66:18 我知道他們的行為和他們的意念，所以時候將到，我必聚集萬民和各族的人，他們必來看見我的榮耀。
66:19 我要在他們中間施行標記，逃脫的人，我要差到列國去，就是到他施、普勒、拉弓的路德，到土巴、雅完，并素來沒有聽見我名聲、沒有看見我榮耀、那遙遠的海島去；他們必將我的榮耀傳揚在列國中。
66:20 他們必將你們的弟兄，從列國中帶來，獻給耶和華為供物，或騎馬，或坐車，或坐轎，或騎騾子，或騎獨峰駝，到我的聖山耶路撒冷，就如以色列人帶供物，來到耶和華的殿中一樣；這是耶和華說的。
66:21 我也必從他們中間取人，立為祭司，立為利未人；這是耶和華說的。
66:22 耶和華說：我所要造的新天新地，怎樣在我面前長存，你們的後裔和你們的名也必照樣長存。
66:23 每逢月朔、安息日，凡有血氣的必來在我面前下拜；這是耶和華說的。
66:24 他們必出去觀看那些違背我人的屍首；因為他們的蟲是不死的，他們的火是不滅的；凡有血氣的，都必憎惡他們。`,
};

// Read-tracking
function loadReadDays() {
  try { const s = localStorage.getItem('bible-read'); return s ? new Set(JSON.parse(s)) : new Set(); }
  catch { return new Set(); }
}
function saveReadDays() {
  localStorage.setItem('bible-read', JSON.stringify([...readDays]));
  if (currentUser) {
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(saveCloudData, 2000);
  }
}
function dayKey(sec, idx) { return sec + '-' + idx; }
const readDays = loadReadDays();

let currentSection = 'july';
let currentIndex = 0;
let currentTab = 'scripture';
// Remembers user's manual expand/collapse of month toggles across re-renders.
// Value: true = open, false = collapsed. Unset = use default (current/future open).
const monthOpenState = {};
let yearOpenState = true;

// Parse a plan date string into {m, d}. Supports both "M/D" and "M月D日".
function parsePlanDate(str) {
  const zh = String(str).match(/(\d+)月(\d+)日/);
  if (zh) return { m: +zh[1], d: +zh[2] };
  const [m, d] = String(str).split('/').map(Number);
  return { m, d };
}

function getTodayInfo() {
  const now = new Date();
  const m = now.getMonth() + 1, d = now.getDate();
  const todayVal = m * 100 + d;
  const sections = Object.keys(PLAN_DATA);
  // Search for today's exact date in each section (format-agnostic)
  for (const sec of sections) {
    const idx = PLAN_DATA[sec].findIndex(r => {
      const p = parsePlanDate(r.date);
      return p.m * 100 + p.d === todayVal;
    });
    if (idx !== -1) return { section: sec, index: idx };
  }
  // Not found — determine if before everything, or pick the latest day on/before today
  const allEntries = [];
  for (const sec of sections) {
    PLAN_DATA[sec].forEach((r, i) => {
      const p = parsePlanDate(r.date);
      allEntries.push({ sec, i, val: p.m * 100 + p.d });
    });
  }
  if (!allEntries.length) return { section: sections[0] || 'july', index: -2 };
  if (todayVal < allEntries[0].val) return { section: sections[0], index: -2 };
  // Latest reading whose date is on or before today
  let chosen = allEntries[0];
  for (const e of allEntries) {
    if (e.val <= todayVal) chosen = e; else break;
  }
  return { section: chosen.sec, index: chosen.i };
}

const todayInfo = getTodayInfo();

function isAvailable(section, i) {
  if (todayInfo.index === -2) return false;
  const sections = Object.keys(PLAN_DATA);
  const todaySecIdx = sections.indexOf(todayInfo.section);
  const thisSecIdx  = sections.indexOf(section);
