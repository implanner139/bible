<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>系統調整中 | iM行動教會</title>
  <style>
    :root { --gold: #f5c518; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
    }
    .icon { font-size: 44px; line-height: 1; margin-bottom: 20px; }
    h1 { color: var(--gold); font-size: 22px; margin: 0 0 20px; letter-spacing: .05em; }
    p { font-size: 16px; line-height: 2; margin: 0 0 12px; color: rgba(255,255,255,.88); }
    .sign { margin-top: 28px; font-size: 14px; color: rgba(255,255,255,.5); }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📖</div>
    <h1>本系統正在調整中</h1>
    <p>讀經系統目前暫停服務，感謝您這段時間的陪伴與參與。</p>
    <p>未來您可以使用同樣的 Google 帳號登入。</p>
    <div class="sign">iM行動教會</div>
  </main>
</body>
</html>
