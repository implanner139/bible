<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>讀經系統全新升級 | iM行動教會</title>
  <style>
    :root { --gold: #f5c518; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
    }
    .icon { font-size: 44px; line-height: 1; margin-bottom: 20px; }
    h1 { color: var(--gold); font-size: 22px; margin: 0 0 20px; letter-spacing: .05em; }
    p { font-size: 16px; line-height: 2; margin: 0 0 12px; color: rgba(255,255,255,.88); }
    .btn {
      display: block;
      margin-top: 24px;
      padding: 14px 20px;
      background: var(--gold);
      color: #000;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
    }
    .btn:active { background: #ffd740; }
    .sign { margin-top: 28px; font-size: 14px; color: rgba(255,255,255,.5); }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📖</div>
    <h1>讀經系統全新升級</h1>
    <p>感謝您這段時間的陪伴與參與！我們讓讀經系統變得更豐富，盼望幫助每一位弟兄姊妹，在每天的讀經中更親近神。</p>
    <p>讀經系統已移轉到新網址，您可以使用同樣的 Google 帳號登入。</p>
    <a class="btn" href="https://www.wechurch.online/">前往新的讀經系統</a>
    <div class="sign">iM行動教會</div>
  </main>
</body>
</html>
